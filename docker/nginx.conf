# MyUcto.cz — nginx config pro alpine variantu (Dockerfile.alpine).
#
# Funkční parity s root .htaccess (Apache). Pravidla 1:1:
#   /api/*       → api/public/index.php (Slim front controller; reálné soubory přímo)
#   /assets/*    → web/dist/assets/*    (Vite generuje absolutní /assets/ URL)
#   PWA soubory  → web/dist/*           (service worker, manifest, ikony)
#   /manual      → manual/index.php     (pretty URL; statika v manual/ přímo)
#   statika      → /styles/, /web/ přímo
#   SPA fallback → PHP host gate → web/dist/index.html
#
# ⚠️ nginx add_header footgun: location s VLASTNÍM add_header zahodí VŠECHNY
# zděděné add_header ze server bloku. Proto NEpoužíváme per-location add_header —
# bezpečnostní hlavičky jsou jen na server úrovni a Cache-Control se počítá přes
# `map $uri` do proměnné. Tím platí security hlavičky i pro statiku, /api i chyby.

user                 www-data;
worker_processes     auto;
pid                  /run/nginx.pid;
error_log            /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    access_log          /dev/stdout;
    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    server_tokens       off;

    # post_max_size = 55M (viz php ini) — nech nginx pustit upload + overhead.
    client_max_body_size 55m;

    # Komprimace (parity s mod_deflate).
    gzip                on;
    gzip_vary           on;
    gzip_min_length     256;
    gzip_proxied        any;
    gzip_types          text/plain text/css text/xml text/javascript
                        application/javascript application/json image/svg+xml application/yaml;

    # ---- HTTPS redirect parity (.htaccess pravidlo 1) -----------------------
    # Force HTTPS, VYJMA: loopback/localhost, RFC1918 privátní IP, .local mDNS,
    # a requestů už terminovaných na TLS reverse proxy (X-Forwarded-Proto=https).
    map $http_host $mi_is_private {
        default                                  0;
        "~*^localhost(:[0-9]+)?$"                1;
        "~*^127\."                               1;
        "~*^10\."                                1;
        "~*^192\.168\."                          1;
        "~*^172\.(1[6-9]|2[0-9]|3[01])\."        1;
        "~*\.local(:[0-9]+)?$"                   1;
    }
    map $http_x_forwarded_proto $mi_xfp {
        default     "";
        "https"     "https";
    }
    # Redirect jen když: NEpřišlo přes https proxy ("") A host NENÍ privátní (0).
    map "$mi_xfp:$mi_is_private" $mi_redirect_https {
        default     0;
        ":0"        1;
    }

    # ---- Skutečná klient IP (SEC-12) ----------------------------------------
    # ⚠️ KLÍČOVÉ: nginx předává VŠECHNY klientské hlavičky do FastCGI jako HTTP_*,
    # takže klientem poslané `X-Forwarded-For` dorazí do PHP beze změny. Kdyby
    # aplikace četla client IP z HTTP_X_FORWARDED_FOR, šlo by ji podvrhnout a
    # obejít tím IP allowlist, rate-limit buckety i auditní logy.
    #
    # Přepsat příchozí hlavičku přes `fastcgi_param HTTP_X_FORWARDED_FOR` NEJDE:
    # nginx posílá explicitní fastcgi_param PŘED auto-generovanými HTTP_*, takže
    # klientská hodnota dorazí jako poslední a v PHP vyhraje.
    #
    # Řešení: předáváme IP v parametru BEZ prefixu `HTTP_`. Klientské hlavičky se
    # do FastCGI vždy mapují jako HTTP_*, takže `MYUCTO_CLIENT_IP` nelze zvenčí
    # podvrhnout. Aplikace (MyInvoice\Service\IpMatcher) ho preferuje před
    # X-Forwarded-For — viz IpMatcher::TRUSTED_CLIENT_IP_PARAM.
    #
    # $remote_addr = TCP peer. Když je PŘED tímhle nginxem ještě edge proxy
    # (Cloudflare, Traefik, HAProxy…), odkomentuj realip níže a vyjmenuj JEJÍ
    # rozsahy — jen tak se $remote_addr přepočítá na reálného klienta. Bez
    # konfigurace zůstává fail-closed IP nejbližšího hopu.
    #
    # set_real_ip_from  173.245.48.0/20;   # např. Cloudflare rozsahy
    # set_real_ip_from  10.0.0.0/8;        # nebo IP vlastní edge proxy
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # ---- Cache-Control přes map (žádný per-location add_header) --------------
    # Pořadí = priorita (první shoda vyhraje):
    #   /api/* + PWA řídicí soubory → no-store
    #   *.html  → no-cache (issue #140 — index.html drží mapu na hash-chunky)
    #   statika → immutable 1 rok (hashed assety)
    map $uri $mi_cache_control {
        default                                                              "";
        "~^/api/"                                                            "no-store";
        "~^/(service-worker\.js|manifest\.webmanifest)$"                    "no-cache, no-store, must-revalidate";
        "~*\.html$"                                                          "no-cache, no-store, must-revalidate";
        "~*\.(woff2|woff|ttf|otf|eot|js|css|svg|png|jpg|jpeg|webp|ico)$"     "public, max-age=31536000, immutable";
    }

    server {
        listen          80 default_server;
        server_name     _;
        root            /var/www/html;
        index           index.php index.html;

        # ---- hlavičky (jen tady; viz add_header footgun pozn. nahoře) -------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), publickey-credentials-create=(self), publickey-credentials-get=(self), accelerometer=(self \"https://challenges.cloudflare.com\"), gyroscope=(self \"https://challenges.cloudflare.com\"), magnetometer=(self \"https://challenges.cloudflare.com\"), xr-spatial-tracking=(self \"https://challenges.cloudflare.com\")" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://validator.swagger.io https://cdn.redoc.ly https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://unpkg.com https://cdn.redoc.ly https://cdn.jsdelivr.net; worker-src 'self' blob:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://unpkg.com https://cdn.redoc.ly https://cdn.jsdelivr.net; frame-src 'self' blob: https://challenges.cloudflare.com chrome-extension: moz-extension:; object-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control $mi_cache_control always;

        # ---- 1) force HTTPS -------------------------------------------------
        if ($mi_redirect_https) {
            return 301 https://$host$request_uri;
        }

        # ---- 2) blokace citlivých složek a souborů (parity pravidlo 2/2b) ---
        # `web/shared/` obsahuje zdrojové policy pro PHP a frontend build, ne statiku.
        # ⚠️ Regex locationy se vyhodnocují v pořadí zápisu a první shoda vyhraje,
        # takže tenhle blok MUSÍ zůstat nad `location /api/` i nad `location /`.
        # Sada cest je držená konzistentně s .htaccess (pravidlo 2/2b) a web.config
        # ("Block sensitive directories" / "Block sensitive files").
        # ⚠️ `(\.[^/]*)?` za jménem složky je ZÁMĚRNÉ: na disku reálně existuje
        # `api/vendor.prod/` (produkční autoloader) a bez toho suffixu ho holé
        # `vendor(/|$)` nematchne (dostane '.', ne '/'). Stejně by prošly i
        # `private.bak/`, `db.old/` apod. Suffix se kotví na tečku, takže
        # legitimní `/dbxyz` se neblokuje.
        location ~ ^/(private|db|log|source|storage|tools|cmd|docker|web/(src|shared|node_modules)|node_modules|api/(src|vendor|templates|tests|bin))(\.[^/]*)?(/|$) {
            return 403;
        }
        # VCS metadata KDEKOLI v cestě — `.git/config` + `.git/HEAD` vedou na
        # rekonstrukci celého repa. V image je sice `.git` vyloučený přes
        # .dockerignore, ale dev compose bind-mountuje celý repozitář.
        location ~ (^|/)\.(git|svn|hg|bzr)(/|$) {
            return 403;
        }
        # Tooling manifesty a zdrojové dokumenty. Pozn.: `manifest.json` schválně
        # NENÍ v seznamu — je to produkční Vite asset ve web/dist/ a musí zůstat
        # dostupný. Blokují se jen konkrétní jména manifestů v rootu, api/ a web/.
        # `(api/|web/)?` u composer manifestů — `api/composer.json` a
        # `api/composer.lock` jsou reálné soubory a root-kotvený regex je minul.
        # ⚠️ Seznam musí zůstávat v synchronizaci s `.htaccess` (pravidlo 2b) a
        # `web.config` („Block sensitive files“) — jinak Docker instance vydává to,
        # co hosting na Apache/IIS blokuje. Drift už jednou nastala: H-19 doplnil
        # `cfg.sample.php`, `cfg.docker.php`, `VERSION`, `web.config` a
        # `portainer-template.json` jen do zbývajících dvou konfigurací.
        location ~ ^/((api|web)/)?(cfg\.sample\.php|cfg\.docker\.php|VERSION|web\.config|portainer-template\.json|cfg\.php|cfg\.local\.php|composer\.(json|lock)|package\.json|pnpm-lock\.yaml|(vite|tsconfig|eslint|tailwind|postcss)\.config\.[^/]+|phpunit\.xml(\.dist)?|Dockerfile(\..*)?|docker-compose[^/]*|\.gitignore|\.env.*|[^/]*\.md|[^/]*\.sql)$ {
            return 403;
        }
        # Přípony pomocných skriptů (`cmd`/`ps1`/`sh`) chrání soubory, které leží
        # v kořeni bundlu mimo blokované složky — `demo.cmd`, `production.cmd`,
        # `docker-entrypoint.sh`. Parita s `<FilesMatch>` v `.htaccess` a
        # `requestFiltering/fileExtensions` ve `web.config`.
        location ~* \.(env|sql|pem|log|lock|md|cmd|ps1|sh)$ {
            return 403;
        }

        # ---- 3a) /assets/* → web/dist/assets/* ------------------------------
        location ^~ /assets/ {
            alias /var/www/html/web/dist/assets/;
            access_log off;
            try_files $uri =404;
        }

        # ---- 3a-2) /fonts/* → web/dist/fonts/* ------------------------------
        # Self-hostované woff2 z `web/public/fonts`, které `web/index.html`
        # preloaduje absolutní cestou `/fonts/…`. Bez tohoto bloku je spolkne
        # `location /` → `@spa` a vrátí index.html s Content-Type text/html —
        # prohlížeč font zahodí (`OTS parsing error: invalid sfntVersion`,
        # 0x3C21444F = "<!DO") a celá aplikace spadne na systémový fallback.
        # Parita s .htaccess (3a-2) a web.config („Self-hosted fonts").
        location ^~ /fonts/ {
            alias /var/www/html/web/dist/fonts/;
            access_log off;
            try_files $uri =404;
        }

        # ---- 3b) PWA soubory z Vite dist ----------------------------------
        location = /service-worker.js {
            alias /var/www/html/web/dist/service-worker.js;
        }
        location = /manifest.webmanifest {
            alias /var/www/html/web/dist/manifest.webmanifest;
            default_type application/manifest+json;
        }
        location ^~ /pwa/ {
            alias /var/www/html/web/dist/pwa/;
            access_log off;
            try_files $uri =404;
        }

        # ---- 3c) /manual a /manual/ → manual/index.php ----------------------
        # (statické soubory v /manual/generated/ a /manual/img/ jdou přes `location /`)
        location = /manual {
            fastcgi_pass            127.0.0.1:9000;
            include                 fastcgi_params;
            fastcgi_param           SCRIPT_FILENAME /var/www/html/manual/index.php;
            fastcgi_param           SCRIPT_NAME     /manual/index.php;
            fastcgi_param           MYUCTO_CLIENT_IP $remote_addr;
            fastcgi_read_timeout    120s;
        }
        location = /manual/ {
            fastcgi_pass            127.0.0.1:9000;
            include                 fastcgi_params;
            fastcgi_param           SCRIPT_FILENAME /var/www/html/manual/index.php;
            fastcgi_param           SCRIPT_NAME     /manual/index.php;
            fastcgi_param           MYUCTO_CLIENT_IP $remote_addr;
            fastcgi_read_timeout    120s;
        }

        # ---- 3) /api/* → api/public/index.php (reálné soubory přímo) --------
        # openapi.yaml je reálný soubor pod /api → musí jít fetchnout (Swagger/Redoc).
        location = /api/openapi.yaml {
            default_type application/yaml;
            try_files $uri =404;
        }
        # ⚠️ PLAIN prefix (NE ^~) — `^~` by přebilo regex blokace výše a vystavilo
        # api/src, api/vendor apod. jako statiku. Plain prefix nechá regexy proběhnout
        # první (security blok matchne `api/(src|vendor|…)` → 403), a /api/health ap.
        # bez shody spadne sem na front controller.
        location /api/ {
            try_files $uri @api;
        }
        location @api {
            fastcgi_pass            127.0.0.1:9000;
            include                 fastcgi_params;
            fastcgi_param           SCRIPT_FILENAME /var/www/html/api/public/index.php;
            fastcgi_param           SCRIPT_NAME     /api/public/index.php;
            # Nepodvrhnutelná client IP — viz poznámka "Skutečná klient IP" nahoře.
            fastcgi_param           MYUCTO_CLIENT_IP $remote_addr;
            fastcgi_read_timeout    120s;
            # App si na /api sám nastaví Cache-Control: no-store. nginx ho přidává z
            # $mi_cache_control taky → skryjeme upstream verzi, ať není dvakrát (parity
            # s Apache `Header set` = replace). Server-level add_header pak dá jeden.
            fastcgi_hide_header     Cache-Control;
        }

        # SPA HTML musí projít stejnou host-to-tenant politikou jako API. Statické
        # hashed assety zůstávají přímé; jen fallback jde přes front controller.
        location @spa {
            fastcgi_pass            127.0.0.1:9000;
            include                 fastcgi_params;
            fastcgi_param           SCRIPT_FILENAME /var/www/html/api/public/index.php;
            fastcgi_param           SCRIPT_NAME     /api/public/index.php;
            fastcgi_param           MYUCTO_CLIENT_IP $remote_addr;
            fastcgi_read_timeout    120s;
        }

        # Ani přímá URL produkčního indexu (nebo její directory index) nesmí
        # obejít host gate. Ostatní hashed soubory zůstávají statické.
        location = /web/dist {
            try_files /__myucto_tenant_gated_spa__ @spa;
        }
        location = /web/dist/ {
            try_files /__myucto_tenant_gated_spa__ @spa;
        }
        location = /web/dist/index.html {
            try_files /__myucto_tenant_gated_spa__ @spa;
        }

        # ---- PHP handler = allowlist, ne „libovolný .php v repu" ------------
        # Do FastCGI se smí dostat jen dva veřejné entrypointy, oba přes vlastní
        # location výše: api/public/index.php (přes named `@api`) a
        # manual/index.php (přes `location = /manual` / `= /manual/`).
        # Všechno ostatní s příponou .php se odmítne — jinak by šlo spustit
        # include-only skripty (manual/generated/_toc.php, docs/md2pdf.config.php)
        # nebo obejít router přímým GET /api/public/index.php.
        # Named location `@api` sem nespadá (nematchuje se proti URI), exact match
        # `= /manual` má přednost před regexem → obojí funguje dál.
        location ~ \.php$ {
            return 403;
        }

        # ---- 4) statika + SPA fallback --------------------------------------
        # Vše co není reálný soubor a není /api/* → tenant-aware SPA host gate.
        location / {
            try_files $uri @spa;
        }
    }
}
