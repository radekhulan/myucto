name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Rychlá série commitů do masteru (běžné při dávkových opravách) spouštěla plný běh
# na KAŽDÝ push — backend job trvá ~12 min, takže 20 commitů = ~4 hodiny strojového
# času, z toho drtivá většina na mezistavech, o které nikdo nestojí. Nedokončené běhy
# se proto ruší a doběhne jen ten poslední.
#
# Vědomý kompromis: přeskočené commity nedostanou vlastní zelenou značku. Pro dohledání
# regrese je pak potřeba `git bisect` nebo ruční `workflow_dispatch`, ne historie CI.
# Pull requesty se ruší podle své větve, aby si master a PR navzájem nerušily běhy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-guard:
    name: Release guard
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tools/release-guard.test.mjs

  backend:
    name: Backend (PHP 8.5 + PHPUnit)
    runs-on: ubuntu-latest

    # Bez databáze se přeskočí celá Integration suita včetně testů atomicity
    # session — tedy zrovna to, co hlídá nejcitlivější garance autentizace.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: myinvoice_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      # Bez Redisu je RateLimitMiddleware záměrně no-op, takže by se neotestoval
      # ani rate limit, ani brute-force ochrana.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, mbstring, intl, gd, zip, opcache, bcmath, exif
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      # cfg.php je gitignored, CI si ho generuje. Píšeme ho jako soubor, ne přes
      # MYINVOICE_* proměnné — ty by prosákly i do unit testů Configu, které
      # ověřují právě chování ENV override, a rozbily by je.
      - name: Configure test instance
        run: |
          cat > cfg.php <<'PHPCFG'
          <?php
          return [
              'app' => [
                  'env'   => 'production',
                  'debug' => false,
                  'url'   => 'http://localhost:8080',
                  // Syntetické klíče jen pro běh testů (32 B po dekódování).
                  'pepper'                => 'Y2ktcGVwcGVyLWZvci10ZXN0cy1vbmx5ISEhISEhISE=',
                  'secret_encryption_key' => 'Y2ktc2VjcmV0LWtleS1mb3ItdGVzdHMhISEhISEhISE=',
              ],
              'db' => [
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'name' => 'myinvoice_ci',
                  'user' => 'root',
                  'pass' => 'ci',
              ],
              'redis' => [
                  'enabled' => true,
                  'host'    => '127.0.0.1',
                  'port'    => 6379,
                  'prefix'  => 'myinvoice:ci:',
              ],
              'captcha' => ['provider' => 'none'],
              // Fallback číselných řad. Reálná instalace je má buď tady, nebo na
              // dodavateli (Systém → Dodavatelé → Číslování faktur); ci-seed staví
              // holého tenanta, takže bez nich neprojde vystavení žádného dokladu.
              // Hodnoty shodné s cfg.sample.php.
              'varsymbol' => [
                  'templates' => [
                      'invoice'     => '{YY}{MM}{CCC}',
                      'proforma'    => '9{YY}{MM}{CCC}',
                      'credit_note' => '7{YY}{MM}{CCC}',
                  ],
              ],
          ];
          PHPCFG
          php api/bin/migrate.php
          php api/bin/ci-seed.php

      # tests/bootstrap.php odmítá běžet proti DB z cfg.php a vynucuje `<cfg-db>_test`
      # (pojistka, aby testy nikdy nesáhly na ostrá data). CI proto musí tu izolovanou
      # databázi opravdu mít — bez ní skončí celá Integration suita na
      # `Unknown database 'myinvoice_ci_test'`.
      #
      # Zakládá se přes PDO, ne přes `mysql` klienta: PHP s pdo_mysql je na runneru
      # jistota, kdežto verze klienta se s MariaDB rozchází.
      - name: Prepare isolated test database
        run: |
          php -r "(new PDO('mysql:host=127.0.0.1;port=3306', 'root', 'ci'))->exec(
            'CREATE DATABASE IF NOT EXISTS myinvoice_ci_test
             CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');"
          MYINVOICE_DB_NAME=myinvoice_ci_test php api/bin/migrate.php
          MYINVOICE_DB_NAME=myinvoice_ci_test php api/bin/ci-seed.php

      # Část integračních testů mluví na běžící instanci přes HTTP (bearer auth,
      # rate-limit hlavičky, cross-tenant vazba tokenu). Bez serveru se přeskočí.
      #
      # Server MUSÍ jet nad toutéž `_test` databází jako PHPUnit — fixtury zakládá
      # test, ověřuje je HTTP volání. Nad cfg.php databází by viděl prázdno.
      # Host v URL MUSÍ odpovídat kanonickému app.url z cfg.php. TenantDomainMiddleware
      # jiný Host záměrně odmítne jako neznámou doménu (421), i když míří na stejnou IP.
      - name: Start test server
        run: |
          MYINVOICE_DB_NAME=myinvoice_ci_test \
            php -S 127.0.0.1:8080 api/bin/dev-server-router.php >/tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Server se nerozeběhl:"; cat /tmp/php-server.log; exit 1

      # Auditní brána běží PŘED plnou sadou a jako samostatné kroky. Důvod je praktický:
      # guardy a invarianty jsou obrana proti třídě chyb, která se do kódu vrací (pravidlo
      # implementované jen na jedné větvi, SSOT obejitý vlastní kopií, tichá degradace).
      # Kdyby běžely uprostřed 6 800 testů, jejich selhání by se ve výpisu ztratilo
      # a nebylo by z něj poznat, že se rozbila právě obrana, ne funkce.
      #
      # AuditGateCoverageTest je čistě statický a hlásí, když z auditní vrstvy zmizí
      # guard nebo ji přestane spouštět tenhle workflow.
      - name: Auditní brána — guardy (L0)
        working-directory: api
        run: vendor/bin/phpunit --no-coverage --testsuite Architecture

      - name: Auditní brána — invarianty a fuzz (L3)
        working-directory: api
        run: vendor/bin/phpunit --no-coverage --testsuite Invariants

      - name: Run PHPUnit
        working-directory: api
        env:
          MYINVOICE_TEST_URL: http://localhost:8080
        run: php bin/test-parallel.php --processes=4 --application

  frontend:
    name: Frontend (Vue + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24 + pnpm
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: web
        run: pnpm exec vue-tsc --noEmit

      - name: PWA service worker tests
        working-directory: web
        run: pnpm test:pwa

      # Doteď CI pouštělo jen `test:pwa`, takže 2 000+ komponentových testů
      # nikdo v pipeline nespustil — tři rozbité testy hostingu tak na masteru
      # ležely nepovšimnuté od 6.6.0. Sada běží ~3 minuty, což za to stojí.
      - name: Unit and component tests
        working-directory: web
        run: pnpm test

      - name: Production build
        working-directory: web
        run: pnpm build
