# MyUcto.cz — Docker Compose pro Portainer / Dockge (pure-ENV, bez cfg souboru)
#
# Tahle varianta NEpotřebuje bind-mount `cfg.docker.php` — veškerá konfigurace
# se předává přes proměnné prostředí (12-factor). To je přesně to, co GUI
# nástroje jako Portainer (Stacks) a Dockge potřebují: stačí vložit tenhle
# YAML, vyplnit pár proměnných a nasadit. Žádné klonování repa, žádné soubory
# na hostu.
#
# ── Portainer ───────────────────────────────────────────────────────────────
#   Stacks → Add stack → Web editor → vlož tento soubor → níže vyplň proměnné
#   prostředí (sekce „Environment variables") → Deploy the stack.
#   Nebo jedním klikem přes App Template (portainer-template.json), viz manuál § 3.11.
#
# ── Dockge ──────────────────────────────────────────────────────────────────
#   + Compose → vlož tento soubor → vyplň `.env` v editoru → Save → Start.
#
# ── Povinné proměnné ────────────────────────────────────────────────────────
#   DB_PASSWORD          heslo aplikačního DB uživatele      (openssl rand -base64 28)
#   DB_ROOT_PASSWORD     root heslo MariaDB                   (openssl rand -base64 28)
#   MYINVOICE_PEPPER     sůl k hashování hesel, 32B base64    (openssl rand -base64 32)
#
# ── Doporučené ──────────────────────────────────────────────────────────────
#   MYINVOICE_SECRET_KEY 32B base64 pro šifrování TOTP secretů (openssl rand -base64 32).
#                        Když prázdné → fallback HKDF z pepperu (TOTP funguje, ale
#                        rotace pepperu pak zneplatní uložené 2FA).
#   APP_PORT             host port (default 8080) → http://<host>:<APP_PORT>
#
# ── Pro produkci za HTTPS reverse proxy (Caddy/Traefik/nginx) ────────────────
#   MYINVOICE_APP_URL=https://faktury.firma.cz   (přesná veřejná URL — do e-mailů)
#   MYINVOICE_SESSION_COOKIE_SECURE=true
#   MYINVOICE_SESSION_COOKIE_NAME=__Host-myinvoice_session
#   Proxy musí posílat hlavičku `X-Forwarded-Proto: https` (jinak redirect loop).
#
# SMTP a další volby lze nastavit i později v aplikaci (Nastavení), nebo přes ENV
# (klíče MYINVOICE_SMTP_* níže). Setup wizard po nasazení doběhne v prohlížeči.

services:
  app:
    image: ghcr.io/radekhulan/myucto:latest   # v produkci pinni konkrétní verzi, např. :4.34.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Žádný cfg mount — vše přes ENV. Stateful data drží jediný named volume.
      - app-data:/data
    environment:
      TZ: ${TZ:-Europe/Prague}
      MYINVOICE_DATA_DIR: /data
      MYINVOICE_ENABLE_CRON: ${MYINVOICE_ENABLE_CRON:-1}

      # App
      MYINVOICE_APP_ENV: ${MYINVOICE_APP_ENV:-production}
      # Veřejná URL do e-mailových odkazů. Nech prázdné a setup wizard ji uloží
      # podle URL, kterou v prohlížeči použiješ. Za reverse proxy ji nastav natvrdo.
      MYINVOICE_APP_URL: ${MYINVOICE_APP_URL:-}
      MYINVOICE_PEPPER: ${MYINVOICE_PEPPER:?MYINVOICE_PEPPER required — openssl rand -base64 32}
      MYINVOICE_SECRET_KEY: ${MYINVOICE_SECRET_KEY:-}

      # Databáze — míří na `db` service v tomto stacku.
      MYINVOICE_DB_HOST: db
      MYINVOICE_DB_PORT: "3306"
      MYINVOICE_DB_NAME: ${DB_NAME:-myucto}
      MYINVOICE_DB_USER: ${DB_USER:-myucto}
      MYINVOICE_DB_PASS: ${DB_PASSWORD:?DB_PASSWORD required — openssl rand -base64 28}

      # Cookies: default HTTP-friendly (přístup přes http://host:port). Za HTTPS
      # proxy přepni na Secure + __Host- (viz hlavička souboru).
      MYINVOICE_SESSION_COOKIE_SECURE: ${MYINVOICE_SESSION_COOKIE_SECURE:-false}
      MYINVOICE_SESSION_COOKIE_NAME: ${MYINVOICE_SESSION_COOKIE_NAME:-myinvoice_session}

      # MFA, passwordless login a zámek session (volitelné).
      MYINVOICE_AUTH_REQUIRE_MFA: ${MYINVOICE_AUTH_REQUIRE_MFA:-}
      MYINVOICE_AUTH_MFA_METHODS: ${MYINVOICE_AUTH_MFA_METHODS:-}
      MYINVOICE_OIDC_ENTRA_SKIP_MFA: ${MYINVOICE_OIDC_ENTRA_SKIP_MFA:-}
      MYINVOICE_AUTH_PASSWORDLESS_LOGIN: ${MYINVOICE_AUTH_PASSWORDLESS_LOGIN:-}
      MYINVOICE_SESSION_LOCK_AFTER_MINUTES: ${MYINVOICE_SESSION_LOCK_AFTER_MINUTES:-}

      # SMTP (volitelné — lze nechat prázdné a doplnit v Nastavení). Prázdné klíče
      # se v Configu ignorují, takže nepřebijí pozdější nastavení ze setup wizardu.
      MYINVOICE_SMTP_HOST: ${MYINVOICE_SMTP_HOST:-}
      MYINVOICE_SMTP_PORT: ${MYINVOICE_SMTP_PORT:-}
      MYINVOICE_SMTP_ENCRYPTION: ${MYINVOICE_SMTP_ENCRYPTION:-}
      MYINVOICE_SMTP_AUTH: ${MYINVOICE_SMTP_AUTH:-}
      MYINVOICE_SMTP_USER: ${MYINVOICE_SMTP_USER:-}
      MYINVOICE_SMTP_PASS: ${MYINVOICE_SMTP_PASS:-}
      MYINVOICE_SMTP_FROM_EMAIL: ${MYINVOICE_SMTP_FROM_EMAIL:-}
      MYINVOICE_SMTP_FROM_NAME: ${MYINVOICE_SMTP_FROM_NAME:-}

      # Redis (volitelné — nasadí se jen s profilem `redis`). Bez ENABLED=1 jede
      # aplikace na DB fallbacku: sessiony v `sessions`, rate limit v
      # `rate_limit_counters`. AUTH nech prázdné, pokud Redis nemá requirepass.
      MYINVOICE_REDIS_ENABLED: ${MYINVOICE_REDIS_ENABLED:-0}
      MYINVOICE_REDIS_HOST: ${MYINVOICE_REDIS_HOST:-redis}
      MYINVOICE_REDIS_PORT: ${MYINVOICE_REDIS_PORT:-6379}
      MYINVOICE_REDIS_AUTH: ${MYINVOICE_REDIS_AUTH:-}
      MYINVOICE_REDIS_DB: ${MYINVOICE_REDIS_DB:-0}
      MYINVOICE_REDIS_PREFIX: ${MYINVOICE_REDIS_PREFIX:-myinvoice:}
      # Workery php-fpm (image default 8, každý ~30-60 MB). Na silnějším stroji zvyš,
      # aby souběžní uživatelé nečekali ve frontě; prázdné = default image.
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-}
      # Lokální AI přes Ollamu (Nastavení → Integrace → AI brána). Prázdné = výchozí.
      MYINVOICE_OLLAMA_TIMEOUT: ${MYINVOICE_OLLAMA_TIMEOUT:-}
      MYINVOICE_OLLAMA_NUM_CTX: ${MYINVOICE_OLLAMA_NUM_CTX:-}
      MYINVOICE_OLLAMA_ALLOWED_HOSTS: ${MYINVOICE_OLLAMA_ALLOWED_HOSTS:-}

  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=${DB_INNODB_BUFFER_POOL:-128M}
      - --innodb-log-file-size=${DB_INNODB_LOG_SIZE:-48M}
      # Default 16 MB nestačí na dump ani obnovu s přílohami do 50 MB
      # (documents.max_file_bytes) — kontrola prostředí to hlásí jako varování.
      - --max-allowed-packet=${DB_MAX_ALLOWED_PACKET:-64M}
      # Dočasné tabulky (ORDER BY/GROUP BY nad joinem). Default 16 MB posílá na disk
      # i malý mezivýsledek — u deníku a sestav to stojí stovky ms navíc.
      - --tmp-table-size=${DB_TMP_TABLE_SIZE:-64M}
      - --max-heap-table-size=${DB_TMP_TABLE_SIZE:-64M}
      # Úložiště je SSD/NVMe. Default io_capacity=200 a flush_neighbors=1 jsou
      # hodnoty pro rotační disk a zbytečně brzdí zápis i čištění buffer poolu.
      - --innodb-io-capacity=${DB_INNODB_IO_CAPACITY:-1000}
      - --innodb-io-capacity-max=${DB_INNODB_IO_CAPACITY_MAX:-2000}
      - --innodb-flush-neighbors=0
      # Schéma má přes 550 tabulek, default 400 definic se recykluje pořád dokola.
      - --table-definition-cache=${DB_TABLE_DEFINITION_CACHE:-1000}
      # Přesnější statistiky = lepší plány. S defaultem 20 vzorků sahá optimalizátor
      # u self-joinů deníku po scanu celé tabulky (BNL) místo indexu.
      - --innodb-stats-persistent-sample-pages=64
      # Strop spojení drží nejhorší případ per-connection bufferů v mezích;
      # víc než 80 souběžných spojení tahle aplikace neotevře.
      - --max-connections=${DB_MAX_CONNECTIONS:-80}
      # Pomalé dotazy logovat trvale — bez nich se výkonový problém v produkci hádá.
      # Log leží v datovém volume; při long_query_time=1 je za normálu prázdný.
      - --slow-query-log=${DB_SLOW_QUERY_LOG:-1}
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=${DB_LONG_QUERY_TIME:-1}
      - --log-slow-verbosity=query_plan,explain
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD required — openssl rand -base64 28}
      MARIADB_DATABASE: ${DB_NAME:-myucto}
      MARIADB_USER: ${DB_USER:-myucto}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required — openssl rand -base64 28}
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    # maxmemory + policy jsou povinné: bez limitu si Redis s AOF vezme veškerou
    # RAM a nechá se OOM-killnout místo evikce. `volatile-lru` navíc evikuje jen
    # klíče s TTL — sessiony (SETEX) ano, ale nic bez TTL se nezahodí.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
  app-data:
  redis-data:
