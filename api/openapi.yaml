  /api/v1/accounting/assets/{id}/dispose:
    post:
      tags: [Accounting]
      summary: Vyřazení majetku (prodej / likvidace / dar / škoda)
      description: |
        Účetní/admin. Atomicky doúčtuje účetní odpis roku, potvrdí daňový půlodpis
        (§26/7) a zaúčtuje vyřazení (R19). Tržba z prodeje se z karty neúčtuje —
        výnos 641 vznikne vydanou fakturou (R20). Operace blokuje přeskočený
        předchozí rok i potvrzené odpisy pozdějších let. V `warnings` upozorní
        na DPH při darování a na doložení likvidace, manka či škody.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, type]
              properties:
                date: { type: string, format: date }
                type: { type: string, enum: [sold, liquidated, donated, damaged] }
                price: { type: [number, "null"], description: "Prodejní cena bez DPH, jen type=sold (evidenční)" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/assets/{id}/dispose/revert:
    post:
      tags: [Accounting]
      summary: Vrácení vyřazení majetku (R24)
      description: Účetní/admin. Jen dokud je období data vyřazení otevřené; storna zůstávají v deníku a dříve založená pauza daňového odpisu zůstává zachována.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/assets/{id}/depreciation/pause:
    post:
      tags: [Accounting]
      summary: Přerušení daňového odpisování pro daný rok (§26/8 ZDP)
      description: Účetní/admin. Jen rovnoměrné/zrychlené odpisy; §30a přerušit nelze.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fiscal_year]
              properties:
                fiscal_year: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/assets/{id}/depreciation/pause/{year}:
    delete:
      tags: [Accounting]
      summary: Zrušení přerušení odpisu roku
      description: Účetní/admin. Jen pokud neexistuje potvrzený řádek pozdějšího roku.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: year, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing:
    get:
      tags: [Accounting]
      summary: Stav uzávěrkového průvodce období (Epic F4)
      description: Období + kroky (precheck…open_next, stav pending/done/skipped, payload) + odvozené flagy can_*.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/accounting/periods/{id}/monthly-check:
    get:
      tags: [Accounting]
      summary: Měsíční kontrola (audit 2026-07 D8)
      description: |
        Reuse ClosingService::buildChecks nad libovolným rozsahem uvnitř období
        (měsíc/kvartál/vlastní od-do), kdykoli, BEZ zahájení uzávěrky. Read-only,
        nemění stav ani kroky. `date_from`/`date_to` volitelné (default = celé
        fiskální období); musí ležet uvnitř `starts_on`–`ends_on` období.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: date_from, schema: { type: string, format: date } }
        - { in: query, name: date_to, schema: { type: string, format: date } }
      responses:
        '200': { description: "OK {period, range_from, range_to, checks[], ran_at}", content: { application/json: { schema: { $ref: '#/components/schemas/MonthlyCheckResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/statement-notes:
    get:
      tags: [Accounting]
      summary: Příloha k účetní závěrce (§ 18/1/c ZoÚ, § 39/39a/39b vyhl. 500/2002)
      description: Povinné sekce dle kategorie účetní jednotky a povinného auditu, jejich obsah a co chybí. Sekce se ukládají per fiskální rok — čtení i zápis fungují i nad uzavřeným obdobím.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK {fiscal_year, category, scopes[], sections[], missing[], complete}", content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/accounting/periods/{id}/statement-notes/{section}:
    put:
      tags: [Accounting]
      summary: Uložení textu sekce přílohy k závěrce
      description: Prázdný/nullový `content` sekci smaže (vrátí se k případnému automatickému předvyplnění). Vrací čerstvý stav přílohy jako GET.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: section, required: true, schema: { type: string, pattern: '^[a-z0-9_]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, nullable: true }
      responses:
        '403':
          description: |
            Zápis přes API token (`token_write_forbidden`). Účetní a daňová vrstva
            je přes token jednosměrná — čtení ano, zápis jen z webového rozhraní,
            a to i tokenu se scope `read_write`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing/start:
    post:
      tags: [Accounting]
      summary: Zahájení uzávěrky (open→closing)
      description: Účetní/admin. Předchozí období musí být closed/approved (422 `previous_period_open`).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [row_version], properties: { row_version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing/abort:
    post:
      tags: [Accounting]
      summary: Přerušení uzávěrky (closing→open)
      description: Účetní/admin. Blokováno 422 `closing_entries_exist`, existují-li zaúčtované závěrkové zápisy.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [row_version], properties: { row_version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing/fx-preview:
    get:
      tags: [Accounting]
      summary: Náhled kurzových rozdílů k rozvahovému dni (bez zápisu)
      description: |
        Saldokonto (open-item z dokladů, kurz ČNB k ends_on) + banka/pokladna dle
        volitelného `bank_rows` (JSON pole {account_code, currency_code, foreign_balance}).
        Návrhy devizových zůstatků vrací v `proposals`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: bank_rows, schema: { type: string, description: "JSON pole bank řádků" } }
      responses:
        '200': { description: "OK {rate_info, saldo, bank, totals, proposals}", content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing/provisions-preview:
    get:
      tags: [Accounting]
      summary: Náhled opravných položek k pohledávkám (D9, §8a/§8c ZoR)
      description: |
        Aging účtu 311 k rozvahovému dni (reuse saldokonta) s návrhem zákonné OP dle
        §8a (18 měs. 50 %, 30 měs. 100 %) a §8c (do 30 000 Kč nad 12 měs. 100 %).
        Od 36 měsíců se automatický návrh vynuluje a položka nese upozornění na možné promlčení.
        Systém návrh jen nabízí — účetní ho per pohledávka potvrdí/upraví v /steps/provisions/run.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK {as_of, items, totals, rules}", content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing/estimates-suggest:
    get:
      tags: [Accounting]
      summary: Návrh dohadných položek pasivních (K10, 389)
      description: |
        Heuristický, read-only návrh dohadů pasivních k rozvahovému dni: opakující se
        měsíční náklad (dodavatel s fakturou ve ≥3 měsících roku a kadencí do měsíce před
        posledním), jehož faktura za POSLEDNÍ měsíc období nedorazila. Návrh částky = průměr
        netto posledních 3 faktur, protiúčet = nejčastější 5xx MD účet dodavatele.
        Systém návrh jen nabízí — účetní ho per dodavatel potvrdí/upraví a zaúčtuje přes
        /closing/entries (estimate.liability → MD 5xx / D 389).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK {as_of, items, totals, rules}", content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing/income-tax-preview:
    get:
      tags: [Accounting]
      summary: Náhled podkladu splatné daně z příjmů (D11, 591/341)
      description: |
        Přednabídne částku z finalizovaného DPPO přiznání téhož roku a zůstatky 341/591.
        Zaúčtování přes /steps/income_tax/run (idempotence source income_tax/period_id).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK {suggested_amount, has_finalized_return, taxpayer_type, applicable, balance_341, balance_591}; applicable=false pro FO", content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing/steps/{step}/run:
    post:
      tags: [Accounting]
      summary: Provedení kroku uzávěrky 1–5
      description: |
        Účetní/admin. precheck = přepočet kontrol; fx_revaluation = zaúčtování
        kurzových rozdílů (body `bank_rows`); depreciation/estimates/deferrals =
        checklist potvrzení (body `status` done|skipped + `note`). Kroky
        close_books/open_next mají vlastní endpointy /close a /open-next.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: step, required: true, schema: { type: string, enum: [precheck, depreciation, fx_revaluation, estimates, deferrals, provisions, income_tax] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [row_version]
              properties:
                row_version: { type: integer, minimum: 1 }
                status: { type: string, enum: [done, skipped], description: "Checklist kroky + skip u provisions/income_tax" }
                note: { type: string, maxLength: 500 }
                amount: { type: number, description: "Jen income_tax — splatná daň (591/341)" }
                items:
                  type: array
                  description: "Jen provisions — účetní-potvrzený seznam OP per pohledávka (§8a/§8c)"
                  items:
                    type: object
                    required: [invoice_id]
                    properties:
                      invoice_id: { type: integer }
                      legal_amount: { type: number, description: "Zákonná OP (558)" }
                      acct_amount: { type: number, description: "Účetní OP nad rámec (559)" }
                      note: { type: string }
                bank_rows:
                  type: array
                  description: "Jen fx_revaluation — devizové zůstatky bank/pokladen"
                  items:
                    type: object
                    required: [account_code, currency_code, foreign_balance]
                    properties:
                      account_code: { type: string }
                      currency_code: { type: string, minLength: 3, maxLength: 3 }
                      foreign_balance: { type: number }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing/steps/{step}/revert:
    post:
      tags: [Accounting]
      summary: Revert kroku uzávěrky (R12 — hard delete závěrkových zápisů)
      description: |
        Admin-only. Pořadí vynuceno: open_next → close_books → fx_revaluation;
        mazané řádky jdou dumpem do activity_log. Asistované zápisy
        estimates/deferrals se nemažou — stornují se jednotlivě.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: step, required: true, schema: { type: string, enum: [precheck, depreciation, fx_revaluation, estimates, deferrals, provisions, income_tax, close_books, open_next] } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [row_version], properties: { row_version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing/entries:
    post:
      tags: [Accounting]
      summary: Asistovaný závěrkový zápis (dohady 388/389, časové rozlišení 381–385)
      description: |
        Účetní/admin, jen ve stavu closing. Kontace z posting_rules
        (estimates: estimate.asset|estimate.liability; deferrals:
        accrual.prepaid.expense|accrual.accrued.expense|accrual.deferred.revenue|
        accrual.accrued.revenue), entry_date = ends_on, číslo z řady ID.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [row_version, step, rule_key, amount, description]
              properties:
                row_version: { type: integer, minimum: 1 }
                step: { type: string, enum: [estimates, deferrals] }
                rule_key: { type: string }
                amount: { type: number, exclusiveMinimum: 0 }
                description: { type: string }
                counter_account: { type: string, description: "Povinný, nemá-li kontace stranu" }
      responses:
        '201': { description: Vytvořený zápis, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/closing/entries/{entryId}/reverse:
    post:
      tags: [Accounting]
      summary: Storno asistovaného závěrkového zápisu
      description: Účetní/admin. Standardní zrcadlový protizápis (zápisy z asistenta se nikdy nemažou).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: entryId, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [row_version], properties: { row_version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/close:
    post:
      tags: [Accounting]
      summary: Uzavření účetních knih (krok 6, ČÚS 002)
      description: |
        Admin-only, stav closing, kroky 1–5 done/skipped, precheck bez errors.
        Zaúčtuje closing zápis (5xx/6xx→710, VH 710↔702, rozvahové↔702) k ends_on
        s číslem z řady UZ a přepne období na closed.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [row_version], properties: { row_version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: "OK {entry_id, profit, document_no…}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/open-next:
    post:
      tags: [Accounting]
      summary: Otevření nového roku přes 701 (krok 7)
      description: |
        Admin-only, stav closed. Následující období se dohledá/založí (musí přesně
        navazovat — 422 `period_gap`); opening zápis = zrcadlo rozvahové části
        closingu + VH na 431, číslo z řady OT; volitelné FX storno saldokonta.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [row_version], properties: { row_version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/profit-distribution/preview:
    get:
      tags: [Accounting]
      summary: Náhled rozdělení výsledku hospodaření (D10)
      description: |
        Disponibilní zůstatek 431 v cílovém otevřeném období. Zdrojové období
        musí být schválené; odpověď obsahuje i limit rozdělitelných zdrojů z 431/428/429.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK {approved_period, target_period, balance_431, available_profit, retained_profit, uncovered_loss, distributable_resources, is_loss, withholding_rate}", content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/profit-distribution:
    post:
      tags: [Accounting]
      summary: Zaúčtování rozdělení VH (D10, 431 → 428/429/364…)
      description: |
        Účetní/admin. Zisk: MD 431 / D {428, fondy, 364}; ztráta: MD {429, 428} / D 431.
        Každý řádek kind=shares představuje jednoho společníka; §36 srážková daň se
        počítá a zaokrouhluje dolů per společník (MD účet podílů / D 342). Kontrola
        Σ přídělů = |zůstatek 431| a limitu rozdělitelných zdrojů. Účtuje se do OTEVŘENÉHO období; idempotence source
        profit_distribution/approved_period_id.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision_date, target_row_version, allocations]
              properties:
                decision_date: { type: string, format: date, description: "Datum rozhodnutí valné hromady" }
                target_row_version: { type: integer, minimum: 1, description: "row_version cílového otevřeného období (CAS)" }
                withholding_rate: { type: number, minimum: 0, maximum: 1, default: 0.15 }
                allocations:
                  type: array
                  items:
                    type: object
                    required: [account_code, amount]
                    properties:
                      account_code: { type: string, example: "428" }
                      amount: { type: number, exclusiveMinimum: 0 }
                      kind: { type: string, enum: [retained, fund, shares, loss_coverage] }
      responses:
        '200': { description: "OK {entry_id, distributed, withholding, target_period_id}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: "distribution_mismatch / validation_failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/accounting/periods/{id}/profit-distribution/revert:
    post:
      tags: [Accounting]
      summary: Revert rozdělení VH (D10 — hard delete s dumpem)
      description: Admin-only. Smaže zápis rozdělení, dokud je cílové otevřené období open.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [target_row_version], properties: { target_row_version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/journal/transfer:
    post:
      tags: [Accounting]
      summary: Dvě nohy převodu mezi peněžními účty přes 261 (R14)
      description: |
        Účetní/admin. Vytvoří DVA manual zápisy: k date_out MD 261 / D account_from,
        k date_in MD account_to / D 261; sdílené číslo dokladu z řady PP (sufix /1, /2).
        Storno standardně po jednotlivých nohách.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date_out, date_in, amount, account_from, account_to]
              properties:
                date_out: { type: string, format: date }
                date_in: { type: string, format: date }
                amount: { type: number, exclusiveMinimum: 0 }
                account_from: { type: string, example: "221" }
                account_to: { type: string, example: "211" }
                description: { type: string }
                force: { type: boolean, default: false, description: "Vědomě povolí ruční zápis i při nalezené bankovní transakci převodu." }
      responses:
        '201': { description: "OK {document_no, entries[2]}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Nalezeny bankovní transakce, jejichž ruční zápis by mohl převod zdvojit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransferCandidatesError'
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/reports/tax-base-adjustments:
    get:
      tags: [Accounting]
      summary: Evidenční podklad DPPO (R19 — bez účtování, bez XML)
      description: |
        Rozdíl daňových a účetních odpisů roku, vyřazený majetek s daňovou/účetní
        ZC a klasifikací uznatelnosti (§24/2/b, §25/1/t, §24/2/l ZDP) a informativní
        zůstatky 388/389 + kurzové rozdíly 563/663 z přecenění.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: fiscal_year, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK {depreciation, disposals, info}", content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/document-series:
    get:
      tags: [Accounting]
      summary: Číselné řady deníku, pokladny a skladu (per rok)
      description: |
        Řádek řady vzniká lazy při prvním výdeji čísla. Firmě v daňové evidenci se
        vracejí jen řady, které umí vydat (pokladní, skladové, objednávkové) —
        deníkové (`closing`, `opening`, `fx`, `transfer`, `manual`, `offset`) ne.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/accounting/document-series/{code}/{year}:
    put:
      tags: [Accounting]
      summary: Nastavení číselné řady (prefix, tvar čísla, čítač)
      description: |
        Účetní/admin. Aspoň jedna položka těla; projeví se u dalšího vydaného čísla.
        `prefix` 1–10 znaků A–Z/0–9. `number_format` je šablona čísla s placeholdery
        {PREFIX}, {YYYY}, {YY} a {C+} (počet C = odsazení nulami); prázdná / null vrací
        řadu na vestavěné `{PREFIX}-{YYYY}-{CCCC}`. `next_number` je číslo PŘÍŠTÍHO
        vydaného dokladu — umožňuje navázat na řadu převzatou z jiného systému.
        `register_id` > 0 míří na vlastní řadu té pokladny (jen `cash_in` / `cash_out`),
        0 nebo vynechané na společnou řadu firmy.

        Deníkové řady (`closing`, `opening`, `fx`, `transfer`, `manual`, `offset`) jsou
        dostupné jen v podvojném účetnictví; v daňové evidenci vrátí `wrong_accounting_mode`
        (403). Pokladní, skladové a objednávkové řady editují oba režimy.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: code, required: true, schema: { type: string, enum: [closing, opening, fx, transfer, manual, cash_in, cash_out, stock_in, stock_out, stock_transfer, offset, purchase_order] } }
        - { in: path, name: year, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                prefix: { type: string, pattern: "^[A-Z0-9]{1,10}$" }
                number_format: { type: string, nullable: true, maxLength: 40, example: "{PREFIX}{CCCCC}" }
                next_number: { type: integer, minimum: 1, maximum: 999999999 }
                register_id: { type: integer, minimum: 0, default: 0, description: "Vlastní řada pokladny (jen cash_in/cash_out); 0 = společná řada firmy" }
      responses:
        '200': { description: OK (aktuální seznam řad), content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # F5: per-user UI stav — ukládané filtry a preference tabulek (všechny role vč. readonly)
  /api/v1/user/filters:
    get:
      tags: [User]
      summary: Seznam uložených filtrů usera pro aktuální firmu
      description: page_key volitelný (R6); bez něj vrací všechny filtry usera pro aktuální firmu.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: page_key, required: false, schema: { type: string } }
      responses:
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`) — tento endpoint je
            dostupný jen z webového rozhraní. Viz „Endpointy dostupné jen z webového
            rozhraní" v úvodu dokumentace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: Pole filtrů, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [User]
      summary: Vytvoření uloženého filtru
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page_key, name, payload]
              properties:
                page_key: { type: string }
                name: { type: string, maxLength: 100 }
                payload: { type: object, additionalProperties: { type: string } }
                is_default: { type: boolean }
                sort_order: { type: integer }
      responses:
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`) — tento endpoint je
            dostupný jen z webového rozhraní. Viz „Endpointy dostupné jen z webového
            rozhraní" v úvodu dokumentace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '201': { description: Vytvořený filtr, content: { application/json: { schema: { type: object } } } }
        '409': { description: Filtr s tímto názvem už existuje (filter_name_exists) }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/user/filters/{id}:
    put:
      tags: [User]
      summary: Úprava uloženého filtru (page_key immutable)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                payload: { type: object, additionalProperties: { type: string } }
                sort_order: { type: integer }
                is_default: { type: boolean }
      responses:
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`) — tento endpoint je
            dostupný jen z webového rozhraní. Viz „Endpointy dostupné jen z webového
            rozhraní" v úvodu dokumentace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: Aktualizovaný filtr, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Filtr s tímto názvem už existuje (filter_name_exists) }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [User]
      summary: Smazání uloženého filtru
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`) — tento endpoint je
            dostupný jen z webového rozhraní. Viz „Endpointy dostupné jen z webového
            rozhraní" v úvodu dokumentace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/user/preferences:
    get:
      tags: [User]
      summary: Uživatelské preference UI (globální per user)
      description: 'Mapa pref_key → payload. Podporuje table.*, nav.order a keyboard.shortcuts; keys volitelný — výčtem omezí výsledek.'
      parameters:
        - { in: query, name: keys, required: false, schema: { type: string }, description: 'CSV výčet pref_key (např. table.invoices,nav.order,keyboard.shortcuts)' }
      responses:
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`) — tento endpoint je
            dostupný jen z webového rozhraní. Viz „Endpointy dostupné jen z webového
            rozhraní" v úvodu dokumentace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: Mapa pref_key → payload, content: { application/json: { schema: { type: object } } } }

  /api/v1/user/preferences/{key}:
    put:
      tags: [User]
      summary: Upsert uživatelské preference
