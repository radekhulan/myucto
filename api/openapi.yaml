      summary: Přesune kategorii pod jiného rodiče
      description: |
        `parent_id=null` přesune uzel do kořene. Přepíše `path`/`depth` celého
        podstromu. Odmítne (422) cyklus — nový rodič nesmí být uzel sám ani
        jeho potomek.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id: { type: [integer, "null"] }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Cyklus — kategorii nelze přesunout do vlastního podstromu }
