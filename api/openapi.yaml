  /api/v1/dashboard/summary:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Reports]
      summary: Dashboard summary — KPI, top klienti, obrat, forecasty, statistiky
      description: |
        Agregovaná data pro Dashboard i stránku Grafy (`/stats`). Endpoint
        sjednocuje desítky agregací do jednoho dotazu (cache je řízena DB
        cache tabulkami `*_revenue_cache`).

        **Obrat (VAT-aware):**
        Pro plátce DPH (`supplier.is_vat_payer = 1`) se ve všech agregacích
        obratu používá `total_without_vat`; pro neplátce `total_with_vat`.
        Vrácený flag `is_vat_payer` to indikuje.

        **Obsah:**
        - **kpi** — obrat per měna (this/prev year + YTD loni) + počty faktur,
          klientů a zakázek per rok + ø doba úhrady + overdue,
        - **overdue / unpaid_upcoming** — tabulky faktur po/před splatnosti,
        - **top_clients_ytd / top_clients_prev_year** — top 12 klientů YTD a loni,
        - **top_clients_12m** — top 12 klientů za rolling 12 měsíců (smart-mix v UI),
        - **revenue_by_month** — 12 + 12 měsíců (rolling + prev_year) per měna,
        - **revenue_by_year** — všechny roky s aktivitou,
        - **rolling_12m** — plovoucí 12měsíční obrat per měna (+ 12m předtím
          pro YoY); relevantní pro DPH limit (2 mil. Kč),
        - **revenue_last_30d** — live obrat za posledních 30 dní per měna,
        - **revenue_forecast** — predikce ročního obratu (medián tří projekcí: run-rate / krátkodobý růst / trend, vč. rozpětí),
        - **cashflow_ytd** — kumulativní inkasované platby letošek vs loni,
        - **cashflow_forecast** — co přiteče z neuhrazených v 30/60/90 dnech,
        - **due_buckets** — splatné dnes / tento týden / tento měsíc,
        - **aging_report** — stáří pohledávek (current/1-30/31-60/61-90/90+),
        - **payment_days_histogram** — distribuce doby úhrady (12m),
        - **vat_breakdown_12m** — rozpad obratu per sazba DPH (jen plátce DPH),
        - **invoice_size_histogram** — distribuce velikosti faktur v CZK ekv.,
        - **active_clients_count / active_recurring_count** — counts,
        - **pending_approvals** — počet žádostí o schválení výkazu,
        - **is_vat_payer / today / year / prev_year** — kontext.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }

  /api/v1/bank-statements:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Bank]
      summary: Seznam nahraných bankovních výpisů
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: Stránka (50 výpisů na stránku).
        - in: query
          name: filter
          style: deepObject
          explode: true
          description: "Volitelné filtry hlaviček a transakcí, zadávané jako filter[year], filter[month], filter[account], filter[counterparty_account], filter[vendor_id], filter[amount], filter[posting_status]."
          schema:
            type: object
            properties:
              year:
                type: integer
                description: "Rok dle statement_date."
              month:
                type: integer
                minimum: 1
                maximum: 12
                description: "Měsíc dle statement_date."
              account:
                type: string
                description: "Číslo účtu — porovnává se normalizovaně (padding, lomítko ani kód banky nevadí)."
              counterparty_account:
                type: string
                description: "Částečná normalizovaná shoda čísla protiúčtu nebo IBANu; mezery, pomlčky a lomítka se ignorují."
              client_id:
                type: integer
                format: int64
                description: "Zákazník nebo dodavatel z clients; hledá příchozí i odchozí platby přes spárované vydané/přijaté faktury nebo evidovaný účet partnera."
              amount:
                type: number
                format: float
                description: "Přesná částka transakce bez ohledu na znaménko."
              posting_status:
                type: string
                enum: [unposted]
                description: "Vrátí jen výpisy s alespoň jedním skutečným nezaúčtovaným pohybem; ignorované položky a e-mailová avíza se nepočítají."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BankStatement' }
                  total:
                    type: integer
                    description: "Celkový počet výpisů odpovídajících filtru."
                  page: { type: integer }
                  limit:
                    type: integer
                    description: "Počet položek na stránku (50)."
                  years:
                    type: array
                    items: { type: integer }
                    description: "Roky s alespoň jedním výpisem (volby filtru; přes celý scope, ne aktuální filtr)."
                  accounts:
                    type: array
                    description: "Konfigurované bankovní účty s alespoň jedním výpisem (volby filtru)."
                    items:
                      type: object
                      properties:
                        account_number: { type: string }
                        bank_code: { type: [string, "null"] }
                        label: { type: [string, "null"] }
                  scan_configured:
                    type: boolean
                    description: "Je nakonfigurované hostitelské adresářové skenování (cfg.bank_import.scan_root)? Interní příznak pro UI tlačítko Skenovat adresář."

  /api/v1/bank-statements/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Bank]
      summary: Detail výpisu vč. stránkovaných transakcí
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 5, maximum: 200, default: 50 } }
        - in: query
          name: status
          schema: { type: string, enum: [unmatched, auto_exact, auto_partial, manual, ignored] }
          description: Filtr stavu párování.
        - in: query
          name: posting_status
          schema: { type: string, enum: [unposted, posted] }
          description: Filtr podle existence aktivního účetního zápisu bankovního pohybu.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementDetail' }
    delete:
      tags: [Bank]
      summary: Smaže výpis vč. transakcí a payment_matches (admin only)
      description: |
        Cascade delete přes FK constraints — smaže transakce výpisu i jejich
        payment_matches záznamy. Status zaplacených faktur se NEzmění (případný
        rollback paid→issued je doménou uživatele přes /unmatch endpoint).

        Vyžaduje roli `admin`. Účetní (`accountant`) může nahrávat a párovat,
        ale ne mazat (forensic integrity uzávěrek DPH/KH).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
        '403': { description: "Forbidden — role není admin" }
        '404': { description: "Výpis nenalezen nebo nepatří current supplier" }
        '409':
          description: |
            Výpis nelze smazat — má živou vazbu z jiné agendy. `has_matches` =
            avízo-výpis se spárovanými položkami; `has_dependencies` = položky
            výpisu jsou doklad o vyplacení mezd (`error.blocked_by` uvádí počty
            po druzích vazby).

  /api/v1/bank-statements/{id}/download:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Bank]
      summary: Stáhne originální obsah GPC souboru
      description: |
        Vrací bajt-přesný originál uploadovaného GPC souboru (uložený od v4.1.0
        v `bank_statements.file_content`). Pro výpisy importované před v4.1.0
        není soubor k dispozici → 410 Gone.

        Klient si může před voláním zkontrolovat pole `has_file` v `BankStatement`.
      responses:
        '200':
          description: OK — GPC bajty
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="<original-filename>"'
          content:
            text/plain:
              schema: { type: string, format: binary }
        '404': { description: "Výpis nenalezen" }
        '410': { description: "Soubor není k dispozici (importováno před v4.1.0)" }

  /api/v1/bank-transactions/{id}/match:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Bank]
      summary: Ručně přiřadí transakci k faktuře a zaeviduje úhradu
      description: |
        Použij když automatický matching nezachytil platbu (variabilní symbol
        chybí nebo neodpovídá). Zaeviduje platbu v měně faktury; plné pokrytí
        ji označí jako `paid` s `paid_at = transaction.posted_at`, nižší platba
        zůstane částečnou úhradou. U CZK platby cizoměnové faktury odpovídající
        celému zbytku se v platbě uloží celý zbytek v měně faktury; přesná CZK
        částka zůstává na bankovní transakci.

        Doklad se vybírá právě jedním ze čtyř způsobů (v tomto pořadí priority):

        - `invoice_ids` (2 a více) — sloučená úhrada: jedna příchozí platba proti
          více vystavaným fakturám. Součet musí sedět na částku transakce.
          Jediné ID v poli degraduje na běžné 1:1 párování.
        - `purchase_invoice_id` — **přijatá** faktura (odchozí platba dodavateli).
          Bez tohoto pole nelze přijatou fakturu spárovat vůbec.
        - `invoice_id` — vystavená faktura, 1:1.
        - `varsymbol` — dohledá doklad podle variabilního symbolu; nejdřív mezi
          vystavenými fakturami, pak mezi přijatými (i podle `vendor_invoice_number`).

        Odpověď má tři tvary podle toho, co se párovalo — vždy obsahuje `matched`,
        `paid_at` a `posting` (souhrn automatického zaúčtování, `null` když se
        neúčtovalo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Vyplň právě jedno z: `invoice_ids`, `purchase_invoice_id`, `invoice_id`, `varsymbol`."
              properties:
                invoice_id:
                  type: integer
                  format: int64
                  description: Vystavená faktura (1:1 párování).
                purchase_invoice_id:
                  type: integer
                  format: int64
                  description: Přijatá faktura — odchozí platba dodavateli (N:N přes `payment_matches`).
                invoice_ids:
                  type: array
                  description: Sloučená úhrada jedné platby proti více vystaveným fakturám (2 a více ID).
                  items: { type: integer, format: int64 }
                varsymbol:
                  type: string
                  description: Variabilní symbol — alternativa k ID, dohledá vystavenou i přijatou fakturu.
      responses:
        '200':
          description: OK — spárováno
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Vystavená faktura (1:1)
                    properties:
                      matched: { type: boolean }
                      paid_at: { type: [string, "null"], description: "Datum úhrady (`posted_at` transakce)." }
                      posting: { $ref: '#/components/schemas/BankPostingSummary' }
                      final_draft_id:
                        type: integer
                        format: int64
                        description: Jen u zálohové faktury — ID vzniklého draftu finální faktury.
                      partial_payment:
                        type: boolean
                        description: Přítomné (a `true`) jen když platba fakturu neuhradila celou.
                      tax_document_id:
                        type: integer
                        format: int64
                        description: Jen když vznikl daňový doklad k přijaté platbě (§28).
                      payment_thanks_sent:
                        type: boolean
                        description: Přítomné (a `true`) jen když se odeslal děkovný e-mail za úhradu.
                  - type: object
                    title: Sloučená úhrada (split)
                    properties:
                      matched: { type: boolean }
                      split: { type: boolean, description: Vždy `true` u tohoto tvaru. }
                      paid_at: { type: [string, "null"] }
                      invoice_ids:
                        type: array
                        items: { type: integer, format: int64 }
                      posting: { $ref: '#/components/schemas/BankPostingSummary' }
                      final_draft_ids:
                        type: array
                        description: ID draftů finálních faktur ke zálohovým, pokud nějaké vznikly.
                        items: { type: integer, format: int64 }
                  - type: object
                    title: Přijatá faktura
                    properties:
                      matched: { type: boolean }
                      paid_at: { type: [string, "null"] }
                      purchase_invoice_id: { type: integer, format: int64 }
                      posting: { $ref: '#/components/schemas/BankPostingSummary' }
        '400':
          description: "Chybí `invoice_id` i `varsymbol` (`validation_failed`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            Transakce nenalezena (`not_found`), faktura nenalezena nebo patří jiné
            firmě (`invoice_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Párování odmítnuto — transakce už je spárovaná (`tx_already_paired`),
            není příchozí (`not_incoming`), stav dokladu se mezitím změnil
            (`state_changed`, `invalid_status`), nesedí měna (`currency_mismatch`),
            typ dokladu (`invalid_type`), klient (`client_mismatch`, `no_client`),
            součet u sloučené úhrady (`sum_mismatch`), nebo doklad nemá co uhradit
            (`nothing_to_pay`, `cannot_reconcile`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: "Párování selhalo (`match_failed`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/bank-transactions/{id}/unmatch:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
