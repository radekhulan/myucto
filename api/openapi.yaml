                    example: [2026, 2025, 2024, 2023, 2018]
                    description: Distinct roky z `invoices` (vystavené)
                  purchase_invoices:
                    type: array
                    items: { type: integer }
                    example: [2026, 2025, 2024]
                    description: Distinct roky z `purchase_invoices` (přijaté)
                  combined:
                    type: array
                    items: { type: integer }
                    example: [2026, 2025, 2024, 2023, 2018]
                    description: Sjednocení obou množin + aktuální a minulý rok jako floor

  # ============================================================================
  # Purchase invoices (přijaté faktury) — fáze 1 integrace forku
  # ============================================================================
  /api/v1/purchase-invoices:
    get:
      tags: [Purchase invoices]
      summary: Seznam přijatých faktur seskupený po měsících
      description: |
        Vrací přijaté faktury aktuálního tenant (supplier_id), seskupené podle
        `COALESCE(tax_date, issue_date)` per měsíc. Stejný response tvar jako
        `/invoices` ale s `vendor_*` poli místo `client_*`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - in: query
          name: filter[status]
          schema: { type: string, enum: [draft, received, booked, paid, cancelled] }
        - in: query
          name: filter[document_kind]
          schema: { type: string, enum: [invoice, receipt, credit_note, advance, tax_document] }
        - in: query
          name: filter[vendor_id]
          schema: { type: integer }
        - in: query
          name: filter[year]
          schema: { type: integer }
        - in: query
          name: filter[month]
          schema: { type: integer }
        - in: query
          name: filter[unpaid_only]
          schema: { type: boolean }
        - in: query
          name: filter[overdue]
          schema: { type: boolean }
        - in: query
          name: filter[unpaid_as_of]
          description: >
            Neuhrazené K DATU X (na rozdíl od `filter[unpaid_only]`, který se dívá na
            dnešní status): doklad vystavený do X (`issue_date <= X`), u kterého k X
            nebyl uhrazen celý `amount_to_pay`. Přijaté faktury nemají obdobu
            `invoice_payments` — plná úhrada k X je autoritativní jen přes
            `status='paid' AND paid_at <= X`, jinak best-effort ze součtu
            `payment_matches.amount` s `bank_transactions.posted_at <= X` (jen bankovní
            párování). Stejná definice jako v saldokontu.
          schema: { type: string, format: date, example: "2026-06-30" }
        - in: query
          name: filter[booked]
          description: "Zaúčtování (jen podvojné účetnictví): 1 = zaúčtováno (booked_at není NULL), 0 = nezaúčtováno"
          schema: { type: string, enum: ['1', '0'] }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        month: { type: string, example: "2026-05" }
                        count: { type: integer }
                        totals_per_currency:
                          type: array
                          items:
                            type: object
                            properties:
                              currency: { type: string }
                              without_vat: { type: number }
                              vat: { type: number }
                              with_vat: { type: number }
                        invoices:
                          type: array
                          items: { $ref: '#/components/schemas/PurchaseInvoiceListItem' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      per_page: { type: integer }
                      pages: { type: integer }
    post:
      tags: [Purchase invoices]
      summary: Vytvoří draft přijaté faktury
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseInvoicePayload' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseInvoice' }
        '400': { description: Validation error }

  /api/v1/purchase-invoices/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Purchase invoices]
      summary: Detail přijaté faktury
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseInvoice' }
        '404': { description: Nenalezeno }
    put:
      tags: [Purchase invoices]
      summary: Update přijaté faktury (jen draft)
      description: |
        Vynechaný klíč `items` znamená „položky neměň" — částečný payload (jen DUZP,
        jen poznámka) doklad nevyprázdní. Explicitně poslané prázdné pole `items: []`
        na dokladu, který položky má, se odmítne s 422 `no_items`: součty se počítají
        z řádků, takže by vznikl doklad na nulu. Poslané neprázdné `items` řádky nahradí
        (DELETE + INSERT), takže payload musí nést kompletní seznam. Vyprázdnit řádky
        draftu lze dedikovaným `PUT /api/v1/purchase-invoices/{id}/items`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - in: query
          name: force
          description: |
            Admin override pro nedraftové doklady — dovolí upravit `received`,
            `booked` i `paid`. Nedotknutelný zůstává jen `cancelled`: storno je
            auditní stopa a needituje se.
          schema: { type: boolean }
        - in: query
          name: force_mode
          schema: { type: string, enum: [reconcile, notes_only] }
          description: |
            **Povinné** (lze poslat i v těle), když admin s `force=1` upravuje doklad,
            který má aktivní zaúčtovaný zápis v uzavřeném období — jinak `422
            force_mode_required`. Bez volby by se doklad rozešel s deníkem.

            - `reconcile` — doklad se opraví, původní zápis se stornuje a doklad se
              přeúčtuje do aktuálního otevřeného období.
            - `notes_only` — smí se změnit jen neúčetní pole (poznámky, jazyk).
              Dotkne-li se payload účetních, částkových nebo DPH polí, vrátí se
              `422 financial_change_not_allowed` se seznamem těch polí.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseInvoicePayload' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseInvoice' }
        '400':
          description: "Validace selhala (`validation_failed`) — chybná pole v `error.fields`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Doklad je v uzamčeném období a role na jeho úpravu nedosáhne (Epic F6)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Přijatá faktura nenalezena
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Doklad není editovatelný (`not_editable`) — nedraftový bez `force=1`,
            nebo stornovaný. Uzamčené období u účetní role hlásí `document_locked`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            `items: []` by doklad připravilo o všechny položky (`no_items`), chybí
            `force_mode` u zaúčtovaného dokladu v uzavřeném období (`force_mode_required`),
            nebo `force_mode=notes_only` narazil na změnu účetního pole
            (`financial_change_not_allowed`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Purchase invoices]
      summary: Smaže draft (vystavené faktury použij transition cancel)
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      responses:
        '200': { description: OK }
        '409': { description: Lze smazat jen draft }

  /api/v1/purchase-invoices/{id}/items:
    put:
      tags: [Purchase invoices]
      summary: Přepíše položky a přepočte sumy
      description: |
        Klíč `items` je povinný — na rozdíl od hlavičkového `PUT /purchase-invoices/{id}`
        tu není „nepošlu = neměň", takže jeho vynechání vrátí 400. Prázdné pole `items: []`
        naopak projde a řádky draftu smaže; je to jednoznačný pokyn a doklad bez řádků je
        u konceptu pracovní stav.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/PurchaseInvoiceItemPayload' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseInvoice' }
        '400':
          description: Chybí klíč `items`, nebo neplatné řádky
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { description: Položky lze upravovat jen u konceptu }

  /api/v1/purchase-invoices/{id}/exchange-rate:
    post:
      tags: [Purchase invoices]
      summary: Nastaví exchange rate manuálně
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rate: { type: [number, "null"] }
                rate_date: { type: [string, "null"], format: date }
                source: { type: string, enum: [cnb, manual, idoklad, fakturoid], default: manual }
      responses:
        '200': { description: OK }

  /api/v1/purchase-invoices/{id}/transition:
    post:
      tags: [Purchase invoices]
      summary: Přechod stavu (state machine draft → received → booked → paid; + cancelled)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, enum: [received, booked, paid, cancelled] }
                paid_date:
                  type: string
                  format: date
                  description: Pouze pro target=paid (default = dnes)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseInvoice' }
        '409': { description: Invalid transition }

  /api/v1/purchase-invoices/{id}/pdf:
    post:
      tags: [Purchase invoices]
      summary: Upload originálního PDF od dodavatele (archive + SHA-256 dedup)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF dokument (max 20 MiB, magic bytes %PDF- validation)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  pdf_path: { type: string }
                  pdf_hash: { type: string, description: SHA-256 hex }
                  pdf_size_bytes: { type: integer }
                  pdf_original_name: { type: string }
        '409':
          description: Stejné PDF už archivováno u jiné faktury (existing_purchase_invoice_id v error.extra)
        '413': { description: File too large (> 20 MiB) }
    get:
      tags: [Purchase invoices]
      summary: Stáhne archivované PDF od dodavatele
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf: {}
        '404': { description: K faktuře není archivovaný PDF }
    delete:
      tags: [Purchase invoices]
      summary: Smaže archivované originální PDF (dedup-aware; guard proti zamčené faktuře)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200': { description: Smazáno }
        '404': { description: K faktuře není archivovaný PDF }
        '409': { description: Faktura je zamčená (denyIfLocked) }

  /api/v1/purchase-invoices/{id}/our-pdf:
    get:
      tags: [Purchase invoices]
      summary: Naše PDF rekonstrukce přijaté faktury (mPDF z dat)
      description: |
        Vygeneruje naši vlastní PDF kopii přijaté faktury. Užitečné když chybí
        originál (importované jen metadata) nebo chceme vlastní layout.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: inline, schema: { type: integer, enum: [0,1] }, description: '1 = Content-Disposition: inline (iframe preview)' }
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf: {}
        '404': { description: Faktura nenalezena }

  /api/v1/purchase-invoices/{id}/isdoc:
    get:
      tags: [Purchase invoices]
      summary: ISDOC 6.0 XML export přijaté faktury
      description: |
        Role inversion — pro přijatou je `AccountingSupplierParty` = vendor,
        `AccountingCustomerParty` = náš tenant. Kořenové `ID` obsahuje číslo
        dokladu dodavatele; interní číslo MyInvoice je v
        `Extensions/myi:InternalDocumentNumber` s namespace
        `https://myinvoice.cz/isdoc/extensions/2026`. `PaymentMeans` obsahuje
        evidovaný bankovní účet dodavatele a platební `VariableSymbol`; pokud
        samostatný platební VS chybí, použije se jeho číselná podoba odvozená
        z čísla faktury dodavatele.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200':
          description: ISDOC XML
          content:
            application/xml: {}
        '404': { description: Faktura nenalezena }

  /api/v1/purchase-invoices/{id}/pohoda:
    get:
      tags: [Purchase invoices]
      summary: Pohoda XML (dataPack s `<pur:purchase>`) export přijaté faktury
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200':
          description: Pohoda XML
          content:
            application/xml: {}
        '404': { description: Faktura nenalezena }

  /api/v1/purchase-invoices/scan-inbox:
    post:
      tags: [Purchase invoices]
      summary: Scan adresáře s PDF/ISDOC pro automatický import (admin/accountant only)
      description: |
        Rekurzivně projde adresář nastavený v `cfg.purchase_invoice.inbox_dir`,
        deduplikuje přes SHA-256 (vůči `purchase_invoices.pdf_hash`). Z PDF s embedded
        ISDOC rozpozná data a automaticky vytvoří draft přijaté faktury. Pure PDF bez
        ISDOC se přeskakují — pro AI extrakci použij endpoint
        `POST /api/integrations/anthropic/extract` (BYOK).
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  description: True = jen vrátit seznam nálezů bez zápisu
                  default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxScanResult' }
        '403': { description: Pouze admin/accountant }
        '409': { description: '`managed_installation` — spravovaná instalace (cfg `app.managed`) skenování adresářů na serveru nepovoluje' }

  /api/v1/reports/dphdp3/preview:
    get:
      tags: [Reports]
      summary: Náhled DPH přiznání (DPHDP3) pro období
      description: |
        ⚠️ XML vygenerovaný buildem je POUZE POMŮCKA. Před odesláním na EPO portál
        MFČR vždy ověř s účetní.
        Summary obsahuje také `document_refs` (snapshot dokladů zahrnutých do podání)
        a `cross_check`, včetně neblokujícího upozornění na nevystavené koncepty DDKP/finálu.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year,   required: true, schema: { type: integer, minimum: 2020, maximum: 2050 } }
        - { in: query, name: month,  schema: { type: integer, minimum: 1, maximum: 12 }, description: 'Měsíc období; u kvartálu poslední měsíc čtvrtletí. Default = aktuální měsíc.' }
        - in: query
          name: period
          schema: { type: string, enum: [monthly, quarterly] }
          description: 'Zdaňovací období. Neuvedené (nebo neznámé) = odvodí se z nastavení plátce.'
        - in: query
          name: variant
          schema: { type: string, enum: [radne, opravne, dodatecne, dodatecne_opravne], default: radne }
          description: 'Typ přiznání. Neplatná hodnota → 400 `validation_failed`.'
        - in: query
          name: d_zjist
          schema: { type: string, format: date }
          description: 'Datum zjištění důvodů pro dodatečné přiznání (§ 141 DŘ).'
      responses:
        '200':
          description: JSON summary (lines 1-29 + 40+, totals, deadline)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DphPriznaniPreview' }
        '400':
          description: "Neplatný rok/měsíc nebo typ přiznání (`validation_failed`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { description: Nedostatečné oprávnění (`reports` ke čtení) }
        '500':
          description: "Sestavení přiznání selhalo (`build_failed`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/reports/dphdp3:
    get:
      tags: [Reports]
      summary: Stáhne XML DPH přiznání (DPHDP3 verzePis 03.01) pro EPO portál
      description: |
        Před stažením se řádné přiznání porovná s kontrolním a souhrnným hlášením
        a s obratem účtu 343. **Blokující rozdíl vrátí `409 vat_cross_check_mismatch`** —
        buď rozdíly srovnejte, nebo stáhněte znovu s `acknowledge_mismatch=1`
        (potvrzení se zaloguje). Dodatečná přiznání (`dodatecne`, `dodatecne_opravne`)
        vykazují jen rozdíly, takže se na ně smír neaplikuje.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, required: true, schema: { type: integer, minimum: 2020, maximum: 2050 } }
        - { in: query, name: month, schema: { type: integer, minimum: 1, maximum: 12 }, description: 'Měsíc období; u kvartálu poslední měsíc čtvrtletí. Default = aktuální měsíc.' }
        - in: query
          name: period
          schema: { type: string, enum: [monthly, quarterly] }
          description: 'Zdaňovací období. Neuvedené = odvodí se z nastavení plátce.'
        - in: query
          name: variant
          schema: { type: string, enum: [radne, opravne, dodatecne, dodatecne_opravne], default: radne }
        - in: query
          name: d_zjist
          schema: { type: string, format: date }
          description: 'Datum zjištění důvodů pro dodatečné přiznání (§ 141 DŘ).'
        - in: query
          name: acknowledge_mismatch
          schema: { type: string, enum: ['1', 'true'] }
          description: 'Potvrzení, že rozdíly proti KH/SH/343 znáte — obejde blokující 409.'
      responses:
        '200':
          description: XML download
          content:
            application/xml: {}
        '400':
          description: "Neplatný rok/měsíc nebo typ přiznání (`validation_failed`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { description: Nedostatečné oprávnění (`reports` ke čtení) }
        '409':
          description: |
            Přiznání se rozchází s kontrolním/souhrnným hlášením nebo obratem účtu 343
            (`vat_cross_check_mismatch`). Opakujte s `acknowledge_mismatch=1`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: "Sestavení přiznání selhalo (`build_failed`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/reports/dphkh1/preview:
    get:
      tags: [Reports]
      summary: Náhled Kontrolního hlášení (DPHKH1) — vždy měsíční
      description: |
        Kontrolní hlášení se podává **vždy měsíčně**, i pro kvartální plátce DPH.
      parameters:
