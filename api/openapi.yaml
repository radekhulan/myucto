  /api/v1/accounting/journal/{id}:
    get:
      tags: [Accounting]
      summary: Detail zápisu + řádky (kód/název účtu, měna)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: row_version zápisu — použij jako If-Match při PATCH .../description.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Accounting]
      summary: Smaže podporovaný účetní zápis z otevřeného období bez protizápisu
      description: >-
        Účetní/admin. Fyzicky odstraní ruční zápis, zápis vydané nebo přijaté
        faktury, bankovního pohybu nebo posledního odpisu bez protizápisu. Fakturu
        odemkne; bankovní pohyb vrátí do fronty nezaúčtovaných. U odpisu odstraní
        zápis i účetní a nepřerušený daňový řádek stejného roku; existující
        přerušení zachová. Odpisy lze mazat pouze odzadu a u nevyřazeného majetku.
        Vždy jen pro otevřené období, mimo uzamčené datum a u zápisu bez storna.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Zápis smazán a zdrojový doklad odúčtován
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  asset_id: { type: [integer, "null"], description: ID majetku při smazání odpisu }
                  fiscal_year: { type: [integer, "null"], description: Smazaný rok odpisu }
                  pause_preserved: { type: [boolean, "null"], description: Zda bylo zachováno přerušení daňového odpisu }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Období není otevřené, datum je uzamčené, zápis je stornovaný, existuje pozdější odpis nebo typ zdroje nepodporuje přímé smazání
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

