      responses:
        '200': { description: Účet deaktivován }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/clients/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Clients]
      summary: Vrátí archivovaného klienta zpět do aktivních
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }

  /api/v1/invoices:
    get:
      tags: [Invoices]
      summary: Seznam faktur (grouped by month)
      description: |
        Vrací faktury aktuálního supplier-a, seskupené po měsících podle
        `COALESCE(tax_date, issue_date)` (DUZP, fallback datum vystavení).
        Filtry se předávají jako `filter[key]=value` (deep object). `status` a `type` mohou
        být čárkou oddělené seznamy (`filter[status]=draft,issued`).

        Stránkuje se po jednotlivých fakturách (`meta.total` = počet faktur);
        měsíční skupiny se skládají až z aktuální stránky, takže skupina na
        hranici stránky může pokračovat na stránce další.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - in: query
          name: q
          description: Fulltextové vyhledávání (varsymbol, klient, popis)
          schema: { type: string }
        - in: query
          name: filter[status]
          description: Stav faktury — lze čárkou oddělit více hodnot
          schema:
            type: string
            example: "draft,issued"
        - in: query
          name: filter[type]
          description: Typ dokladu — lze čárkou oddělit více hodnot
          schema:
            type: string
            example: "invoice,proforma"
        - in: query
          name: filter[client_id]
          schema: { type: integer }
        - in: query
          name: filter[project_id]
          schema: { type: integer }
        - in: query
          name: filter[year]
          description: Rok (dle `COALESCE(tax_date, issue_date)`)
          schema: { type: integer, example: 2026 }
        - in: query
          name: filter[month]
          description: Měsíc 1–12 (vyžaduje filter[year])
          schema: { type: integer, minimum: 1, maximum: 12 }
        - in: query
          name: filter[date_from]
          description: Datum od (YYYY-MM-DD, dle `COALESCE(tax_date, issue_date)`)
          schema: { type: string, format: date }
        - in: query
          name: filter[date_to]
          description: Datum do (YYYY-MM-DD, dle `COALESCE(tax_date, issue_date)`)
          schema: { type: string, format: date }
        - in: query
          name: filter[currency]
          description: Kód měny (CZK, EUR, …)
          schema: { type: string, example: CZK }
        - in: query
          name: filter[unpaid_only]
          description: Pouze nezaplacené (issued + neuhrazené)
          schema: { type: boolean }
        - in: query
          name: filter[overdue]
          description: Pouze po splatnosti
          schema: { type: boolean }
        - in: query
          name: filter[unpaid_as_of]
          description: >
            Neuhrazené K DATU X (na rozdíl od `filter[unpaid_only]`, který se dívá na
            dnešní status/zůstatek): doklad vystavený do X (`issue_date <= X`), u kterého
            k X nebyl uhrazen celý `amount_to_pay` — součet `invoice_payments.amount`
            s `paid_on <= X`. Stejná definice jako v saldokontu.
          schema: { type: string, format: date, example: "2026-06-30" }
        - in: query
          name: filter[booked]
          description: "Zaúčtování (jen podvojné účetnictví): 1 = zaúčtováno (booked_at není NULL), 0 = nezaúčtováno"
          schema: { type: string, enum: ['1', '0'] }
        - in: query
          name: filter[oss_review]
          description: >
            Pouze doklady s řádkem k ručnímu posouzení místa plnění
            (`oss_needs_manual_review = 1`). Rozsah říká, kde řádek leží:
            `domestic` = mimo OSS (`oss_applicable = 0`) — vstupuje do tuzemského přiznání
            na ř. 1/2 a do OSS podání nepatří;
            `oss` = v OSS podání (`oss_applicable = 1`) s otazníkem nad zemí či typem sazby;
            `any` = obojí. Legacy `1` / `true` se mapuje na `any`.
          schema: { type: string, enum: [any, oss, domestic, '1'] }
        - in: query
          name: filter[revenue_category_id]
          description: >
            Kategorie tržby — ponechat JEN vybrané. Čárkou oddělený seznam ID z číselníku
            `revenue_categories`; sentinel `none` znamená doklad BEZ kategorie
            (`revenue_category_id IS NULL`, do IN/NOT IN by se nechytil).
            ID cizího tenanta se zahodí — nezbude-li po tom nic, odpověď je prázdná
            (ne „bez filtru"). Nečíselné tokeny se ignorují; nezbude-li ani jeden
            použitelný token, filtr se neuplatní.
          schema: { type: string, example: "3,7,none" }
        - in: query
          name: filter[revenue_category_exclude]
          description: >
            Kategorie tržby — vybrané SKRÝT (typicky drobné faktury za předplatné).
            Stejný formát jako `filter[revenue_category_id]`. Doklady BEZ kategorie
            zůstávají, dokud se nevyloučí i sentinel `none` — `NOT IN` je u NULL
            UNKNOWN a naivní vyloučení by je vyhodilo taky. Zadané obojí: `revenue_category_id`
            vybere množinu a `revenue_category_exclude` ji zúží.
          schema: { type: string, example: "12,none" }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 5, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    description: Měsíční skupiny, řazené od nejnovějšího měsíce.
                    items: { $ref: '#/components/schemas/InvoiceMonthGroup' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
    post:
      tags: [Invoices]
      summary: Vytvoří draft faktury
      description: |
        Vytvoří fakturu ve stavu `draft`. Pro vystavení (přidělení čísla, zápis do
        DB účetně) volej `POST /api/v1/invoices/{id}/issue`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '201':
          description: Vytvořeno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400':
          description: |
            Validace neprošla (`validation_failed`, detaily v `error.fields`), klient
            neexistuje (`client_not_found`), odkaz míří na cizí firmu
            (`invalid_reference`) nebo by zápis porušil integritu (`integrity_violation`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Doklad by spadl do uzamčeného období a role na to nedosáhne (Epic F6)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Uzamčené období u účetní role (`document_locked`), nebo by vznikl duplicitní
            variabilní symbol (`varsymbol_duplicate`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/preview-varsymbol:
    get:
      tags: [Invoices]
      summary: Náhled budoucího čísla faktury
      description: |
        Vrátí, jaké číslo (varsymbol) by faktura dostala při vystavení, podle
        platné číselné řady a stávajícího counteru — **bez inkrementace**.
        Slouží pro náhled v editoru.

        Řada se vybírá podle priority `klient → kategorie tržby → dodavatel →
        výchozí konfigurace`, takže náhled odpovídá skutečnosti jen tehdy, když
        se předá i `client_id` a `revenue_category_id` rozpracované faktury.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - in: query
          name: type
          schema:
            type: string
            enum: [invoice, proforma, credit_note]
            default: invoice
        - in: query
          name: issue_date
          description: Datum vystavení (YYYY-MM-DD). Default = dnes.
          schema: { type: string, format: date }
        - in: query
          name: client_id
          description: Odběratel — rozhoduje o případné per-client číselné řadě.
          schema: { type: integer }
        - in: query
          name: revenue_category_id
          description: |
            Kategorie tržby — rozhoduje o případné číselné řadě kategorie.
            Uplatní se jen tehdy, když klient vlastní řadu nastavenou nemá.
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  varsymbol:
                    type: string
                    example: "JD2026-01"
                    description: Prázdný řetězec pokud supplier nemá nastavenou template.
                  has_template: { type: boolean }
        '400':
          description: Chybí zvolený supplier nebo neplatný typ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/export.pdf:
    get:
      tags: [Invoices]
      summary: Sloučené PDF vybraných faktur
      description: |
        Spojí až 100 vystavených faktur zvolených parametrem `ids` do jednoho
        PDF v uvedeném pořadí. Výstup obsahuje pouze vlastní strany faktur, bez
        příloh, vloženého ISDOC a výkazů práce. Všechny faktury musí patřit
        dodavateli z `X-Supplier-Id`. S `sign_pdf=true` se elektronicky podepíše
        až výsledný celek profilem nastaveným pro PDF faktur.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - in: query
          name: ids
          required: true
          description: ID faktur oddělená čárkou; duplicity se odstraní při zachování pořadí.
          schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
          example: 125,124,119
        - { in: query, name: sign_pdf, schema: { type: boolean, default: false }, description: "Elektronicky podepíše výsledné sloučené PDF." }
      responses:
        '200':
          description: Sloučený PDF soubor (Content-Disposition attachment)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404':
          description: Některá vybraná faktura neexistuje nebo patří jinému dodavateli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Překročen limit, doklad není vystavený nebo výsledné PDF nelze podepsat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/export:
    get:
      tags: [Invoices]
      summary: Hromadný export vystavených faktur za měsíc nebo čtvrtletí
      description: |
        Jeden soubor se všemi vystavenými doklady za období (status
        issued/sent/reminded/paid), supplier scope dle `X-Supplier-Id`:

        - `pdf-zip` — ZIP s jedním PDF na doklad (`Faktura-{vs}.pdf`, dobropisy
          `Dobropis-{vs}.pdf` atd.); s `merge_pdf=true` místo ZIPu vrátí jeden
          sloučený PDF soubor obsahující pouze faktury bez příloh a výkazů práce
        - `isdoc` — ISDOC XML; jeden doklad = samostatný `.isdoc`, víc dokladů = ZIP
        - `pohoda` — Pohoda XML dataPack
        - `stereo` — Stereo (Ježek) XML
        - `money_s3` — Money S3 (Seyfor) XML, formát „Faktury vydané"
          (SeznamFaktVyd/FaktVyd). Bez oficiálního veřejného XSD — struktura
          rekonstruovaná z reálného exportního vzorku. Sazby DPH přebírá z
          řádkových snapshotů dokladu, takže podporuje i historické sazby.
          Money S3 dovoluje nejvýše dvě různé nenulové sazby na jednom dokladu;
          třetí nenulová sazba export zastaví validační chybou.
        - `csv` — tabulkový přehled vydaných faktur v UTF-8

        Období: `month=YYYY-MM`, nebo `period=quarterly&year=YYYY&quarter=1..4`.
        `date_by=issue|tax` řídí zařazení do období (default issue; `tax` = DUZP,
        shodné s výkazy DPH).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: format, required: true, schema: { type: string, enum: [pdf-zip, isdoc, pohoda, stereo, money_s3, csv] } }
        - { in: query, name: month, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { in: query, name: period, schema: { type: string, enum: [monthly, quarterly] } }
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: quarter, schema: { type: integer, minimum: 1, maximum: 4 } }
        - { in: query, name: date_by, schema: { type: string, enum: [issue, tax], default: issue } }
        - { in: query, name: type, schema: { type: string, enum: [invoice, proforma, credit_note, cancellation], description: "Jen jeden typ dokladu (default všechny)" } }
        - { in: query, name: merge_pdf, schema: { type: boolean, default: false }, description: "Jen pro format=pdf-zip. Vrátí jeden sloučený PDF soubor místo ZIP archivu." }
        - { in: query, name: sign_pdf, schema: { type: boolean, default: false }, description: "Jen se současným merge_pdf=true. Elektronicky podepíše výsledný soubor." }
      responses:
        '200':
          description: ZIP / PDF / XML stream (Content-Disposition attachment)
          content:
            application/zip:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            application/xml:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: Za období nejsou žádné vystavené faktury
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Překročen limit 200 faktur nebo výsledné PDF nelze podepsat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/isdoc:
    get:
      tags: [Invoices]
      summary: ISDOC XML jedné vystavené faktury
      description: |
        Strojově čitelná faktura (ISDOC) — symetrie
        s `/api/v1/purchase-invoices/{id}/isdoc`. Koncept (draft) nelze
        exportovat (400) — nemá přidělené číslo. Stornovanou fakturu (409)
        také ne — stejné pravidlo jako u hromadného exportu.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: ISDOC XML (Content-Disposition attachment, Faktura-{vs}.isdoc)
          content:
            application/xml:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Stornovanou fakturu nelze exportovat do ISDOC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Invoices]
      summary: Detail faktury
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Invoices]
      summary: Aktualizace draftu
      description: |
        Vynechaný klíč `items` znamená „položky neměň" — částečný payload (jen DUZP,
        jen poznámka) doklad nevyprázdní. Explicitně poslané prázdné pole `items: []`
        na dokladu, který položky má, se odmítne s 422 `no_items`: součty se počítají
        z řádků, takže by vznikl doklad na nulu. Poslané neprázdné `items` řádky nahradí
        (DELETE + INSERT), takže payload musí nést kompletní seznam.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '409':
          description: Faktura už není draft (vystavená/storno) — nelze editovat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`items: []` by doklad připravilo o všechny položky (`no_items`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Invoices]
      summary: Smazání faktury
      description: |
        Draft může smazat uživatel s oprávněním zápisu. Nedraftovou fakturu může
        smazat pouze admin. Parametr `force=1` označuje vědomý force-delete:
        pokud target ani žádný kaskádově mazaný doklad není zaúčtovaný, retenční
        brána se neuplatní. U zaúčtovaného dokladu zůstává retenční lhůta aktivní;
        její administrátorské přehlasování vyžaduje navíc `ack_retention=1` a
        zaznamená se do activity logu.
      parameters:
        - in: query
          name: force
          description: Admin force-delete nedraftové faktury
          schema: { type: integer, enum: [1] }
        - in: query
          name: ack_retention
          description: Vědomé admin přehlasování aktivní retenční lhůty zaúčtovaného dokladu
          schema: { type: integer, enum: [1] }
      responses:
        '200':
          description: OK
        '403':
          description: Nedostatečné oprávnění nebo admin role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Doklad je uzamčený nebo nelze bezpečně stornovat jeho účetní či skladový zápis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Zaúčtovaný doklad je v aktivní retenční lhůtě
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/issue:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Invoices]
      summary: Vystaví fakturu (z draftu)
      description: |
        Přidělí číslo dle nastavení supplier-a, archivuje PDF snapshot. Po vystavení
        nelze měnit položky/částky.

        Vystavení je poslední místo, kde se doklad kontroluje jako celek — koncept
        smí být neúplný, vystavený daňový doklad ne. Proto odsud vede řada zákonných
        odmítnutí (chybějící DIČ u přenesené daňové povinnosti, rozpis u platebního
        kalendáře, zjednodušený doklad nad limit) i zámek účetního období.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '403':
          description: |
            Doklad je v uzamčeném období a role na jeho vystavení nedosáhne
            (Epic F6; účetní dostane `409`, admin může obejít přes `?force=1`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Faktura nenalezena
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Doklad není koncept (`not_draft`), nemá kladnou částku k úhradě
            (`invalid_amount`), k zálohové faktuře už existuje finální doklad
            (`final_exists`), varsymbol by kolidoval (`varsymbol_duplicate`),
            nebo se doklad mezitím změnil (`race_condition`). Zamčené období
            u účetní role hlásí `document_locked`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Doklad neprošel zákonnou kontrolou — bez položek (`no_items`), storno
            se nevystavuje (`invalid_type`), chybí DIČ odběratele u přenesené daňové
            povinnosti (`reverse_charge_dic_missing`, § 29/2 ZDPH), zjednodušený doklad
            nesplňuje podmínky (`simplified_document_not_allowed`, § 30 ZDPH), nebo
            platební kalendář nemá rozpis plateb (`payment_schedule_missing`)
            či jeho součet nesedí na doklad (`payment_schedule_mismatch`, § 31 ZDPH).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: "Nepodařilo se přidělit varsymbol (`varsymbol_failed`) nebo uložit snapshot (`snapshot_failed`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/mark-paid:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Invoices]
      summary: Označí fakturu jako uhrazenou
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paid_at:
                  type: string
                  format: date
                  description: Datum platby (default = dnes)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400':
          description: "Neplatné datum platby (`invalid_date`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Faktura nenalezena
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Fakturu nelze označit za uhrazenou — není vystavená ani odeslaná
            (`invalid_state`), nemá kladnou částku k úhradě (`invalid_amount`),
            nebo platbu odmítla evidence úhrad (`invalid_payment`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Invoices]
      summary: Evidované platby faktury
      description: |
        Seznam plateb (částečných úhrad), přímo spárovaných bankovních operací
        a souhrn faktury nebo zálohové faktury:
        `paid_total`, `remaining` (= `amount_to_pay - paid_total`) a odvozený
        `payment_status` (`unpaid` / `partially_paid` / `paid` / `overpaid`).
        `bank_transactions` je informační vazba a samo o sobě se nezapočítává
        do `paid_total`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/InvoicePayment' }
                  bank_transactions:
                    type: array
                    items: { $ref: '#/components/schemas/InvoiceRelatedBankTransaction' }
                  paid_total: { type: number, format: float }
                  amount_to_pay: { type: number, format: float }
                  remaining: { type: number, format: float }
                  payment_status:
                    type: [string, "null"]
                    enum: [unpaid, partially_paid, paid, overpaid, null]
    post:
      tags: [Invoices]
      summary: Zaeviduje (částečnou) úhradu faktury
      description: |
        Přidá platbu v měně faktury. Pokud suma plateb pokryje `amount_to_pay`
        (tolerance 0,05), faktura se označí jako zaplacená (`paid_at` = datum
        poslední platby). Stávající `mark-paid` je zkratka „platba na zbytek".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  format: float
                  description: Částka platby v měně faktury (> 0)
                paid_on:
                  type: string
                  format: date
                  description: Datum platby (default = dnes)
                variable_symbol: { type: [string, "null"], maxLength: 20 }
                bank_reference: { type: [string, "null"], maxLength: 120 }
                note: { type: [string, "null"], maxLength: 255 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { $ref: '#/components/schemas/Invoice' }
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/InvoicePayment' }
                  payment: { $ref: '#/components/schemas/InvoicePayment' }
                  became_paid: { type: boolean }
                  remaining: { type: number, format: float }
        '409':
          description: Neplatný stav/částka (draft, storno, dobropis…)

  /api/v1/invoices/{id}/payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
      - in: path
        name: paymentId
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Invoices]
      summary: Smaže evidovanou platbu
      description: |
        Platbu navázanou na bankovní transakci nelze smazat (409) — ruší se přes
        unmatch v detailu výpisu. Platbu s vystaveným daňovým dokladem k přijaté
        platbě lze smazat až po smazání/stornu dokladu. Pokud po smazání přestane
        být doklad pokrytý, vrátí se ze stavu `paid` zpět (`sent`/`issued`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { $ref: '#/components/schemas/Invoice' }
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/InvoicePayment' }
                  became_unpaid: { type: boolean }
                  remaining: { type: number, format: float }
        '409':
          description: Platba je zamčená (bankovní vazba / daňový doklad)

  /api/v1/invoices/{id}/payments/{paymentId}/tax-document:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
      - in: path
        name: paymentId
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Invoices]
      summary: Vystaví daňový doklad k přijaté platbě (DRAFT)
      description: |
        K platbě **zálohové faktury** vystaví koncept daňového dokladu k přijaté
        platbě (`invoice_type = tax_document`, § 28 odst. 2 ZDPH): DUZP = datum
        platby, DPH shora koeficientem (§ 37), částka rozdělená mezi sazby DPH
        proformy poměrně. Jen plátce DPH a ne-reverse-charge plnění. Idempotentní —
        existující nestornovaný doklad k platbě vrátí beze změny.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_document_id: { type: integer, format: int64 }
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/InvoicePayment' }
        '409':
          description: Podmínky nesplněny (neplátce DPH, reverse charge, není proforma)

  /api/v1/invoices/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Invoices]
      summary: PDF faktury
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /api/v1/invoices/{id}/imported-pdf:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
      - in: query
        name: inline
        required: false
        description: "`1` → Content-Disposition: inline (náhled v prohlížeči); jinak attachment (stažení)."
        schema: { type: integer, enum: [1] }
    get:
      tags: [Invoices]
      summary: Zdrojové PDF vydané faktury z importu
      description: |
        Vrátí archivovaný ZDROJOVÝ PDF vydané faktury tak, jak dorazil z importu
        (iDoklad/Fakturoid) — nezaměňovat s naším vlastním rendered PDF
        (`GET /api/v1/invoices/{id}/pdf`). Dostupné jen pro faktury s neprázdným
        `imported_pdf_path`; jinak `404`.
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404':
          description: Faktura nenalezena, nemá archivovaný zdrojový PDF, nebo soubor chybí na disku.

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: Seznam zakázek
      description: |
        Vrátí stránkovaný seznam **neArchivovaných** zakázek v rámci aktuálního
        supplier-a. Filtrování přes `filter[status]` a `filter[client_id]`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - in: query
          name: filter[status]
          schema:
            type: string
            enum: [active, paused, closed]
        - in: query
          name: filter[client_id]
          schema: { type: integer, format: int64 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, client, revenue, last_activity]
            default: name
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 5, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  meta: { $ref: '#/components/schemas/ProjectsPagination' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Projects]
      summary: Vytvoří zakázku
      description: |
        Klient (`client_id`) musí patřit aktuálnímu supplier-ovi. Currency se
        validuje proti `currencies` skoupeným pod stejným supplier-em.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Vytvořeno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/InsufficientScope'

  /api/v1/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Projects]
      summary: Detail zakázky se statistikami
      description: |
        Vrátí celý záznam zakázky + odvozené metriky:
        - `invoices_count` — kolik faktur zakázka má,
        - `revenue_by_month` — obrat po měsících za posledních 24 měsíců (per currency),
        - `revenue_by_year` — obrat po letech (per currency),
        - `unpaid_summary` — nezaplaceno / po splatnosti per currency.

        Metriky zahrnují jen vystavené faktury + dobropisy (`issued`, `sent`,
        `reminded`, `paid`); zálohy a koncepty se nepočítají.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Projects]
      summary: Aktualizace zakázky
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      summary: Smazání zakázky
      description: |
        Smaže zakázku, pokud nemá vystavené doklady. Pro zakázky s historií
        použij `POST /api/v1/projects/{id}/archive`.
      responses:
        '200':
          description: OK
        '409':
          description: Zakázka má vystavené doklady — použij archivaci
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Projects]
      summary: Archivuje zakázku
      description: |
        Nastaví `archived_at = NOW()`. Archivované zakázky se nezobrazují
        v defaultním výpisu (lze je dohledat přes filtr).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }

  /api/v1/clients/{client_id}/projects:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: client_id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Projects]
      summary: Zakázky daného klienta (vč. archivovaných)
      description: |
        Light-weight výpis bez stránkování — vrátí všechny zakázky klienta včetně
        archivovaných (řazené active → paused → closed → archived). Užitečné pro
        plnění selectů ve frontu integrace.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectBrief' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/stats:
    get:
      tags: [Projects]
      summary: Agregované statistiky zakázek (pro dashboard a stránku Grafy)
      description: |
        Vrací agregace pro vizualizace na stránce **Grafy** (`/stats`):

        - **top_this_year / top_prev_year** — top 12 zakázek + agregovaná položka „Ostatní"
        - **top_12m** — top 12 zakázek za rolling 12 měsíců (smart-mix tabulky v UI;
          v lednu jsou per-rok statistiky téměř prázdné, rolling 12m je robustní)
        - **totals_per_year** — sumy + počty per (year, currency)
        - **status_breakdown** — counts per status (active/paused/closed)
        - **is_vat_payer** — určuje, který sloupec se použil pro agregaci obratu
          (plátce = `total_without_vat`, neplátce = `total_with_vat`)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectStats' }

  /api/v1/projects/profitability:
    get:
      tags: [Projects]
      summary: Výnosy, náklady a marže zakázek
      description: |
        Manažerský přehled pouze ke čtení. V podvojném účetnictví vychází
        ze zaúčtovaného deníku; v daňové evidenci z dokladů. Vrací také počet
        nezaúčtovaných dokladů, aby nulový výsledek nebyl zaměněn za úplná data.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Přehled ziskovosti zakázek
          content:
            application/json:
              schema:
                type: object
                required: [source, currency, items, totals]
                properties:
                  source: { type: string, enum: [journal, documents] }
                  currency: { type: string, example: CZK }
                  date_from: { type: [string, "null"], format: date }
                  date_to: { type: [string, "null"], format: date }
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  totals: { type: object, additionalProperties: { type: number } }

  /api/v1/projects/{id}/profit:
    get:
      tags: [Projects]
      summary: Výnosy, náklady a marže jedné zakázky
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Ziskovost a zdrojové doklady zakázky
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invoices/{id}/work-report:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        description: ID faktury
        schema: { type: integer, format: int64 }
    get:
      tags: [WorkReports]
      summary: Výkaz víceprací k faktuře
      description: |
        Vrátí výkaz včetně všech `items` (úkony s hodinami a sazbou) nebo
        `null` pokud k faktuře žádný neexistuje.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WorkReport'
                  - { type: "null" }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [WorkReports]
      summary: Vytvoří nebo aktualizuje výkaz
      description: |
        Idempotentní upsert (jedna fakturace = max 1 výkaz). Výkaz lze měnit
        pouze pokud faktura má status `draft`. Admin může vynutit edit
        pomocí query parametru `?force=1` (bez ohledu na status).

        Suma `total_hours` a `total_amount` se přepočítá ze `items` na serveru.

        **Pozor:** výkaz víceprací je samostatná entita — ukládá se jen jako
        příloha (2. strana PDF) a **NEmění položky ani částku faktury**. Pokud chceš
        práci i vyúčtovat, přidej odpovídající položku faktury zvlášť přes
        `PUT /api/v1/invoices/{id}` (úprava `items`). Obojí lze dělat jen u draftu.
      parameters:
        - in: query
          name: force
          description: Admin-only override editace u nedraftových faktur
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkReportInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkReport' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: Faktura není draft (a klient není admin s ?force=1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [WorkReports]
      summary: Smaže výkaz
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invoices/{id}/request-approval:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [WorkReports]
      summary: Pošle výkaz zákazníkovi ke schválení
      description: |
        Pre-conditions:
        - faktura je `draft` a má linknutý work-report,
        - projekt má `requires_work_report_approval = true`.

        Co se stane:
        - vygeneruje se 32-bytový `approval_token`, který dostane zákazník
          v emailu (link `/approval/{token}`),
        - faktura přejde do `approval_status = "requested"` (status zůstává `draft`),
        - alokuje se variabilní symbol a zafixují snapshoty supplier/client/bank
          (faktura se po schválení vystaví bez dalších změn),
        - zákazník dostane email `invoice_approval` s **PDF výkazu** v příloze
          (ne fakturu — tu uvidí až po vystavení),
        - příjemci: kontakty klienta s účelem `approvals` (viz `email_contacts`);
          bez nich `project.billing_emails`, fallback `client.main_email`,
        - audit log: `invoice.approval_requested`.

        Po rozhodnutí zákazníka (přes veřejný link) můžeš stav zjistit
        v `GET /api/v1/invoices/{id}` (pole `approval_*`). Pokud schválí,
        může proběhnout auto-issue + auto-send dle nastavení supplier-a.
      responses:
        '200':
          description: OK — email odeslán
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval_token: { type: string, example: "a1b2…" }
                  approval_status: { type: string, example: requested }
                  recipients:
                    type: array
                    items: { type: string, format: email }
        '409':
          description: Faktura není draft / nemá výkaz / projekt nevyžaduje schválení
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/approval-status:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [WorkReports]
      summary: Ruční update schvalovacího stavu (admin override)
      description: |
        Použij když potřebuješ obejít veřejný link — např. zákazník schválil
        telefonicky a chceš to v systému zaznamenat. Audit log loguje, kdo
        rozhodnutí vložil ručně.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_status]
              properties:
                approval_status:
                  type: string
                  enum: [none, requested, approved, rejected]
                approval_decided_by_email:
                  type: string
                  format: email
                  description: Kdo schválil (pro audit)
                approval_rejection_reason:
                  type: string
                  description: Důvod (pokud `rejected`)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }

  /api/v1/invoices/{id}/public-link:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [InvoiceComms]
      summary: Web faktura — vrátí (a případně vytvoří) trvalý veřejný odkaz
      description: |
        Trvalý veřejný odkaz `/invoice/{token}` — klient si na něm fakturu
        bez přihlášení prohlédne v HTML a stáhne PDF (obdoba „web faktury"
        ve Fakturoidu). Token se generuje lazy při prvním volání; opakované
        volání vrací tentýž odkaz (idempotentní). Odkaz se také automaticky
        přikládá do e-mailu při odeslání faktury klientovi.

        `public_viewed_at` = poslední zobrazení klientem (anonymní přístup);
        null dokud klient fakturu neotevřel.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: "https://faktury.example.cz/invoice/a1b2…" }
                  token: { type: string, description: "48 hex znaků" }
                  public_viewed_at: { type: [string, "null"], format: date-time }
        '409':
          description: Faktura je draft — web faktura je dostupná až po vystavení
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { description: "Faktura nenalezena" }

  /api/v1/invoices/{id}/public-link/regenerate:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [InvoiceComms]
      summary: Web faktura — zneplatní stávající odkaz vygenerováním nového
      description: |
        Revokace veřejného odkazu (např. při úniku URL) — starý token přestane
        okamžitě platit, vrací se nová URL. `public_viewed_at` se resetuje.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  token: { type: string }
                  public_viewed_at: { type: [string, "null"], example: null }
        '409':
          description: Faktura je draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { description: "Faktura nenalezena" }

  /api/v1/invoices/{id}/pdfs:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [InvoiceComms]
      summary: Archiv vystavených/odeslaných verzí PDF
      description: |
        Pokaždé, když se faktura vystaví, znovu-vystaví nebo pošle e-mailem,
        se PDF archivuje. Archiv slouží jako důkaz, co přesně zákazník dostal —
        i když se snapshot na faktuře později změnil (přes admin override).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PdfArchiveEntry' }

  /api/v1/invoices/{id}/pdfs/{archiveId}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
      - in: path
        name: archiveId
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [InvoiceComms]
      summary: Stažení archivované verze PDF
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invoices/{id}/recipients:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [InvoiceComms]
      summary: Vyřešení e-mailoví příjemci pro odeslání
      description: |
        Vrátí příjemce, na které by se daný typ zprávy odeslal (#86) — jednotný
        `RecipientResolver`: aktivní kontakty klienta s daným účelem
        (`email_contacts`, u upomínek fallback na účel `documents`); bez kontaktů
        dosavadní logika (`main_email` + `project.billing_emails`; u schvalování
        e-maily zakázky NAHRAZUJÍ hlavní e-mail). Kombinaci s e-maily zakázky
        řídí `project.billing_emails_mode`. Read-only — nic neodesílá; hodí se
        pro náhled příjemců před voláním `/send`.
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [documents, reminders, approvals], default: documents }
          description: Typ zprávy (doklad / upomínka / žádost o schválení výkazu).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [documents, reminders, approvals] }
                  to:  { type: array, items: { type: string, format: email } }
                  cc:  { type: array, items: { type: string, format: email } }
                  bcc: { type: array, items: { type: string, format: email } }
                  resolved:
                    type: array
                    description: Provenance každého příjemce (zdroj + účel + popisek).
                    items:
                      type: object
                      properties:
                        email: { type: string, format: email }
                        recipient: { type: string, enum: [to, cc, bcc] }
                        source: { type: string, enum: [contact, project, main_email] }
                        usage: { type: [string, "null"], enum: [communication, documents, reminders, approvals, null] }
                        label: { type: [string, "null"] }
        '404': { description: Faktura nenalezena }

  /api/v1/invoices/{id}/send:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [InvoiceComms]
      summary: Pošle fakturu emailem klientovi
      description: |
        Vyrenderuje aktuální PDF, archivuje ho a odešle přes SMTP. Faktura musí
        být `issued` nebo navazující stav. Předmět + tělo z šablony `invoice_send`
        (per locale, per supplier override v Email šablonách).

        Body je volitelné — když chybí, příjemce vyřeší jednotný resolver (#86):
        kontakty klienta s účelem `documents` (vč. cc/bcc rolí); bez kontaktů
        `client.main_email` + `project.billing_emails`. Explicitní `to` v body
        je autoritativní (resolver se přeskočí). Response obsahuje
        `resolved_recipients` s provenancí každého příjemce.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: array
                  items: { type: string, format: email }
                cc:
                  type: array
                  items: { type: string, format: email }
                bcc:
                  type: array
                  items: { type: string, format: email }
                subject_override:
                  type: string
                  description: Override předmětu emailu (jinak předmět ze šablony `invoice_send`)
                note:
                  type: string
                  maxLength: 5000
                  description: |
                    Volitelná poznámka do těla e-mailu (NE do PDF). Plain text;
                    neprázdné řádky se vyrenderují jako odstavce. Delší text se ořízne na 5000 znaků.
      responses:
        '200':
          description: OK — email odeslán
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent_to:
                    type: array
                    description: Adresy v poli To, na které se skutečně odesílalo.
                    items: { type: string, format: email }
                  cc:
                    type: array
                    items: { type: string, format: email }
                  bcc:
                    type: array
                    items: { type: string, format: email }
                  resolved_recipients:
                    type: array
                    description: "Provenance příjemců (#86) — prázdné při explicitním `to` v body."
                    items:
                      type: object
                      properties:
                        email: { type: string, format: email }
                        recipient: { type: string, enum: [to, cc, bcc] }
                        source: { type: string, enum: [contact, project, main_email, supplier] }
                        usage: { type: [string, "null"], enum: [communication, documents, reminders, approvals, null] }
                        label: { type: [string, "null"] }
                  sent_at:
                    type: string
                    description: "Čas odeslání ve formátu `YYYY-MM-DD HH:MM:SS` (čas serveru)."
                  is_test:
                    type: boolean
                    description: Vždy `false` u tohoto endpointu (testovací odeslání má vlastní endpoint).
        '400':
          description: Žádný platný příjemce (`no_recipients`) nebo neplatná adresa (`invalid_email`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Faktura nenalezena
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Fakturu nelze odeslat — není vystavená (`invalid_state`) nebo jde
            o interní stornovací doklad (`cannot_send_cancellation`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Nepodařilo se vygenerovat PDF (`pdf_failed`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: SMTP odmítl zprávu (`send_failed`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/reminder:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [InvoiceComms]
      summary: Pošle upomínku po splatnosti
      description: |
        Šablona `invoice_reminder` (per locale, per supplier override). Klient
        nemá vliv na obsah — text je z nastavení.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reminder_count: { type: integer, description: Kolikátá upomínka }
        '409':
          description: Faktura není po splatnosti / je již zaplacená
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [InvoiceComms]
      summary: Seznam příloh faktury
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: '#/components/schemas/InvoiceAttachment' }
    post:
      tags: [InvoiceComms]
      summary: Nahraje přílohu
      description: |
        Multipart upload (max ~10 MB). Příloha se přidá do dalšího emailu faktury.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Nahráno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceAttachment' }
        '413':
          description: Soubor je příliš velký
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/attachments/{attId}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
      - in: path
        name: attId
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [InvoiceComms]
      summary: Stažení přílohy
      responses:
        '200':
          description: Soubor (typ podle původního MIME)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
    delete:
      tags: [InvoiceComms]
      summary: Smaže přílohu
      responses:
        '200':
          description: OK

  /api/v1/clients/lookup-ares:
    post:
      tags: [Lookup]
      summary: Načte firmu z ARES (CZ obchodní rejstřík)
      description: |
        Vrátí strukturované údaje firmy podle IČO. Vhodné jako první krok
        v „create client" flow — pošli IČO, dostaneš název, adresu, DIČ
        a flag plátce DPH, ty pak pošleš do `POST /api/v1/clients`.

        Cache 24h — opakované volání pro stejné IČO nezatíží ARES.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ic]
              properties:
                ic:
                  type: string
                  pattern: '^\d{8}$'
                  example: "27082440"
      responses:
        '200':
          description: "OK (`found: false` pokud IČO neexistuje v ARES)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AresLookupResult' }
        '400':
          description: IČO není 8 číslic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: ARES dočasně nedostupný
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/clients/lookup-vies:
    post:
      tags: [Lookup]
      summary: Validuje EU DIČ přes VIES
      description: |
        Validace DIČ obchodního partnera v EU. Vrátí `valid: true/false`
        a (pokud platné) registrované jméno a adresu. Cache 24h.

        Reverse-charge fakturace pro EU plátce by měla DIČ validovat před
        vystavením — VIES je oficiální zdroj pravdy EK.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vat_id]
              properties:
                vat_id:
                  type: string
                  description: DIČ ve formátu countryCode + číslo (např. DE123456789)
                  example: "DE123456789"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViesLookupResult' }
        '400':
          description: Neplatný formát DIČ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: VIES dočasně nedostupný
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [InvoiceOps]
      summary: Audit log faktury
      description: |
        Vrátí chronologický log všech akcí, které faktura prošla
        (created, updated, issued, sent, paid, reminded, approval_requested,
        approval_decided, cancelled, ...). Vhodné pro debugging integrace
        a zobrazení timeline v custom UI.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityLogEntry' }

  /api/v1/invoices/{id}/unmark-paid:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [InvoiceOps]
      summary: Vrátí fakturu z „paid" zpět do „issued"
      description: "Reverzace omylem označené platby. Audit log: `invoice.unmark_paid`."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '409':
          description: Faktura není ve stavu `paid`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/penalty/preview:
    get:
      tags: [InvoiceOps]
      summary: Náhled výpočtu úroku z prodlení (NV 351/2013)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: as_of, schema: { type: string, format: date } }
        - { in: query, name: principal, schema: { type: number }, description: "Override dlužné částky" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Faktura není v uhraditelném stavu, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/invoices/{id}/penalty:
    post:
      tags: [InvoiceOps]
      summary: Založí penalizační fakturu (úrok z prodlení)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                as_of: { type: string, format: date }
                principal: { type: number }
      responses:
        '201': { description: Založená penalizační faktura, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Faktura není v uhraditelném stavu, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/invoices/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [InvoiceOps]
      summary: Storno vystavené faktury
      description: |
        Vystavená faktura **nelze smazat**. Číselná řada je vždy zachovaná
        (číslo původní faktury nezmizí). Povinný `mode` volí režim storna:

        - `internal` — interní storno bez dokladu pro klienta. Vznikne protidoklad
          `invoice_type = cancellation`, původní faktura dostane status `cancelled`.
          Odpověď obsahuje `cancellation_id` a stornovanou původní fakturu.
        - `credit_note` — vystaví se **draft** dobropisu (`invoice_type = credit_note`)
          se zápornými položkami; uživatel ho musí zkontrolovat v editoru a zavolat
          `/issue`. Původní faktura si status ponechá až do vystavení dobropisu.
          Odpověď obsahuje `credit_note_id` a `edit_url`.

        Dobropis lze stornovat pouze v režimu `internal`. Stornovací doklad
        (`cancellation`) stornovat nelze. Storno je účetní akt — na zaúčtovaném
        či uzamčeném dokladu ho blokuje zámek (Epic F6).

        Úspěšný status se liší podle režimu: `internal` vrací `200`,
        `credit_note` vrací `201` (vznikl nový doklad).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [internal, credit_note]
                  description: Režim storna — interní storno vs. draft dobropisu.
                reason:
                  type: string
                  description: Důvod storna (audit + poznámka nad položkami protidokladu)
      responses:
        '200':
          description: "Interní storno (`mode: internal`)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancellation_id:
                    type: integer
                    format: int64
                    description: ID vytvořeného stornovacího dokladu (`invoice_type = cancellation`).
                  invoice:
                    allOf:
                      - $ref: '#/components/schemas/Invoice'
                    description: Původní faktura po stornu (status `cancelled`).
        '201':
          description: "Vytvořen draft dobropisu (`mode: credit_note`)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  credit_note_id: { type: integer, format: int64 }
                  edit_url:
                    type: string
                    description: Relativní odkaz do editoru draftu dobropisu.
        '400':
          description: "Chybí nebo neplatný `mode` (`invalid_mode`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Doklad je uzamčený a role na jeho storno nedosáhne (Epic F6)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Faktura nenalezena
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Fakturu nelze stornovat — není vystavená/odeslaná/zaplacená (`invalid_state`),
            jde o stornovací doklad (`invalid_type`), je to dobropis a `mode` není
            `internal` (`invalid_mode`), doklad byl mezitím zaúčtován (`document_locked`),
            existuje navazující finální faktura k daňovému dokladu k přijaté platbě
            (`advance_tax_document_settled`), nebo brání pokladní doklad (`cash_*`),
            zápis v deníku (`journal_*`) či skladový pohyb (`stock.error.*`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Storno selhalo (`cancel_failed`) nebo se nepodařilo vytvořit dobropis (`credit_note_failed`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invoices/{id}/clone:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [InvoiceOps]
      summary: Vytvoří kopii faktury jako nový draft
      description: |
        Kopíruje hlavičku + položky + work-report. Nový draft má dnešní
        `issue_date`, prázdný `number`, status `draft`. Vhodné pro periodicky
        opakované faktury (předplatné, paušál).
      responses:
        '201':
          description: Vytvořen nový draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }

  /api/v1/invoices/{id}/issue-final:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [InvoiceOps]
      summary: Vystaví finální fakturu ze zaplacené zálohy (proforma → invoice)
      description: |
        Pouze pro `invoice_type = proforma` ve stavu `paid`. Vytvoří finální
        daňový doklad navázaný na zálohu (`parent_id`). Číslo a snapshoty
        se zafixují stejně jako u běžného vystavení.
      responses:
