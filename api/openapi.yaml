  /api/v1/accounting/reports/saldo:
    get:
      tags: [Accounting]
      summary: Saldokonto — otevřené položky per partner + konfrontace se zůstatkem účtu
      description: |
        Otevřené (nezaplacené/částečně zaplacené) faktury seskupené per partner na
        saldokontních účtech (default 311/321/314/324), s automatickou konfrontací
        Σ otevřených položek proti zůstatku účtu z hlavní knihy k rozvahovému dni.
        Rozdíl (inventarizační hodnota) odhalí ruční zápisy, storna či zapomenuté
        faktury nepokryté fakturačním zdrojem.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: period_id, required: true, schema: { type: integer } }
        - { in: query, name: as_of, description: "Rozvahový den (default min(konec období, dnešek)). Smí ležet mimo period_id (i v uzavřeném období) — odpověď nese as_of_period se skutečným obdobím.", schema: { type: string, format: date } }
        - { in: query, name: account, description: "Kód účtu (např. 311) nebo 'all' pro default sadu", schema: { type: string, default: all } }
        - { in: query, name: partner_id, description: "Volitelný filtr na jednoho partnera", schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/reports/saldo/export:
    get:
      tags: [Accounting]
      summary: Export saldokonta / inventarizačního protokolu (PDF / XLSX)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: period_id, required: true, schema: { type: integer } }
        - { in: query, name: as_of, schema: { type: string, format: date } }
        - { in: query, name: account, schema: { type: string, default: all } }
        - { in: query, name: partner_id, schema: { type: integer } }
        - { in: query, name: format, required: true, schema: { type: string, enum: [pdf, xlsx] } }
        - { in: query, name: view, description: "Jen pro format=xlsx: grouped (default, per partner) nebo flat (plochý seznam dokladů). PDF je vždy grouped.", schema: { type: string, enum: [grouped, flat], default: grouped } }
      responses:
        '200': { description: Soubor sestavy, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

