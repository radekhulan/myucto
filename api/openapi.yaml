        fingerprint_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        subject_dn: { type: string }
        issuer_dn: { type: string }
        serial_hex: { type: [string, "null"] }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        ik_mpsv_present: { type: boolean }
        epo_verified: { type: boolean, description: Alespoň jeden test=1 s tímto přesným otiskem úspěšně prošel EPO. }
        epo_verified_at: { type: [string, "null"], format: date-time }
        valid_now: { type: boolean }
        enabled_for_supplier: { type: boolean }
        linked_profiles_count: { type: integer, minimum: 0, description: Počet aktivních podpisových profilů používajících certifikát napříč firmami vlastníka. }
        linked_supplier_profiles_count: { type: integer, minimum: 0, description: Počet aktivních podpisových profilů používajících certifikát v aktuální firmě. }
        created_at: { type: string, format: date-time }
    EpoDirectTestResult:
      type: object
      required: [attempt_id, passed, messages, large_submission, environment, artifacts, attempts]
      properties:
        attempt_id: { type: integer, format: int64 }
        passed: { type: boolean }
        messages:
          type: array
          items: { $ref: '#/components/schemas/EpoMessage' }
        large_submission: { type: boolean }
        environment: { type: string, enum: [production, test] }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/EpoSubmissionArtifact' }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/EpoSubmissionAttempt' }
    EpoDirectSubmissionResult:
      type: object
      required: [attempt_id, status, environment]
      properties:
        attempt_id: { type: integer, format: int64 }
        status: { type: string, enum: [processing, confirmed, rejected, uncertain, cancelled] }
        environment: { type: string, enum: [production, test] }
        reference: { type: string }
        submitted_at: { type: string, format: date-time }
        chain_valid: { type: boolean }
        message: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/EpoMessage' }
        remote_status: { type: object, additionalProperties: { type: string } }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/EpoSubmissionArtifact' }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/EpoSubmissionAttempt' }
