                locked_until: { type: [string, "null"], format: date }
                reason: { type: string, minLength: 5 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { locked_until: { type: [string, "null"], format: date } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

