  /api/v1/bank-transactions/{id}/ai-suggest:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Bank]
      summary: Ruční AI návrh kontace podle doplňujícího dotazu
      description: Session-only. Dotaz se před odesláním redukuje na povolený účetní slovník; návrh pouze předvyplní MD/D.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Návrh kontace
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion_id: { type: integer, format: int64 }
                  debit_account_code: { type: string }
                  credit_account_code: { type: string }
                  reasoning: { type: string }
                  confidence: { type: number, minimum: 0, maximum: 0.4 }
        '404': { description: Bankovní transakce neexistuje v aktuální firmě }
        '409': { description: "AI je vypnutá, pozastavená, bez DPA nebo v konfliktu rezidence" }
        '422': { description: Neplatná délka dotazu nebo AI navrhla neplatný pár účtů (invalid_accounts) }

