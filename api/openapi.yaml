  # ── Podvojné účetnictví (Epic F1) ─────────────────────────────────────────
  /api/v1/accounting/accounts:
    get:
      tags: [Accounting]
      summary: Účtová osnova (seznam nebo strom)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: tree, description: "1 = vrátí strom (children)", schema: { type: boolean } }
        - { in: query, name: include_inactive, description: "1 = i neaktivní účty", schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChartAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Accounting]
      summary: Vytvoří analytický účet (dítě syntetiky)
      description: Účetní/admin. Typ i normální stranu dědí účet po rodiči.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_id, account_code, name]
              properties:
                parent_id: { type: integer }
                account_code: { type: string, example: "518001" }
                name: { type: string, example: "Software — předplatné" }
      responses:
        '201':
          description: Vytvořeno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Účet s tímto kódem už existuje, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/accounts/{id}:
    get:
      tags: [Accounting]
      summary: Karta účtu (kmenová data, analytiky se zůstatky, PS/obraty/KS za rozsah)
      description: >
        Rozcestník drill-through nad osnovou. `from`/`to` jsou volitelné — bez nich se
        vezme kalendářní rok. Součty syntetiky zahrnují i pohyby jejích analytik
        (stejný roll-up jako hlavní kniha a opis účtu).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: after_closing, description: "1 = stav PO uzavření knih", schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    patch:
      tags: [Accounting]
      summary: Přejmenování / deaktivace účtu
      description: |
        Účetní/admin. Běžná cesta je deaktivace (`is_active=false`) — kód účtu visí
        jako TEXT na kontacích, pravidlech i kartách, takže se nemění. Analytiku
        BEZ jediného použití lze i smazat (viz DELETE níž).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                is_active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Accounting]
      summary: Smazání nepoužité analytiky — účetní|admin, jen podvojné účetnictví
      description: |
        Smazat jde POUZE analytika, kterou nic nepoužívá — ani deník, ani doklady,
        kontace, karty majetku či mzdové nastavení. Syntetický účet z osnovy se
        smazat nedá (`account_synthetic`), použitá analytika vrátí `account_in_use`
        se seznamem míst; místo mazání ji deaktivujte přes PATCH.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK — `{deleted: true}`", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Účet se používá (`account_in_use`) — hláška vyjmenuje agendy, které na něj odkazují." }
        '422': { description: "Syntetický účet (`account_synthetic`) smazat nelze." }

