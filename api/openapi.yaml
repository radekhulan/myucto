      parameters:
        - { in: path, name: key, required: true, schema: { type: string, pattern: '^[a-z0-9_.]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`) — tento endpoint je
            dostupný jen z webového rozhraní. Viz „Endpointy dostupné jen z webového
            rozhraní" v úvodu dokumentace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: Uložený payload, content: { application/json: { schema: { type: object } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [User]
      summary: Reset preference klíče na default
      parameters:
        - { in: path, name: key, required: true, schema: { type: string, pattern: '^[a-z0-9_.]+$' } }
      responses:
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`) — tento endpoint je
            dostupný jen z webového rozhraní. Viz „Endpointy dostupné jen z webového
            rozhraní" v úvodu dokumentace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # F5: Excel export/import číselníků (osnova, kontace, majetek). Export = čtení
