  /api/v1/accounting/accounts/export:
    get:
      tags: [Accounting]
      summary: Export účtové osnovy do XLSX
      description: 'Round-trip: re-import beze změn skončí 100 % skip. List „Účtová osnova" + „Návod".'
      responses:
        '200':
          description: XLSX soubor
          content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } }
  /api/v1/accounting/posting-rules/export:
    get:
      tags: [Accounting]
      summary: Export kontačních pravidel do XLSX
      description: Efektivní pohled firmy (globální seed překrytý overridy).
      responses:
        '200':
          description: XLSX soubor
          content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } }
  /api/v1/accounting/assets/export:
    get:
      tags: [Accounting]
      summary: Export karet majetku do XLSX
      responses:
        '200':
          description: XLSX soubor
          content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } }
  /api/v1/accounting/accounts/import:
    post:
      tags: [Accounting]
      summary: Import účtové osnovy z XLSX/CSV
      description: 'Dry-run náhled (default dry_run=1). Ostrý běh (dry_run=0) all-or-nothing; ≥1 error → 422 import_has_errors.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                dry_run: { type: string, enum: ['0', '1'], default: '1' }
      responses:
        '200': { description: Report importu, content: { application/json: { schema: { $ref: '#/components/schemas/CodebookImportReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/ValidationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/accounting/posting-rules/import:
    post:
      tags: [Accounting]
      summary: Import kontačních pravidel z XLSX/CSV
      description: 'Výhradně firemní overridy (priority=100, R11); neznámý klíč = error. Dry-run default.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                dry_run: { type: string, enum: ['0', '1'], default: '1' }
      responses:
        '200': { description: Report importu, content: { application/json: { schema: { $ref: '#/components/schemas/CodebookImportReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/ValidationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/accounting/assets/import:
    post:
      tags: [Accounting]
      summary: Import karet majetku z XLSX/CSV
      description: 'Create vždy draft (stav ze souboru ignorován). Update jen draft; zaúčtovaná karta odlišná = error. Dry-run default.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                dry_run: { type: string, enum: ['0', '1'], default: '1' }
      responses:
        '200': { description: Report importu, content: { application/json: { schema: { $ref: '#/components/schemas/CodebookImportReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/ValidationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/cash-registers:
    get:
      tags: [Accounting]
      summary: Seznam pokladen (analytiky 211) vč. zůstatku z ledgeru
      description: Pokladna = analytika 211; zůstatek počítán z ledgeru (R6). CZK-only v1.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: include_inactive, schema: { type: integer, enum: [0, 1] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Accounting]
      summary: Nová pokladna (účetní|admin)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name, account_code], properties: { name: { type: string }, account_code: { type: string, description: "Analytika 211; tvar bez tečky (211200) se dohledá jako 211.200" }, currency_code: { type: string, default: CZK }, is_default: { type: boolean }, own_series: { type: boolean, default: false, description: "Vlastní číselná řada PPD/VPD pokladny místo společné řady firmy" } } } } }
      responses:
        '201': { description: Detail nové pokladny, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ValidationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/cash-registers/{id}:
    get:
