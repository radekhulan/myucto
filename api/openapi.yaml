openapi: 3.1.0
info:
  title: MyÚčto.cz REST API
  version: "1.0"
  summary: Veřejné REST API pro automatizaci fakturace
  description: |
    Veřejné API MyÚčto.cz pro integraci s e-shopy, CRM, automatizačními platformami
    (Make, Zapier) a vlastními skripty.

    ## Autentizace

    Použij Personal Access Token (PAT) v hlavičce `Authorization`:

    ```
    Authorization: Bearer mi_pat_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    ```

    Token vytvoříš v MyÚčto → **Nastavení → API tokeny**. Plain-text se zobrazí
    pouze jednou při vytvoření — ulož si ho. Pokud token ztratíš, odvolej ho a vytvoř
    nový.

    Token má:
    - **scope** — `read` (pouze GET) nebo `read_write` (všechny operace).
    - **supplier** — pokud je token bound na konkrétního supplier-a, všechny operace
      se odehrávají v jeho kontextu. Pokud je `supplier` `null`, klient může
      přepínat přes hlavičku `X-Supplier-Id: <id>`.
    - volitelnou expiraci.
    - volitelné **omezení podle IP adresy** — seznam povolených adres a CIDR
      rozsahů (IPv4 i IPv6). Prázdný seznam znamená bez omezení; jinak volání
      z jiné adresy skončí `403 token_ip_forbidden`.

    ## Účetnictví a daně jen ke čtení

    Nad rámec scopů platí, že **účetní a daňová vrstva je přes token jednosměrná**.
    Cesty `/api/v1/accounting/**`, `/api/v1/reports/**`, `/api/v1/tax/**`,
    `/api/v1/tax-evidence/**`, `/api/v1/tax-return/**` a `/api/v1/automation/**`
    odpovídají na `GET`, ale jakýkoli zápis odmítnou chybou
    `403 token_write_forbidden` — i tokenu se scope `read_write`.

    Zaúčtování dokladu, storno zápisu, uzavření období, zaevidování opravy podle
    § 46 / § 74b, podání přiznání i odeslání podání na EPO jsou úkony s daňovou
    odpovědností, kde chyba znamená opravné podání. Provádějí se výhradně
    z webového rozhraní.

    ## Endpointy dostupné jen z webového rozhraní

    Několik zdokumentovaných cest token nezavolá vůbec — odpoví
    `403 token_endpoint_forbidden` bez ohledu na scope. Jsou v této dokumentaci
    proto, aby integrátor věděl, že existují a proč je nemá k dispozici:

    - `/api/v1/admin/**` a `/api/v1/settings/{ai-assist,accounting-activation,mode-switch-preview,domains}`
      — konfigurace systému, ne data firmy.
    - `/api/v1/portal/**` a `/api/v1/user/{filters,preferences}` — plocha webového
      rozhraní (klientský portál, uložené filtry a předvolby uživatele).
    - `/api/v1/ai/suggestions/{id}/accept` a `/reject` — přijetí návrhu je
      zaúčtování, viz předchozí odstavec.

    Mzdový modul je kvůli zvláštní citlivosti personálních, daňových a platebních
    údajů dostupný jen z přihlášeného webového rozhraní pod `/api/payroll/**`.
    Veřejná bearer varianta pro mzdy neexistuje a proto v tomto OpenAPI kontraktu
    není. Její případné budoucí zpřístupnění vyžaduje samostatný
    omezený kontrakt oprávnění, rozsahů dat a auditování; interní session endpointy
    se do veřejného API automaticky nepromítají.

    ## Logování volání

    Každé volání tokenem se zaznamenává (cesta, metoda, návratový kód, doba
    zpracování, zdrojová IP) a uživatel si ho prohlédne v aplikaci. Klient se
    může označit hlavičkami `X-MyUcto-Client`, `X-MyUcto-Client-Version`
    a `X-MyUcto-Tool`; jejich hodnoty se do logu propíšou, takže je ve výpisu
    poznat, která integrace a která její operace volání vyvolala.

    ## Verzování

    Stabilní veřejná cesta začíná `/api/v1/`. Pokud přidáme nekompatibilní změnu,
    půjde do `/api/v2/` — `/api/v1/` zůstane funkční.

    Každá response vrací hlavičku `X-API-Version: 1`.

    ## Rate limity

    Defaultně **600 requestů / minutu / token**. Při překročení vrátíme `429 Too Many Requests`
    s hlavičkou `Retry-After` (sekundy).

    ## Chyby

    Všechny chyby mají formát:

    ```json
    { "error": { "code": "validation_failed", "message": "..." } }
    ```

  contact:
    name: MyÚčto.cz
    url: https://myucto.cz
  license:
    name: MyÚčto.cz mixed MIT and commercial license

servers:
  - url: /
    description: Aktuální origin
  - url: http://localhost:8080
    description: Docker

security:
  - BearerAuth: []

tags:
  - name: System
    description: Health-check, verze, dokumentace
  - name: Auth
    description: Identita aktuálního klienta
  - name: User
    description: Uživatelský profil a nastavení účtu
  - name: Tokens
    description: Správa API tokenů (jen ze session — webového UI)
  - name: Clients
    description: Klienti / odběratelé
  - name: Invoices
    description: Faktury
  - name: Projects
    description: Zakázky (vázané na klienta, jednotka pro reporting a fakturaci)
  - name: WorkReports
    description: Výkaz víceprací (po hodinách) k faktuře — vytvoření, schválení zákazníkem, PDF
  - name: InvoiceComms
    description: Email faktury, upomínky, archiv vystavených PDF, přílohy
  - name: InvoiceOps
    description: Pokročilé operace s fakturami (storno, klonování, hromadné akce, proforma→final)
  - name: Lookup
    description: ARES (CZ obchodní rejstřík), VIES (EU VAT validation)
  - name: Reports
    description: Dashboard summary, CSV exports, activity log
  - name: Bank
    description: Bankovní výpisy a párování plateb
  - name: Settings
    description: Konfigurace dodavatele a per-supplier overrides codebooku (read-only přes API)
  - name: Codebooks
    description: Číselníky (země, měny, DPH sazby, jednotky)
  - name: Documents
    description: Dokumenty — úložiště souborů, složky, ZFO datové zprávy, fulltext, párování s entitami
  - name: Purchase invoices
    description: Přijaté faktury (náklady) — evidence, položky, DPH odpočet, export, párování záloh
  - name: Recurring
    description: Pravidelné (opakované) fakturace — šablony, jejich rozvrh a generování faktur
  - name: CRM
    description: CRM dashboard — KPI, aging, koncentrace, cash-flow, action-items
  - name: Tax
    description: Daňový optimalizátor (srovnání režimů, predikce ročních limitů)
  - name: Logbook
    description: Kniha jízd — vozidla, jízdy, tankování a daňové souhrny
  - name: Accounting
    description: |
      Podvojné účetnictví (Epic F1) — účtová osnova, účetní období, deník
      (journal) a kontační pravidla. Vše tenant-scoped. Zápisy vyžadují roli
      účetní nebo admin, čtení stačí readonly; změna stavu období je admin-only.
  - name: Stock
    description: |
      Sklad (Epic Stock) — sklady, skladové karty, pohyby a stavy, skladové
      doklady (příjem/výdej/převod), inventury a skladové reporty. Tenant-scoped,
      vyžaduje zapnutý skladový modul u dodavatele.
  - name: Eshop
    description: |
      E-shop / katalog zboží — číselníky (výrobci, štítky, poplatky, parametry),
      strom kategorií (i18n) a karta zboží (média, cenotvorba, dodavatelé, import).
  - name: Portal
    description: Přehledový portál (dashboard souhrn napříč agendami).
  - name: Portfolio
    description: |
      Přehled firem pro účetní kancelář (Fáze F) — cross-supplier agregace přes
      user_suppliers membership; NENÍ scoped na X-Supplier-Id. Role client bez přístupu.
  - name: DocumentRequests
    description: |
      Vyžádání chybějících dokladů od klienta (Fáze F) — účetní pohled (CRUD)
      i klientský portál (výčet vlastních požadavků + upload dokladu).
  - name: TaxReturn
    description: |
      Přiznání k dani z příjmů (DPFO/DPPO, Epic DP) — vstupy, lifecycle
      koncept→finalizace→reopen, EPO XML, přehledy pro OSSZ/zdravotní
      pojišťovnu a zálohy na daň (§38a) vč. rozhodnutí FÚ (§174).

paths:
  /api/v1/branding-profiles:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Settings]
      summary: Aktivní brandingové profily aktuálního dodavatele
      description: "Vrací ID a vizuální údaje použitelné jako `branding_profile_id` při vytvoření faktury. Endpoint je pouze pro čtení."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BrandingProfile' }
        '400':
          description: "Není zvolená firma (`no_supplier`) — pošli hlavičku `X-Supplier-Id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/health:
    description: |
      Veřejná provozní diagnostika, interně přepsaná na přesnou cestu
      `/api/health`. Monitoring má volat `GET` nebo `HEAD` přes hostname
      instalace, ne přes IP.

      Tenant host gate propustí přesné read-only `GET`/`HEAD /api/health` i přes
      hostname, který se neshoduje s `app.url` a není registrovanou doménou —
      jinak by monitoring přes servisní hostname skončil na `421` a nešlo by
      odlišit výpadek od chybné konfigurace. Zda hostname požadavku odpovídá
      `app.url`, hlásí odpověď v `configuration.app_url_matches_host`. Výjimka se
      NEvztahuje na vlastní domény firem: na aktivní ani ověřované doméně zůstává
      health mimo klientské rozhraní. Ostatní metody a cesty zůstávají odmítnuté.
      Chybějící nebo přesně prázdná hodnota `app.url` zachovává legacy fallback,
      ve kterém se platný request hostname považuje za canonical; tento fallback
      se nerozšiřuje na whitespace ani na jinou neprázdnou chybnou hodnotu.

      Health zůstává dostupný i při zapnutém zámku údržby, kdy všechny ostatní
      cesty vrací `503` s hlavičkou `Retry-After`. Je to jediný způsob, jak
      provozovatel odliší plánovanou údržbu od výpadku a jak zjistí, kdy
      doběhly rozpracované úlohy (`jobs.running` = 0).

      Health je veřejný jen z hlediska autentizace: neobchází reverse proxy ani
      zapnutý IP allowlist. Během nedokončeného first-run setupu používej `GET`;
      setup allowlist metodu `HEAD` nepovoluje.
    get:
      tags: [System]
      summary: Health-check
      security: []
      responses:
        '200':
          description: |
            Endpoint odpověděl. `status` neagreguje stav závislostí; monitor musí
            samostatně vyhodnotit `db`, podle nasazení `redis` a
            `configuration.app_url`. `status` zůstává `ok` i v údržbě — instance
            odpovídá; údržbu nese samostatný příznak `maintenance`.

            Bez autentizace se vrací pouze SOUHRN: booleany, počty a stáří.
            Jména skriptů, seznamy nedoběhlých migrací, cesty, hostname ani
            chybové hlášky ven nejdou. `null` znamená „nevím" (typicky
            nedostupná databáze nebo tabulka, která ještě nevznikla) a nikdy se
            nezaměňuje s nulou. Diagnostika canonical URL obsahuje jen stabilní
            stav, reason code a capability booleany, nikdy původní hodnotu ani
            její části.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, db, redis, time, maintenance, jobs, cron, backup, migrations, configuration]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string, example: "4.3.1" }
                  db: { type: boolean }
                  redis: { type: boolean }
                  time: { type: string, format: date-time }
                  maintenance:
                    type: boolean
                    description: |
                      Je položený zámek údržby? Při `true` vrací všechny ostatní
                      cesty `503` s `Retry-After`.
                  jobs:
                    type: object
                    additionalProperties: false
                    required: [running]
                    properties:
                      running:
                        type: integer
                        nullable: true
                        minimum: 0
                        description: |
                          Počet rozpracovaných úloh — nárokované a ještě
                          nedoběhlé cron úlohy plus frontové úlohy ve stavu
                          `running`. Teprve nula znamená, že je bezpečné
                          nasazovat. `null` = nedostupná databáze.
                  cron:
                    type: object
                    additionalProperties: false
                    required: [mode, dispatcher_age_sec, dispatcher_fresh, dispatcher_status, last_tick_age_sec]
                    description: |
                      Čerstvost plánovače se čte z databáze (`cron_heartbeat`),
                      ne z logu — wrapper v `cmd/` nemusí být na cílovém hostingu
                      vůbec použitý.
                    properties:
                      mode: { type: string, nullable: true, enum: [individual, dispatcher, null] }
                      dispatcher_age_sec: { type: integer, nullable: true, minimum: 0 }
                      dispatcher_fresh:
                        type: boolean
                        nullable: true
                        description: |
                          `null` v režimu `individual`, kde dispatcher záměrně
                          neběží — použij `last_tick_age_sec`.
                      dispatcher_status: { type: string, nullable: true, enum: [ok, noop, error, null] }
                      last_tick_age_sec: { type: integer, nullable: true, minimum: 0 }
                  backup:
                    type: object
                    additionalProperties: false
                    required: [age_sec, fresh]
                    properties:
                      age_sec: { type: integer, nullable: true, minimum: 0 }
                      fresh: { type: boolean, nullable: true }
                  migrations:
                    type: object
                    additionalProperties: false
                    required: [applied, pending, up_to_date]
                    description: Jen počty; seznam nedoběhlých migrací je za autentizací.
                    properties:
                      applied: { type: integer, nullable: true, minimum: 0 }
                      pending: { type: integer, nullable: true, minimum: 0 }
                      up_to_date: { type: boolean, nullable: true }
                  configuration:
                    type: object
                    additionalProperties: false
                    required: [app_url, app_url_configured, app_url_matches_host, host_gate_enforced, managed, managed_provider]
                    properties:
                      app_url: { $ref: '#/components/schemas/AppUrlConfigurationDiagnostic' }
                      app_url_configured:
                        type: boolean
                        description: |
                          Je `app.url` vůbec vyplněné? Prázdná hodnota host gate
                          TIŠE VYPNE (canonical origin je prázdný, takže projde
                          každý hostname), chybná ho naopak zamkne — proto se
                          hlásí zvlášť od `app_url.state`.
                      app_url_matches_host:
                        type: boolean
                        nullable: true
                        description: |
                          Shoduje se hostname požadavku s `app.url`? `null` =
                          nelze rozhodnout (nepoužitelné `app.url`, request bez
                          hostname). Nikdy nevrací hostname samotný.
                      host_gate_enforced:
                        type: boolean
                        description: Vynucuje se host gate reálně (`domains.enabled` a neprázdné `app.url`)?
                      managed: { type: boolean, description: Spravovaná (SaaS) instalace. }
                      managed_provider: { type: string, nullable: true, description: "`app.managed_provider` — čistě diagnostický údaj." }
                  warnings:
                    type: array
                    description: Diagnostika dostupná pouze přihlášenému uživateli.
                    items:
                      type: object
                      required: [code, message]
                      properties:
                        code:
                          type: string
                          enum:
                            - secret_encryption_key
                            - webauthn_configuration
                            - mfa_methods_configuration
                            - session_lock_configuration
                            - session_lock_without_unlock_method
                        message: { type: string }
    head:
      tags: [System]
      summary: Health-check bez response body
      description: |
        Stejná dostupnost a tenant-host pravidla jako u `GET`; response body se
        pro metodu `HEAD` nepřenáší.
      security: []
      responses:
        '200':
          description: Health endpoint je dosažitelný; bez response body.

  /api/v1/version:
    get:
      tags: [System]
      summary: Verze aplikace
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: "4.3.1" }

  /api/v1/slug:
    get:
      tags: [System]
      summary: Slug z názvu (bez diakritiky, malá písmena, pomlčky)
      description: |
        Pomocník pro číselníky — z „Název" vyrobí kód (`Oblečení` → `obleceni`).
        Sdílený serverový Slugifier je jediný zdroj pravdy, takže UI preview
        odpovídá tomu, co by se uložilo. Max 50 znaků.
      parameters:
        - { in: query, name: text, required: true, schema: { type: string }, description: Vstupní název }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string, example: "obleceni" }

  /api/v1/auth/api-me:
    get:
      tags: [Auth]
      summary: Identita aktuálního klienta
      description: |
        Vrátí informace o uživateli a supplier-ovi, pod kterým token / session
        operuje. Slouží jako connection-test pro integrace.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiMe' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/domain-context:
    get:
      tags: [Auth]
      summary: Kontext aktuálního hostname
      description: |
        Pre-auth endpoint pro webové rozhraní. Rozliší canonical `app.url`
        a aktivní vlastní doménu firmy. Vlastní doména obsluhuje celý rozsah
        autentizovaných rout povolených klientské roli, ne jen prefix `/portal`.
        WebAuthn-dependent správa passkeys a vynucené nastavení MFA přecházejí
        serverem svázaným tokem na canonical origin z `app.url`; WebAuthn API
        vlastní doména neobsluhuje.
        `supplier_id` je na ní autoritativní a nelze jej přepsat hlavičkou ani
        query parametrem.
        Neznámý nebo neaktivní hostname je odmítnut ještě před akcí.
      security: []
      responses:
        '200':
          description: Bezpečný kontext aktuálního originu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainContext' }
        '421':
          description: Hostname není nakonfigurovaný nebo aktivní
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`); endpoint je určený
            browserovému pre-auth toku bez bearer identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/clients:
    get:
      tags: [Clients]
      summary: Seznam klientů
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - in: query
          name: q
          description: Fulltextové vyhledávání (název firmy / IČO)
          schema: { type: string }
        - in: query
          name: filter[archived]
          description: "1 = jen archivované, 0/chybí = jen aktivní"
          schema: { type: boolean, default: false }
        - in: query
          name: sort
          description: "Řazení (default: name)"
          schema: { type: string, default: name, enum: [name, created_at, -created_at] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 5, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/ListMeta'
                      - type: object
                        properties:
                          role_counts:
                            type: object
                            description: "Počty klientů dle role pro tab badge — bez vlivu stránkování a filtru kategorie nákladu"
                            properties:
                              all: { type: integer }
                              customers: { type: integer }
                              vendors: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Clients]
      summary: Vytvoří klienta
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '201':
          description: Vytvořeno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/InsufficientScope'

  /api/v1/clients/duplicates:
    get:
      tags: [Clients]
      summary: Report duplicitních karet dodavatele/odběratele
      description: |
        Skupiny karet tenanta se shodným IČO nebo DIČ po normalizaci (bez mezer,
        bez úvodní nuly u IČO) — typicky vzniklé před zavedením kontroly duplicit
        při zakládání karty (mezera v DIČ, chybějící úvodní nula v IČO).
        Zakládání nové karty samo o sobě takové duplicitě předchází; tento report
        pokrývá karty založené dřív.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [groups, count]
                properties:
                  count:
                    type: integer
                    description: Počet nalezených skupin duplicit
                  groups:
                    type: array
                    items:
                      type: object
                      required: [key_type, key_value, clients]
                      properties:
                        key_type: { type: string, enum: [ic, dic] }
                        key_value: { type: string, description: Normalizovaná hodnota, na které se karty shodují }
                        clients:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer, format: int64 }
                              company_name: { type: string }
                              ic: { type: string, nullable: true }
                              dic: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/clients/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Clients]
      summary: Detail klienta se statistikami
      description: |
        Vrátí klienta + odvozené metriky pro detail stránku:

        - `projects` — seznam zakázek klienta,
        - `invoices_count` — celkový počet faktur,
        - `revenue_by_month` — obrat po měsících za posledních 24 měsíců (VAT-aware),
        - `revenue_by_year` — obrat po letech (VAT-aware),
        - `revenue_by_project` — obrat agregovaný per zakázka pro graf „Obrat podle zakázek"
          (faktury bez `project_id` se agregují pod `project_id: null`),
        - `unpaid_summary` — nezaplaceno / po splatnosti per měna.

        Obraty zahrnují vystavené faktury + dobropisy (`issued`, `sent`,
        `reminded`, `paid`), zálohy a koncepty se nepočítají. Pro plátce DPH
        se používá `total_without_vat`, pro neplátce `total_with_vat`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clients]
      summary: Aktualizace klienta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Clients]
      summary: Smazání klienta (pokud nemá vystavené doklady)
      responses:
        '200':
          description: OK
        '409':
          description: Klient má vystavené doklady, použij archivaci
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/clients/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Clients]
      summary: Archivuje klienta
      description: |
        Nastaví `archived_at = NOW()`. Archivovaný klient se nezobrazuje
        v defaultním seznamu, jeho historické faktury zůstávají dohledatelné.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }

  /api/v1/clients/{id}/bank-accounts:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
