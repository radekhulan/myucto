    put:
      tags: [Reports]
      summary: Povolí nebo odebere vlastní certifikát pro aktuální firmu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, password]
              properties:
                enabled: { type: boolean }
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Aktualizovaný seznam certifikátů }
        '401': { description: Step-up autentizace selhala }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Certifikát používá aktivní podpisový profil aktuální firmy }

  /api/v1/reports/submissions/epo-credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: credentialId, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [Reports]
      summary: Vyřadí vlastní certifikát z aktivního EPO trezoru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Šifrovaný certifikát byl fyzicky odstraněn; historické pokusy drží pouze jeho otisk }
        '401': { description: Step-up autentizace selhala }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Certifikát používá alespoň jeden aktivní podpisový profil }

  /api/v1/reports/submissions/{id}:
    get:
      tags: [Reports]
      summary: Detail záznamu (vč. XML)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200':
          description: Submission detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxSubmission' }
        '404': { description: Not found }
    delete:
      tags: [Reports]
      summary: Smaže archivovaný záznam (jen admin)
      description: >-
        Blokuje jen to, co prokazatelně odešlo. Testovací pokus EPO (`test=1`) mazání
        nebrání. U předání, jehož výsledek aplikace nezná, je potřeba vědomé potvrzení
        `not_submitted_note` — pokus se tím uzavře jako nepodaný.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                not_submitted_note:
                  type: string
                  maxLength: 500
                  description: Jak bylo ověřeno, že podání nevzniklo.
      responses:
        '200': { description: Deleted }
        '403': { description: Pouze admin }
        '409': { description: Prokazatelné podání, nedořešené předání nebo retenční hold podle § 32 ZoÚ }

  /api/v1/reports/submissions/{id}/xml:
    get:
      tags: [Reports]
      summary: Stáhne archivované XML
      description: Název obsahuje období, ID snapshotu a čas jeho vygenerování, takže opakované exporty nekolidují.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200':
          description: XML download
          content:
            application/xml: {}

  /api/v1/reports/submissions/{id}/epo-handoff:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Reports]
      summary: Předá uložený XML snapshot do asistovaného formuláře EPO
      description: |
        Odešle přesné archivované XML na oficiální EPO endpoint s
        `otevriFormular=1`. Krátkodobé návratové URL se vrací pouze v odpovědi,
        server je neukládá do databáze ani logu; klient je může ponechat pouze
        do uvedeného času expirace. Operace sama podání neodesílá.
        Asistovaný handoff vždy používá ostrý interaktivní formulář bez ohledu
        na konfiguraci zkušebního prostředí přímého podepsaného API.
        Pokud klient odkaz ztratí, může vědomě zrušit aktivní pokus a vytvořit
        nový pomocí `replace_active`.
        OSS přiznání (`ossei1`) se touto cestou podat nedá — podává se
        v samostatné aplikaci MOSS/OSS daňového portálu, do které se uživatel
        musí přihlásit. Operace ho odmítne s chybou `moss_oss_only` (422).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                replace_active:
                  type: boolean
                  default: false
                  description: Zruší dosavadní aktivní pokus a vytvoří nový krátkodobý odkaz.
      responses:
        '201':
          description: Dočasný odkaz na předvyplněný formulář EPO
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpoHandoffResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Aktivní předání již existuje nebo je snapshot podaný }
        '422': { description: Snapshot není podporovaný, XSD-validní nebo se změnil jeho hash }
        '502': { description: EPO endpoint vrátil neplatnou odpověď }
        '503': { description: EPO endpoint není dostupný }

  /api/v1/reports/submissions/{id}/epo-test:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Reports]
      summary: Podepíše snapshot a provede úplný test EPO s test=1
      description: |
        Vytvoří připojený CMS/PKCS#7 signedData v DER s právě jedním podpisem,
        kontrolní hlášení před podpisem vloží jako jediné XML do ZIP, odešle
        payload na nakonfigurované EPO prostředí a archivuje celý XML protokol.
        Podepsaný testovací payload zůstane pouze šifrovaně v interním úložišti
        a není dostupný ke stažení. Typy S, K a E test blokují; propustné N/P se
        vracejí jako upozornění. Operace nečiní daňové podání a vyžaduje
        session step-up heslem a případně TOTP.
        OSS přiznání (`ossei1`) touto cestou projít nemůže — přímé podání míří
        na týž endpoint jako asistované předání a portál písemnost odmítne
        s tím, že uživatel musí být přihlášený v aplikaci MOSS/OSS. Operace ho
        proto odmítne s chybou `moss_oss_only` (422) dřív, než sáhne na klíč.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id, password]
              properties:
                credential_id: { type: integer, format: int64 }
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Výsledek všech kontrol EPO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpoDirectTestResult' }
        '401': { description: Step-up autentizace selhala }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Snapshot nebo certifikát není dostupný }
        '422': { description: Neplatný snapshot nebo certifikát }
        '502': { description: Neplatná odpověď EPO }
        '503': { description: EPO nebo kryptografická konfigurace není dostupná }

  /api/v1/reports/submissions/{id}/epo-submit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Reports]
      summary: Právně účinně podepíše a odešle snapshot do EPO
      description: |
        Vyžaduje úspěšný test téhož snapshotu a certifikátu, session step-up
        heslem a případně TOTP. Při síťovém timeoutu výsledek označí jako
        `uncertain` a nikdy automaticky neopakuje POST. Při `epo_test=true`
        odešle pouze do zkušebního prostředí a snapshot neoznačí jako právně
        podaný.
        OSS přiznání (`ossei1`) se ani touto cestou podat nedá — odmítne se
        s chybou `moss_oss_only` (422), viz `epo-test`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id, password]
              properties:
                attempt_id: { type: integer, format: int64 }
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Potvrzené nebo offline zpracovávané podání
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpoDirectSubmissionResult' }
        '401': { description: Step-up autentizace selhala }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Chybí úspěšný test, snapshot už byl podán nebo se změnilo aktivní EPO prostředí }
        '422': { description: EPO podání odmítlo; odpověď obsahuje messages }
        '502': { description: Potvrzení EPO nelze bezpečně ověřit }
        '503': { description: Výsledek odeslání je nejistý nebo EPO nedostupné }

  /api/v1/reports/submissions/{id}/epo-status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Reports]
      summary: Obnoví stav přímého nebo rozsáhlého EPO podání
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id]
              properties:
                attempt_id: { type: integer, format: int64 }
      responses:
        '200':
          description: Uložený aktuální stav bez vrácení stavového hesla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpoDirectSubmissionResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Pokus nemá údaje pro stav nebo patří do jiného než aktuálně aktivního EPO prostředí }
        '502': { description: EPO vrátilo neplatnou odpověď }

  /api/v1/reports/submissions/{id}/epo-attempts/{attemptId}/confirmation:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: attemptId, required: true, schema: { type: integer, format: int64 } }
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Reports]
      summary: Ověří nalezené P7S/P7M a bezpečně dokončí nejisté přímé podání
      description: |
        Vyžaduje session step-up. Produkční potvrzení musí mít platný podpis a
        řetězec EPO; sandboxové potvrzení platný podpis a přesnou testovací
        identitu GFŘ. Potvrzení se musí vztahovat k archivovanému odchozímu CMS.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, password]
              properties:
                file: { type: string, format: binary, description: Potvrzení EPO P7S/P7M, nejvýše 10 MiB }
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Kryptograficky ověřené a dokončené podání
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpoDirectSubmissionResult' }
        '400': { description: Chybějící nebo neplatný soubor }
        '401': { description: Step-up autentizace selhala }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Pokus nelze tímto způsobem obnovit }
        '502': { description: Potvrzení nelze bezpečně ověřit }

  /api/v1/reports/submissions/{id}/epo-attempts/{attemptId}/resolve-not-submitted:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: attemptId, required: true, schema: { type: integer, format: int64 } }
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Reports]
      summary: Auditovaně uvolní nejednoznačný pokus ověřený jako nepřijatý
      description: |
        Nikdy nekontaktuje submit endpoint. Je dostupné jen pro `uncertain` bez
        vzdáleného identifikátoru nebo pro `submitting` starší 15 minut, pokud
        nejsou dostupné údaje pro stavový dotaz. Vyžaduje session step-up,
        výslovné potvrzení a auditní poznámku.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verified_not_submitted, note, password]
              properties:
                verified_not_submitted: { type: boolean, enum: [true] }
                note: { type: string, minLength: 10, maxLength: 500 }
                password: { type: string, format: password }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Pokus byl auditovaně uzavřen a snapshot lze znovu podat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpoDirectSubmissionResult' }
        '400': { description: Chybí výslovné potvrzení nebo auditní poznámka }
        '401': { description: Step-up autentizace selhala }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Pokus není bezpečně uvolnitelný }

  /api/v1/reports/submissions/{id}/artifacts:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Reports]
      summary: Nahraje potvrzení a další artefakty EPO do dokumentů
      description: |
        Přijímá nejvýše 20 souborů XML, P7S/P7M nebo PDF. Před uložením
        automaticky vytvoří nakonfigurovanou stromovou strukturu archivu podle
        druhu formuláře a období. U podepsaného potvrzení se ověří dostupné
        kryptografické a obsahové vlastnosti; podání uživatel doloží ručně po
        kontrole doručenky, dokud není k dispozici spravovaný allowlist EPO pečetí.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                attempt_id:
                  type: integer
                  format: int64
                  description: ID pokusu vrácené handoffem; bez něj zůstane artefakt bez vazby na konkrétní pokus.
                file:
                  type: array
                  maxItems: 20
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Výsledek uložení a ověření artefaktů
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpoArtifactUploadResult' }
        '400': { description: Chybějící, neplatné nebo nezpracovatelné soubory }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Více než 20 souborů }
        '415': { description: Nepodporovaný typ artefaktu }

  /api/v1/reports/submissions/{id}/artifacts/{artifactId}/download:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: artifactId, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Reports]
      summary: Stáhne důkazní artefakt EPO v rámci oprávnění k reportům
      responses:
        '200':
          description: Soubor jako bezpečná příloha
          content:
            application/octet-stream: {}
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

