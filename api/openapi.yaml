  /api/v1/accounting/reporting-settings:
    get:
      tags: [Accounting]
      summary: Nastavení výkaznictví firmy (zaměstnanci, override rozsahu)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { avg_employees: { type: [integer, "null"] }, statement_scope_override: { type: [string, "null"], enum: [full, small, micro, null] }, statutory_audit: { type: boolean }, manual_doc_series: { type: boolean }, fx_reversal_at_open: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Accounting]
      summary: Uloží nastavení výkaznictví
      description: |
        Účetní/admin. Přepínače (statutory_audit §3a vyhl. → výkazy vždy v plném
        rozsahu, manual_doc_series — řada ID pro ruční zápisy, fx_reversal_at_open
        — storno FX přecenění saldokonta k 1. dni) se ukládají jen jsou-li v body.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avg_employees: { type: [integer, "null"], minimum: 0 }
                statement_scope_override: { type: [string, "null"], enum: [full, small, micro, null] }
                statutory_audit: { type: boolean, description: "Povinný audit §20 ZoÚ → plný rozsah výkazů (§3a vyhl. 500/2002)" }
                manual_doc_series: { type: boolean, description: "Auto číslo dokladu ID-{rok}-{NNNN} pro ruční zápisy" }
                fx_reversal_at_open: { type: boolean, description: "Storno přecenění saldokonta k 1. dni nového období (ČÚS 006)" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/period-lock:
