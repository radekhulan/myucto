        vat_rate_default_id: { type: [integer, "null"], description: "Legacy výchozí sazba DPH" }
        hourly_rate: { type: [number, "null"], format: float, description: "Default hodinová sazba (CZK / hod) pro projekty klienta" }
        reverse_charge: { type: boolean, description: "Přenesená daňová povinnost — propisuje se do nových faktur." }
        oss_mode:
          type: string
          enum: [auto, never]
          default: auto
          description: "Uplatnění OSS u tohoto odběratele. `auto` = rozhoduje derivace z číselníku sazeb členských států; `never` OSS jen UBERE (vynutit ho nelze — o místě plnění rozhoduje výhradně derivace)."
        oss_default_supply_type:
          type: [string, "null"]
          enum: [goods, services, null]
          description: "Výchozí typ plnění pro OSS. NULL = odvodit z měrné jednotky položky / CZ-NACE. Uplatní se AŽ POD jednotkou položky — jednotka je důkaz z řádku, karta jen default."
        is_customer: { type: boolean, description: "Role odběratele (vystavujeme mu faktury)" }
        is_vendor: { type: boolean, description: "Role dodavatele (evidujeme přijaté faktury)" }
        is_vat_payer: { type: boolean, description: "Plátce DPH — aktuální stav karty (ověřitelné online přes /clients/{id}/vat-status). Klienti historii plátcovství nevedou; doklady nesou per-doklad snapshot k datu vystavení." }
        auto_send_reminders: { type: boolean, description: "Automatické odesílání upomínek" }
        payment_due_default: { type: [integer, "null"], description: "Default splatnost pro nové faktury klienta" }
        payment_due_unit: { type: [string, "null"], enum: [days, month, null], description: "Jednotka splatnosti (dny / konec měsíce)" }
        note: { type: [string, "null"] }
        default_expense_category_id: { type: [integer, "null"], description: "Default kategorie nákladu pro přijaté faktury dodavatele" }
        default_revenue_category_id: { type: [integer, "null"], description: "Default kategorie tržby pro vydané faktury odběratele" }
        invoice_number_format: { type: [string, "null"], description: "Per-klient override číselné řady faktur" }
        proforma_number_format: { type: [string, "null"] }
        credit_note_number_format: { type: [string, "null"] }
        invoice_number_period: { type: [string, "null"], enum: [year, month, none, null] }
        default_branding_profile_id: { type: [integer, "null"], description: "Výchozí brandingový profil pro nové vydané faktury klienta." }
        archived_at: { type: [string, "null"], format: date-time, description: "NULL = aktivní; vyplněno = archivováno" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        _warnings:
          type: array
          items: { type: string }
          description: "Jen v odpovědi POST/PUT — non-blocking varování (např. ic_checksum_invalid, dic_format_invalid, dic_ic_mismatch — audit 2026-07), uložení neblokují."
        _duplicate_candidates:
          type: array
          description: "Jen v odpovědi POST/PUT, jen když existuje — jiná karta tenanta se stejným IČO/DIČ po normalizaci (FR 2, vendor bugreport 2026-08-06). Non-blocking, uložení neblokuje."
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              company_name: { type: string }
              match_field: { type: string, enum: [ic, dic] }

    ClientEmailContact:
      type: object
      description: "E-mailový kontakt odběratele dle účelu (#86). Účely: communication (běžná komunikace), documents (faktury/dobropisy/poděkování za platbu), reminders (upomínky; bez nich fallback na documents), approvals (schvalování výkazů). Jakmile má klient aktivní kontakt s daným účelem, main_email se pro tento typ zprávy přestane automaticky přidávat (zůstává jen fallback)."
      properties:
        id: { type: integer, readOnly: true }
        email: { type: string, format: email }
        label: { type: [string, "null"], maxLength: 80, description: 'Popisek (např. „účetní oddělení")' }
        contact_name: { type: [string, "null"], maxLength: 120, description: "Jméno kontaktní osoby" }
        is_active: { type: boolean, default: true }
        sort_order: { type: integer, readOnly: true, description: "Pořadí — odvozeno z pořadí v zaslaném poli" }
        usages:
          type: array
          description: "Účely použití kontaktu + role příjemce."
          items:
            type: object
            required: [usage]
            properties:
              usage: { type: string, enum: [communication, documents, reminders, approvals] }
              recipient: { type: string, enum: [to, cc, bcc], default: to }

    ClientBankAccount:
      type: object
      description: "Bankovní účet obchodního partnera. Příznaky původu jsou nezávislé, protože tentýž účet může být ruční, zveřejněný v registru DPH i pozorovaný na výpisu."
      required: [id, client_id, account_number, source_manual, source_vat_registry, source_bank_statement, is_active]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        client_id: { type: integer, format: int64, readOnly: true }
        account_number: { type: string }
        bank_code: { type: [string, "null"] }
        iban: { type: [string, "null"] }
        source_manual: { type: boolean }
        source_vat_registry: { type: boolean }
        source_bank_statement: { type: boolean }
        last_bank_transaction_id: { type: [integer, "null"], format: int64, readOnly: true }
        is_active: { type: boolean }
        first_seen_at: { type: string, format: date-time, readOnly: true }
        last_seen_at: { type: string, format: date-time, readOnly: true }

    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          properties:
            email_contacts:
              type: array
              items: { $ref: '#/components/schemas/ClientEmailContact' }
            bank_accounts:
              type: array
              items: { $ref: '#/components/schemas/ClientBankAccount' }
            projects:
              type: array
              items: { $ref: '#/components/schemas/Project' }
            invoices_count:
              type: integer
              description: Celkový počet faktur klienta.
            revenue_by_month:
              type: array
              description: "Obrat po měsících za posledních 24 měsíců (VAT-aware)."
              items:
                type: object
                properties:
                  month: { type: string, example: "2026-04" }
                  currency: { type: string }
                  total: { type: number, format: float }
            revenue_by_year:
              type: array
              description: "Obrat po letech (VAT-aware)."
              items:
                type: object
                properties:
                  year: { type: integer }
                  currency: { type: string }
                  total: { type: number, format: float }
                  count: { type: integer }
            revenue_by_project:
              type: array
              description: 'Obrat agregovaný per zakázka — pro graf "Obrat podle zakázek". Faktury bez project_id agregovány pod project_id=null.'
              items:
                type: object
                properties:
                  project_id: { type: [integer, "null"] }
                  project_name: { type: [string, "null"] }
                  currency: { type: string }
                  total: { type: number, format: float }
                  count: { type: integer }
            unpaid_summary:
              type: array
              items:
                type: object
                properties:
                  currency: { type: string }
                  unpaid_total:  { type: number, format: float }
                  unpaid_count:  { type: integer }
                  overdue_total: { type: number, format: float }
                  overdue_count: { type: integer }

    ClientInput:
      type: object
      required: [company_name, street, city, zip]
      properties:
        company_name: { type: string }
        first_name: { type: [string, "null"] }
        last_name: { type: [string, "null"] }
        ic: { type: [string, "null"], description: "IČO — 8 číslic" }
        dic: { type: [string, "null"], description: "DIČ / VAT ID s country prefixem (u SK = IČ DPH)" }
        tax_number: { type: [string, "null"], description: "Národní daňové číslo bez prefixu (SK DIČ, DE/AT Steuernummer, PL NIP, HU Adószám)" }
        street: { type: string }
        city: { type: string }
        zip: { type: string }
        country_iso2: { type: string, default: CZ, description: "ISO2 kód země (resolvuje se na country_id). POZOR: vstup je `country_iso2`, ne `country_id`." }
        main_email: { type: [string, "null"], format: email, description: "Volitelný hlavní e-mail (backend pole `main_email`, ne `email`)." }
        phone: { type: [string, "null"], maxLength: 40 }
        language: { type: string, enum: [cs, en], default: cs }
        currency_default_id: { type: [integer, "null"], description: "Výchozí měna klienta. Pokud chybí, použije se výchozí měna supplier-a." }
        currency_default: { type: string, description: "Legacy — kód měny (CZK…). Použij currency_default_id." }
        hourly_rate: { type: [number, "null"], format: float, description: "Default hodinová sazba pro nové projekty (≥ 0)" }
        reverse_charge: { type: boolean, default: false }
        oss_mode:
          type: string
          enum: [auto, never]
          default: auto
          description: "Uplatnění OSS u tohoto odběratele. `auto` = rozhoduje derivace; `never` OSS jen UBERE — vynutit ho nelze."
        oss_default_supply_type:
          type: [string, "null"]
          enum: [goods, services, null]
          description: "Výchozí typ plnění pro OSS; NULL = odvodit z měrné jednotky položky / CZ-NACE. Při PUT se `null` uloží jako vymazání defaultu."
        is_customer: { type: boolean, default: true, description: "Role odběratele. Aspoň jedna z is_customer/is_vendor musí zůstat true." }
        is_vendor: { type: boolean, default: false, description: "Role dodavatele." }
        is_vat_payer: { type: boolean, default: true }
        auto_send_reminders: { type: boolean, default: true }
        payment_due_default: { type: integer, minimum: 1, maximum: 365, description: "Default splatnost" }
        payment_due_unit: { type: [string, "null"], enum: [days, month, null] }
        note: { type: [string, "null"] }
        default_expense_category_id: { type: [integer, "null"] }
        default_revenue_category_id: { type: [integer, "null"] }
        invoice_number_format: { type: [string, "null"], maxLength: 60 }
        proforma_number_format: { type: [string, "null"] }
        credit_note_number_format: { type: [string, "null"] }
        invoice_number_period: { type: [string, "null"], enum: [year, month, none, null] }
        default_branding_profile_id: { type: [integer, "null"], description: "Volitelný výchozí brandingový profil; musí patřit aktuálnímu supplier-ovi." }
        email_contacts:
          type: array
          description: "E-mailové kontakty dle účelu (#86) — replace-all: pošli kompletní pole; klíč vynech, pokud kontakty neměníš. Max 10 kontaktů."
          items: { $ref: '#/components/schemas/ClientEmailContact' }

    Invoice:
      type: object
      properties:
        id: { type: integer }
        supplier_id: { type: integer }
        branding_profile_id: { type: [integer, "null"], description: "Vizuální identita dokladu; při vystavení se uloží do supplier_snapshot." }
        client_id: { type: integer }
        client_company_name: { type: string, description: "Denormalizováno z klienta pro pohodlí výpisů" }
        client_main_email: { type: [string, "null"], format: email }
        project_id: { type: [integer, "null"] }
        project_name: { type: [string, "null"] }
        parent_invoice_id: { type: [integer, "null"], description: "Pro credit_note / cancellation / final-z-proformy odkaz na původní fakturu" }
        recurring_template_id: { type: [integer, "null"], description: "Pro faktury vygenerované ze šablony pravidelné fakturace — odkaz na šablonu (NULL pokud byla šablona smazána, viz ON DELETE SET NULL)." }
        varsymbol: { type: [string, "null"], description: "Variabilní symbol = číslo faktury. Přiděluje se při issue (u draft je null nebo manuální override)." }
        invoice_type:
          type: string
          enum: [invoice, proforma, credit_note, cancellation, tax_document, penalty, payment_calendar]
          description: |
            Druh dokladu (doména sloupce `invoices.invoice_type`, migrace 1170).
            `tax_document` = daňový doklad k přijaté platbě zálohy (§ 28/2 ZDPH);
            DUZP = datum platby, `parent_invoice_id` = proforma.
            `penalty` = penalizační faktura, `payment_calendar` = platební kalendář
            (§ 31 ZDPH). Vytvořit přímo lze jen podmnožinu — viz `InvoiceInput`.
        status:
          type: string
          enum: [draft, issued, sent, reminded, paid, cancelled]
        payment_status:
          type: [string, "null"]
          enum: [unpaid, partially_paid, paid, overpaid, null]
          description: "Odvozený platební stav (#89) z paid_total vs. amount_to_pay (tolerance 0,05). Null pro draft/cancelled."
        payment_method:
          type: string
          enum: [bank_transfer, direct_debit, card, cash, cash_on_delivery, offset, other]
          default: bank_transfer
          description: |
            Způsob úhrady (doména `Support\PaymentMethods::ALL`, migrace 1128 — společná
            pro vystavené i přijaté faktury). U card/cash se v PDF/emailu nezobrazuje QR
            ani bankovní spojení a místo výzvy k platbě se uvede odpovídající poznámka.
        cash_register_id:
          type: [integer, "null"]
          description: |
            Hotovostní vyrovnání (migrace 1327): pokladna, do které se doklad inkasuje,
            je-li `payment_method = cash`. Při vystavení (a při každém uložení) z ní
            vznikne zaúčtovaný příjmový pokladní doklad navázaný na tuto fakturu;
            NULL doklad zase zruší. Neplatí pro zálohové faktury (proforma),
            storna a platební kalendáře.
        language: { type: string, enum: [cs, en], description: "Jazyk PDF/emailů" }
        reverse_charge: { type: boolean }
        prices_include_vat: { type: boolean, description: "Ceny položek zadané včetně DPH (DPH se počítá shora koeficientem). Per-doklad, migrace 0083." }
        auto_send_reminders: { type: boolean, description: "Per-faktura přepínač automatických upomínek (migrace 0088). False = cron tuto fakturu přeskočí, i když má dodavatel i klient upomínky zapnuté." }
        client_ic: { type: [string, "null"], description: "Denormalizováno z klienta" }
        client_dic: { type: [string, "null"] }
        revenue_category_id: { type: [integer, "null"], description: "FK do /revenue-categories — kategorie tržby pro CRM/Grafy" }
        revenue_category_label: { type: [string, "null"], description: "Denormalizovaný label kategorie tržby" }
        revenue_category_code: { type: [string, "null"] }
        revenue_category: { type: [string, "null"], description: "Legacy volný textový tag (nahrazeno revenue_category_id)" }
        vat_classification_code: { type: [string, "null"], description: "Hlavičkový default kódu klasifikace plnění (DPHDP3 / KH)" }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date }
        tax_date: { type: [string, "null"], format: date, description: "DUZP — null u proforem" }
        currency_id: { type: integer, description: "FK do /settings/currencies (per-supplier)" }
        currency: { type: string, example: CZK, description: "Denormalizovaný kód měny (= currencies.code)" }
        currency_symbol: { type: string, example: "Kč" }
        exchange_rate: { type: [number, "null"], format: float, description: "CZK / 1 jednotka cizí měny (ČNB). NULL = neaplikováno (např. faktura v CZK)" }
        exchange_rate_date: { type: [string, "null"], format: date }
        total_without_vat: { type: number, format: float }
        total_vat: { type: number, format: float }
        total_with_vat: { type: number, format: float }
        rounding: { type: number, format: float, description: "Zaokrouhlení (CZK)" }
        advance_paid_amount: { type: number, format: float, description: "Záloha k odečtení (u faktury vystavované po proforme)" }
        amount_to_pay: { type: number, format: float, description: "total_with_vat + rounding − advance_paid_amount" }
        paid_total: { type: number, format: float, description: "Suma evidovaných plateb (invoice_payments, #89); zbývá k úhradě = amount_to_pay − paid_total" }
        discount_percent: { type: number, format: float, description: "Procentuální sleva z celé faktury (0 = žádná). Materializuje se jako záporná položka „Sleva X %\" v `items`." }
        totals:
          type: object
          description: "Agregát pro renderování — duplikuje stejné hodnoty co výše"
          properties:
            without_vat: { type: number, format: float }
            vat: { type: number, format: float }
            with_vat: { type: number, format: float }
            rounding: { type: number, format: float }
            advance_paid_amount: { type: number, format: float }
            amount_to_pay: { type: number, format: float }
            discount_percent: { type: number, format: float, description: "Procentuální sleva z celé faktury (0 = žádná)" }
            discount_amount: { type: number, format: float, description: "Kladná peněžní hodnota slevy (= součet záporných slevových položek)" }
        vat_breakdown:
          type: array
          description: "Per-sazba rozpad DPH (vstup pro QR + PDF)"
          items:
            type: object
            properties:
              vat_rate_id: { type: integer }
              rate: { type: number, format: float, example: 21 }
              base: { type: number, format: float }
              vat:  { type: number, format: float }
              total: { type: number, format: float }
        czk_recap:
          description: "CZK rekapitulace u cizoměnových faktur (null pokud měna == CZK nebo není zafixován kurz)"
          type: [object, "null"]
        note_above_items: { type: [string, "null"] }
        note_below_items: { type: [string, "null"] }
        bank_account_number: { type: [string, "null"], description: "Z currencies (per-měna bank účet supplier-a)" }
        bank_code: { type: [string, "null"] }
        bank_iban: { type: [string, "null"] }
        bank_bic: { type: [string, "null"] }
        approval_status:
          type: [string, "null"]
          enum: [none, requested, approved, rejected, null]
        public_token: { type: [string, "null"], description: "Token trvalého veřejného odkazu „web faktura\" (/invoice/{token}); null dokud odkaz nevznikl. Viz POST /invoices/{id}/public-link." }
        public_viewed_at: { type: [string, "null"], format: date-time, description: "Poslední zobrazení web faktury klientem (anonymní přístup); null = klient ji zatím neotevřel." }
        items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceItem' }
        project_billing_emails:
          type: array
          items:
            type: object
            properties:
              email: { type: string, format: email }
              label: { type: [string, "null"] }
        final_invoice:
          type: [object, "null"]
          description: "Jen u proformy — navázaný finální daňový doklad ({ id, varsymbol, status })"
        parent_invoice:
          type: [object, "null"]
          description: "Jen pokud je parent_invoice_id ({ id, varsymbol, status, invoice_type })"
        has_advance_candidates: { type: boolean, description: "UI flag — existují nespárované zálohy k propojení" }
        has_final_candidates: { type: boolean }
        sent_at: { type: [string, "null"], format: date-time, description: "Kdy byla naposledy odeslána emailem" }
        last_reminder_at: { type: [string, "null"], format: date-time }
        reminder_count: { type: integer, description: "Počet odeslaných upomínek" }
        paid_at: { type: [string, "null"], format: date }
        cancelled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        _warnings:
          type: array
          description: |
            Neblokující upozornění k dokladu. Vrací je create/update, ne seznamy.
            Pole nese **kódy**, ne věty — UI si je překládá (`invoice.warning.<kód>`).
            Klíč chybí, když upozornění není žádné.
          items:
            type: string
            example: exchange_rate_cnb_deviation
        _warning_meta:
          type: object
          description: |
            Detaily k jednotlivým kódům z `_warnings`, klíčované týmž kódem. Tvar se
            liší podle upozornění — např. `exchange_rate_cnb_deviation` nese odchylku
            od denního kurzu ČNB, `oss_derived_notes` seznam poznámek z derivace OSS.
          additionalProperties: true
        _meta:
          type: object
          description: "Metadata k právě provedené operaci (dnes `exchange_rate`). Nejde o stav dokladu."
          additionalProperties: true

    InvoiceMonthGroup:
      type: object
      description: |
        Jedna měsíční skupina výpisu faktur (GET /invoices). Měsíc se určuje
        z `COALESCE(tax_date, issue_date)`.
      required: [month, count, totals_per_currency, invoices]
      properties:
        month: { type: string, example: "2026-05", description: "Měsíc ve formátu YYYY-MM" }
        count: { type: integer, description: "Počet faktur skupiny na aktuální stránce" }
        totals_per_currency:
          type: array
          description: |
            Měsíční obrat po měnách. Do obratu (`without_vat`/`vat`/`with_vat`) se
            počítají jen vystavené doklady (`issued`/`sent`/`reminded`/`paid`) typu
            `invoice`/`credit_note`/`tax_document`; koncepty (`draft`) stejných typů
            jdou zvlášť do `draft_*` (predikce „rozpracováno k vystavení“).
            Proformy, storna a stornované doklady se nezapočítávají vůbec.
          items:
            type: object
            properties:
              currency: { type: string, example: CZK }
              without_vat: { type: number, format: float }
              vat: { type: number, format: float }
              with_vat: { type: number, format: float }
              draft_without_vat: { type: number, format: float }
              draft_vat: { type: number, format: float }
              draft_with_vat: { type: number, format: float }
        invoices:
          type: array
          description: |
            Faktury skupiny — list vrací podmnožinu polí `Invoice` (bez items,
            bankovních polí apod.) plus listová pole `month_bucket` (YYYY-MM),
            `has_work_report` a `project_requires_approval`.

            Dále booleany `oss_review_domestic` a `oss_review_oss` — doklad má řádek
            k ručnímu posouzení místa plnění mimo OSS, resp. v OSS podání. Rozlišují
            výsledky filtru `filter[oss_review]=any`; každý stav se řeší jinak. Chybí,
            když schéma sloupec `oss_needs_manual_review` nezná.
          items: { $ref: '#/components/schemas/Invoice' }

    InvoiceInput:
      type: object
      required: [client_id, items]
      description: |
        Vstup pro POST /invoices (vytvoří draft) i PUT /invoices/{id} (úprava draftu).
        Vystavená/zaplacená/storno faktura nelze upravovat — vrátí 409.
      properties:
        client_id: { type: integer, description: "Musí patřit aktuálnímu supplier-ovi" }
        project_id: { type: [integer, "null"], description: "Pokud uvedeno, musí patřit `client_id`" }
        branding_profile_id: { type: [integer, "null"], description: "Volitelný brandingový profil stejného supplier-a; bez pole se použije výchozí profil klienta." }
        parent_invoice_id: { type: [integer, "null"], description: "Jen při create (credit_note / final-z-proformy). Na UPDATE se ignoruje." }
        invoice_type:
          type: string
          enum: [invoice, proforma, credit_note, payment_calendar]
          default: invoice
          description: |
            Druhy, které lze zadat přímo. `cancellation` a `tax_document` sem
            nepatří — vznikají vlastními cestami (`POST /invoices/{id}/cancel`,
            resp. úhradou zálohové faktury), aby s nimi vznikly i navazující vazby.
            Úprava dokladu (`PUT`) přijímá tutéž čtveřici.
        issue_date: { type: string, format: date, description: "Default = dnes" }
        due_date: { type: string, format: date, description: "Default = issue_date + payment_due_days (z projektu/klienta/supplier)" }
        tax_date: { type: [string, "null"], format: date, description: "DUZP. U proform se ignoruje (uloží se null)." }
        currency_id: { type: integer, description: "FK do /settings/currencies (per-supplier). Default = výchozí měna projektu/klienta/supplier." }
        currency:
          type: string
          example: CZK
          deprecated: true
          description: "Legacy — kód měny (CZK, EUR, …) resolvuje se na `currency_id` v rámci supplier-a. Preferuj `currency_id`."
        language: { type: string, enum: [cs, en], description: "Default = language klienta (cs)" }
        reverse_charge: { type: boolean, description: "Přenesená daňová povinnost. Default = z klienta." }
        prices_include_vat: { type: boolean, default: false, description: "Ceny položek zadané včetně DPH (DPH shora koeficientem)." }
        auto_send_reminders: { type: boolean, default: true, description: "Per-faktura přepínač automatických upomínek (migrace 0088). False = cron tuto fakturu přeskočí." }
        revenue_category_id: { type: [integer, "null"], description: "Kategorie tržby. Když chybí, na create se odvodí z defaultu projektu/klienta." }
        revenue_category: { type: [string, "null"], description: "Legacy textová kategorie tržby vedle `revenue_category_id`; ukládá se, jen když je neprázdná." }
        vat_classification_code: { type: [string, "null"], description: "Hlavičkový default klasifikace plnění; auto-default podle sazby/RC/země, pokud prázdné." }
        is_simplified:
          type: boolean
          default: false
          description: |
            Zjednodušený daňový doklad podle § 30 ZDPH (do 10 000 Kč včetně daně).
            Ukládá se jen na instalacích s migrací 1170 — starší sloupec nemají a pole se ignoruje.
        income_tax_exempt:
          type: boolean
          default: false
          description: "Příjem osvobozený od daně z příjmů. Vyžaduje migraci 0087, jinak se ignoruje."
        income_tax_exempt_reason:
          type: [string, "null"]
          description: "Důvod osvobození; ukládá se spolu s `income_tax_exempt`."
        payment_schedule:
          type: array
          description: |
            Rozpis splátek u platebního kalendáře (`invoice_type = payment_calendar`).
            Bez něj vystavení skončí `422 payment_schedule_missing`; nesouhlasí-li
            součet s dokladem, `422 payment_schedule_mismatch`.

            **Vynechaný klíč rozpis nemění** — jinak by ho cesty, které o kalendáři
            nevědí (import, opakovaná fakturace, hromadné reissue), tiše smazaly.
            Prázdné pole ho smaže záměrně. Řádek bez `due_on` se přeskočí.
          items:
            type: object
            required: [due_on]
            properties:
              due_on: { type: string, format: date, description: Datum splatnosti splátky. }
              base_amount: { type: number, format: float, default: 0 }
              vat_amount: { type: number, format: float, default: 0 }
              total_amount: { type: number, format: float, default: 0 }
              note: { type: [string, "null"], maxLength: 255 }
        varsymbol:
          type: [string, "null"]
          maxLength: 20
          description: "Volitelný manuální override automatického číslování. U draftu lze ponechat null — číslo se přidělí při /issue."
        advance_paid_amount: { type: number, format: float, default: 0, description: "Záloha k odečtení od total_with_vat" }
        discount_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 0
          description: |
            Procentuální sleva z celé faktury (0–100). Při uložení se materializuje jako
            záporná položka „Sleva X %" rozpadlá na každou sazbu DPH zvlášť (proto se
            správně propíše do DPH rozpisu i daňových výkazů). Slevovou položku
            NEposílej ručně v `items` — generuje se z tohoto pole.
        payment_method:
          type: string
          enum: [bank_transfer, direct_debit, card, cash, cash_on_delivery, offset, other]
          default: bank_transfer
          description: |
            Způsob úhrady (doména `Support\PaymentMethods::ALL`, migrace 1128).
            Pro card/cash se v PDF/emailu nevygeneruje QR ani bankovní spojení.
        cash_register_id:
          type: [integer, "null"]
          description: |
            Hotovostní vyrovnání (migrace 1327) — pokladna pro inkaso, platí jen s
            `payment_method = cash`. Pokladní doklad vznikne až při vystavení faktury;
            NULL volbu (a dřív založený pokladní doklad) zruší.
        exchange_rate: { type: [number, "null"], format: float, description: "Volitelný manuální override ČNB kurzu (CZK / 1 jednotka cizí měny)" }
        note:
          type: [string, "null"]
          description: |
            Zkratka pro `note_below_items` — hodnota se uloží do poznámky pod položkami.
            Přednost má vždy konkrétní klíč: když je v těle i `note_below_items`
            (třeba `null` jako vyprázdnění), `note` se ignoruje.
            Jen vstupní alias — odpověď ho nevrací, čti `note_above_items` / `note_below_items`.
        note_above_items: { type: [string, "null"] }
        note_below_items: { type: [string, "null"] }
        items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceItemInput' }

    ProjectBilingEmail:
      type: object
      required: [position, email]
      properties:
        position: { type: integer, minimum: 1, maximum: 3 }
        email: { type: string, format: email }
        label: { type: [string, "null"], example: "účetní" }
        usages:
          type: [array, "null"]
          description: "Typy zpráv, pro které se e-mail použije (#86). NULL / prázdné / všechny tři = všechny typy (default, zpětně kompatibilní)."
          items: { type: string, enum: [documents, reminders, approvals] }

    ProjectBrief:
      type: object
      description: Zkrácená reprezentace zakázky (pro výpisy a selecty).
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string, enum: [active, paused, closed] }
        currency_id: { type: integer }
        currency: { type: string, example: CZK }
        hourly_rate: { type: number, format: float, example: 1500 }
        payment_due_days: { type: integer, example: 14 }
        payment_due_unit: { type: [string, "null"], enum: [days, month, null], description: "Jednotka splatnosti (NULL = dny)" }
        project_number: { type: [string, "null"] }
        contract_number: { type: [string, "null"] }
        budget_total:   { type: [number, "null"] }
        budget_yearly:  { type: [number, "null"] }
        budget_monthly: { type: [number, "null"] }
        default_revenue_category_id: { type: [integer, "null"], description: "Default kategorie tržby pro faktury zakázky" }
        archived_at: { type: [string, "null"], format: date-time }

    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectBrief'
        - type: object
          properties:
            client_id: { type: integer, format: int64 }
            client_company_name: { type: string }
            client_main_email: { type: [string, "null"], format: email }
            supplier_id: { type: integer }
            note: { type: [string, "null"] }
            requires_work_report_approval: { type: boolean }
            billing_emails:
              type: array
              maxItems: 3
              items: { $ref: '#/components/schemas/ProjectBilingEmail' }
            billing_emails_mode:
              type: string
              enum: [auto, append, replace]
              default: auto
              description: "Jak kombinovat e-maily zakázky s kontakty klienta (#86): auto = dosavadní per-typ chování (doklady/upomínky přidat, schvalování nahradit), append = vždy přidat, replace = vždy nahradit."
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            invoices_count:
              type: integer
              description: Počet faktur navázaných na zakázku.
            revenue_by_month:
              type: array
              items:
                type: object
                properties:
                  month: { type: string, example: "2026-04" }
                  currency: { type: string, example: CZK }
                  total: { type: number, format: float }
            revenue_by_year:
              type: array
              items:
                type: object
                properties:
                  year: { type: integer, example: 2026 }
                  currency: { type: string, example: CZK }
                  total: { type: number, format: float }
                  count: { type: integer }
            unpaid_summary:
              type: array
              items:
                type: object
                properties:
                  currency: { type: string, example: CZK }
                  unpaid_total:  { type: number, format: float }
                  unpaid_count:  { type: integer }
                  overdue_total: { type: number, format: float }
                  overdue_count: { type: integer }

    ProjectInput:
      type: object
      required: [client_id, name, payment_due_days]
      properties:
        client_id:
          type: integer
          format: int64
          description: Musí patřit aktuálnímu supplier-ovi.
        name:
          type: string
          maxLength: 190
          example: "Webové stránky 2026"
        status:
          type: string
          enum: [active, paused, closed]
          default: active
        currency_id:
          type: integer
          description: Default = výchozí měna supplier-a.
        currency:
          type: string
          deprecated: true
          description: "Legacy — kód měny (CZK…). Resolvuje se na currency_id. Preferuj currency_id."
        hourly_rate:
          type: number
          format: float
          example: 1500.00
        payment_due_days:
          type: integer
          minimum: 1
          maximum: 365
          example: 14
          description: |
            Povinné. Chybějící pole se čte jako `0`, což validace odmítne (rozsah 1–365),
            takže payload bez něj skončí `400` — server tu žádný default nedoplňuje.
        payment_due_unit:
          type: [string, "null"]
          enum: [days, month, null]
        default_revenue_category_id:
          type: [integer, "null"]
          description: "Default kategorie tržby (musí patřit tenantovi); zpětně doplní existující faktury zakázky."
        project_number:
          type: [string, "null"]
          maxLength: 50
        contract_number:
          type: [string, "null"]
          maxLength: 50
        budget_total:
          type: [number, "null"]
          format: float
        budget_yearly:
          type: [number, "null"]
          format: float
        budget_monthly:
          type: [number, "null"]
          format: float
        requires_work_report_approval:
          type: boolean
          default: false
          description: |
            Pokud `true`, faktury z této zakázky vyžadují schválení výkazu
            víceprací zákazníkem před vystavením.
        note:
          type: [string, "null"]
        billing_emails:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ProjectBilingEmail' }
          description: |
            Až 3 fakturační emaily (slot 1/2/3). Kombinace s kontakty/hlavním
            e-mailem klienta se řídí přes `billing_emails_mode` (default `auto`
            = dosavadní chování: u dokladů a upomínek se přidávají, u schvalování
            výkazů nahrazují).
        billing_emails_mode:
          type: string
          enum: [auto, append, replace]
          default: auto
          description: "Jak kombinovat e-maily zakázky s příjemci dle kontaktů klienta (#86)."

    WorkReportItem:
      type: object
      properties:
        id: { type: integer }
        description: { type: string, example: "Analýza požadavků a tech-spec" }
        hours: { type: number, format: float, example: 8.5 }
        rate:  { type: number, format: float, example: 1500 }
        total_amount: { type: number, format: float, example: 12750, description: hours × rate }
        order_index: { type: integer, example: 1 }
        work_date: { type: [string, "null"], format: date, description: "Datum provedení úkonu (volitelné)" }

    WorkReportItemInput:
      type: object
      required: [description, hours, rate]
      properties:
        description: { type: string }
        hours: { type: number, format: float, minimum: 0 }
        rate:  { type: number, format: float, minimum: 0 }
        order_index: { type: integer }
        work_date: { type: string, format: date, description: "Datum provedení úkonu (volitelné, YYYY-MM-DD)" }

    WorkReport:
      type: object
      properties:
        id: { type: integer, format: int64 }
        invoice_id: { type: integer, format: int64 }
        project_id: { type: [integer, "null"], format: int64 }
        title: { type: string, example: "Květen 2026 — vývoj backendu" }
        total_hours: { type: number, format: float }
        total_amount: { type: number, format: float }
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkReportItem' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkReportInput:
      type: object
      required: [title, items]
      properties:
        project_id:
          type: [integer, "null"]
          description: |
            Volitelné — pokud faktura má `project_id`, výkaz se na něj naváže
            automaticky. Pro faktury bez zakázky nechej `null`.
        title:
          type: string
          maxLength: 190
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkReportItemInput' }

    PdfArchiveEntry:
      type: object
      description: |
        Jeden snapshot vystaveného PDF. Soubor se ukládá s timestampem a typem
        akce (issue / send / reissue) v `storage/invoices-pdf/`. Pro stažení
        použij `GET /api/v1/invoices/{id}/pdfs/{archiveId}`.
      properties:
        id: { type: integer, format: int64 }
        invoice_id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [issue, send, reissue, manual]
          description: Co snapshot iniciovalo
        filename: { type: string, example: "F2026-001.pdf" }
        size_bytes: { type: integer }
        sha256: { type: string, example: "9f86d081…" }
        created_at: { type: string, format: date-time }
        created_by_user_id: { type: [integer, "null"] }

    InvoiceAttachment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        invoice_id: { type: integer, format: int64 }
        filename: { type: string, example: "podklad-vykaz.xlsx" }
        mime_type: { type: string, example: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }
        size_bytes: { type: integer, example: 18452 }
        created_at: { type: string, format: date-time }

    AresLookupResult:
      type: object
      description: |
        Odpověď ARES lookup-u. Pokud IČO existuje, `found = true` (implicitní) a
        ostatní pole jsou vyplněná. Pro neexistující IČO vrátíme `{ found: false }`.
      properties:
        found: { type: boolean, example: true }
        source:
          type: string
          enum: [fresh, cache]
          description: Zda data přišla z ARES API nebo z 24h cache
        company_name: { type: string, example: "Vzorová firma s.r.o." }
        ic:  { type: string, example: "27082440" }
        dic: { type: string, example: "CZ27082440" }
        street: { type: string }
        city: { type: string }
        zip: { type: string, example: "301 00" }
        country_iso2: { type: string, example: "CZ" }
        is_vat_payer: { type: boolean }
        date_active: { type: string, format: date, description: "Datum vzniku firmy" }
        legal_form: { type: string, example: "112" }

    ViesLookupResult:
      type: object
      properties:
        valid: { type: boolean }
        vat_id: { type: string, example: "DE123456789" }
        country_code: { type: string, example: "DE" }
        name: { type: [string, "null"] }
        address: { type: [string, "null"] }
        consultation_number:
          type: [string, "null"]
          description: |
            VIES consultation number — důkazní záznam pro daňovou kontrolu, že DIČ
            byl k danému datu platný.
        request_date: { type: string, format: date-time }
        source:
          type: string
          enum: [fresh, cache]

    ActivityLogEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        action:
          type: string
          example: "invoice.issued"
          description: "Tečka-separátor: entity.verb (např. invoice.paid, project.archived, auth.login)"
        entity_type: { type: [string, "null"], example: "invoice" }
        entity_id:   { type: [integer, "null"], format: int64 }
        user_id:     { type: [integer, "null"], format: int64, description: "Null = systémová akce (cron)" }
        user_email:  { type: [string, "null"], format: email }
        payload:
          type: [object, "null"]
          additionalProperties: true
          description: Akce-specifické metadata (citlivá pole se redaktují)
        ip:         { type: [string, "null"], example: "203.0.113.42" }
        user_agent: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    DashboardSummary:
      type: object
      description: |
        Souhrnná data pro Dashboard (homepage) i stránku Grafy (`/stats`).

        **VAT-aware obrat:** Pro plátce DPH (`supplier.is_vat_payer = 1`) se obrat
        ve všech KPI a grafech počítá z `total_without_vat`; pro neplátce z
        `total_with_vat`. Flag `is_vat_payer` v response signalizuje použitou
        variantu.
      properties:
        today: { type: string, format: date }
        year: { type: integer, example: 2026 }
        prev_year: { type: integer, example: 2025 }
        is_vat_payer:
          type: boolean
          description: "Plátce DPH? Určuje použitý sloupec obratu (total_without_vat vs total_with_vat)."
        kpi:
          type: object
          properties:
            per_currency:
              type: array
              description: "Per měna: obrat YTD + loni + YTD loni (do stejného kalendářního dne) + počty faktur/klientů/zakázek pro každý rok."
              items:
                type: object
                properties:
                  currency: { type: string }
                  this_year: { type: number }
                  prev_year: { type: number }
                  prev_year_ytd: { type: number, description: "Obrat loni do stejného dne v roce (pro fair YoY)" }
                  change_pct: { type: [number, "null"], description: "Letošek vs prev_year_ytd v %" }
                  this_year_invoice_count: { type: integer }
                  prev_year_invoice_count: { type: integer }
                  this_year_client_count: { type: integer, description: "DISTINCT klienti v této měně (letos)" }
                  prev_year_client_count: { type: integer }
                  this_year_project_count: { type: integer, description: "DISTINCT zakázky v této měně (letos)" }
                  prev_year_project_count: { type: integer }
            issued_count_ytd: { type: integer }
            overdue_count: { type: integer }
            overdue_per_currency:
              type: array
              items:
                type: object
                properties:
                  currency: { type: string }
                  count: { type: integer }
                  total: { type: number }
            avg_payment_days: { type: [number, "null"] }
            status_counts_ytd:
              type: object
              additionalProperties: { type: integer }
        overdue:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        unpaid_upcoming:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        draft_invoices:
          type: array
          description: "Rozpracované (status=draft) vystavené faktury pro widget Výkazy práce na Přehledu — firma + zakázka + odkaz na editaci. Max 24, řazeno dle updated_at DESC."
          items:
            type: object
            properties:
              id: { type: integer }
              varsymbol: { type: [string, "null"] }
              invoice_type: { type: string }
              client_id: { type: integer }
              client_company_name: { type: string }
              project_id: { type: [integer, "null"] }
              project_name: { type: [string, "null"], description: "Název zakázky (NULL = bez zakázky)." }
              currency: { type: string }
              issue_date: { type: string, format: date }
              total_with_vat: { type: number }
        top_clients_ytd:
          type: array
          description: "Top 12 klientů YTD per měna."
          items: { $ref: '#/components/schemas/TopClient' }
        top_clients_prev_year:
          type: array
          description: "Top 12 klientů za minulý rok per měna."
          items: { $ref: '#/components/schemas/TopClient' }
        top_clients_12m:
          type: array
          description: "Top 12 klientů za rolling posledních 12 měsíců. Robustní vůči začátku roku (kdy YTD je téměř prázdné)."
          items: { $ref: '#/components/schemas/TopClient' }
        revenue_by_month:
          type: array
          description: "Per měna: rolling 12 měsíců (`months`) + odpovídajících 12 měsíců o rok dříve (`prev_year`)."
          items:
            type: object
            properties:
              currency: { type: string }
              months:
                type: array
                items: { $ref: '#/components/schemas/MonthBucket' }
              prev_year:
                type: array
                items: { $ref: '#/components/schemas/MonthBucket' }
        revenue_by_year:
          type: array
          description: "Obrat po rocích — všechny roky s aktivitou, VAT-aware."
          items:
            type: object
            properties:
              year: { type: integer }
              currency: { type: string }
              total: { type: number }
              invoice_count: { type: integer }
        rolling_12m:
          type: array
          description: "Plovoucí 12měsíční obrat (rolling) per měna + 12 měsíců předtím (pro rolling YoY srovnání). Relevantní pro DPH limit 2 000 000 Kč."
          items:
            type: object
            properties:
              currency: { type: string }
              total: { type: number, description: "Obrat za posledních 12 měsíců (rolling)" }
              prev_period_total: { type: number, description: "Obrat za 12 měsíců předtím" }
        revenue_last_30d:
          type: array
          description: "Live indikátor obratu za posledních 30 dní per měna."
          items:
            type: object
            properties:
              currency: { type: string }
              total: { type: number }
              invoice_count: { type: integer }
        revenue_forecast:
          type: array
          description: |
            Forecast ročního obratu — medián tří nezávislých projekcí (odolný vůči odlehlému signálu).

            **Postup:** medián ze tří signálů —
            (1) run-rate `ytd / uplynulé_dny × dní_v_roce`,
            (2) sezonalita × krátkodobý růst `ytd + prev_year_remainder × growth_short`,
            (3) sezonalita × dlouhodobý trend `ytd + prev_year_remainder × growth_trend`.
            `forecast` je medián, `forecast_low`/`forecast_high` rozpětí (min/max projekcí).
            Bez loňských dat (`prev_year_full = 0`) se použije pouze run-rate.
          items:
            type: object
            properties:
              currency: { type: string }
              ytd: { type: number, description: "Obrat letos Jan 1 – dnes" }
              prev_year_remainder: { type: number, description: "Obrat loni od dneška do konce roku (sezonalita)" }
              prev_year_full: { type: number, description: "Celý loňský rok pro srovnání" }
              growth_short: { type: number, description: "Krátkodobý růst: rolling 12m / předch. 12m, cap [0.5, 2.5]" }
              growth_trend: { type: number, description: "Dlouhodobý trend: CAGR z posledních ≤5 let, cap [0.8, 1.8]" }
              forecast: { type: number, description: "Medián tří projekcí — predikovaný celoroční obrat" }
              forecast_low: { type: number, description: "Nejnižší ze tří projekcí (spodní hranice rozpětí)" }
              forecast_high: { type: number, description: "Nejvyšší ze tří projekcí (horní hranice rozpětí)" }
        cashflow_ytd:
          type: array
          description: "Měsíční cash-flow (skutečné platby `paid_at`) letošek + minulý rok per měna. Doplňuje obrat o reálné inkaso."
          items:
            type: object
            properties:
              currency: { type: string }
              months:
                type: array
                items: { $ref: '#/components/schemas/MonthBucket' }
              prev_year:
                type: array
                items: { $ref: '#/components/schemas/MonthBucket' }
        cashflow_forecast:
          type: array
          description: "Kumulativní cash-flow forecast — co přiteče z neuhrazených faktur v příštích 30/60/90 dnech."
          items:
            type: object
            properties:
              currency: { type: string }
              in_30: { type: number }
              in_60: { type: number }
              in_90: { type: number }
              count_30: { type: integer }
              count_60: { type: integer }
              count_90: { type: integer }
        due_buckets:
          type: array
          description: "Splatnost neuhrazených faktur — kumulativně dnes / tento týden (Po-Ne) / tento měsíc."
          items:
            type: object
            properties:
              currency: { type: string }
              today_count: { type: integer }
              today_total: { type: number }
              week_count: { type: integer }
              week_total: { type: number }
              month_count: { type: integer }
              month_total: { type: number }
        aging_report:
          type: array
          description: "Aging report — stáří pohledávek po splatnosti v bucketech per měna."
          items:
            type: object
            properties:
              currency: { type: string }
              current: { type: number, description: "Ještě před splatností" }
              b1_30: { type: number, description: "1–30 dní po splatnosti" }
              b31_60: { type: number }
              b61_90: { type: number }
              b90_plus: { type: number, description: "Více než 90 dní po splatnosti" }
              current_n: { type: integer }
              b1_30_n: { type: integer }
              b31_60_n: { type: integer }
              b61_90_n: { type: integer }
              b90_plus_n: { type: integer }
        payment_days_histogram:
          type: object
          description: "Distribuce doby úhrady (`paid_at - issue_date`) za posledních 12 měsíců."
          properties:
            buckets:
              type: array
              items:
                type: object
                properties:
                  key: { type: string, enum: ["0-7", "8-14", "15-30", "30+"] }
                  label: { type: string }
                  count: { type: integer }
            total: { type: integer }
            avg_days: { type: [number, "null"] }
        vat_breakdown_12m:
          type: array
          description: |
            Rozpad obratu (base bez DPH) podle sazby DPH — **pouze pro plátce DPH**.
            Pro neplátce vrací prázdné pole. Per měna a `vat_rate_snapshot`.
            Reverse-charge řádky jsou vyznačeny labelem „RC (reverse charge)".
          items:
            type: object
            properties:
              label: { type: string, example: "21 %" }
              base: { type: number, description: "Suma total_without_vat" }
              currency: { type: string }
        invoice_size_histogram:
          type: object
          description: "Histogram velikosti faktur za posledních 12 měsíců. Buckety v CZK ekvivalentu (non-CZK přepočtené přes `exchange_rate`)."
          properties:
            buckets:
              type: array
              items:
                type: object
                properties:
                  key: { type: string, enum: ["0-5", "5-25", "25-100", "100+"] }
                  label: { type: string }
                  count: { type: integer }
                  total_czk: { type: number }
            total: { type: integer }
        active_clients_count:
          type: integer
          description: "Počet nearchivovaných klientů aktuálního dodavatele."
        active_recurring_count:
          type: integer
          description: "Počet aktivních šablon pravidelné fakturace."
        pending_approvals:
          type: object
          properties:
            requested: { type: integer }
            overdue: { type: integer, description: "Bez reakce > 5 dní" }

    TopClient:
      type: object
      properties:
        client_id: { type: integer }
        company_name: { type: string }
        currency: { type: string }
        total: { type: number }
        invoice_count: { type: integer }

    MonthBucket:
      type: object
      properties:
        ym: { type: string, example: "2026-04", description: "Měsíc ve formátu YYYY-MM" }
        total: { type: number }

    ProjectStats:
      type: object
      description: "Statistiky zakázek pro stránku Grafy. VAT-aware (viz `is_vat_payer`)."
      properties:
        this_year: { type: integer, example: 2026 }
        prev_year: { type: integer, example: 2025 }
        primary_currency:
          type: string
          description: "Nejvyužívanější měna ve fakturách — používá se k filtrování per-currency agregací."
        is_vat_payer: { type: boolean }
        top_this_year: { $ref: '#/components/schemas/ProjectStatsBlock' }
        top_prev_year: { $ref: '#/components/schemas/ProjectStatsBlock' }
        top_12m:
          allOf:
            - $ref: '#/components/schemas/ProjectStatsBlock'
            - description: "Top 12 zakázek za rolling posledních 12 měsíců. Robustní vůči začátku roku."
        totals_per_year:
          type: array
          items:
            type: object
            properties:
              year: { type: integer }
              currency: { type: string }
              total: { type: number }
              invoice_count: { type: integer }
        status_breakdown:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [active, paused, closed] }
              count: { type: integer }

    ProjectStatsBlock:
      type: object
      properties:
        top:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              client_company_name: { type: string }
              revenue: { type: number }
              invoice_count: { type: integer }
        others:
          type: object
          description: 'Agregovaná položka "Ostatní" (mimo top 12).'
          properties:
            revenue: { type: number }
            count: { type: integer }

    PurchasePaymentQr:
      type: object
      description: "QR platba + bankovní účet přijaté faktury (GET/POST/PUT na /purchase-invoices/{id}/payment-qr resp. /payment-account)."
      properties:
        ok: { type: boolean }
        qr_data_uri: { type: [string, "null"], description: "QR jako data URI (PNG)." }
        source: { type: [string, "null"], enum: [manual, isdoc, ai_reextract, qr_image, null] }
        amount: { type: number }
        currency: { type: string }
        account:
          type: object
          properties:
            account_number: { type: [string, "null"] }
            bank_code: { type: [string, "null"] }
            iban: { type: [string, "null"] }
            bic: { type: [string, "null"] }
            variable_symbol: { type: [string, "null"] }
        editable: { type: boolean }
        needs_account: { type: boolean }
        can_extract: { type: [boolean, "null"] }

    WorkReportLinkStatus:
      type: object
      description: "Stav veřejného sledovacího odkazu na výkaz (klient/zakázka)."
      properties:
        exists: { type: boolean }
        url: { type: [string, "null"] }
        last_sent_at: { type: [string, "null"], format: date-time }
        last_viewed_at: { type: [string, "null"], format: date-time }

    WorkReportLinkRecipients:
      type: object
      description: "Navržení příjemci pro odeslání odkazu (předvyplnění modalu)."
      properties:
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        bcc: { type: array, items: { type: string } }
        resolved: { type: object }

    SupplierBankAccount:
      type: object
      required: [id, account_number, kind, is_active, source]
      properties:
        id: { type: integer, format: int64 }
        label: { type: [string, "null"] }
        account_number: { type: [string, "null"] }
        bank_code: { type: [string, "null"], pattern: '^[0-9]{4}$' }
        iban: { type: [string, "null"] }
        currency: { type: [string, "null"], minLength: 3, maxLength: 3 }
        kind: { type: string, enum: [current, savings, term_deposit] }
        analytic_suffix: { type: [string, "null"], description: 'Analytika účtu 221 (221<suffix>); přiděluje se automaticky každému aktivnímu účtu.' }
        is_active: { type: boolean }
        source: { type: string, enum: [currencies, statement, manual] }
        currency_id: { type: [integer, "null"] }

    BankTransferCandidate:
      type: object
      required: [tx_id, statement_id, posted_at, amount, direction]
      properties:
        tx_id: { type: integer, format: int64 }
        statement_id: { type: integer, format: int64 }
        posted_at: { type: string, format: date }
        amount: { type: number }
        direction: { type: string, enum: [out, in] }

    BankTransferCandidatesError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, data]
          properties:
            code: { type: string, enum: [bank_transfer_candidates] }
            message: { type: string }
            data:
              type: object
              required: [candidates]
              properties:
                candidates:
                  type: array
                  items: { $ref: '#/components/schemas/BankTransferCandidate' }

    BankTransferPostingInfo:
      type: object
      required: [direction, own_account_label, pair]
      properties:
        direction: { type: string, enum: [out, in] }
        own_account_label: { type: [string, "null"] }
        pair:
          type: [object, "null"]
          required: [tx_id, statement_id, posted_at, entry_id]
          properties:
            tx_id: { type: integer, format: int64 }
            statement_id: { type: integer, format: int64 }
            posted_at: { type: string, format: date }
            entry_id: { type: [integer, "null"], format: int64 }

    BankMatchSuggestionCandidate:
      type: object
      required: [type, score, signals, flags, display]
      properties:
        type: { type: string, enum: [invoice, purchase_invoice, split] }
        invoice_id: { type: [integer, "null"], format: int64 }
        invoice_ids:
          type: [array, "null"]
          items: { type: integer, format: int64 }
        purchase_invoice_id: { type: [integer, "null"], format: int64 }
        score: { type: number, minimum: 0, maximum: 1 }
        signals:
          type: object
          additionalProperties: { type: number }
        flags:
          type: array
          items: { type: string, enum: [overpayment, fee_gap, vs_typo, currency_mismatch, proforma] }
        fee_amount: { type: [number, "null"] }
        overpayment_amount: { type: [number, "null"] }
        display:
          type: object
          required: [amount, currency, paid]
          properties:
            ref: { type: [string, "null"] }
            party: { type: [string, "null"] }
            amount: { type: number }
            currency: { type: string }
            due_date: { type: [string, "null"], format: date }
            paid: { type: boolean }

    BankMatchSuggestion:
      type: object
      required: [id, bank_transaction_id, kind, reason, top_score, deterministic_core, status, candidates, created_at]
      properties:
        id: { type: integer, format: int64 }
        bank_transaction_id: { type: integer, format: int64 }
        kind: { type: string, enum: [single, split, vs_typo, overpayment, fee_gap] }
        reason: { type: string }
        top_score: { type: number, minimum: 0, maximum: 1 }
        margin: { type: [number, "null"] }
        deterministic_core: { type: boolean }
        status: { type: string, enum: [pending, accepted, rejected, superseded, auto_applied] }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/BankMatchSuggestionCandidate' }
        created_at: { type: string, format: date-time }

    BankStatementImportResult:
      type: object
      description: |
        Souhrn importu výpisu (odpověď `/bank-statements/upload`). Není to entita
        výpisu — detail se načítá přes `GET /bank-statements/{id}`.
      properties:
        statement_id: { type: integer, format: int64 }
        transactions: { type: integer, description: Počet skutečně založených pohybů. }
        matched: { type: integer, description: Kolik z nich se rovnou spárovalo s fakturou. }
        duplicate:
          type: boolean
          description: |
            `true` = soubor se stejným SHA-256 už je v evidenci; nic se nezakládalo
            a `statement_id` míří na původní výpis.
        parsed_transactions: { type: integer, description: Počet pohybů nalezených v souboru. }
        skipped_duplicates: { type: integer, description: Pohyby přeskočené jako již evidované. }
        warnings:
          type: array
          description: "Např. `transactions_skipped_as_duplicate` při překryvu výpisů."
          items: { type: string }

    BankPostingSummary:
      type: [object, "null"]
      description: |
        Souhrn automatického zaúčtování bankovního pohybu. `null` znamená, že se
        neúčtovalo vůbec (např. vypnutá automatizace nebo firma bez podvojného účetnictví).
      properties:
        action:
          type: string
          description: "Co automatika udělala. `skipped` je výchozí, když služba akci nevrátila."
        reason:
          type: string
          description: Doplňující důvod — přítomný jen když ho služba uvedla.

    BankStatement:
      type: object
      description: "Položka seznamu výpisů (GET /bank-statements). Bankovní spojení dodavatele je per-měna na /settings/currencies, ne tady."
      properties:
        id: { type: integer, format: int64 }
        source: { type: string, enum: [gpc, pdf, email_notice, idoklad], description: "Původ výpisu: gpc/pdf = oficiální bankovní výpis, email_notice/idoklad = virtuální měsíční výpis." }
        file_name: { type: string, example: "vypis_2026_05.gpc" }
        account_number: { type: string, example: "1234567890/0100" }
        bank_code: { type: [string, "null"], example: "0100", description: "Kód banky účtu — autoritativně z konfigurovaného účtu (currencies.bank_code), fallback z výpisu. GPC výpisy ho samy nenesou." }
        currency: { type: [string, "null"], example: EUR, description: "ISO 4217. Odvozeno z transakcí výpisu nebo z currencies.account_number. NULL u výpisů importovaných před v4.1.0." }
        statement_date: { type: string, format: date }
        statement_number: { type: [string, "null"] }
        prev_balance: { type: number, format: float }
        curr_balance: { type: number, format: float }
        transaction_count: { type: integer }
        matched_count: { type: integer }
        ignored_count: { type: integer, description: "Počet sekundárních pohybů převzatých autoritativním výpisem a označených jako ignorované." }
        unposted_count: { type: integer, description: "Počet skutečných pohybů bez aktivního účetního zápisu; ignorované položky se nepočítají." }
        imported_at: { type: string, format: date-time }
        has_file: { type: boolean, description: "True pokud server má uložený originál výpisu — ke stažení přes /bank-statements/{id}/download." }
        has_pdf: { type: boolean, description: "True pokud je nahrán doprovodný PDF výpis." }
        pdf_name: { type: [string, "null"] }
        account_label: { type: [string, "null"], description: "Odvozeno z currencies.label" }

    BankStatementDetail:
      allOf:
        - $ref: '#/components/schemas/BankStatement'
        - type: object
          properties:
            file_hash: { type: string, description: "SHA-256 originálního souboru" }
            credit_total: { type: [number, "null"], format: float }
            debit_total: { type: [number, "null"], format: float }
            imported_by: { type: [integer, "null"], description: "User ID importujícího" }
            transactions:
              type: array
              items: { $ref: '#/components/schemas/BankTransaction' }

    BankTransaction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        source: { type: string, enum: [statement, email_notice, idoklad] }
        statement_id: { type: integer, format: int64 }
        posted_at: { type: string, format: date }
        amount: { type: number, format: float, example: 12500.00 }
        balance: { type: [number, "null"], format: float, description: "Disponibilní zůstatek účtu z e-mailového avíza (Creditas/Fio/RB); u transakcí z GPC výpisu null." }
        currency: { type: [string, "null"], example: CZK }
        variable_symbol: { type: [string, "null"] }
        constant_symbol: { type: [string, "null"] }
        specific_symbol: { type: [string, "null"] }
        counterparty_account: { type: [string, "null"] }
        counterparty_bank: { type: [string, "null"] }
        counterparty_name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        bank_ref: { type: [string, "null"], description: "Bankovní referenční ID transakce" }
        match_status:
          type: string
          enum: [unmatched, auto_exact, auto_partial, manual, ignored]
          description: "Stav párování. auto_* = automatika, manual = ruční přiřazení."
        matched_invoice_id: { type: [integer, "null"], format: int64, description: "Spárovaná VYDANÁ faktura" }
        matched_purchase_invoice_id: { type: [integer, "null"], format: int64, description: "Spárovaná PŘIJATÁ faktura (z payment_matches)" }
        matched_varsymbol: { type: [string, "null"] }
        matched_invoice_amount: { type: [number, "null"], format: float }
        client_id: { type: [integer, "null"] }
        matched_client_name: { type: [string, "null"] }
        matched_at: { type: [string, "null"], format: date-time }
        matched_by: { type: [integer, "null"], description: "User ID (u ručního párování)" }
        posting:
          type: [object, "null"]
          description: Stav účetního návrhu nebo zápisu bankovní transakce.
          properties:
            suggestion_source: { type: [string, "null"], enum: [rule, learned, payment_match, transfer, null] }
            transfer: { $ref: '#/components/schemas/BankTransferPostingInfo' }

    SupplierUpdate:
      type: object
      description: |
        Částečný update dodavatele — pošli jen pole ke změně. Zrcadlí
        mass-assign whitelist `PUT /api/v1/settings/supplier`; níže veřejný
        subset (fakturační údaje, defaulty, číslování, branding). `logo_path`
        a `signature_path` přes tento endpoint změnit NELZE (bezpečnost).
      properties:
        company_name: { type: string }
        display_name: { type: [string, "null"], description: "Obchodní/značkové jméno v hlavičce PDF a e-mailů (fallback = company_name)" }
        street: { type: string }
        city: { type: string }
        zip: { type: string }
        country_id: { type: integer }
        ic: { type: [string, "null"] }
        dic: { type: [string, "null"] }
        is_vat_payer: { type: boolean, description: "Aktuální stav plátcovství DPH (cache dneška); změna zapíše řádek do historie supplier_vat_status_history (viz `vat_status_history` v SupplierFull), účinnost lze určit polem `vat_status_effective_from`." }
        vat_status_effective_from: { type: string, format: date, description: "Účinnost změny plátcovství DPH poslané v témže requestu (default dnešek). Zapíše/aktualizuje řádek historie supplier_vat_status_history k tomuto datu." }
        is_identified: { type: boolean }
        data_box_id: { type: [string, "null"] }
        data_box_type: { type: [string, "null"], enum: [FO, PFO, PO, OVM, null], description: "Druh datové schránky v ISDS; nesouvisí s typem poplatníka." }
        oss_enabled: { type: boolean }
        oss_valid_from: { type: [string, "null"], format: date }
        oss_valid_to: { type: [string, "null"], format: date }
        oss_identification_country: { type: [string, "null"], minLength: 2, maxLength: 2 }
        oss_return_currency: { type: string, minLength: 3, maxLength: 3, default: EUR }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        web: { type: [string, "null"] }
        tagline: { type: [string, "null"], description: "Podtitulek v patičce PDF a e-mailů" }
        default_currency_id: { type: integer }
        default_payment_due_days: { type: integer }
        default_payment_due_unit: { type: string, enum: [days, month] }
        default_prices_include_vat: { type: boolean }
        invoice_number_format:
          type: [string, "null"]
          maxLength: 60
          example: "{YY}{MM}{CCC}"
          description: |
            Template čísla faktury: `{YYYY}`/`{YY}` rok, `{MM}` měsíc, `{C..C}`
            counter s paddingem dle počtu C (např. `{CCC}` → 001). Musí
            obsahovat counter placeholder. Prázdný string / null = fallback
            na globální cfg.
        proforma_number_format: { type: [string, "null"], maxLength: 60, example: "9{YY}{MM}{CCC}" }
        credit_note_number_format: { type: [string, "null"], maxLength: 60, example: "7{YY}{MM}{CCC}" }
        purchase_invoice_number_format: { type: [string, "null"], maxLength: 60, description: "Interní číslování přijatých faktur" }
        invoice_number_period:
          type: string
          enum: [year, month, none]
          description: "Reset counteru: ročně / měsíčně / nikdy (jedna průběžná řada). Společné pro všechny typy dokladů."
        email_branding_enabled: { type: boolean, description: "Původní branding dodavatele používaný při vypnutých brandingových profilech" }
        email_accent_color: { type: string, example: "#3B2D83", description: "Hex #RRGGBB; akcentní barva e-mailů a PDF faktur" }
        pdf_logo_show_name: { type: boolean, description: "Zobrazit vedle loga v PDF i název dodavatele" }
        branding_profiles_enabled: { type: boolean, description: "Zapíná volbu brandingových profilů; výchozí hodnota je false." }
        default_branding_profile_id: { type: [integer, "null"], readOnly: true }
        auto_send_reminders: { type: boolean }
        reminder_days_after_due: { type: integer, minimum: 1, maximum: 365 }

    SupplierFull:
      type: object
      description: |
        Kompletní data dodavatele (per-supplier konfigurace). Vrací `SELECT s.*`
        + odvozená pole. Bankovní účty NEJSOU součástí — jsou per-měna
        na `GET /api/settings/currencies`. (Pozn.: response obsahuje i další
        sloupce mimo tento výčet — branding, integrace, payment-thanks ap.)
      properties:
        id: { type: integer }
        company_name: { type: string }
        display_name: { type: [string, "null"] }
        street: { type: string }
        city: { type: string }
        zip: { type: string }
        country_id: { type: integer }
        country_iso: { type: string, description: "Odvozený ISO2 kód země" }
        ic: { type: [string, "null"] }
        dic: { type: [string, "null"] }
        is_vat_payer: { type: boolean, description: "Aktuální stav plátcovství DPH (derivovaná cache dneška); historie změn v `vat_status_history` (tabulka supplier_vat_status_history). Pro rozhodování k datu dokladu/období vždy použij historii, ne tento flag." }
        vat_status_history:
          type: array
          readOnly: true
          description: |
            Historie plátcovství DPH firmy (supplier_vat_status_history), vzestupně
            dle `effective_from`. Stav k datu D = poslední řádek s
            `effective_from <= D`. Zapisuje se přes `PUT /api/v1/settings/supplier`
            (`is_vat_payer` + volitelné `vat_status_effective_from`), tady je read-only.
          items:
            type: object
            properties:
              effective_from: { type: string, format: date, description: "Od kterého data stav platí" }
              is_vat_payer: { type: boolean }
              annual_deduction_percent: { type: [number, "null"], format: float, description: "Skutečný roční koeficient odpočtu §76 ZDPH; null = nepoužije se" }
        is_identified: { type: boolean, description: "Identifikovaná osoba (§ 6g–6l ZDPH, issue #94) — neplátce v tuzemsku s přeshraničními povinnostmi (RC faktury do EU, SHV, samovyměření bez odpočtu). Nelze kombinovat s is_vat_payer=true." }
        data_box_id: { type: [string, "null"] }
        data_box_type: { type: [string, "null"], enum: [FO, PFO, PO, OVM, null], description: "Druh datové schránky v ISDS; nesouvisí s typem poplatníka." }
        oss_enabled: { type: boolean }
        oss_valid_from: { type: [string, "null"], format: date }
        oss_valid_to: { type: [string, "null"], format: date }
        oss_identification_country: { type: [string, "null"], minLength: 2, maxLength: 2 }
        oss_return_currency: { type: string, minLength: 3, maxLength: 3, default: EUR }
        accounting_mode:
          type: string
          enum: [tax_evidence, double_entry]
          default: tax_evidence
          description: "Režim účetnictví firmy (Epic F0, migrace 1001): 'tax_evidence' = daňová evidence (výchozí), 'double_entry' = podvojné účetnictví. Lze měnit přes PUT /settings/supplier (admin)."
        accounting_mode_effective_from:
          type: string
          format: date
          description: "Účinnost změny režimu; musí připadat na 1. ledna. Přechod fyzické osoby z účetnictví na daňovou evidenci je povolen až po 5 po sobě jdoucích účetních obdobích (§ 4 odst. 7 ZoÚ)."
        commercial_register: { type: [string, "null"], description: "Spisová značka u rejstříkového soudu (doplňuje ARES enricher)" }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        web: { type: [string, "null"] }
        tagline: { type: [string, "null"] }
        default_currency_id: { type: integer }
        default_currency: { type: string, description: "Odvozený kód výchozí měny" }
        default_payment_due_days: { type: integer }
        default_payment_due_unit: { type: string, enum: [days, month] }
        default_hourly_rate: { type: number, format: float }
        default_prices_include_vat: { type: boolean, description: "Default pro nové doklady (migrace 0083)" }
        stock_enabled: { type: boolean, description: "Feature-flag Epic SKLAD — zapíná skladovou evidenci pro tohoto dodavatele." }
        stock_method:
          type: string
          enum: [B, A]
          default: B
          description: "Způsob účtování zásob (ČÚS 015). V1 vynuceně 'B' (service); 'A' schema-ready pro v2."
        stock_auto_issue: { type: boolean, default: true, description: "Automatická výdejka ze skladu při vystavení faktury (item se stock_item_id)." }
        stock_in_transit_from:
          type: string
          enum: [sent, confirmed]
          default: sent
          description: "Od kterého stavu objednávky se zboží počítá „na cestě\" (rozhodnutí #2). 'sent' = odeslaná objednávka je závazek; 'confirmed' = počítat až od potvrzení dodavatelem."
        invoice_number_format:
          type: [string, "null"]
          example: "{YY}{MM}{CCC}"
          description: "{YYYY}/{YY}, {MM}, {C..C} placeholders (viz SupplierUpdate). Per-supplier; null = globální cfg."
        proforma_number_format: { type: [string, "null"] }
        credit_note_number_format: { type: [string, "null"] }
        purchase_invoice_number_format: { type: [string, "null"] }
        invoice_number_period: { type: string, enum: [year, month, none], description: "Reset counteru číselných řad" }
        taxpayer_type: { type: [string, "null"], enum: [fo, po, null], description: "Fyzická / právnická osoba (EPO výkazy)" }
        vat_period: { type: [string, "null"], enum: [monthly, quarterly, null] }
        financial_office_code: { type: [string, "null"], description: "Kód FÚ pro EPO (= CRPDPH cisloFu)" }
        flat_tax_band: { type: string, enum: [none, band1, band2, band3], description: "Pásmo paušální daně" }
        email_branding_enabled: { type: boolean }
        email_accent_color: { type: string, example: "#3B2D83" }
        has_email_logo: { type: boolean }
        auto_send_reminders: { type: boolean }
        reminder_days_after_due: { type: integer, minimum: 1, maximum: 365, default: 3, description: "Per-dodavatel práh: po kolika dnech po splatnosti poslat první automatickou upomínku (migrace 0089). CLI --days ho přebije." }
        self_copy:
          type: [object, "null"]
          description: |
            Kopie odchozích e-mailů na e-mail dodavatele (migrace 0102).
            Klíče = typy zpráv, hodnoty off|cc|bcc. Chybějící klíč nebo null
            = fallback na globální cfg flagy (cc_supplier_on_*). Klíč
            `approvals` platí pro žádost o schválení i schvalovací upomínku.
          properties:
            documents: { type: string, enum: ["off", cc, bcc] }
            reminders: { type: string, enum: ["off", cc, bcc] }
            approvals: { type: string, enum: ["off", cc, bcc] }
          example: { documents: cc, approvals: bcc }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectsPagination:
      type: object
      properties:
        total:    { type: integer, example: 423 }
        page:     { type: integer, example: 1 }
        per_page: { type: integer, example: 50 }
        pages:    { type: integer, example: 9 }

    InvoicePayment:
      type: object
      description: "Evidovaná platba faktury / zálohové faktury (#89). N:1 — jedna faktura může mít víc plateb (splátky, více převodů, avíza)."
      properties:
        id: { type: integer, format: int64 }
        invoice_id: { type: integer, format: int64 }
        paid_on: { type: string, format: date }
        amount: { type: number, format: float, description: "Částka v měně faktury (> 0). U úplné FX úhrady jde o vypořádaný zbytek faktury; skutečnou částku a měnu bankovního pohybu nese navázaná BankTransaction." }
        currency: { type: string, example: CZK, description: "Denormalizovaný kód měny faktury v okamžiku platby" }
        variable_symbol: { type: [string, "null"] }
        bank_reference: { type: [string, "null"] }
        note: { type: [string, "null"] }
        source:
          type: string
          enum: [manual, mark_paid, bank, legacy]
          description: "manual = ruční záznam, mark_paid = zkratka „označit zaplaceno“, bank = bankovní párování (GPC i e-mailové avízo), legacy = backfill z dob před evidencí plateb"
        bank_transaction_id: { type: [integer, "null"], format: int64, description: "Vazba na bankovní transakci (taková platba se maže přes unmatch ve výpisu)" }
        bank_statement_id: { type: [integer, "null"], format: int64 }
        tax_document_invoice_id: { type: [integer, "null"], format: int64, description: "Daňový doklad k přijaté platbě vystavený k této platbě (jen u záloh)" }
        tax_document_varsymbol: { type: [string, "null"] }
        tax_document_status: { type: [string, "null"], enum: [draft, issued, sent, reminded, paid, cancelled, null] }
        created_by: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }

    InvoiceRelatedBankTransaction:
      type: object
      description: "Bankovní operace přímo spárovaná s fakturou. Bez odpovídajícího InvoicePayment se nezapočítává do paid_total."
      properties:
        id: { type: integer, format: int64 }
        statement_id: { type: integer, format: int64 }
        statement_source: { type: string, enum: [gpc, pdf, email_notice, idoklad] }
        posted_at: { type: string, format: date }
        amount: { type: number, format: float }
        currency: { type: [string, "null"] }
        variable_symbol: { type: [string, "null"] }
        constant_symbol: { type: [string, "null"] }
        specific_symbol: { type: [string, "null"] }
        counterparty_account: { type: [string, "null"] }
        counterparty_bank: { type: [string, "null"] }
        counterparty_name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        bank_ref: { type: [string, "null"] }
        match_status: { type: string, enum: [unmatched, auto_exact, auto_partial, manual, ignored] }

    InvoiceItem:
      type: object
      properties:
        id: { type: integer }
        invoice_id: { type: integer }
        description: { type: string }
        quantity: { type: number, format: float, description: "Může být záporné pro slevový řádek. Nesmí být 0." }
        unit: { type: string, example: ks }
        unit_price_without_vat: { type: number, format: float, description: "Jednotková cena bez DPH. Může být záporná pro slevový řádek." }
        vat_rate_id: { type: integer, description: "FK do /codebooks/vat-rates (kontextově k supplierovi)" }
        vat_rate_snapshot:
          type: number
          format: float
          example: 21
          description: "Snapshot procentní hodnoty DPH v okamžiku přidání položky (drží se i po případné změně sazby v číselníku)"
        vat_code: { type: [string, "null"], example: "STD", description: "Kód sazby ze snapshot-u (STD / RED1 / RED2 / ZERO / FREE)" }
        vat_label_cs: { type: [string, "null"], description: "Lokalizovaný název sazby (CS)" }
        vat_label_en: { type: [string, "null"], description: "Lokalizovaný název sazby (EN)" }
        vat_classification_code: { type: [string, "null"], example: "3", description: "Kód klasifikace plnění pro DPH přiznání / Kontrolní hlášení (default podle sazby + reverse charge + země klienta). U neplátce DPH bez významu." }
        total_without_vat: { type: number, format: float }
        total_vat: { type: number, format: float }
        total_with_vat: { type: number, format: float }
        item_kind:
          type: string
          enum: [standard, discount]
          default: standard
          description: "`discount` = systémově vygenerovaný záporný řádek „Sleva X %\" z `discount_percent` faktury (po sazbách DPH). Needituj ho ručně."
        order_index: { type: integer }
        linked_work_report_id: { type: [integer, "null"] }
        stock_item_id:
          type: [integer, "null"]
          description: "FK na skladovou kartu (Epic SKLAD) — řídí automatickou výdejku při vystavení faktury (supplier.stock_auto_issue)."
        warehouse_id:
          type: [integer, "null"]
          description: "FK na sklad (/api/stock/warehouses), ze kterého se položka vydává. Relevantní jen když je vyplněn stock_item_id."
        small_asset_id:
          type: [integer, "null"]
          description: "FK na kartu drobného majetku (/accounting/small-assets). Výnos řádku jde na 642 (small_asset.sale.revenue) a po vystavení faktury karta přejde do stavu `sold`."
        asset_id:
          type: [integer, "null"]
          description: "FK na kartu dlouhodobého majetku (/accounting/assets). Výnos řádku jde na 641 (asset.sale.revenue) a po vystavení faktury se karta vyřadí (type=sold) včetně doúčtování zůstatkové ceny 541/08x."
        small_asset_name: { type: [string, "null"], description: "Název navázané karty drobného majetku (read-only, z JOINu)." }
        asset_name: { type: [string, "null"], description: "Název navázané karty dlouhodobého majetku (read-only, z JOINu)." }
        oss_applicable: { type: boolean }
        oss_consumer_country: { type: [string, "null"], minLength: 2, maxLength: 2 }
        oss_rate_type: { type: [string, "null"], enum: [standard, reduced, second_reduced, parking, null] }
        oss_supply_type: { type: [string, "null"], enum: [goods, services, null] }
        oss_exchange_rate: { type: [number, "null"] }
        oss_exchange_rate_date: { type: [string, "null"], format: date }
        oss_taxable_amount_return: { type: [number, "null"] }
        oss_vat_amount_return: { type: [number, "null"] }
        oss_original_period: { type: [string, "null"], pattern: '^[0-9]{4}Q[1-4]$' }
        oss_needs_manual_review:
          type: boolean
          description: "Odvození při importu nedokázalo určit místo plnění (sazba platí v zemi dodavatele i ve státě spotřeby, nebo se číselník sazeb členských států nedal zeptat). Řádek JE v OSS, ale čeká na potvrzení člověkem. Chybí-li na instanci migrace 1293, pole se nevrací."

    InvoiceItemInput:
      type: object
      required: [description, quantity, unit_price_without_vat, vat_rate_id]
      properties:
        description: { type: string }
        quantity: { type: number, format: float, description: "Nesmí být 0. Může být záporné pro slevový řádek, ale ne současně se zápornou cenou." }
        unit: { type: string, default: "ks" }
        unit_price_without_vat: { type: number, format: float, description: "Jednotková cena BEZ DPH. Může být záporná pro slevový řádek, ale ne současně se záporným množstvím." }
        vat_rate_id: { type: integer, description: "FK do /codebooks/vat-rates (kontextově k supplierovi)" }
        order_index: { type: integer, description: "Pořadí v rámci faktury. Default = pozice v poli." }
        vat_classification_code: { type: [string, "null"], description: "Volitelný kód klasifikace plnění (DPH přiznání / KH). Když nevyplněno, server dopočítá default podle sazby + reverse charge + země klienta." }
        stock_item_id:
          type: [integer, "null"]
          description: "Vazba na skladovou kartu (Epic SKLAD). Když vyplněno, doporučeno vyplnit i warehouse_id."
        warehouse_id:
          type: [integer, "null"]
          description: "Sklad, ze kterého se má vydat (jen ve spojení se stock_item_id)."
        small_asset_id:
          type: [integer, "null"]
          description: "Prodávaná karta drobného majetku. Nesmí být vyplněná zároveň s `asset_id`; karta musí patřit téže firmě, být v užívání a nesmí být prodaná jinou fakturou (jinak 400 integrity_violation)."
        asset_id:
          type: [integer, "null"]
          description: "Prodávaná karta dlouhodobého majetku. Stejná pravidla jako u `small_asset_id`."
        oss_applicable: { type: boolean, default: false }
        oss_consumer_country: { type: [string, "null"], minLength: 2, maxLength: 2 }
        oss_rate_type: { type: [string, "null"], enum: [standard, reduced, second_reduced, parking, null] }
        oss_supply_type: { type: [string, "null"], enum: [goods, services, null] }
        oss_exchange_rate: { type: [number, "null"] }
        oss_exchange_rate_date: { type: [string, "null"], format: date }
        oss_taxable_amount_return: { type: [number, "null"] }
        oss_vat_amount_return: { type: [number, "null"] }
        oss_original_period: { type: [string, "null"], pattern: '^[0-9]{4}Q[1-4]$' }
        oss_needs_manual_review:
          type: boolean
          default: false
          description: "Round-trip příznaku „místo plnění systém neurčil\". Klient ho má poslat zpět v té podobě, v jaké ho dostal z detailu dokladu — uložení položek je DELETE + INSERT, takže co se nepošle, to se ztratí. Se sazbou nesouvisí a needituje se: server ho ignoruje (zapíše 0) u řádku s `oss_applicable: false`, protože vypnutí OSS je rozhodnutí člověka a nejistota tím končí."

    RecurringTemplate:
      type: object
      description: "Šablona pravidelné fakturace. Cron `bin/cron-generate-recurring-invoices.php` generuje faktury dle periodicity."
      properties:
        id: { type: integer }
        supplier_id: { type: integer }
        client_id: { type: integer }
        client_company_name: { type: string }
        project_id: { type: [integer, "null"] }
        project_name: { type: [string, "null"] }
        name: { type: string, description: "Display name pro admin (např. \"Hosting Acme s.r.o.\")" }
        frequency:
          type: string
          enum: [monthly, quarterly, semi_annually, annually]
        day_of_month:
          type: [integer, "null"]
          description: "1–28; pokud null a end_of_month=false, odvodí se z anchor_date"
        end_of_month:
          type: boolean
          description: "true = poslední den měsíce (28/29/30/31 dynamicky); přebíjí day_of_month"
        anchor_date: { type: string, format: date }
        end_date:    { type: [string, "null"], format: date }
        next_run_date: { type: string, format: date }
        last_run_date: { type: [string, "null"], format: date }
        invoice_type:
          type: string
          enum: [invoice, proforma]
        currency_id: { type: integer }
        currency: { type: string, example: CZK }
        language: { type: string, enum: [cs, en] }
        payment_method:
          type: string
          enum: [bank_transfer, direct_debit, card, cash, cash_on_delivery, offset, other]
        reverse_charge: { type: boolean }
        payment_due_days: { type: integer }
        discount_percent: { type: number, format: float, description: "Procentuální sleva (0–100) zděděná na každou vygenerovanou fakturu." }
        revenue_category_id:
          type: [integer, "null"]
          description: "Pevná kategorie tržby pro generované faktury (#119) — přebíjí fallback výchozí kategorie zakázky > zákazníka. NULL = fallback. Na fakturu se ukládá jako snapshot při generování."
        revenue_category_label: { type: [string, "null"], description: "Label kategorie (jen detail šablony)." }
        revenue_category_code: { type: [string, "null"], description: "Kód kategorie (jen detail šablony)." }
        draft_open_mode:
          type: string
          enum: [at_issue, period_start]
          description: "at_issue = koncept vznikne až v den vystavení; period_start = koncept se otevře na začátku období (průběžný výkaz víceprací) a vystaví se na konci."
        reminder_days_before: { type: integer, description: "0–14; připomenutí konceptu N dní před vystavením (0 = vypnuto; jen pro period_start)." }
        note_above_items: { type: [string, "null"] }
        note_below_items: { type: [string, "null"] }
        increment_month_in_descriptions:
          type: boolean
          description: "Posun M/YYYY v popiscích položek (např. „Hosting 3/2026\" → „Hosting 4/2026\"). Pro frequency != monthly se posouvá o odpovídající počet měsíců."
        auto_issue:
          type: boolean
          description: "true = cron rovnou vystaví (varsymbol + snapshot, status=issued); false = nechá draft"
        auto_send_email:
          type: boolean
          description: "true = po vystavení rovnou odešle klientovi; vyžaduje auto_issue=true"
        status:
          type: string
          enum: [active, paused, expired]
        invoices_generated_count: { type: integer }
        last_error: { type: [string, "null"], description: "Poslední chyba generování (cron) — UI ji ukáže jako banner u šablony; vyčistí se po úspěšném ručním běhu." }
        last_error_at: { type: [string, "null"], format: date-time }
        created_at: { type: string }
        updated_at: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              description: { type: string }
              quantity: { type: number, format: float, description: "Může být záporné pro slevový řádek. Nesmí být 0." }
              unit: { type: string }
              unit_price_without_vat: { type: number, format: float, description: "Může být záporná pro slevový řádek." }
              vat_rate_id: { type: integer }
              vat_rate_percent: { type: number, format: float }
              order_index: { type: integer }
              oss_applicable:
                type: boolean
                description: "Uložené rozhodnutí „tenhle řádek se na vygenerované faktuře vykáže v OSS\". Chybí-li na instanci migrace 1297, pole se nevrací."
              oss_consumer_country: { type: [string, "null"], minLength: 2, maxLength: 2 }
              oss_rate_type: { type: [string, "null"], enum: [standard, reduced, second_reduced, parking, null] }
              oss_supply_type: { type: [string, "null"], enum: [goods, services, null] }

    RecurringTemplateInput:
      type: object
      required: [client_id, name, frequency, anchor_date, currency_id, items]
      properties:
        client_id: { type: integer }
        project_id: { type: [integer, "null"] }
        name: { type: string, maxLength: 200 }
        frequency:
          type: string
          enum: [monthly, quarterly, semi_annually, annually]
        day_of_month:
          type: [integer, "null"]
          minimum: 1
          maximum: 28
        end_of_month: { type: boolean, default: false }
        anchor_date: { type: string, format: date }
        end_date:    { type: [string, "null"], format: date }
        invoice_type:
          type: string
          enum: [invoice, proforma]
          default: invoice
        currency_id: { type: integer }
        language: { type: string, enum: [cs, en], default: cs }
        payment_method:
          type: string
          enum: [bank_transfer, direct_debit, card, cash, cash_on_delivery, offset, other]
          default: bank_transfer
        reverse_charge: { type: boolean, default: false }
        payment_due_days: { type: integer, default: 14 }
        discount_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 0
          description: "Procentuální sleva z celé faktury (0–100); zdědí ji každá vygenerovaná faktura (materializuje se jako záporná položka „Sleva X %\")."
        revenue_category_id:
          type: [integer, "null"]
          description: "Pevná kategorie tržby pro generované faktury (#119). Musí existovat a patřit dodavateli šablony. NULL/vynecháno = fallback výchozí kategorie zakázky > zákazníka při generování."
        draft_open_mode:
          type: string
          enum: [at_issue, period_start]
          default: at_issue
          description: "period_start (koncept na začátku období → vystavení na konci) vyžaduje auto_issue=true."
        tax_date_mode:
          type: string
          enum: [same_as_issue, previous_month_last_day]
          default: same_as_issue
          description: "DUZP vygenerované faktury: stejné jako datum vystavení, nebo poslední den předchozího měsíce."
        reminder_days_before:
          type: integer
          minimum: 0
          maximum: 14
          default: 1
          description: |
            Připomenutí konceptu N dní před vystavením (jen `draft_open_mode=period_start`;
            0 = vypnuto). Vynecháte-li pole, uloží se **1**, ne 0 — hodnota mimo rozsah
            se ořízne do 0–14.
        note_above_items: { type: [string, "null"] }
        note_below_items: { type: [string, "null"] }
        increment_month_in_descriptions:
          type: boolean
          default: false
          description: "Vynechané pole se ukládá jako `false`, ne `true`."
        auto_issue:
          type: boolean
          default: false
          description: |
            Vynechané pole se ukládá jako `false` — šablona pak jen zakládá koncepty
            a nic sama nevystaví. Chcete-li automatické vystavení, pošlete `true` výslovně.
        auto_send_email:
          type: boolean
          default: false
          description: "Vynechané pole se ukládá jako `false`. Vyžaduje `auto_issue=true`."
        items:
          type: array
          items:
            type: object
            required: [description, quantity, unit_price_without_vat, vat_rate_id]
            properties:
              description: { type: string }
              quantity: { type: number, format: float, description: "Nesmí být 0. Může být záporné pro slevový řádek, ale ne současně se zápornou cenou." }
              unit: { type: string, default: ks }
              unit_price_without_vat: { type: number, format: float, description: "Může být záporná pro slevový řádek, ale ne současně se záporným množstvím." }
              vat_rate_id: { type: integer }
              order_index: { type: integer }
              oss_applicable:
                type: boolean
                default: false
                description: "Uložené OSS rozhodnutí pro řádek generované faktury. Při generování má přednost před automatickým odvozením — s jedinou výjimkou: nemá-li dodavatel k datu plnění generovaného dokladu platnou registraci do OSS, rozhodnutí se nepoužije, řádek zůstane tuzemský a dostane `oss_needs_manual_review`. Uložení položek je DELETE + INSERT, takže co se nepošle, to se ztratí."
              oss_consumer_country:
                type: [string, "null"]
                minLength: 2
                maxLength: 2
                description: "Stát spotřeby (ISO2). Povinný pro `oss_applicable: true` — bez něj server řádek uloží jako NE-OSS (`oss_applicable: false`), protože takovou položku by cron při každém běhu vyrobil neplatnou."
              oss_rate_type:
                type: [string, "null"]
                enum: [standard, reduced, second_reduced, parking, null]
                description: "NULL je legitimní stav; při generování se ho pokusí doplnit odvození, ale jedině když mluví o TÉŽE zemi spotřeby."
              oss_supply_type:
                type: [string, "null"]
                enum: [goods, services, null]
                description: "NULL = doplní se při generování (odvození, jinak „services\")."

    # ========================================================================
    # Purchase invoices (přijaté faktury) — fáze 1 integrace forku
    # ========================================================================
    PurchaseInvoiceListItem:
      type: object
      properties:
        id: { type: integer }
        supplier_id: { type: integer }
        vendor_id: { type: integer }
        varsymbol: { type: [string, "null"], description: "Naše interní číslo PF-YYYYMM-NNNN" }
        vendor_invoice_number: { type: string }
        document_kind: { type: string, enum: [invoice, receipt, credit_note, advance, tax_document] }
        issue_date: { type: string, format: date }
        tax_date: { type: [string, "null"], format: date, description: "DUZP" }
        due_date: { type: string, format: date }
        received_at: { type: string, format: date }
        currency_id: { type: integer }
        currency: { type: string }
        total_without_vat: { type: number }
        total_vat: { type: number }
        total_with_vat: { type: number }
        advance_paid_amount: { type: number }
        amount_to_pay: { type: number, description: "Generated column = total_with_vat - advance_paid_amount" }
        exchange_rate: { type: [number, "null"] }
        exchange_rate_date: { type: [string, "null"], format: date }
        status: { type: string, enum: [draft, received, booked, paid, cancelled] }
        booked_at: { type: [string, "null"], format: date-time }
        paid_at: { type: [string, "null"], format: date }
        cancelled_at: { type: [string, "null"], format: date-time }
        vat_deduction: { type: string, enum: [full, none, proportional, reduced] }
        vat_deduction_percent: { type: number, format: float }
        tax_deductible: { type: boolean }
        extraction_warning: { type: [string, "null"] }
        currency_symbol: { type: string }
        vendor_company_name: { type: string }
        vendor_ic: { type: [string, "null"] }
        month_bucket: { type: string, example: "2026-05" }
        has_small_asset:
          type: boolean
          description: "§DM — aspoň jedna položka dokladu má expense_kind='small_asset' (drobný majetek). Jen v seznamu, v detailu se odvozuje z items[]."

    PurchaseInvoiceItem:
      type: object
      properties:
        id: { type: integer }
        purchase_invoice_id: { type: integer }
        description: { type: string }
        quantity: { type: number }
        unit: { type: string }
        unit_price_without_vat: { type: number }
        vat_rate_id: { type: integer }
        vat_rate_snapshot: { type: number }
        total_without_vat: { type: number }
        total_vat: { type: number }
        total_with_vat: { type: number }
        order_index: { type: integer }
        vat_code: { type: [string, "null"], description: "Kód sazby ze snapshot-u (STD / RED1 / …)" }
        vat_label_cs: { type: [string, "null"] }
        vat_label_en: { type: [string, "null"] }
        vat_classification_code:
          type: [string, "null"]
          description: "MFČR kód pro DPH/KH (připraveno pro fázi 6)"
        expense_kind:
          type: [string, "null"]
          enum: [service, material, small_asset, fixed_asset, null]
          description: |
            §DM — druh nákladu na řádku. Řídí nákladový účet i evidenci majetku:
            service → 518, material (vč. PHM) → 501, small_asset → 501 + karta drobného
            majetku, fixed_asset → 042 + odpisy. NULL = neurčeno (chová se jako dosud → 518).
            Autoritativní vůči `is_fixed_asset`, který se z něj odvozuje.
            Návrhy vrací `GET /accounting/purchase-invoices/{id}/expense-suggestions`;
            zapisuje je vždy až uživatel, nikdy klasifikátor ani AI import.
        is_fixed_asset:
          type: boolean
          default: false
          description: |
            Řádek je za dlouhodobý majetek (§ 4 odst. 4 písm. c — vozidlo, stroj, ...).
            Per-řádek override umožňuje mixed doklady (pár položek majetek, zbytek běžné).
            Pokud je nastaveno na řádku, vyhrává nad `PurchaseInvoice.is_fixed_asset` (header).
            Hodnota se na DPHDP3 navíc uvede na ř. 47 (`nar_maj`).
        stock_item_id:
          type: [integer, "null"]
          description: "FK na skladovou kartu (Epic SKLAD). NULL = volný text/služba, bez vazby na sklad."
        stock_sku: { type: [string, "null"], description: "SKU navázané skladové karty (jen pro zobrazení, denormalizováno)" }
        stock_name: { type: [string, "null"], description: "Název navázané skladové karty (jen pro zobrazení, denormalizováno)" }
        small_asset:
          type: [object, "null"]
          description: "Karta drobného majetku vzniklá z téhle položky (§DM), pokud existuje — jen pro zobrazení (proklik + nabídka vyřazení prodejem)."
          properties:
            id: { type: integer }
            name: { type: string }
            status: { type: string, enum: [in_use, disposed, sold] }

    PurchaseInvoiceItemPayload:
      type: object
      required: [description, quantity, unit_price_without_vat, vat_rate_id]
      properties:
        description: { type: string }
        quantity: { type: number }
        unit: { type: string, default: ks }
        unit_price_without_vat: { type: number }
        vat_rate_id: { type: integer }
        order_index: { type: integer }
        vat_classification_code: { type: [string, "null"] }
        is_fixed_asset: { type: boolean, default: false }
        stock_item_id:
          type: [integer, "null"]
          description: |
            Volitelná vazba na skladovou kartu (Epic SKLAD) — jen naznačuje kartu pro
            předvyplnění příjemkového wizardu; skutečný pohyb dělá až příjemka
            (POST /api/purchase-invoices/{id}/stock-receipt). Musí patřit stejnému
            dodavateli, jinak se tiše ignoruje (uloží se NULL).

    AiAssistSettings:
      type: object
      required: [enabled, scope, provider, provider_label, data_region, dpa_confirmed, embedding_available, knn_warm, muted_sources, daily_limit, today_used]
      properties:
        enabled: { type: boolean }
        scope:
          type: array
          items: { type: string, enum: [bank_tx, purchase_invoices] }
        provider: { type: string, enum: [anthropic, azure_openai, openai, gemini] }
        provider_label: { type: string }
        data_region: { type: string, enum: [us, eu] }
        dpa_confirmed:
          type: object
          additionalProperties:
            type: [string, "null"]
            format: date-time
        embedding_available: { type: boolean }
        knn_warm:
          type: object
          properties:
            bank_transaction: { type: boolean }
            purchase_invoice: { type: boolean }
            labels:
              type: object
              properties:
                bank_transaction: { type: integer, minimum: 0 }
                purchase_invoice: { type: integer, minimum: 0 }
        muted_sources:
          type: array
          items:
            type: object
            properties:
              source: { type: string, enum: [knn, llm] }
              muted_at: { type: string, format: date-time }
              reason: { type: object, additionalProperties: true }
        daily_limit: { type: integer, minimum: 0 }
        today_used: { type: integer, minimum: 0 }

    AiPostingSuggestion:
      type: object
      required: [id, entity_type, entity_id, source, payload, confidence, status]
      properties:
        id: { type: integer, format: int64 }
        entity_type: { type: string, enum: [purchase_invoice, invoice, cash_transaction] }
        entity_id: { type: integer, format: int64 }
        source: { type: string, enum: [knn, llm] }
        payload:
          type: object
          properties:
            debit_account_code: { type: string }
            credit_account_code: { type: [string, "null"] }
            expense_category_id: { type: [integer, "null"] }
        confidence: { type: number, minimum: 0, maximum: 0.4 }
        reasoning: { type: [string, "null"] }
        status: { type: string, enum: [pending, accepted, rejected, superseded, expired] }
        created_at: { type: string, format: date-time }

    PurchaseInvoice:
      type: object
      properties:
        id: { type: integer }
        supplier_id: { type: integer }
        vendor_id: { type: integer }
        varsymbol: { type: [string, "null"] }
        vendor_invoice_number: { type: string }
        document_kind: { type: string, enum: [invoice, receipt, credit_note, advance, tax_document] }
        advance_purchase_invoice_id: { type: [integer, "null"], description: "FK na zálohovou fakturu, kterou tento doklad vyúčtovává (párování zálohy)" }
        advance_link_suggested_id: { type: [integer, "null"], description: "AI/auto návrh na propojení zálohy (čeká na potvrzení)" }
        issue_date: { type: string, format: date }
        tax_date: { type: [string, "null"], format: date }
        due_date: { type: string, format: date }
        received_at: { type: string, format: date }
        received_at_source: { type: string, enum: [manual, import], description: "Odkud pochází datum přijetí. 'manual' = zadal ho uživatel → vstupuje do období odpočtu (§ 73 odst. 1 písm. a ZDPH); 'import' = jen otisk dne importu / AI extrakce → do zařazení se nepočítá. Překlápí se až SKUTEČNOU změnou pole, ne pouhým přeuložením dokladu." }
        prices_include_vat: { type: boolean, description: "Ceny položek zadané včetně DPH (migrace 0083)" }
        expense_category_id: { type: [integer, "null"], description: "FK do /expense-categories — kategorie nákladu pro CRM/dashboard" }
        expense_category_label: { type: [string, "null"] }
        expense_category_code: { type: [string, "null"] }
        ai_posting_suggestion:
          allOf:
            - $ref: '#/components/schemas/AiPostingSuggestion'
          type: [object, "null"]
        currency_id: { type: integer }
        currency: { type: string }
        currency_symbol: { type: string }
        exchange_rate: { type: [number, "null"] }
        exchange_rate_date: { type: [string, "null"], format: date }
        exchange_rate_source:
          type: string
          enum: [cnb, manual, idoklad, fakturoid, fixed, import, user]
          description: |
            Kdo kurz nastavil. Rozhoduje o tom, jestli ho smí přepsat automatické
            přenačtení po změně rozhodného data (DUZP, s fallbackem na vystavení) nebo měny:
            `cnb` a `fixed` (pevný kurz období § 24/7) jsou odvozené z data → přenačtou se;
            `import` (kurz z dokladu dodavatele nebo cizího systému) a `user` (člověk zadal
            kurz ve formuláři) se nepřepisují. `manual` je DEPRECATED — znamená „neznámý /
            historický zápis" a chová se jako `import`; `idoklad`/`fakturoid` jsou
            DEPRECATED a nikdy se nezapsaly.
        reverse_charge: { type: boolean }
        cash_register_id:
          type: [integer, "null"]
          description: |
            Hotovostní vyrovnání (migrace 1327): pokladna, ze které se faktura hradí,
            je-li forma úhrady „Hotově". Při přijetí dokladu (a při každém uložení)
            z ní vznikne zaúčtovaný výdajový pokladní doklad navázaný na tuto fakturu
            a faktura přejde na `paid`; NULL doklad zase zruší. Koncept se nevyrovnává.
        vat_deduction:
          type: string
          enum: [full, none, proportional, reduced]
          default: full
          description: |
            Nárok na odpočet DPH. `none` = faktura NEvstupuje do Knihy DPH ani do
            DPHDP3 / KH (jen účetní náklad). `proportional` = krácený / poměrný odpočet
            (§75) — odpočet (základ i daň) se zkrátí o `vat_deduction_percent`.
        vat_deduction_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 100
          description: "Procento odpočtu při `vat_deduction='proportional'` (§75). Pro full/none se ignoruje (drží 100)."
        tax_deductible:
          type: boolean
          default: true
          description: "Daňová uznatelnost nákladu pro daň z příjmů (DPFO/DPPO); false = nezahrne se do nákladů. Nezávislé na DPH."
        is_fixed_asset:
          type: boolean
          default: false
          description: |
            Doklad je za dlouhodobý majetek (§ 4 odst. 4 písm. c) — vozidlo, stroj.
            Header flag pro celý doklad. Pro mixed doklady (část majetek, část běžné
            náklady) použij per-řádek `PurchaseInvoiceItem.is_fixed_asset`.

            Když je nastaveno a doklad jde do odpočtu na ř. 40-45 DPHDP3 (přímo
            nebo přes ř. 43 RC mirror), hodnota se navíc uvede na ř. 47 jako
            doplňující údaj (`nar_maj`).
        language: { type: string, enum: [cs, en] }
        note_above_items: { type: [string, "null"] }
        note_below_items: { type: [string, "null"] }
        vendor_snapshot:
          type: object
          description: Immutable JSON snapshot vendor row at time of receipt
        own_snapshot: { type: [object, "null"] }
        total_without_vat: { type: number }
        total_vat: { type: number }
        total_with_vat: { type: number }
        rounding: { type: number }
        advance_paid_amount: { type: number }
        amount_to_pay: { type: number }
        payment_currency_id: { type: [integer, "null"] }
        payment_exchange_rate: { type: [number, "null"] }
        paid_amount_payment_ccy: { type: [number, "null"] }
        paid_amount_invoice_ccy: { type: [number, "null"] }
        exchange_diff_base:
          type: [number, "null"]
          description: "FX gain/loss v base ccy (CZK)"
        payment_method:
          type: string
          enum: [bank_transfer, direct_debit, card, cash, cash_on_delivery, offset, other]
          default: bank_transfer
          description: |
            Forma úhrady (migrace 1128). **Pozor na `direct_debit` (inkaso/SIPO):**
            peníze si strhne dodavatel sám, takže se na takovou fakturu NESMÍ vystavit
            platební příkaz — jinak zaplatíte dvakrát. Z dokladu to poznat nejde
            (inkasní faktura má číslo účtu, VS i KS stejně jako převodní), proto je to
            samostatný atribut. Výběr do platebních příkazů bere jen `bank_transfer`.
        payment_method_source:
          type: string
          enum: [default, vendor, ai, manual]
          default: default
          description: |
            Kdo hodnotu nastavil — řídí, kdo ji smí přepsat:
            `manual` > `ai` > `vendor` > `default`. Automatika (AI extrakce, předvolba
            dodavatele) tedy nikdy nepřepíše rozhodnutí účetní; stejná úroveň přepsat smí.
        status: { type: string, enum: [draft, received, booked, paid, cancelled] }
        booked_at: { type: [string, "null"], format: date-time }
        paid_at: { type: [string, "null"], format: date }
        cancelled_at: { type: [string, "null"], format: date-time }
        pdf_path:
          type: [string, "null"]
          description: "Relative path within archive_storage"
        pdf_hash: { type: [string, "null"], description: "SHA-256 hex" }
        pdf_size_bytes: { type: [integer, "null"] }
        pdf_original_name: { type: [string, "null"] }
        pdf_uploaded_at: { type: [string, "null"], format: date-time }
        source_path: { type: [string, "null"], description: "Relative path to machine-readable source artifact within archive_storage (sources/ subtree)" }
        source_hash: { type: [string, "null"], description: "SHA-256 hex of source artifact" }
        source_size_bytes: { type: [integer, "null"] }
        source_original_name: { type: [string, "null"] }
        source_format: { type: [string, "null"], enum: [isdoc, isdocx, pdf, pohoda_xml, idoklad_json, fakturoid_json, null], description: "Format of the archived authoritative source document" }
        source_uploaded_at: { type: [string, "null"], format: date-time }
        vat_classification_code: { type: [string, "null"] }
        vat_overrides:
          type: [array, "null"]
          description: "Per-sazba override rekapitulace DPH (§73; migrace 0086). Zapéká se do řádkových totálů."
          items:
            type: object
            properties:
              rate: { type: number }
              base: { type: number }
              vat:  { type: number }
        vat_allocations:
          type: array
          description: "Volitelné rozdělení rekapitulace DPH na odpočtové a účetní režimy; prázdné pole zachovává hlavičkové nastavení."
          items: { $ref: '#/components/schemas/PurchaseVatAllocation' }
        extraction_warning: { type: [string, "null"], description: "Varování z AI/automatické extrakce dokladu (rozdíl součtů apod.)" }
        idoklad_id: { type: [integer, "null"], description: "ID v iDoklad (jen u importovaných)" }
        fakturoid_id: { type: [integer, "null"], description: "ID ve Fakturoid (jen u importovaných)" }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        vendor_company_name: { type: string }
        vendor_ic: { type: [string, "null"] }
        vendor_dic: { type: [string, "null"] }
        vendor_main_email: { type: [string, "null"] }
        linked_advance:
          type: [object, "null"]
          description: "Brief zálohy, kterou tento doklad vyúčtovává ({ id, varsymbol, document_kind, status, total_with_vat, currency })"
        advance_link_suggestion: { type: [object, "null"], description: "Brief AI-navržené zálohy k propojení" }
        settled_by: { type: [object, "null"], description: "Jen u zálohy — brief finální faktury, která ji vyúčtovává" }
        has_advance_candidates: { type: boolean }
        has_settlement_candidates: { type: boolean }
        unsettled_notice:
          type: [object, "null"]
          description: |
            Jen u zálohy/samostatného DDKP bez vyúčtování: na 314 je otevřený zůstatek a od
            stejného dodavatele existuje pravděpodobná nespárovaná faktura. `remaining_vat_on_343`
            je vyplněné jen u DDKP — kolik DPH kandidátní faktury zbývá doúčtovat na 343 nad
            rámec už uplatněné DPH z DDKP.
          properties:
            paid_amount: { type: number }
            candidate:
              type: object
              properties:
                id: { type: integer }
                varsymbol: { type: [string, "null"] }
                vendor_invoice_number: { type: [string, "null"] }
                total_with_vat: { type: number }
            remaining_vat_on_343: { type: [number, "null"] }
            message: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PurchaseInvoiceItem' }
        vat_breakdown:
          type: array
          items:
            type: object
            properties:
              vat_rate: { type: number }
              without_vat: { type: number }
              vat: { type: number }
              with_vat: { type: number }
        totals:
          type: object
          properties:
            without_vat: { type: number }
            vat: { type: number }
            with_vat: { type: number }
            rounding: { type: number }
            advance_paid_amount: { type: number }
            amount_to_pay: { type: number }
        _warnings:
          type: array
          items: { type: string }
          description: "Jen v odpovědi POST/PUT — non-blocking varování (credit_note_positive_total, vendor_non_payer_deduction, vendor_unreliable_payer — CRPDPH nespolehlivý plátce, audit 2026-07), uložení neblokují."

    PurchaseVatAllocation:
      type: object
      required: [description, usage_type, vat_rate, base_amount, vat_amount, total_amount, vat_deduction, vat_deduction_percent, tax_treatment, account_code, order_index]
      properties:
        id: { type: integer, readOnly: true }
        description: { type: string, maxLength: 190 }
        usage_type: { type: string, enum: [business, personal, mixed, non_deductible] }
        vat_rate: { type: number, format: float }
        base_amount: { type: number }
        vat_amount: { type: number }
        total_amount: { type: number }
        vat_deduction: { type: string, enum: [full, none, proportional, reduced] }
        vat_deduction_percent: { type: number, minimum: 0, maximum: 100 }
        tax_treatment: { type: string, enum: [deductible, non_deductible, not_expense] }
        account_code: { type: string, maxLength: 10 }
        vat_classification_code: { type: [string, "null"] }
        order_index: { type: integer }

    PurchaseInvoicePayload:
      type: object
      required: [vendor_id, vendor_invoice_number, issue_date, due_date, currency_id, items]
      properties:
        vendor_id: { type: integer }
        vendor_invoice_number: { type: string, maxLength: 50 }
        varsymbol: { type: [string, "null"], maxLength: 20 }
        document_kind: { type: string, enum: [invoice, receipt, credit_note, advance, tax_document], default: invoice }
        issue_date: { type: string, format: date }
        tax_date: { type: [string, "null"], format: date }
        due_date: { type: string, format: date }
        received_at: { type: string, format: date }
        payment_method:
          type: string
          enum: [bank_transfer, direct_debit, card, cash, cash_on_delivery, offset, other]
          description: |
            Forma úhrady — viz `PurchaseInvoice.payment_method`. Když pole nepošlete,
            server hodnotu odvodí z předvolby dodavatele (`clients.default_payment_method`),
            jinak `bank_transfer`. Neplatná hodnota se ignoruje (pole se nezapíše).
            **Nastavte `direct_debit` u inkasa/SIPO**, jinak doklad spadne do platebního
            příkazu a zaplatí se podruhé.
        payment_method_source:
          type: string
          enum: [default, vendor, ai, manual]
          default: manual
          description: |
            Kdo hodnotu nastavuje. Nepošlete-li ho spolu s `payment_method`, zapíše se
            `manual` — tedy nejsilnější zdroj, který už automatika nepřepíše. Slabší
            zdroj (`ai`, `vendor`) hodnotu nastavenou ručně nepřepíše.
        currency_id: { type: integer }
        exchange_rate: { type: [number, "null"] }
        exchange_rate_date: { type: [string, "null"], format: date }
        exchange_rate_source:
          type: string
          enum: [cnb, manual, idoklad, fakturoid, fixed, import, user]
          default: manual
          description: |
            Kdo kurz nastavil — viz `PurchaseInvoice.exchange_rate_source`. Když pole
            nepošlete, uloží se `manual` („neznámý původ"), takže automatické přenačtení
            kurzu po změně rozhodného data doklad NEpřepíše. Chcete-li přenačítání povolit,
            pošlete `cnb`. Při aktualizaci dokladu (PUT) se sloupec zapisuje jen tehdy,
            když je pole v těle přítomné — jinak zůstává uložená hodnota.
        reverse_charge: { type: boolean, default: false }
        prices_include_vat: { type: boolean, default: false, description: "Ceny položek zadané včetně DPH (DPH shora koeficientem)." }
        expense_category_id: { type: [integer, "null"], description: "Kategorie nákladu. Když chybí, na create se odvodí z default kategorie dodavatele." }
        cash_register_id:
          type: [integer, "null"]
          description: |
            Hotovostní vyrovnání (migrace 1327) — pokladna, ze které se faktura hradí;
            dává smysl jen s `payment_method = cash`. Zapisuje se jen když je klíč
            v těle přítomen. Výdajový pokladní doklad vznikne až u nekonceptu; NULL
            volbu (a dřív založený pokladní doklad) zruší.
        vat_overrides:
          type: [array, "null"]
          description: "Per-sazba override rekapitulace DPH (§73). Zapisuje se jen když je klíč přítomen; zapéká se do řádkových totálů."
          items:
            type: object
            properties:
              rate: { type: number }
              base: { type: number }
              vat:  { type: number }
        vat_allocations:
          type: array
          description: "Účetní alokace celé rekapitulace; součty musí po sazbách přesně odpovídat dokladu. [] alokace zruší."
          items: { $ref: '#/components/schemas/PurchaseVatAllocation' }
        rounding: { type: number, description: "Jen PUT — zaokrouhlení dokladu; zapisuje se jen když je klíč přítomen." }
        vat_deduction: { type: string, enum: [full, none, proportional, reduced], default: full, description: "Nárok na odpočet DPH (none → mimo Knihu DPH/DPHDP3/KH; proportional → poměrný §75; reduced → krácený §76)." }
        vat_deduction_percent: { type: number, format: float, minimum: 0, maximum: 100, default: 100, description: "Procento odpočtu pro proportional (§75)." }
        tax_deductible: { type: boolean, default: true, description: "Daňová uznatelnost pro daň z příjmů (nezávislé na DPH)." }
        is_fixed_asset:
          type: boolean
          default: false
          description: "Doklad za dlouhodobý majetek — propíše se do ř. 47 DPHDP3 jako doplňující údaj."
        language: { type: string, enum: [cs, en], default: cs }
        note_above_items: { type: [string, "null"] }
        note_below_items: { type: [string, "null"] }
        advance_paid_amount: { type: number, default: 0 }
        payment_currency_id: { type: [integer, "null"] }
        payment_exchange_rate: { type: [number, "null"] }
        paid_amount_payment_ccy: { type: [number, "null"] }
        paid_amount_invoice_ccy: { type: [number, "null"] }
        exchange_diff_base: { type: [number, "null"] }
        vat_classification_code: { type: [string, "null"] }
        items:
          type: array
          items: { $ref: '#/components/schemas/PurchaseInvoiceItemPayload' }

