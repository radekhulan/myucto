        '400': { description: Neplatný typ/rok/variant }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Build XML selhal }

  /api/v1/tax-return/advances/upcoming:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [TaxReturn]
      summary: Nadcházející zálohy na daň a pojistné napříč roky (E9)
      responses:
        '200': { description: "OK {schedules}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/tax-return/{type}/{year}/advances:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: type, required: true, schema: { type: string, enum: [fo, po] } }
      - { in: path, name: year, required: true, schema: { type: integer } }
      - { in: query, name: variant, schema: { type: string, enum: [radne, opravne, dodatecne], default: radne } }
      - { in: query, name: seq, schema: { type: integer, minimum: 0, default: 0 } }
    get:
      tags: [TaxReturn]
      summary: Předpisy záloh na daň a pojistné za rok
      responses:
        '200': { description: "OK {schedules}", content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok/variant }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/tax-return/{type}/{year}/advances/generate:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: type, required: true, schema: { type: string, enum: [fo, po] } }
      - { in: path, name: year, required: true, schema: { type: integer } }
    post:
      tags: [TaxReturn]
      summary: Vygeneruje předpisy záloh z finalizovaného přiznání
      responses:
        '200': { description: "OK {generated_count}", content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Přiznání není finalizované / předpisy už existují, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/tax-return/{type}/{year}/advances/match:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: type, required: true, schema: { type: string, enum: [fo, po] } }
      - { in: path, name: year, required: true, schema: { type: integer } }
    post:
      tags: [TaxReturn]
      summary: Spáruje bankovní platby s předpisy záloh
      responses:
        '200': { description: "OK {matched_count}", content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Nelze spárovat (chybí předpisy), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/tax-return/{type}/{year}/advances/generate-period:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: type, required: true, schema: { type: string, enum: [fo, po] } }
      - { in: path, name: year, required: true, schema: { type: integer } }
    post:
      tags: [TaxReturn]
      summary: Vygeneruje předpisy záloh pro tento rok (z draftu min. roku / rozhodnutí FÚ)
      description: "#42 — použije se, dokud není přiznání předchozího roku finalizované."
      responses:
        '200': { description: "OK {generated_count}", content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Předpisy pro rok už existují, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/tax-return/{type}/{year}/advances/overrides:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: type, required: true, schema: { type: string, enum: [fo, po] } }
      - { in: path, name: year, required: true, schema: { type: integer } }
    get:
      tags: [TaxReturn]
      summary: Globální přehled rozhodnutí FÚ (§174) napříč roky
      description: "#46 — id-based CRUD s rozsahem OD-DO, globální tabulka nezávislá na `year` v cestě."
      responses:
        '200': { description: "OK {overrides}", content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [TaxReturn]
      summary: Vytvoří rozhodnutí FÚ (§174) s rozsahem OD-DO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valid_from, valid_to, amount]
              properties:
                valid_from: { type: string, format: date }
                valid_to: { type: string, format: date }
                amount: { type: number }
                reason: { type: [string, "null"] }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/tax-return/{type}/{year}/advances/overrides/{overrideId}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: type, required: true, schema: { type: string, enum: [fo, po] } }
      - { in: path, name: year, required: true, schema: { type: integer } }
      - { in: path, name: overrideId, required: true, schema: { type: integer } }
    put:
      tags: [TaxReturn]
      summary: Upraví rozhodnutí FÚ (§174) podle ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                valid_from: { type: string, format: date }
                valid_to: { type: string, format: date }
                amount: { type: number }
                reason: { type: [string, "null"] }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [TaxReturn]
      summary: Smaže rozhodnutí FÚ (§174) podle ID
      responses:
        '200': { description: "OK {deleted: true}", content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tax-return/{type}/{year}/advances/confirm-all:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: type, required: true, schema: { type: string, enum: [fo, po] } }
      - { in: path, name: year, required: true, schema: { type: integer } }
    post:
      tags: [TaxReturn]
      summary: Hromadně potvrdí úhradu všech záloh roku
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: [string, "null"], description: "Volitelný filtr druhu zálohy (daň / pojistné)" }
      responses:
        '200': { description: "OK {confirmed_count}", content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Některé zálohy nelze potvrdit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/tax-return/{type}/{year}/advances/{scheduleId}/amount:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: type, required: true, schema: { type: string, enum: [fo, po] } }
      - { in: path, name: year, required: true, schema: { type: integer } }
      - { in: path, name: scheduleId, required: true, schema: { type: integer } }
    post:
      tags: [TaxReturn]
      summary: Ručně upraví předepsanou výši zálohy (jen nezaplacené)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Záloha je už potvrzená, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/tax-return/{type}/{year}/advances/{scheduleId}/confirm:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: type, required: true, schema: { type: string, enum: [fo, po] } }
      - { in: path, name: year, required: true, schema: { type: integer } }
      - { in: path, name: scheduleId, required: true, schema: { type: integer } }
    post:
      tags: [TaxReturn]
      summary: Ručně potvrdí úhradu zálohy (bez párování s bankou)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: [number, "null"] }
                paid_on: { type: [string, "null"], format: date }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Záloha je už potvrzená, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/tax-return/{type}/{year}/advances/{scheduleId}/unconfirm:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: type, required: true, schema: { type: string, enum: [fo, po] } }
      - { in: path, name: year, required: true, schema: { type: integer } }
      - { in: path, name: scheduleId, required: true, schema: { type: integer } }
    post:
      tags: [TaxReturn]
      summary: Vrátí potvrzenou zálohu zpět do stavu "planned"
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatný typ/rok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Záloha není ve stavu confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: mi_pat_
      description: Personal Access Token získaný v Nastavení → API tokeny.
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-myinvoice_session
      description: |
        Host-only browserová session webového rozhraní. Název lze v lokálním
        HTTP vývoji změnit konfigurací; produkční výchozí používá prefix `__Host-`.

  parameters:
    SupplierIdHeader:
      in: header
      name: X-Supplier-Id
      required: false
      description: |
        ID supplier-a (firmy), v jejíž kontextu má operace běžet. Vyžadováno
        jen u **multi-supplier účtů s tokenem bez bind**. Pokud je token bound
        na konkrétního supplier-a, hlavička se ignoruje.
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Neplatný nebo chybějící token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Zdroj nenalezen
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Nedostatečné oprávnění (role)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Validace selhala
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InsufficientScope:
      description: Token nemá dostatečný scope (např. `read` na write operaci)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Překročen rate limit
      headers:
        Retry-After:
          schema: { type: integer }
          description: Sekundy do uvolnění
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    AppUrlConfigurationDiagnostic:
      type: object
      additionalProperties: false
      description: |
        Veřejná bezpečná klasifikace canonical `app.url`. Neobsahuje původní
        hodnotu, hostname, userinfo, heslo, cestu, query ani fragment.

        Stav a reason code tvoří pevné páry:
        * `missing` / `app_url_missing`: klíč chybí, je přesně prázdný nebo
          obsahuje jen whitespace. Diagnostický stav tyto případy záměrně
          slučuje, ale tenant routing ne: jen chybějící a přesně prázdná hodnota
          zachovává legacy request-host fallback; whitespace má pouze úzkou
          health výjimku.
        * `invalid` / `app_url_invalid_origin`: neprázdná hodnota není samostatný
          HTTP(S) origin. Pokud z ní legacy tenant resolver přesto získá platný
          hostname, může jako canonical uznat pouze request s přesně tímto
          hostname; nejde o důvěru k libovolnému hostu. Přes jiný hostname je
          dostupný pouze přesný read-only health endpoint.
        * `routing_only` / `app_url_webauthn_incompatible`: HTTP(S) origin je
          použitelný pro běžné routování, včetně HTTP nebo LAN IP, ale ne pro
          WebAuthn.
        * `hostname_conflict` / `app_url_hostname_conflict`: hostname originu
          je současně uložený jako vlastní doména firmy. Aplikace fail-closed
          odmítne běžné cesty; přesný read-only health endpoint zůstane dostupný
          pro bezpečnou diagnostiku bez zveřejnění hostname.
        * `webauthn_ready` / `app_url_valid`: origin vyhovuje routování i
          WebAuthn. WebAuthn vyžaduje HTTPS DNS origin; jediná HTTP výjimka je
          `http://localhost`.

        First-run setup může doplnit chybějící, prázdnou nebo whitespace-only
        hodnotu a známý distribuční placeholder z detekovaného originu.
        Explicitně neprázdnou neplatnou hodnotu zachová pro diagnostiku a
        preflight ji označí jako chybu.
      required: [state, reason_code, routing_compatible, webauthn_compatible]
      properties:
        state:
          type: string
          enum: [missing, invalid, routing_only, hostname_conflict, webauthn_ready]
          description: Stabilní třída konfigurace; nikdy neobsahuje část URL.
        reason_code:
          type: string
          description: Stabilní reason code odpovídající hodnotě `state`.
          enum:
            - app_url_missing
            - app_url_invalid_origin
            - app_url_webauthn_incompatible
            - app_url_hostname_conflict
            - app_url_valid
        routing_compatible:
          type: boolean
          description: Zda lze `app.url` použít jako canonical HTTP(S) origin pro routování.
        webauthn_compatible:
          type: boolean
          description: Zda `app.url` splňuje přísnější origin a RP ID podmínky WebAuthn.

    StockVendorOfferPatch:
      type: object
      description: >
        Pole nabídky dodavatele. Všechna jsou volitelná — pošli jen ta, která se
        mají změnit. Peněžní a množstevní hodnoty jdou jako řetězec (DECIMAL,
        žádné floatování).
      properties:
        vendor_sku: { type: [string, "null"], maxLength: 80, description: Kód zboží u dodavatele. }
        purchase_price: { type: [string, "null"], description: Nákupní cena bez DPH. }
        currency_code: { type: string, minLength: 3, maxLength: 3, default: CZK }
        delivery_days: { type: [integer, "null"], minimum: 0, maximum: 65535 }
        stock_qty: { type: [string, "null"], description: Množství, které dodavatel hlásí skladem. }
        stock_qty_updated_at:
          type: [string, "null"]
          description: >
            Kdy naposled množství přišlo. Doplní se samo při změně `stock_qty`.
            INFORMATIVNÍ — hlášená skladovost platí, dokud ji dodavatel nezmění;
            žádný práh stárnutí se neuplatňuje.
        availability_state:
          type: string
          enum: [in_stock, on_order, unavailable, unknown]
          default: unknown
        min_order_qty: { type: [string, "null"], description: Minimální objednací množství (kladné). }
        package_qty: { type: [string, "null"], description: Velikost balení; objednávka se na ni zaokrouhluje nahoru. }
        price_valid_to: { type: [string, "null"], format: date, description: Do kdy platí ceníková cena. }
        data_source:
          type: string
          enum: [manual, import, feed]
          default: manual
          description: Odkud hodnoty přišly — ruční zápis, import ceníku, automatický kanál.
        is_active: { type: boolean, default: true, description: Vyřazená nabídka zůstává kvůli historii, ale nenabízí se. }
        is_preferred: { type: boolean, description: Hlavní dodavatel karty; nejvýš jeden — ostatní se odznačí. }
        note: { type: [string, "null"], maxLength: 255 }
    StockVendorOfferCreate:
      allOf:
        - type: object
          required: [stock_item_id, client_id]
          properties:
            stock_item_id: { type: integer, format: int64, description: Skladová karta. }
            client_id:
              type: integer
              format: int64
              description: Karta klienta s příznakem „je dodavatel" (`is_vendor`).
        - $ref: '#/components/schemas/StockVendorOfferPatch'
    StockVendorOffer:
      allOf:
        - $ref: '#/components/schemas/StockVendorOfferPatch'
        - type: object
          required: [id, stock_item_id, client_id]
          properties:
            id: { type: integer, format: int64 }
            supplier_id: { type: integer }
            stock_item_id: { type: integer, format: int64 }
            client_id: { type: integer, format: int64 }
            client_name: { type: string, description: Název dodavatele. }
            sku: { type: string }
            item_name: { type: string }
            unit: { type: string }
            on_hand:
              type: string
              description: >
                Vlastní stav na skladě napříč sklady. Karta bez jediného pohybu
                nemá řádek ve `stock_levels` a vrací `0`, ne prázdno.
            updated_at: { type: string }
    StockVendorOfferImportReport:
      type: object
      required: [ok, dry_run, created, updated, skipped, failed, rows]
      properties:
        ok: { type: boolean, description: Žádný chybný řádek. }
        dry_run: { type: boolean }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [line, key, status]
            properties:
              line: { type: integer, description: Číslo řádku v souboru (1-based včetně hlavičky). }
              key: { type: string, description: 'SKU / dodavatel.' }
              status: { type: string, enum: [create, update, skip, error] }
              changes:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    from: {}
                    to: {}
              message: { type: string }
    EshopPromoPriceInput:
      type: object
      required: [promo_price]
      properties:
        id:
          type: [integer, "null"]
          description: Existující akce k úpravě; prázdné = nová.
        currency_code: { type: string, minLength: 3, maxLength: 3, default: CZK }
        promo_price: { type: number, description: Akční cena bez DPH. }
        label: { type: [string, "null"], maxLength: 60 }
        valid_from:
          type: [string, "null"]
          format: date
          description: Začátek platnosti včetně; null = bez omezení zdola.
        valid_to:
          type: [string, "null"]
          format: date
          description: Konec platnosti včetně; null = bez omezení shora.
        qty_mode:
          type: string
          enum: [stock, limited, unlimited]
          default: stock
          description: >
            `stock` = do vyprodání zásob (strop = živý stav skladu, doskladnění akci
            obnoví); `limited` = pevný rozpočet `qty_limit` kusů odečítaný prodejem;
            `unlimited` = bez množstevního stropu.
        qty_limit:
          type: [number, "null"]
          description: Povinné a kladné pro `qty_mode=limited`, jinak se ignoruje.
        is_active: { type: boolean, default: true }
        note: { type: [string, "null"], maxLength: 255 }
    EshopPromoPrice:
      allOf:
        - $ref: '#/components/schemas/EshopPromoPriceInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            stock_item_id: { type: integer, format: int64 }
            qty_remaining:
              type: [number, "null"]
              description: Kolik kusů akce ještě pokryje; null = bez stropu.
            state:
              type: string
              enum: [active, scheduled, expired, disabled, exhausted]
            created_at: { type: string }
            updated_at: { type: string }
    EshopEffectivePrice:
      type: object
      required: [stock_item_id, currency_code, unit_price, promo_applied, promo_reason]
      properties:
        stock_item_id: { type: integer, format: int64 }
        currency_code: { type: string, minLength: 3, maxLength: 3 }
        base_price:
          type: [string, "null"]
          description: Standardní cena bez DPH z cenotvorby.
        unit_price:
          type: [string, "null"]
          description: Platná cena bez DPH — akční, pokud se akce uplatnila, jinak standardní.
        promo_applied: { type: boolean }
        promo_reason:
          type: string
          enum: [applied, none, qty_exceeds_remaining, exhausted, not_cheaper]
          description: >
            `qty_exceeds_remaining` = akce existuje, ale její strop nepokryje celé
            požadované množství (uplatnění je vše-nebo-nic per řádek);
            `exhausted` = strop vyčerpaný / zboží není skladem;
            `not_cheaper` = akce není levnější než standardní cena.
        promo_qty_available:
          type: [string, "null"]
          description: Kolik kusů by akce pokryla; null = bez stropu.
        promo:
          type: [object, "null"]
          properties:
            id: { type: integer, format: int64 }
            label: { type: [string, "null"] }
            promo_price: { type: string }
            valid_from: { type: [string, "null"], format: date }
            valid_to: { type: [string, "null"], format: date }
            qty_mode: { type: string, enum: [stock, limited, unlimited] }
            qty_limit: { type: [string, "null"] }
            qty_remaining: { type: [string, "null"] }
    OssPreview:
      type: object
      required: [period, settings, summary, countries, corrections, warnings]
      properties:
        period:
          type: object
          required: [year, quarter, start, end, label, submission_deadline]
          properties:
            year: { type: integer }
            quarter: { type: integer, minimum: 1, maximum: 4 }
            start: { type: string, format: date }
            end: { type: string, format: date }
            label: { type: string }
            submission_deadline: { type: string, format: date }
        settings: { type: object, additionalProperties: true }
        summary:
          type: object
          properties:
            return_currency: { type: string, example: EUR }
            total_base: { type: number }
            total_vat: { type: number }
            total_corrections: { type: number }
            total_payable: { type: number }
            invoice_count: { type: integer }
            row_count: { type: integer }
            correction_row_count: { type: integer }
            invalid_correction_count: { type: integer }
            conversion_missing_count: { type: integer }
            manual_review_count:
              type: integer
              description: >
                Počet OSS řádků období s příznakem `oss_needs_manual_review`. Táž množina,
                kterou v seznamu faktur vrátí `filter[oss_review]=oss`.
        countries:
          type: array
          items: { type: object, additionalProperties: true }
        corrections:
          type: array
          items:
            type: object
            required: [period, year, quarter, state_consumption, correction, count, rows]
            properties:
              period: { type: string, pattern: '^[0-9]{4}Q[1-4]$' }
              year: { type: integer }
              quarter: { type: integer, minimum: 1, maximum: 4 }
              state_consumption: { type: string, minLength: 2, maxLength: 2 }
              correction: { type: number, description: "Rozdíl DPH v EUR, může být záporný." }
              count: { type: integer }
              rows:
                type: array
                items: { type: object, additionalProperties: true }
        warnings:
          type: array
          items: { type: string }

    OssArchive:
      type: object
      required: [form_code, submissions]
      description: "Archiv OSS podání — filtrovaný na `ossei1`; snapshoty DPH a KH na OSS obrazovku nepatří, i když leží v téže tabulce."
      properties:
        form_code: { type: string, enum: [ossei1] }
        submissions:
          type: array
          items: { $ref: '#/components/schemas/TaxSubmission' }

    OssReconciliationBasis:
      type: object
      description: "Podklad rekonciliace = konkrétní archivované podání, proti kterému se porovnává."
      required: [submission_id, status, is_proven_filing, xml_sha256, totals]
      properties:
        submission_id: { type: integer }
        status: { type: string, enum: [draft, generated, downloaded, submitted, accepted, rejected] }
        is_proven_filing:
          type: boolean
          description: "false = jen vygenerovaný nebo stažený snapshot. Stažení XML NENÍ podání; rekonciliace to nesmí zaměňovat."
        form_variant: { type: string }
        validation_status: { type: string, enum: [passed, failed, skipped] }
        generated_at: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
        submission_ref: { type: [string, "null"] }
        xml_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        fingerprint: { type: string, description: "Otisk snapshotu — shoda s dnešním `current.fingerprint` znamená nedotčené období." }
        totals:
          type: object
          properties:
            base: { type: [number, "null"] }
            vat: { type: [number, "null"] }
            corrections: { type: [number, "null"] }
            payable: { type: [number, "null"] }

    OssTotalDifference:
      type: object
      required: [key, filed, current, delta]
      properties:
        key: { type: string, enum: [base, vat, corrections, payable] }
        filed: { type: number }
        current: { type: number }
        delta: { type: number }

    OssKeyedDifference:
      type: object
      description: "Rozdíl na agregovaném řádku (stát + sazba) nebo na opravě minulého období."
      required: [change, key]
      properties:
        change: { type: string, enum: [added, removed, changed] }
        key: { type: string }
        filed: { type: [object, "null"], additionalProperties: true }
        current: { type: [object, "null"], additionalProperties: true }
        amounts:
          type: object
          additionalProperties:
            type: object
            properties:
              filed: { type: number }
              current: { type: number }
              delta: { type: number }

    OssDocumentDifference:
      type: object
      description: "Konkrétní doklad, který se od podání změnil — bez něj by účetní neměl kde začít."
      required: [change, invoice_id, item_id, country, rate, base, vat]
      properties:
        change: { type: string, enum: [added, removed, changed] }
        invoice_id: { type: integer }
        item_id: { type: integer }
        doc_number: { type: [string, "null"] }
        country: { type: string, minLength: 2, maxLength: 2 }
        tax_date: { type: [string, "null"], format: date }
        rate: { type: number }
        base: { type: number }
        vat: { type: number }
        adjusted_period: { type: [string, "null"], pattern: '^[0-9]{4}Q[1-4]$' }
        status: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
        filed: { type: object, additionalProperties: true }

    OssReconciliation:
      type: object
      required: [period, has_filing, snapshot_available, in_sync, differences]
      properties:
        period:
          type: object
          properties:
            year: { type: integer }
            quarter: { type: integer, minimum: 1, maximum: 4 }
            start: { type: string, format: date }
            end: { type: string, format: date }
            label: { type: string }
        has_filing: { type: boolean, description: "false = za období není archivované žádné OSS podání." }
        snapshot_available:
          type: boolean
          description: "false = archiv je starší než snapshotování podání → porovnat NELZE. Není to shoda."
        basis: { $ref: '#/components/schemas/OssReconciliationBasis' }
        current:
          type: object
          properties:
            return_currency: { type: string, example: EUR }
            totals:
              type: object
              properties:
                base: { type: number }
                vat: { type: number }
                corrections: { type: number }
                payable: { type: number }
            fingerprint: { type: string }
        in_sync:
          type: [boolean, "null"]
          description: "null = nebylo s čím porovnávat (chybí podání nebo snapshot). Přiznaná neznalost, ne shoda."
        differences:
          type: object
          properties:
            totals: { type: array, items: { $ref: '#/components/schemas/OssTotalDifference' } }
            rows: { type: array, items: { $ref: '#/components/schemas/OssKeyedDifference' } }
            corrections: { type: array, items: { $ref: '#/components/schemas/OssKeyedDifference' } }
            documents: { type: array, items: { $ref: '#/components/schemas/OssDocumentDifference' } }

    OssEvidenceRecord:
      type: object
      description: "Jeden evidenční záznam čl. 63c — write-once, po zápisu už ho UPDATE ani DELETE nezmění (databázový trigger)."
      required: [id, seq, consumption_country, supply_date, taxable_amount, vat_amount, retain_until]
      properties:
        id: { type: integer }
        seq: { type: integer }
        consumption_country: { type: string, minLength: 2, maxLength: 2, description: "63c(1)(a) stát spotřeby" }
        supply_type: { type: [string, "null"], enum: [goods, services, null] }
        supply_description: { type: string, description: "63c(1)(b) druh plnění" }
        supply_quantity: { type: [string, "null"] }
        supply_unit: { type: [string, "null"] }
        supply_date: { type: string, format: date, description: "63c(1)(c) datum uskutečnění plnění" }
        taxable_amount: { type: string, description: "63c(1)(d) základ v měně dokladu" }
        taxable_currency: { type: string, minLength: 3, maxLength: 3 }
        taxable_amount_return: { type: string, description: "Základ přepočtený do měny podání" }
        return_currency: { type: string, minLength: 3, maxLength: 3 }
        exchange_rate: { type: [string, "null"] }
        exchange_rate_date: { type: [string, "null"], format: date }
        adjusted_period: { type: [string, "null"], pattern: '^[0-9]{4}Q[1-4]$' }
        vat_rate: { type: string, description: "63c(1)(f) sazba státu spotřeby" }
        vat_rate_type: { type: [string, "null"], enum: [standard, reduced, second_reduced, parking, null] }
        vat_amount: { type: string }
        vat_amount_return: { type: string }
        payments:
          type: array
          description: "63c(1)(h) přijaté úhrady"
          items:
            type: object
            properties:
              paid_on: { type: string, format: date }
              amount: { type: number }
              currency: { type: string, minLength: 3, maxLength: 3 }
        invoice_id: { type: [integer, "null"] }
        invoice_item_id: { type: [integer, "null"] }
        invoice_snapshot: { type: object, additionalProperties: true }
        customer_name: { type: [string, "null"] }
        place_evidence: { type: object, additionalProperties: true, description: "63c(1)(j) podklad pro určení místa plnění" }
        completeness:
          type: object
          additionalProperties: { type: string }
          description: "Body čl. 63c, které se naplnit nepodařilo (kód → důvod). Prázdný objekt = kompletní."
        retain_until: { type: string, format: date, description: "§ 110f odst. 2 písm. a) — konec roku plnění + 10 let." }
        captured_at: { type: string, format: date-time }

    OssEvidence:
      type: object
      required: [legal_basis, retention_years, available, records]
      properties:
        legal_basis: { type: string, example: "§ 110f ZDPH / čl. 63c nařízení (EU) 282/2011" }
        retention_years: { type: integer, example: 10 }
        unsupported:
          type: object
          additionalProperties: { type: string }
          description: "Body evidence, které aplikace obecně naplnit neumí (kód → důvod)."
        available: { type: boolean, description: "false = chybí migrace evidenční tabulky; záznamy se nezachytávaly." }
        submission_id: { type: integer, description: "Podání, ke kterému byla evidence zachycena." }
        records:
          type: array
          items: { $ref: '#/components/schemas/OssEvidenceRecord' }

    OssBulkUpdateInput:
      type: object
      required: [invoice_ids]
      properties:
        invoice_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: integer, format: int64 }
          description: "Nad 200 dokladů vrací 422 `too_many`."
        scope:
          type: string
          enum: [needs_review, missing_rate_type, oss, all]
          default: needs_review
          description: |
            Které POLOŽKY dokladu akce bere:
            `needs_review` = jen řádky s `oss_needs_manual_review`,
            `missing_rate_type` = OSS řádky bez typu sazby (ty exportér do podání nepustí),
            `oss` = všechny OSS řádky, `all` = všechny řádky dokladu.
        set:
          type: object
          description: |
            Co se má nastavit — posílají se jen klíče, které se mají změnit. Prázdný `set`
            vrací 400 `nothing_to_set`. Peněžní OSS sloupce (kurz, částky v měně podání)
            akce ZÁMĚRNĚ nemění; dopočítává je náhled OSS podání.
          properties:
            oss_applicable:
              type: boolean
              description: Zařazení řádku do OSS. Zapnout lze jen se zemí spotřeby, vypnout jen s potvrzenou tuzemskou sazbou.
            oss_consumer_country:
              type: string
              minLength: 2
              maxLength: 2
              example: PL
              description: ISO2 členského státu EU. Nesmí se rovnat státu identifikace dodavatele (to je tuzemské plnění).
            oss_rate_type: { type: string, enum: [standard, reduced, second_reduced, parking] }
            oss_supply_type: { type: string, enum: [goods, services] }
            clear_needs_review:
              type: boolean
              default: true
              description: |
                Zhasne „k ručnímu posouzení" na dotčených řádcích — potvrzení místa plnění
                je rozhodnutí člověka a tahle akce je jediné místo, kde ho dělá. Tam, kde
                příznak drží ROZPOR celého dokladu, zůstane rozsvícený i tak
                (viz `documents[].keep_review`).

    OssBulkUpdateDocument:
      type: object
      properties:
        invoice_id: { type: integer, format: int64 }
        varsymbol: { type: string, nullable: true }
        status: { type: string, nullable: true }
        tax_date: { type: string, format: date, nullable: true, description: Rozhodné datum, proti kterému se ověřuje zámek i sazba. }
        action: { type: string, enum: [update, skip] }
        skip_reason:
          type: string
          nullable: true
          enum: [not_found, cancelled, locked, date_locked, period_filed, retention_hold, outside_oss_registration, missing_consumer_country, unverified_domestic_rate, no_matching_items, no_change]
          description: |
            Proč se doklad přeskočil. Skip je vždy PER DOKLAD — nezapsat nic je lepší
            než doklad v půli cesty. `unverified_domestic_rate` = číselník členských států
            nepotvrdil sazbu řádku v zemi dodavatele, takže OSS opustit nesmí.
        skip_detail: { type: string, nullable: true, description: Věta pro uživatele včetně návodu, co s tím. }
        items_matched: { type: integer }
        changes:
          type: array
          description: Změny per položka; `from`/`to` nesou OSS sloupce před a po.
          items:
            type: object
            properties:
              item_id: { type: integer, format: int64 }
              description: { type: string, maxLength: 80 }
              from: { $ref: '#/components/schemas/OssBulkItemState' }
              to: { $ref: '#/components/schemas/OssBulkItemState' }
        warnings:
          type: array
          items: { type: string }
          description: Doklad se provede, ale něco na něm nesedí (nepotvrzená sazba, rozpor v dokladu).
        keep_review:
          type: array
          items: { type: string }
          description: Položky, kterým `oss_needs_manual_review` zůstane rozsvícený navzdory `clear_needs_review`.

    OssBulkItemState:
      type: object
      properties:
        oss_applicable: { type: boolean }
        oss_consumer_country: { type: string, nullable: true }
        oss_rate_type: { type: string, nullable: true }
        oss_supply_type: { type: string, nullable: true }
        oss_needs_manual_review: { type: boolean }

    OssBulkUpdateResult:
      type: object
      required: [applied, scope, set, documents, summary]
      properties:
        applied: { type: boolean, description: "false = náhled, nic se nezapsalo." }
        scope: { type: string, enum: [needs_review, missing_rate_type, oss, all] }
        set: { type: object, description: Normalizovaná podoba požadavku, jak jí akce rozuměla. }
        documents:
          type: array
          items: { $ref: '#/components/schemas/OssBulkUpdateDocument' }
        summary:
          type: object
          properties:
            documents_total: { type: integer }
            documents_to_change: { type: integer }
            documents_skipped: { type: integer }
            items_to_change: { type: integer }
            warnings: { type: integer }
            skipped_by_reason:
              type: object
              additionalProperties: { type: integer }
              description: "Počet přeskočených dokladů podle `skip_reason`."

    TaxEvidenceNonCashAdjustment:
      type: object
      required: [adjustment_on, kind, direction, amount, description]
      properties:
        id: { type: integer, readOnly: true }
        adjustment_on: { type: string, format: date }
        kind: { type: string, enum: [setoff, barter, in_kind_income, debt_forgiveness, private_use, shortage, damage, inventory, receivable, payable, section23_other] }
        direction: { type: string, enum: [increase, decrease, neutral] }
        amount: { type: number, minimum: 0 }
        description: { type: string, maxLength: 500 }
        evidence_ref: { type: [string, "null"], maxLength: 190 }

    TaxEvidenceAnnualClosingWrite:
      type: object
      required: [row_version, checklist, opening_balances, closing_balances]
      properties:
        row_version: { type: integer, minimum: 1 }
        checklist: { type: object, additionalProperties: { type: boolean } }
        opening_balances: { type: object, additionalProperties: { type: number } }
        closing_balances: { type: object, additionalProperties: { type: number } }
        unsupported_cases: { type: array, items: { type: string, maxLength: 500 } }
        adjustments: { type: array, items: { $ref: '#/components/schemas/TaxEvidenceNonCashAdjustment' } }

    TaxEvidenceAnnualClosing:
      allOf:
        - $ref: '#/components/schemas/TaxEvidenceAnnualClosingWrite'
        - type: object
          required: [id, supplier_id, year, status, adjustments]
          properties:
            id: { type: integer }
            supplier_id: { type: integer }
            year: { type: integer }
            status: { type: string, enum: [draft, final] }
            source_snapshot: { type: [object, "null"], readOnly: true }
            source_hash: { type: [string, "null"], readOnly: true }
            finalized_at: { type: [string, "null"], format: date-time, readOnly: true }
            finalized_by: { type: [integer, "null"], readOnly: true }

    AutoPostingPolicyRow:
      type: object
      required: [operation_type, level, is_default, effective_level]
      properties:
        operation_type: { type: string }
        level: { type: string, enum: [off, suggest, auto] }
        is_default: { type: boolean }
        effective_level: { type: string, enum: [off, suggest, auto] }

    AutoPostingPolicy:
      type: object
      required: [automation_level, automation_daily_limit_czk, automation_digest_enabled, automation_digest_hour, rows]
      properties:
        automation_level: { type: string, enum: [off, suggest, assisted, full] }
        automation_daily_limit_czk: { type: [number, "null"], minimum: 0 }
        automation_digest_enabled: { type: boolean }
        automation_digest_hour: { type: integer, minimum: 0, maximum: 23 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/AutoPostingPolicyRow' }

    AutoPostingPolicyWrite:
      type: object
      properties:
        automation_level: { type: string, enum: [off, suggest, assisted, full] }
        automation_daily_limit_czk: { type: [number, "null"], minimum: 0 }
        automation_digest_enabled: { type: boolean }
        automation_digest_hour: { type: integer, minimum: 0, maximum: 23 }
        rows:
          type: array
          items:
            type: object
            required: [operation_type, level]
            properties:
              operation_type: { type: string }
              level: { type: string, enum: [off, suggest, auto] }

    BankPostingRuleWrite:
      type: object
      required: [direction, debit_account_code, credit_account_code]
      description: |
        Kromě povinných polí musí být vyplněné **aspoň jedno kritérium**, podle kterého
        pravidlo pohyb pozná: `counterparty_account`, `counterparty_bank`,
        `counterparty_prefix`, `variable_symbol` nebo `message_contains`. Pravidlo bez
        kritéria by sedělo na všechno — server ho odmítne `422 rule_criteria_missing`.
      properties:
        name: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        counterparty_account: { type: [string, "null"] }
        counterparty_bank: { type: [string, "null"] }
        counterparty_prefix: { type: [string, "null"] }
        variable_symbol: { type: [string, "null"] }
        message_contains: { type: [string, "null"] }
        amount_min: { type: [number, "null"], minimum: 0 }
        amount_max: { type: [number, "null"], minimum: 0 }
        debit_account_code: { type: string }
        credit_account_code: { type: string }
        description: { type: [string, "null"] }
        is_active: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 999 }
        operation_type: { type: [string, "null"] }
        auto_amount_cap: { type: [number, "null"], minimum: 0 }
        applies_currency: { type: string, pattern: '^[A-Z]{3}$' }
        backfill_suggestions: { type: boolean }

    BankPostingRule:
      allOf:
        - $ref: '#/components/schemas/BankPostingRuleWrite'
        - type: object
          required: [id, supplier_id, mode, is_active, hit_count, priority, applies_currency]
          properties:
            id: { type: integer }
            supplier_id: { type: integer }
            system_template_key: { type: [string, "null"] }
            hit_count: { type: integer }
            approved_streak: { type: integer }
            promotion_candidate: { type: boolean }
            rejected_streak: { type: integer }
            mode: { type: string, enum: [suggest, auto] }
            last_hit_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    BankPostingRulePage:
      type: object
      required: [items, total, page, per_page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BankPostingRule' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }

    BankPostingRuleDryRun:
      type: object
      required: [matched_count, already_posted_count, shadowed_by_own_transfer, sample]
      properties:
        matched_count: { type: integer }
        already_posted_count: { type: integer }
        shadowed_by_own_transfer: { type: boolean }
        sample:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              posted_at: { type: string, format: date }
              amount: { type: number }
              description: { type: [string, "null"] }
              already_posted: { type: boolean }

    BankPostingRuleHistory:
      type: object
      required: [events, corrections, stats, total, page, per_page]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        events:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              event_type: { type: string }
              reason: { type: [string, "null"] }
              created_by_name: { type: [string, "null"] }
              created_at: { type: string, format: date-time }
        corrections:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              event_type: { type: string }
              suggested: { type: [string, "null"] }
              final: { type: [string, "null"] }
              amount: { type: [number, "null"] }
              created_by_name: { type: [string, "null"] }
              created_at: { type: string, format: date-time }
        stats:
          type: object
          properties:
            hit_count: { type: integer }
            approved_streak: { type: integer }
            rejected_streak: { type: integer }
            override_count: { type: integer }
            success_rate: { type: number }

    BankRuleTemplate:
      type: object
      required: [template_key, name, direction, operation_type, rule_key, default_priority, already_instantiated]
      properties:
        template_key: { type: string }
        name: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        operation_type: { type: string }
        counterparty_bank: { type: [string, "null"] }
        counterparty_prefix: { type: [string, "null"] }
        vs_placeholder: { type: [string, "null"] }
        vs_value: { type: [string, "null"] }
        message_contains: { type: [string, "null"] }
        rule_key: { type: string }
        debit_account_code: { type: [string, "null"] }
        credit_account_code: { type: [string, "null"] }
        default_priority: { type: integer }
        already_instantiated: { type: boolean }
