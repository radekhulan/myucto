              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 50 }
                name: { type: string, maxLength: 150 }
                parent_id: { type: [integer, "null"] }
                display_order: { type: integer }
                export_eshop: { type: boolean, default: true }
                archived: { type: boolean, default: false }
      responses:
        '201': { description: Vytvořeno }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { description: Kategorie s tímto kódem už existuje }
  /api/v1/eshop/categories/{id}/i18n:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Eshop]
      summary: Seznam překladů kategorie
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Eshop]
      summary: Uloží překlady kategorie (upsert po jazycích)
      description: |
        Přijímá pole `translations` (nebo přímo pole objektů) — každý záznam
        `{locale, name, description?, seo_slug?}`. Neplatné/prázdné řádky (chybí
        `locale` nebo `name`, `locale` > 5 znaků) se přeskočí. Vrací aktuální
        seznam překladů po zápisu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                translations:
                  type: array
                  items:
                    type: object
                    required: [locale, name]
                    properties:
                      locale: { type: string, maxLength: 5 }
                      name: { type: string }
                      description: { type: [string, "null"] }
                      seo_slug: { type: [string, "null"] }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
