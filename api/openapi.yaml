          description: Seznam domén firmy
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupplierDomain' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `managed_installation` — ve spravované instalaci (cfg `app.managed`)
            nastavuje doménu provozovatel; plocha je zamčená včetně čtení.

  /api/v1/settings/supplier:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Settings]
      summary: Detail aktuálního dodavatele
      description: |
        Vrátí kompletní data supplier-a v jehož scope token operuje — adresa,
        IČO/DIČ, bankovní účty, číslování faktur, default platební podmínky.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierFull' }
    put:
      tags: [Settings]
      summary: Úprava aktuálního dodavatele
      description: |
        Částečný update supplier-a v jehož scope token operuje — pošli jen pole,
        která chceš změnit. Vyžaduje token se scope `read_write` patřící adminovi.

        Zahrnuje i **číslování dokladů** (`invoice_number_format`,
        `proforma_number_format`, `credit_note_number_format`,
        `purchase_invoice_number_format`, `invoice_number_period`) a **branding
        PDF/e-mailů** (`email_branding_enabled`, `email_accent_color`,
        `pdf_logo_show_name`, `display_name`, `tagline`). Brandingová pole jsou
        původním nastavením dodavatele. Logo se nahrává zvlášť
        (není součástí tohoto endpointu).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierUpdate' }
      responses:
        '200':
          description: Aktualizovaný supplier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierFull' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          description: Uživatel není admin nebo token nemá scope `read_write`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/settings/supplier/invoice-counter:
    put:
      tags: [Settings]
      summary: Nastavení counteru číselné řady dokladů
      description: |
        Nastaví supplier-wide counter tak, aby **příští vystavený doklad** daného
        typu dostal číslo `next_number`. `date` určuje, do kterého období (dle
        `invoice_number_period` supplier-a) se counter zapíše — default dnes.

        Na rozdíl od samoopravné synchronizace umí counter i **snížit**; pokud by
        nové číslo kolidovalo s už vystaveným dokladem, vystavení se automaticky
        posune na první volné číslo (číslo se nikdy nezduplikuje).

        Typický use-case: převzetí existující číselné řady při migraci z jiného
        fakturačního software nebo napojení externího systému.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [next_number]
              properties:
                type:
                  type: string
                  enum: [invoice, proforma, credit_note]
                  default: invoice
                next_number:
                  type: integer
                  minimum: 1
                  maximum: 999999999
                  example: 42
                  description: Číslo, které dostane příští vystavený doklad.
                date:
                  type: string
                  format: date
                  description: Datum určující období řady (YYYY-MM-DD). Default = dnes.
      responses:
        '200':
          description: Counter nastaven
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, example: invoice }
                  next_number: { type: integer, example: 42 }
                  counter:
                    type: integer
                    example: 41
                    description: Uložená hodnota `last_number` (= next_number - 1).
                  period:
                    type: string
                    example: "202607"
                    description: Klíč období counteru (YYYY / YYYYMM / ALL).
                  preview:
                    type: string
                    example: "2607042"
                    description: Jak bude vypadat příští vygenerované číslo.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          description: Uživatel není admin nebo token nemá scope `read_write`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/settings/supplier/logo:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Settings]
      summary: Nahrání loga dodavatele
      description: |
        Multipart upload loga (pole `file`). Formáty PNG / JPG / SVG / WebP,
        max **1 MiB**. Rastr se zmenší na max 240×800 px; SVG se sanitizuje
        a rasterizuje (vektorová kopie se zachová pro ostré PDF). Logo se
        v e-mailech a PDF fakturách zobrazuje jen při
        `email_branding_enabled = true` (nastavíš přes
        `PUT /api/v1/settings/supplier`).

        `logo_path` NELZE měnit přes mass-assign na supplier update — vždy jen
        tímto endpointem (bezpečnost).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG / JPG / SVG / WebP, max 1 MiB
      responses:
        '200':
          description: Logo uloženo
          content:
            application/json:
              schema:
                type: object
                properties:
                  logo_path: { type: string, example: "storage/supplier-logos/sup-1.png" }
                  width: { type: integer, example: 480 }
                  height: { type: integer, example: 160 }
        '400':
          description: Chybí soubor / nepodporovaný formát / konverze selhala
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Uživatel není admin nebo token nemá scope `read_write`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Soubor přes 1 MiB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Settings]
      summary: Odebrání loga dodavatele
      responses:
        '200':
          description: Logo odstraněno
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
        '403':
          description: Uživatel není admin nebo token nemá scope `read_write`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/suppliers:
    get:
      tags: [Settings]
      summary: Seznam dodavatelů, ke kterým má token přístup
      description: |
        Užitečné pro klienta, který chce zjistit `id` supplier-ů (pro X-Supplier-Id
        header u tokenu bez bind, nebo pro multi-supplier reporting).

        **Membership (Epic F0):** pokud má uživatel v `user_suppliers` alespoň
        jedno přiřazení, vrací se JEN přiřazené firmy. Uživatel bez přiřazení
        (typicky vlastník single-tenant instalace) vidí všechny firmy — zpětně
        kompatibilní chování. Požadavek s `X-Supplier-Id` mimo membership vrací
        `403` s kódem `forbidden_supplier`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SupplierBrief' }

  /api/v1/suppliers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Settings]
      summary: Detail konkrétního dodavatele
      description: |
        Membership (Epic F0): firma mimo `user_suppliers` přiřazení uživatele
        vrací `404` (konvence pro cizí entity).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierFull' }

  /api/v1/admin/users/{id}/suppliers:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: ID uživatele (users.id)
    get:
      tags: [Settings]
      summary: Přiřazení uživatele k firmám (membership, Epic F0)
      description: |
        **Session-only, role `admin`** — přes bearer token nedostupné
        (`/api/admin/*` je mimo veřejný API subset).

        Vrací sadu přiřazení z `user_suppliers`. Prázdné pole = uživatel bez
        omezení (vidí všechny firmy — zpětně kompatibilní režim).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserSupplierAssignment' }
        '403': { description: "Forbidden — role není admin (nebo bearer token)" }
        '404': { description: Uživatel nenalezen }
    put:
      tags: [Settings]
      summary: Nahradí sadu přiřazení uživatele k firmám (Epic F0)
      description: |
        **Session-only, role `admin`.** Replace-all sémantika: poslaná sada
        NAHRAZUJE všechna dosavadní přiřazení. Prázdné `assignments` = odebrat
        všechna omezení. `role: null` = zdědit globální `users.role`;
        jinak per-supplier override (`admin`/`accountant`/`readonly`).
        Změna se zapisuje do activity logu (`user.suppliers_updated`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [supplier_id]
                    properties:
                      supplier_id: { type: integer }
                      role:
                        type: [string, "null"]
                        enum: [admin, accountant, readonly, null]
                        description: "NULL = zdědit globální users.role"
      responses:
        '200':
          description: Nová sada přiřazení
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserSupplierAssignment' }
        '400': { description: "Validace — neexistující supplier_id, duplicitní položka, neplatná role" }
        '403': { description: "Forbidden — role není admin (nebo bearer token)" }
        '404': { description: Uživatel nenalezen }

  /api/v1/admin/bank-rule-templates:
    get:
      tags: [Accounting]
      summary: Globální katalog šablon bankovních pravidel pro administraci
      description: "Session-only, superadmin. Vrací šablony, povolené typy operací a globální předkontace."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBankRuleTemplateCatalog' }
        '403': { description: Pouze superadmin }
    post:
      tags: [Accounting]
      summary: Vytvoří globální šablonu bankovního pravidla
      description: "Session-only, superadmin. Šablona se po aktivaci nabízí všem firmám."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBankRuleTemplateWrite' }
      responses:
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`) — tento endpoint je
            dostupný jen z webového rozhraní. Viz „Endpointy dostupné jen z webového
            rozhraní" v úvodu dokumentace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBankRuleTemplate' }
        '409': { description: template_key_taken }
        '422': { description: validation_failed / posting_rule_not_found / rule_account_forbidden }

  /api/v1/admin/bank-rule-templates/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    put:
      tags: [Accounting]
      summary: Upraví globální šablonu bankovního pravidla
      description: "Session-only, superadmin. template_key je po vytvoření neměnný."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBankRuleTemplateWrite' }
      responses:
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`) — tento endpoint je
            dostupný jen z webového rozhraní. Viz „Endpointy dostupné jen z webového
            rozhraní" v úvodu dokumentace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBankRuleTemplate' }
        '404': { description: template_not_found }
        '409': { description: template_key_immutable }
        '422': { description: validation_failed / posting_rule_not_found / rule_account_forbidden }
    delete:
      tags: [Accounting]
      summary: Smaže nepoužitou globální šablonu bankovního pravidla
      description: "Session-only, superadmin. Použitou šablonu je nutné místo smazání deaktivovat."
      responses:
        '403':
          description: |
            Volání API tokenem (`token_endpoint_forbidden`) — tento endpoint je
            dostupný jen z webového rozhraní. Viz „Endpointy dostupné jen z webového
            rozhraní" v úvodu dokumentace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: Deleted }
        '404': { description: template_not_found }
        '409': { description: template_in_use }
  /api/v1/settings/currencies:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Settings]
      summary: Měny nakonfigurované pro aktuálního dodavatele
      description: |
        Per-supplier override hlavního codebooku — obsahuje i bank-accounts
        per currency. Mutace (POST/PUT/DELETE) jsou jen přes UI, ne přes API.
      responses:
        '200':
          description: OK

  /api/v1/settings/vat-rates:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Settings]
      summary: DPH sazby aktuálního dodavatele
      responses:
        '200':
          description: OK

  /api/v1/settings/units:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Settings]
      summary: Měrné jednotky aktuálního dodavatele
      responses:
        '200':
          description: OK

  /api/v1/settings/countries:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Settings]
      summary: Země nakonfigurované pro aktuálního dodavatele
      responses:
        '200':
          description: OK

  /api/v1/bank-statements/upload:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Bank]
      summary: Nahraje bankovní výpis (GPC/CSV/ABO)
      description: |
        Multipart upload. Server detekuje formát z obsahu a parsuje transakce.
        Auto-matching proti otevřeným fakturám se spustí po `POST /scan`.

        GPC/ABO hlavička neobsahuje měnu. Pokud jedno číslo účtu evidujete ve více
        měnách (např. Raiffeisenbank: CZK/EUR/USD = jedno číslo), je nutné zvolit
        cílový měnový účet přes `account_id`. Když `account_id` chybí a číslo je
        víceznačné, server vrátí `409` s kódem `ambiguous_account_currency` a polem
        `candidates` (seznam měnových variant). Při jednoznačném čísle je `account_id`
        nepovinné (zpětně kompatibilní).

        Odpověď nese kromě `statement_id` také `parsed_transactions` (počet pohybů
        v souboru), `transactions` (skutečně založených), `skipped_duplicates` a
        `warnings`. Rozdíl mezi `parsed_transactions` a `transactions` je normální
        u překrývajících se výpisů (týž pohyb už je v evidenci), ale nikdy není tichý —
        vždy k němu přibude varování `transactions_skipped_as_duplicate`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: GPC, CSV (FIO/KB/MB formáty) nebo ABO výpis
                account_id:
                  type: integer
                  description: |
                    Cílový měnový účet (`currencies.id`). Povinné jen u víceměnového účtu
                    se sdíleným číslem účtu (jinak server vrátí 409 `ambiguous_account_currency`).
      responses:
        '200':
          description: Naparsováno — souhrn importu (ne entita výpisu)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementImportResult' }
        '400':
          description: |
            Neznámý formát / poškozený soubor (`parse_failed`), soubor není textový
            (`invalid_mime`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Číslo účtu není registrované u dodavatele (`wrong_supplier_account`),
            nebo má více měnových variant a chybí `account_id` (`ambiguous_account_currency`
            — `error.candidates` nese seznam `{account_id, code, label}`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Zvolený `account_id` neodpovídá číslu účtu výpisu / dodavateli (`invalid_account`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/bank-statements/upload-pdf:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Bank]
      summary: Nahraje bankovní výpis z PDF (banky bez GPC/CSV exportu)
      description: Multipart upload, max 5 MiB. Extrakce transakcí z PDF.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                account_id: { type: integer, description: "Cílový měnový účet u víceměnového čísla účtu" }
      responses:
        '200':
          description: "Naparsováno {statement_id, transaction_count, duplicates_count, skipped}"
          content:
            application/json:
              schema: { type: object }
        '400':
          description: Chybí soubor / neplatný formát / parsování selhalo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Číslo účtu neodpovídá dodavateli (`wrong_supplier_account`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { description: Soubor je příliš velký }

  /api/v1/bank-statements/{id}/rematch:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
        description: ID výpisu (např. z odpovědi `/bank-statements/upload`).
    post:
      tags: [Bank]
      summary: Přepáruje nespárované transakce výpisu proti fakturám
      description: |
        Auto-matching nad transakcemi výpisu **přímo v databázi** — žádný
        souborový import ani konfigurace serveru se nepoužívá. Vhodné po nahrání
        výpisu přes `/bank-statements/upload`, nebo když uživatel ex-post doplnil
        faktury, které by se daly napárovat.

        Projde transakce výpisu ve stavu `unmatched` a `auto_partial` a pro každou
        zkusí najít fakturu podle:
        - variabilního symbolu (přesný match) — preferovaná cesta,
        - částky + protiúčtu (fallback).

        Příchozí platba se páruje na vystavenou fakturu, odchozí na přijatou.
        Při unikátní shodě se transakce označí jako spárovaná a faktura `paid`
        s `paid_at = transaction.posted_at`; transakce s více kandidáty zůstávají
        nepřiřazené pro manuální rozhodnutí. Stavy `auto_exact`, `manual`
        a `ignored` zůstávají nedotčené.

        Pozn.: hromadný **import výpisů z adresáře na serveru** (`scan_root`) je
        hostitelská/cron záležitost a není součástí veřejného API — výpisy se přes
        API nahrávají endpointem `/bank-statements/upload`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  considered:
                    type: integer
                    description: Počet transakcí, které se přepárovávaly (unmatched + auto_partial).
                  newly_matched:
                    type: integer
                    description: Nově přesně spárované (auto_exact).
                  newly_partial:
                    type: integer
                    description: Nově částečně spárované (auto_partial — částka v širší toleranci).
                  still_unmatched:
                    type: integer
                    description: Po přepárování stále nespárované.
        '404': { description: "Výpis nenalezen nebo nepatří current supplier" }

  /api/v1/bank-statements/{id}/match-suggestions:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Bank]
      summary: Čekající skórované návrhy párování pro bankovní výpis
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { $ref: '#/components/schemas/BankMatchSuggestion' }
        '404': { description: Výpis nebyl nalezen v aktuální firmě }

  /api/v1/bank-match-suggestions/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Bank]
      summary: Potvrdí vybraného kandidáta návrhu párování
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                candidate_index: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Transakce byla spárována }
        '404': { description: Návrh nebyl nalezen v aktuální firmě }
        '409': { description: Návrh už byl vyřízen }
        '422': { description: Index kandidáta je mimo rozsah }

  /api/v1/bank-match-suggestions/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Bank]
      summary: Zamítne návrh párování
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 190 }
      responses:
        '200': { description: Návrh byl zamítnut }
        '404': { description: Návrh nebyl nalezen v aktuální firmě }
        '409': { description: Návrh už byl vyřízen }

  /api/v1/purchase-invoices/payment-orders/candidates:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Purchase invoices]
      summary: Kandidáti pro platební příkaz (nezaplacené přijaté faktury)
      parameters:
        - in: query
          name: currency
          schema: { type: string }
          description: "ISO 4217 — omezí kandidáty i účty plátce na danou měnu."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items: { type: object }
                    description: "Nezaplacené přijaté faktury vhodné k zařazení do příkazu."
                  payer_accounts:
                    type: array
                    items: { type: object }
                    description: "Bankovní účty dodavatele (plátce) k výběru odesílacího účtu."
                  supplier_currencies:
                    type: array
                    items: { type: object }

  /api/v1/purchase-invoices/payment-orders/verify-account:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Purchase invoices]
      summary: Ověří bankovní účet dodavatele faktury (CRPDPH)
      parameters:
        - in: query
          name: invoice_id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK — výsledek ověření spolehlivosti účtu
          content:
            application/json:
              schema: { type: object }
        '404': { description: "Faktura nenalezena" }

  /api/v1/purchase-invoices/payment-orders:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Purchase invoices]
      summary: Historie vytvořených platebních příkazů
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object }
    post:
      tags: [Purchase invoices]
      summary: Vytvoří platební příkaz z vybraných přijatých faktur
      description: |
        Vyžaduje roli `accountant` nebo vyšší. Sestaví příkaz k úhradě
        (ke stažení jako ABO/KPC, CSV, PDF nebo SEPA XML přes `/payment-orders/{id}/download`).
        Volitelně rovnou označí faktury jako „předáno k úhradě" (`mark_paid`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_ids, payer_currency_id, payment_date]
              properties:
                invoice_ids:
                  type: array
                  items: { type: integer, format: int64 }
                payer_currency_id:
                  type: integer
                  format: int64
                  description: "Účet plátce (currencies.id) — určuje odesílací účet a měnu."
                payment_date:
                  type: string
                  format: date
                  description: "Datum splatnosti / provedení příkazu."
                constant_symbol: { type: [string, "null"] }
                note: { type: [string, "null"] }
                mark_paid:
                  type: boolean
                  description: "Označit zařazené faktury jako předané k úhradě."
      responses:
        '201':
          description: Příkaz vytvořen
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: { type: integer, format: int64 }
                  view:
                    type: object
                    properties:
                      item_count: { type: integer }
                      total_amount: { type: number }
                      currency: { type: string }
                      mark_paid: { type: boolean }
                  skipped:
                    type: array
                    items: { type: object }
                    description: "Faktury vynechané z příkazu (s důvodem)."
        '403':
          description: "Role na vystavení platebního příkazu nedosáhne (`forbidden`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: "Validace selhala (`validation_failed`) — např. prázdný výběr faktur"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

