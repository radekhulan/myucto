          content:
            application/json:
              schema:
                type: object
                properties:
                  reissued_count: { type: integer }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        invoice_id: { type: integer }
                        reason: { type: string }

  /api/v1/invoices/bulk-oss/preview:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [InvoiceOps]
      summary: Náhled hromadné změny OSS parametrů (nic nezapisuje)
      description: |
        Spočítá, co by hromadná změna udělala, a vrátí to per doklad — bez zápisu.
        Náhled je POVINNÝ: `/invoices/bulk-oss` bez `confirm: true` vrátí 428.

        `oss_applicable` rozhoduje, jestli řádek jde do ČESKÉHO přiznání k DPH, nebo
        do OSS podání. Doklad, který je zaúčtovaný, uzamčený, v už podaném období nebo
        pod zadržením podle § 32 ZoÚ, se proto NEPŘEPISUJE — přeskočí se a v `documents[]`
        je uvedený i s důvodem. Akce nemá „force".

        Vypnutí OSS je hlídané stejně jako zapnutí: řádek smí OSS opustit jedině tehdy,
        když číselník členských států POZITIVNĚ potvrdí jeho sazbu v zemi dodavatele
        k rozhodnému datu — jinak by se cizí daň (např. PL 23 %) přesunula na ř. 1
        českého přiznání. „Nevím" (chybí číselník / stát k datu nevede) blokuje stejně
        jako „neplatí" (`skip_reason = unverified_domestic_rate`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OssBulkUpdateInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OssBulkUpdateResult' }
        '400': { description: 'Prázdný výběr, neznámý `scope`, nebo nic k nastavení' }
        '403': { description: Chybí oprávnění `invoices.create` (WRITE), nebo jde o klientský účet }
        '409': { description: OSS režim není v nastavení firmy aktivní }
        '422': { description: Víc než 200 dokladů najednou }

  /api/v1/invoices/bulk-oss:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [InvoiceOps]
      summary: Provede hromadnou změnu OSS parametrů (vyžaduje potvrzený náhled)
      description: |
        Tělo i odpověď jsou shodné s `/invoices/bulk-oss/preview`, navíc je povinné
        `confirm: true` a odpověď nese `completed_invoice_ids`.

        **Přes API token to nejde** — provedení vrací 403 `token_write_forbidden`.
        Přeřazení řádků mezi českým přiznáním a OSS je úkon s daňovou odpovědností,
        takže ho dělá člověk v aplikaci, kde vidí, co se přeskočilo a proč. Náhled
        tokenem projde.

        Každý doklad má vlastní transakci, takže rozepsaný zůstat nemůže. Při chybě se
        dávka ZASTAVÍ u prvního selhání (zbytek se ani nezkusí) a vrací 500
        `bulk_update_failed` se seznamem hotových i nezpracovaných dokladů — bez toho
        by uživatel u 200 dokladů nevěděl, kde má pokračovat.

        Po zásahu se přepočítá soudržnost dokladu: kde rozpor trvá, zůstane
        `oss_needs_manual_review` rozsvícený navzdory `clear_needs_review`
        (dotčené položky jsou v `documents[].keep_review`). Cache PDF se zahazuje;
        doklady, u nichž se to nepovedlo, jsou v `pdf_not_invalidated` — zápis
        je hotový, jen vytištěné PDF je potřeba obnovit ručně.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OssBulkUpdateInput'
                - type: object
                  required: [confirm]
                  properties:
                    confirm:
                      type: boolean
                      enum: [true]
                      description: Potvrzení náhledu. Bez něj 428.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OssBulkUpdateResult'
                  - type: object
                    properties:
                      completed_invoice_ids:
                        type: array
                        items: { type: integer, format: int64 }
                      pdf_not_invalidated:
                        type: array
                        items: { type: integer, format: int64 }
        '400': { description: 'Prázdný výběr, neznámý `scope`, nebo nic k nastavení' }
        '403': { description: 'Chybí oprávnění, klientský účet, nebo `token_write_forbidden` (bearer)' }
        '409': { description: OSS režim není v nastavení firmy aktivní }
        '422': { description: Víc než 200 dokladů najednou }
        '428':
          description: '`preview_required` — chybí `confirm: true`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: '`bulk_update_failed` — dávka se zastavila; `meta` nese, co je hotové'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      completed_invoice_ids:
                        type: array
                        items: { type: integer, format: int64 }
                      failed_invoice:
                        type: object
                        properties:
                          invoice_id: { type: integer, format: int64 }
                          varsymbol: { type: string, nullable: true }
                      not_attempted_invoice_ids:
                        type: array
                        items: { type: integer, format: int64 }
                      pdf_not_invalidated:
                        type: array
                        items: { type: integer, format: int64 }

  /api/v1/invoices/bulk-reminder:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
