    DocumentLinkCandidate:
      type: object
      properties:
        entity_type: { type: string, enum: [client, invoice, purchase_invoice, project, journal_entry, bank_transaction] }
        entity_id: { type: integer }
        label: { type: string }
        sublabel: { type: string }
        meta: { type: string }
    DocumentDmsMessage:
      type: object
      description: Metadata datové zprávy (ZFO) z ISDS
      properties:
        dm_id: { type: [string, "null"] }
        direction: { type: string, enum: [sent, received, unknown] }
        sender_box_id: { type: [string, "null"] }
        sender_name: { type: [string, "null"] }
        recipient_box_id: { type: [string, "null"] }
        recipient_name: { type: [string, "null"] }
        annotation: { type: [string, "null"], description: Předmět zprávy }
        delivery_time: { type: [string, "null"] }
        acceptance_time: { type: [string, "null"] }
    DocumentDetail:
      allOf:
        - { $ref: '#/components/schemas/Document' }
        - type: object
          properties:
            tags: { type: array, items: { type: string } }
            links: { type: array, items: { $ref: '#/components/schemas/DocumentLink' } }
            attachments: { type: array, items: { $ref: '#/components/schemas/Document' } }
            dms_message: { $ref: '#/components/schemas/DocumentDmsMessage' }
    Error:
      type: object
      required: [error]
      description: |
        Chybová obálka. Vedle `code` a `message` může objekt `error` nést doplňující
        klíče podle konkrétní chyby — nejčastěji `fields` u validace, dále například
        `items`, `candidates` nebo `suggestion`. Klienti by neznámé klíče měli tolerovat.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string, example: "Pole 'name' je povinné." }
            fields:
              type: object
              description: |
                Mapa pole → seznam chyb. Doprovází validační chyby (typicky `422`,
                u některých endpointů `400`) a říká, které konkrétní pole selhalo.
              additionalProperties:
                type: array
                items: { type: string }
              example: { name: ["Název zakázky je povinný"], payment_due_days: ["Splatnost musí být 1–365 dní"] }

    ListMeta:
      type: object
      description: "Stránkovací metadata seznamů (obálka `meta`)."
      required: [total]
      properties:
        total: { type: integer, example: 423, description: "Celkový počet záznamů přes všechny stránky" }
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 50 }
        pages: { type: integer, example: 9, description: "Celkový počet stránek" }

    ApiMe:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer }
            email: { type: string, format: email }
            name: { type: string }
            role: { type: string, enum: [admin, accountant, readonly] }
        supplier:
          oneOf:
            - $ref: '#/components/schemas/SupplierBrief'
            - { type: "null" }
        auth_method:
          type: string
          enum: [bearer, session]
        token:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                name: { type: string }
                prefix: { type: string, example: "mi_pat_abcd" }
                scope: { type: string, enum: [read, read_write] }
                expires_at: { type: [string, "null"], format: date-time }
            - { type: "null" }

    DomainContext:
      type: object
      required:
        [mode, hostname, origin, locked, supplier_id, purpose, feature_enabled,
         canonical_base_url, canonical_login_url]
      properties:
        mode:
          type: string
          enum: [canonical, custom]
        feature_enabled:
          type: boolean
          description: >-
            Vlastní domény jsou opt-in (`domains.enabled` v cfg.php). Vypnuté =
            každý hostname je canonical a správa domén se vůbec nenabízí.
        hostname:
          type: string
          format: hostname
        origin:
          type: string
          format: uri
        locked:
          type: boolean
          description: Aktivní vlastní doména autoritativně uzamyká tenant firmy.
        supplier_id:
          type: [integer, "null"]
        purpose:
          type: [string, "null"]
          enum: [portal, public_links, all, null]
          description: Hodnota `portal` označuje celé klientské rozhraní podle oprávnění role client.
        canonical_base_url:
          type: string
          format: uri
        canonical_login_url:
          type: string
          format: uri
          description: Canonical origin pro přihlášení a RP-bound WebAuthn operace.

    SupplierDomain:
      type: object
      required:
        [id, supplier_id, hostname, purpose, status, is_primary,
         is_primary_portal, is_primary_public, dns, verification_url,
         portal_url, public_base_url]
      properties:
        id: { type: integer, format: int64 }
        supplier_id: { type: integer }
        hostname: { type: string, format: hostname }
        purpose:
          type: string
          enum: [portal, public_links, all]
          description: Hodnota `portal` označuje celé klientské rozhraní podle oprávnění role client.
        status:
          type: string
          enum: [pending, verified, active, disabled, verification_failed]
        is_primary: { type: boolean }
        is_primary_portal: { type: boolean }
        is_primary_public: { type: boolean }
        verified_at: { type: [string, "null"], format: date-time }
        last_checked_at: { type: [string, "null"], format: date-time }
        verification_error: { type: [string, "null"] }
        dns:
          type: object
          required: [type, name, value]
          properties:
            type: { type: string, const: TXT }
            name: { type: string }
            value: { type: string }
        verification_url: { type: string, format: uri }
        portal_url: { type: string, format: uri }
        public_base_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SupplierBrief:
      type: object
      properties:
