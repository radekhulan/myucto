    post:
      tags: [Bank]
      summary: Odpojí transakci od faktury (a vrátí fakturu z paid → issued)
      responses:
        '200':
          description: OK

  /api/v1/bank-transactions/{id}/ignore:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Bank]
      summary: Označí transakci jako „ignorovat" (nesedí na žádnou fakturu)
      responses:
        '200':
          description: OK
        '409':
          description: Zaúčtovanou transakci nelze ignorovat (posted_transaction_cannot_be_ignored)

  /api/v1/bank-transactions/{id}/post:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Bank]
      summary: Ruční zaúčtování bankovní transakce (MD/D + volitelně založení pravidla)
      description: >
        Automatizace (mini-epic). Zaúčtuje nespárovanou transakci na zvolené účty
        (2 řádky, ABS(amount)). Saldokontní účty na ne-bankovní straně jsou zakázané
        (H2). Volitelný `create_rule` založí pravidlo (vždy mode=suggest) v téže transakci.
        Pro rozúčtování na víc řádků pošli `lines` — protiúčty z `debit_account_code`
        a `credit_account_code` se pak neuplatní.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debit_account_code, credit_account_code]
              properties:
                debit_account_code: { type: string }
                credit_account_code: { type: string }
                description: { type: [string, "null"] }
                lines:
                  type: array
                  description: |
                    Rozúčtování jedné transakce na víc řádků. Prázdné pole se ignoruje
                    (zaúčtuje se běžně na dvojici účtů); tvar řádků validuje až služba.
                  items: { type: object }
                create_rule: { type: [object, "null"] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal_entry_id: { type: integer }
                  document_no: { type: [string, "null"] }
                  rule_id: { type: [integer, "null"] }
                  similar:
                    type: [object, "null"]
                    properties:
                      count: { type: integer }
                      period_months: { type: integer }
                      last_seen: { type: [string, "null"] }
        '409':
          description: Transakce už je zaúčtovaná (already_posted)
        '422':
          description: Chybná kontace (rule_account_forbidden / account_not_found / foreign_currency …)

  /api/v1/bank-transactions/{id}/unpost:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Bank]
