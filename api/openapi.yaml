      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_number]
              properties:
                account_number: { type: string, maxLength: 40, example: '1000000005/0100' }
                bank_code: { type: [string, "null"], maxLength: 11, example: '0100' }
                iban: { type: [string, "null"], maxLength: 34 }
      responses:
        '201':
          description: Účet přidán nebo znovu aktivován
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientBankAccount' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/clients/{id}/bank-accounts/sync-registry:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Clients]
      summary: Synchronizuje účty partnera z registru plátců DPH
      responses:
        '200':
          description: Výsledek synchronizace a aktuální seznam účtů
          content:
            application/json:
              schema:
                type: object
