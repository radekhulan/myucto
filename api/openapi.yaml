                currency: { type: string, description: "ISO 4217, ne CZK" }
                fiscal_year: { type: integer }
                month: { type: integer, minimum: 0, maximum: 12 }
                rate: { type: number, exclusiveMinimum: 0, maximum: 9999999.999999 }
      responses:
        '200': { description: "OK {rates}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/fx-rate-settings/rates/{id}:
    delete:
      tags: [Accounting]
      summary: Smaže pevný kurz
