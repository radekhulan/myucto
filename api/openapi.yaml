  /api/v1/reports/submissions/settings:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Reports]
      summary: Nastavení kořenových složek důkazního archivu EPO
      responses:
        '200':
          description: Aktuální nastavení
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpoSubmissionSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Reports]
      summary: Uloží kořenové složky důkazního archivu EPO
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EpoSubmissionSettings' }
      responses:
        '200':
          description: Uložené nastavení
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpoSubmissionSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Vybraná složka neexistuje nebo nepatří aktuální firmě }

  /api/v1/reports/submissions/epo-credentials:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Reports]
      summary: Seznam osobních certifikátů přihlášeného uživatele pro EPO
      description: Nikdy nevrací PFX, soukromý klíč, heslo PFX ani jejich ciphertext.
      responses:
        '200':
          description: Certifikáty vlastníka včetně příznaku povolení pro aktuální firmu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EpoSigningCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Reports]
      summary: Zašifruje a uloží osobní P12/PFX certifikát pro přímé EPO
      description: |
        Vyžaduje session, znovu aktuální heslo a TOTP, pokud je u uživatele
        aktivní. Server odmítne ukládání bez samostatného
        `app.secret_encryption_key`. Certifikát se současně povolí pro aktuální firmu.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, label, pfx_password, password]
              properties:
                file: { type: string, format: binary, description: Soubor P12/PFX, nejvýše 256 KiB }
                label: { type: string, maxLength: 120 }
                pfx_password: { type: string, format: password }
                password: { type: string, format: password, description: Aktuální heslo uživatele }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '201':
          description: Veřejná metadata uloženého certifikátu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpoSigningCredential' }
        '400': { description: Neplatný PFX, heslo, certifikát nebo chybějící soukromý klíč }
        '401': { description: Step-up autentizace selhala }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Stejný certifikát už je uložen }
        '503': { description: Chybí samostatný šifrovací klíč nebo OpenSSL }

  /api/v1/reports/submissions/epo-credentials/{credentialId}/supplier:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
