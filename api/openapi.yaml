      responses:
        '200': { description: "OK {rates}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/repo-rates/{date}:
    delete:
      tags: [Accounting]
      summary: Smaže repo sazbu k datu
      description: Účetní/admin.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: date, required: true, schema: { type: string, format: date }, description: "Formát YYYY-MM-DD" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/accounting/offsets:
    get:
      tags: [Accounting]
      summary: Historie dohod o vzájemném zápočtu
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: status, schema: { type: string } }
      responses:
        '200': { description: "OK {items}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Accounting]
      summary: Vytvoří dohodu o zápočtu (koncept)
      description: Účetní/admin.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_id, agreement_date, items]
              properties:
                partner_id: { type: integer }
                agreement_date: { type: string, format: date }
                note: { type: [string, "null"] }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      doc_type: { type: string }
                      doc_id: { type: integer }
                      amount: { type: number }
      responses:
        '201': { description: "OK {agreement}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Neplatná kombinace dokladů, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/offsets/partners:
    get:
      tags: [Accounting]
      summary: Partneři s otevřenou pohledávkou i závazkem (kandidáti na zápočet)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200': { description: "OK {items}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/accounting/offsets/open:
    get:
      tags: [Accounting]
      summary: Otevřené faktury a přijaté faktury partnera pro sestavení zápočtu
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: partner_id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Partner nemá otevřené položky, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/offsets/{id}:
    get:
      tags: [Accounting]
      summary: Detail dohody o zápočtu
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Nekonzistentní stav dohody, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/accounting/offsets/{id}/confirm:
    post:
      tags: [Accounting]
      summary: Potvrdí dohodu — zaúčtuje a vyrovná saldokonto
      description: Účetní/admin.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK {agreement}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Dohoda už není v konceptu, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/offsets/{id}/cancel:
    post:
      tags: [Accounting]
      summary: Zruší dohodu (storno zápočtu + odvolání saldokonta)
      description: Účetní/admin.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK {agreement}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Dohodu nelze zrušit v aktuálním stavu, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/offsets/{id}/pdf:
    get:
      tags: [Accounting]
      summary: PDF dohody o zápočtu ke stažení
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Soubor PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/accounting/bank-accounts:
    get:
      tags: [Accounting]
      summary: Registr vlastních bankovních účtů firmy
      description: Vrací účty používané pro rozpoznání převodů mezi vlastními účty.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/SupplierBankAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/accounting/bank-accounts/{id}:
    patch:
      tags: [Accounting]
      summary: Upraví vlastní bankovní účet
      description: Účetní/admin. Mění klasifikaci a aktivaci účtu; cizí tenant vrací 404.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [current, savings, term_deposit] }
                label: { type: [string, "null"], maxLength: 120 }
                analytic_suffix:
                  type: [string, "null"]
                  pattern: '^[0-9]{1,6}$'
                  description: >-
                    Analytika účtu 221 (221<suffix>). Musí být v rámci firmy jedinečná —
                    obsazené číslo vrací 422. Prázdná hodnota u účtu BEZ analytiky znamená
                    „přiděl automaticky"; u účtu, který analytiku už má, je odmítnutá (422) —
                    analytiku lze jen změnit na jiné číslo, ne zrušit.
                is_active: { type: boolean }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierBankAccount' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/assets:
    get:
      tags: [Accounting]
      summary: Seznam karet dlouhodobého majetku (Epic F3)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: status, schema: { type: string, enum: [draft, in_use, disposed] } }
        - { in: query, name: q, description: "Fulltext (inventární číslo, název)", schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [Accounting]
      summary: Založí kartu majetku
      description: |
        Účetní/admin. Koncept; historický majetek (R23) lze založit rovnou `in_use`
        s opening poli. Validační matice druh × daňová metoda dle §26–33 ZDP;
        opening oprávky nesmějí překročit vstupní cenu a osobní automobil M1
        nesmí mít zvýšený odpis prvního roku. Neblokující upozornění vrací pole
        `warnings`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: "Sloupce karty majetku (inventory_number, name, kind, input_price, tax_method, tax_group, účty, účetní parametry…)" } } }
      responses:
        '201': { description: Vytvořená karta, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/assets/purchase-candidates:
    get:
      tags: [Accounting]
      summary: Přijaté faktury s příznakem majetku (kandidáti na kartu)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200': { description: "OK (id, varsymbol, vendor, částky, kurz, has_asset)", content: { application/json: { schema: { type: array, items: { type: object } } } } }

  /api/v1/accounting/assets/depreciations/book:
    post:
      tags: [Accounting]
      summary: Hromadné potvrzení a zaúčtování odpisů roku (R12)
      description: |
        Účetní/admin. Pro každý majetek v užívání (a vyřazený v daném roce) potvrdí
        daňový odpis a zaúčtuje účetní odpis (551 MD / oprávky D). Idempotentní —
        opakované spuštění přepíše in-place, dokud je období otevřené. Chyby per
        majetek vrací v poli `errors` (HTTP 200). Zaúčtovat lze pouze období, které
        už skončilo; probíhající nebo budoucí období vrací 409 `period_not_ended`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fiscal_year]
              properties:
                fiscal_year: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200': { description: "Souhrn {booked, skipped, total_accounting, total_tax, errors}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Období ještě neskončilo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/assets/{id}:
    get:
      tags: [Accounting]
      summary: Detail karty majetku (vč. TZ a zámků editace R13)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Accounting]
      summary: Upraví kartu majetku
      description: Účetní/admin. Daňové parametry a VC zamčené po prvním potvrzeném odpisu (422 `asset_locked`).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Accounting]
      summary: Smaže koncept nebo chybně zařazenou kartu majetku
      description: >-
        Účetní/admin. U karty v užívání atomicky odstraní i zápis zařazení.
        Operace je povolena jen bez potvrzených odpisů a technických zhodnocení;
        zápis zařazení musí být v otevřeném a neuzamčeném období.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Karta má účetní historii nebo je období uzavřené/uzamčené, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/accounting/assets/{id}/depreciation-plan:
    get:
      tags: [Accounting]
      summary: Plán odpisů (daňové i účetní, on-the-fly R11)
      description: >-
        Minulost z potvrzených řádků, budoucnost dopočtená strategií dle ZDP/ČÚS 013.
        Potvrzené řádky obsahují `depreciation_entry_id`; roky s aktivním účetním
        zápisem také `journal_entry_id`, přes které lze poslední odpis smazat.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK {asset_summary, tax, accounting}", content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/accounting/assets/{id}/depreciation-card:
    get:
      tags: [Accounting]
      summary: Inventární karta majetku ke stažení (§29–30 ZoÚ) — PDF
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Soubor PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/accounting/assets/{id}/put-into-use:
    post:
      tags: [Accounting]
      summary: Zařazení majetku do užívání (MD 02x / D 042)
      description: Účetní/admin. Jen koncept; `book_entry=false` pro historický majetek (R23).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                book_entry: { type: boolean, default: true }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
