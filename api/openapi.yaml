  /api/v1/vat-classifications/{id}:
    put:
      tags: [Codebooks]
      summary: Update VAT kódu (jen tenant rows, globální seed read-only)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VatClassificationInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VatClassification' }
        '403': { description: Globální seed je read-only }
    delete:
      tags: [Codebooks]
      summary: Smaže (nebo archivuje pokud má reference) VAT kód
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200': { description: Deleted/archived }

  # ── Roční daňové konstanty (globální číselník) ──────────────────────────
  /api/v1/codebooks/tax-constants:
    get:
      tags: [Codebooks]
      summary: Roční daňové konstanty (sazby, limity, paušály) za roky
      description: |
        GLOBÁLNÍ číselník (ne per-supplier) — efektivní hodnoty per rok s příznakem
        `is_override` (přepis výchozích konstant z migrace) vs. výchozí seed.
        Slouží daňovému optimalizátoru a EPO výkazům (DPFO/DPPO).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  years:
                    type: array
                    items: { $ref: '#/components/schemas/TaxConstantsYear' }

  /api/v1/codebooks/tax-constants/{year}:
    parameters:
      - in: path
        name: year
        required: true
        schema: { type: integer, minimum: 2018, maximum: 2100 }
    put:
      tags: [Codebooks]
      summary: Uloží override daňových konstant pro rok (jen admin)
      description: |
        Přepíše výchozí konstanty pro daný rok. Tělo lze poslat buď jako plochý
        objekt, nebo zabalené v `{ "data": { ... } }`. Skalární klíče jsou povinné
        (sazby, limity), vnořené (`band_ceilings`, `expense_caps`, `child_credits`)
        musí být objekty/pole. Paušální daň se posílá jako rozvrh měsíčních záloh
        `pausal_monthly` (roční `pausal_annual` je odvozená a neukládá se; přijme se
        jen kvůli zpětné kompatibilitě, když rozvrh chybí).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxConstantsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  year:        { type: integer }
                  is_override: { type: boolean, example: true }
                  data:        { type: object }
        '403': { description: Pouze admin }
        '422': { description: Neplatný rok / validace selhala }
    delete:
      tags: [Codebooks]
      summary: Reset roku na výchozí konstanty (smaže override, jen admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  year:        { type: integer }
                  is_override: { type: boolean, example: false }
                  data:        { type: object }
        '403': { description: Pouze admin }

  /api/v1/codebooks/oss-member-state-rates:
    get:
      tags: [Codebooks]
      summary: Sazby DPH členských států pro OSS (kontrolní číselník)
      description: |
        GLOBÁLNÍ číselník (ne per-supplier), proti kterému se ověřuje sazba na OSS řádku
        dokladu — není to nabídka sazeb PRO doklad (ta je v `/codebooks/vat-rates`).
        Vrací i vyřazené a uživatelem doplněné řádky; rozlišuje je `is_custom` a `disabled`.
        `effective_valid_to` = `COALESCE(valid_to_override, valid_to)`, tedy konec platnosti,
        se kterým se skutečně počítá.

        `available = false` znamená, že tabulka v databázi není (chybí migrace 1152) —
        v tom stavu se neověřuje ŽÁDNÝ stát, což je jiná situace než prázdný číselník.
        `manageable = false` znamená chybějící migraci 1296, tedy číselník jen ke čtení.

        Zápis (doplnění vlastní sazby, zkrácení platnosti, vyřazení) je záměrně mimo
        veřejné API: mění autoritu společnou pro všechny firmy v instanci, takže je
        dostupný jen správci instance z webového rozhraní.
      parameters:
        - in: query
          name: country
          required: false
          schema: { type: string, minLength: 2, maxLength: 2, example: PL }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:  { type: boolean, example: true }
                  manageable: { type: boolean, example: true }
                  can_write:  { type: boolean, example: false }
                  rate_types:
                    type: array
                    items: { type: string, enum: [standard, reduced, second_reduced, parking] }
                  rates:
                    type: array
                    items: { $ref: '#/components/schemas/OssMemberStateRate' }

  # ── Purchase invoices — chybějící endpointy ──────────────────────────────
  /api/v1/purchase-invoices/export:
    get:
      tags: [Purchase invoices]
      summary: Hromadný export přijatých faktur za měsíc nebo čtvrtletí (PDF ZIP / ISDOC ZIP / Pohoda dataPack)
      description: |
        `pdf-zip`: ZIP s jedním PDF na fakturu. Preferuje archivovaný **originál**
        od dodavatele (`Prijata-{vs}-{vendor}.pdf`); pokud originál chybí, doplní
        **naši rekonstrukci** z dat faktury (`Prijata-{vs}-{vendor}-rekonstrukce.pdf`).
        Počet rekonstrukcí je v hlavičce `X-Export-Reconstructed`.

        `isdoc` / `pohoda`: generují XML z dat faktury (PDF nepotřebují).
        ISDOC obsahuje také evidovaný bankovní účet dodavatele a platební
        variabilní symbol. Číslo dokladu dodavatele je v kořenovém `ID`, interní
        číslo MyInvoice v namespacovaném `Extensions/myi:InternalDocumentNumber`.

        Období lze zadat legacy parametrem `month=YYYY-MM`, nebo explicitně
        `period=monthly&year=YYYY&month=M` / `period=quarterly&year=YYYY&quarter=1..4`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: month, schema: { oneOf: [{ type: string, pattern: '^\d{4}-\d{2}$' }, { type: integer, minimum: 1, maximum: 12 }] } }
        - { in: query, name: period, schema: { type: string, enum: [monthly, quarterly] } }
        - { in: query, name: year, schema: { type: integer, minimum: 1900, maximum: 2100 } }
        - { in: query, name: quarter, schema: { type: integer, minimum: 1, maximum: 4 } }
        - { in: query, name: format, required: true, schema: { type: string, enum: [pdf-zip, isdoc, pohoda] } }
        - { in: query, name: date_by, schema: { type: string, enum: [tax, issue, received] } }
      responses:
        '200':
          description: ZIP nebo XML stream
          headers:
            X-Export-Warnings:
              schema: { type: string }
              description: Per-invoice warnings (poškozený originál, selhání rekonstrukce)
            X-Export-Reconstructed:
              schema: { type: integer }
              description: Počet faktur, u kterých se místo originálu vložila naše rekonstrukce (jen pdf-zip)

  /api/v1/purchase-invoices/{id}/activity:
    get:
      tags: [Purchase invoices]
      summary: Activity log pro přijatou fakturu
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200': { description: List events }

  # ── CRM dashboard endpoints ──────────────────────────────────────────────
  /api/v1/crm/overview:
    get:
      tags: [CRM]
      summary: KPI overview (current month + last + YTD + trailing 12m + prev year per currency)
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      responses: { '200': { description: KPI } }

  /api/v1/crm/monthly:
    get:
      tags: [CRM]
      summary: Monthly history (revenue/costs/profit per měsíc)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12, minimum: 1, maximum: 36 } }
        - { in: query, name: currency, schema: { type: string } }
      responses: { '200': { description: Monthly rows } }

  /api/v1/crm/top-clients:
    get:
      tags: [CRM]
      summary: Top klienti podle revenue
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
        - { in: query, name: limit, schema: { type: integer, default: 10 } }
        - { in: query, name: currency, schema: { type: string } }
      responses: { '200': { description: Top klienti } }

  /api/v1/crm/top-vendors:
    get:
      tags: [CRM]
      summary: Top dodavatelé podle costs
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
        - { in: query, name: limit, schema: { type: integer, default: 10 } }
      responses: { '200': { description: Top dodavatelé } }

  /api/v1/crm/aging-receivables:
    get:
      tags: [CRM]
      summary: Aging buckets pohledávek
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      responses: { '200': { description: Buckets not_due / overdue_30 / 60 / 90 / 90+ } }

  /api/v1/crm/aging-payables:
    get:
      tags: [CRM]
      summary: Aging buckets závazků
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      responses: { '200': { description: Buckets } }

  /api/v1/crm/dso:
    get:
      tags: [CRM]
      summary: Days Sales Outstanding (průměrná doba inkasa)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
      responses: { '200': { description: 'avg_days + sample_size' } }

  /api/v1/crm/payment-punctuality:
    get:
      tags: [CRM]
      summary: "% faktur zaplacených včas"
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
      responses: { '200': { description: 'on_time_pct + counts' } }

  /api/v1/crm/concentration:
    get:
      tags: [CRM]
      summary: Riziko koncentrace (Top 1/3/5 klient share + Pareto count)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
        - { in: query, name: currency, schema: { type: string } }
      responses: { '200': { description: 'top1_share + pareto_80_count + risk_level' } }

  /api/v1/crm/expense-breakdown:
    get:
      tags: [CRM]
      summary: Náklady per kategorie
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
      responses: { '200': { description: Per-category totals } }

  /api/v1/crm/churn-risk:
    get:
      tags: [CRM]
      summary: Klienti dlouho bez objednávky
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: days, schema: { type: integer, default: 60 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses: { '200': { description: Churn risk klienti } }

  /api/v1/crm/action-items:
    get:
      tags: [CRM]
      summary: Daily TODO (overdue, bank unmatched, recurring due, payables, purchase drafts, unbooked, tax/SHV deadlines, churn)
      description: |
        Vrací položky `items[]` (typ `type`: `overdue_invoices`, `bank_unmatched`,
        `recurring_due`, `overdue_payables`, `purchase_drafts`, `unbooked_documents`,
        `journal_integrity`, `tax_deadline`, `shv_deadline`, `churn_risk`), každá s
        `severity`, `title`, `hint`, `link` a volitelně `count`/`days`. Položka
        `unbooked_documents` (jen firmy v podvojném účetnictví) navíc nese
        `breakdown[]` s rozpadem `{ key: invoices|purchase_invoices|bank, count, link }`.
        Položka `journal_integrity` (též jen podvojné účetnictví) nese `breakdown[]`
        s typy nálezů `{ key: orphan_entry|unbalanced_entry|booked_without_entry|entry_without_booked|amount_mismatch, count, link }`
        z posledního běhu nočního integrity jobu. Plus `total` a `dismissed_count`.
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      responses: { '200': { description: 'items + total + dismissed_count' } }

  /api/v1/crm/cash-flow-forecast:
    get:
      tags: [CRM]
      summary: Cash flow prognóza N týdnů dopředu
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: weeks, schema: { type: integer, default: 4, minimum: 1, maximum: 12 } }
        - { in: query, name: currency, schema: { type: string, default: CZK } }
      responses: { '200': { description: 'weeks[] + total_in/out/net' } }

  /api/v1/crm/late-risk:
    get:
      tags: [CRM]
      summary: Late payment risk score per klient
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: limit, schema: { type: integer, default: 10 } }
      responses: { '200': { description: Top risky klienti } }

  /api/v1/crm/reminder-effectiveness:
    get:
      tags: [CRM]
      summary: Funnel zaplaceno po N. upomínce
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
      responses: { '200': { description: 'no_reminder + after_first/_second/_third_plus + never_paid' } }

  /api/v1/crm/payment-time-histogram:
    get:
      tags: [CRM]
      summary: Distribuce doby inkasa (buckets 0-7, 8-14, 15-30, 31-60, 61+)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
      responses: { '200': { description: 'buckets[] + median + p90' } }

  /api/v1/crm/recompute:
    post:
      tags: [CRM]
      summary: Manuální přepočet pre-aggregated stats (admin)
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      responses:
        '200': { description: 'ok + elapsed_ms' }
        '403': { description: Pouze admin }

  /api/v1/crm/tax-calendar:
    get:
      tags: [CRM]
      summary: Daňový kalendář — DPH/KH/SH + zálohy (E9) + roční DPFO/DPPO
      description: |
        Fáze F (audit 2026-07 P2/S). Širší okno než action-items; každá položka
        (krom `tax_advance`) nese `submitted`/`submitted_at` odvozené z archivu
        `tax_submissions`. Typy: `tax_deadline` (DPH), `kh_deadline`, `shv_deadline`,
        `tax_advance` (zálohy E9, má `status` planned|paid a `amount` místo submitted),
        `income_tax_deadline` (roční DPFO/DPPO — standardní termíny 1.4./1.-2.5.,
        bez varianty "s poradcem"; vynecháno pro OSVČ v paušálním režimu).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: max_days_ahead, schema: { type: integer, default: 90, minimum: 1, maximum: 365 } }
      responses: { '200': { description: 'items[] + total' } }

  # ─────────────────────────────── Portfolio ───────────────────────────────
  /api/v1/portfolio/overview:
    get:
      tags: [Portfolio]
      summary: Přehled firem pro účetní kancelář (cross-supplier)
      description: |
        Fáze F (audit 2026-07 P2/M). NENÍ scoped na X-Supplier-Id — agreguje přes
        firmy z `user_suppliers` přihlášeného uživatele (admin/uživatel bez membership
        řádků vidí vše). Per firma: nejbližší daňový termín, počty nezaúčtovaných
        dokladů / nespárovaných bankovních plateb / konceptů PF, stav účetního období
        a datum posledního importu bankovního výpisu. Role client bez přístupu.
      responses: { '200': { description: 'companies[] + total + generated_at' } }

  # ─────────────────────────────── Dokumenty ───────────────────────────────
  /api/v1/documents:
    get:
      tags: [Documents]
      summary: Seznam dokumentů a podsložek v dané složce
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: folder_id, in: query, schema: { type: [integer, "null"] }, description: 'NULL/prázdné = kořen' }
        - { name: doc_type, in: query, schema: { type: string, enum: [pdf, docx, xlsx, xml, zfo, p7s, zip, image, other] } }
      responses:
        '200':
          description: Výpis složky
          content:
            application/json:
              schema:
                type: object
                properties:
                  breadcrumb: { type: array, items: { $ref: '#/components/schemas/DocumentBreadcrumb' } }
                  folders: { type: array, items: { $ref: '#/components/schemas/DocumentFolder' } }
                  documents: { type: array, items: { $ref: '#/components/schemas/Document' } }
                  max_file_bytes: { type: integer }
    post:
      tags: [Documents]
      summary: Nahrání souborů (multipart). ZFO se automaticky rozbalí; ZIP dle zip_mode.
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                'file[]': { type: array, items: { type: string, format: binary } }
                folder_id: { type: [integer, "null"] }
                zip_mode: { type: string, enum: [explode, keep], default: keep }
                'relpaths[]': { type: array, items: { type: string }, description: 'Relativní cesty složek pro upload adresáře' }
      responses:
        '200':
          description: Souhrn nahrání
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skipped: { type: array, items: { type: object } }
                  errors: { type: array, items: { type: object } }
  /api/v1/documents/search:
    get:
      tags: [Documents]
      summary: Fulltextové vyhledávání v názvech, popisech a obsahu (MariaDB FULLTEXT)
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200':
          description: Výsledky
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: array, items: { $ref: '#/components/schemas/Document' } }
                  query: { type: string }
  /api/v1/documents/link-search:
    get:
      tags: [Documents]
      summary: Našeptávač pro párování — hledá faktury, přijaté faktury, klienty a projekty
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: types, in: query, schema: { type: string }, description: 'CSV filtr: invoice,purchase_invoice,client,project' }
      responses:
        '200':
          description: Kandidáti pro vazbu
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/DocumentLinkCandidate' } }
                  query: { type: string }
  /api/v1/documents/{id}/text:
    get:
      tags: [Documents]
      summary: Omezený úsek vytěženého textu dokumentu
      description: |
        Vrací text získaný OCR nebo extrakcí, nikdy binární obsah souboru.
        Výstup je stránkovaný po znacích a zachovává tenantový i osobní scope dokumentu.
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: max_chars, in: query, schema: { type: integer, minimum: 1000, maximum: 50000, default: 20000 } }
      responses:
        '200':
          description: Úsek vytěženého textu a informace pro pokračování
          content:
            application/json:
              schema:
                type: object
                required: [id, text_status, offset, max_chars, total_chars, has_more, content]
                properties:
                  id: { type: integer }
                  text_status: { type: string }
                  offset: { type: integer }
                  max_chars: { type: integer }
                  total_chars: { type: integer }
                  has_more: { type: boolean }
                  content: { type: [string, "null"] }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{id}:
    get:
      tags: [Documents]
      summary: Detail dokumentu (vč. tagů, vazeb, příloh a ZFO metadat)
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Dokument, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }
        '404': { description: Nenalezeno }
    patch:
      tags: [Documents]
      summary: Editace metadat (název, popis, tagy)
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: [string, "null"] }
                tags: { type: array, items: { type: string } }
      responses:
        '200': { description: Aktualizovaný dokument, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }
    delete:
      tags: [Documents]
      summary: Přesun do koše (soft-delete)
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
  /api/v1/documents/{id}/download:
    get:
      tags: [Documents]
      summary: Stažení souboru (Content-Disposition attachment)
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Binární obsah souboru, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /api/v1/documents/{id}/links:
    post:
      tags: [Documents]
      summary: Připojit dokument k entitě (faktura / přijatá faktura / klient / projekt)
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id]
              properties:
                entity_type: { type: string, enum: [client, invoice, purchase_invoice, project, journal_entry, bank_transaction] }
                entity_id: { type: integer }
      responses:
        '200': { description: Aktuální vazby, content: { application/json: { schema: { type: object, properties: { links: { type: array, items: { $ref: '#/components/schemas/DocumentLink' } } } } } } }
    delete:
      tags: [Documents]
      summary: Odpojit vazbu dokumentu na entitu
      description: '`entity_type`/`entity_id` lze poslat v těle nebo jako query parametry.'
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_type: { type: string, enum: [client, invoice, purchase_invoice, project, journal_entry, bank_transaction] }
                entity_id: { type: integer }
      responses:
        '200': { description: Aktuální vazby, content: { application/json: { schema: { type: object, properties: { links: { type: array, items: { $ref: '#/components/schemas/DocumentLink' } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/documents/by-entity/{type}/{id}:
    get:
      tags: [Documents]
      summary: Dokumenty navázané na entitu (oboustranné párování)
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: type, in: path, required: true, schema: { type: string, enum: [client, invoice, purchase_invoice, project, journal_entry, bank_transaction] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Navázané dokumenty, content: { application/json: { schema: { type: object, properties: { documents: { type: array, items: { $ref: '#/components/schemas/Document' } } } } } } }
  /api/v1/document-folders:
    get:
      tags: [Documents]
      summary: Strom složek (bez parametru celý plochý seznam, s parent_id přímé potomky)
      parameters:
        - { $ref: '#/components/parameters/SupplierIdHeader' }
        - { name: parent_id, in: query, schema: { type: [integer, "null"] } }
      responses:
        '200': { description: Složky, content: { application/json: { schema: { type: object, properties: { folders: { type: array, items: { $ref: '#/components/schemas/DocumentFolder' } } } } } } }
    post:
      tags: [Documents]
      summary: Vytvoření složky
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id: { type: [integer, "null"] }
      responses:
        '200': { description: ok }

  # ─────────────────────────── Pravidelné fakturace ────────────────────────
  /api/v1/recurring:
    get:
      tags: [Recurring]
      summary: Seznam šablon pravidelných fakturací
      description: |
        Stránkovaný seznam šablon aktuálního supplier-a. `meta.summary` obsahuje
        součet částek per měna + přepočet na CZK (dnešní ČNB kurz, pokud je víc měn).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: client_id, schema: { type: integer } }
        - { in: query, name: status, schema: { type: string, enum: [active, paused, expired] } }
        - { in: query, name: sort, schema: { type: string, enum: [client, next_run, amount_czk] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 5, maximum: 200, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RecurringTemplate' }
                  meta: { type: object }
    post:
      tags: [Recurring]
      summary: Vytvoří šablonu pravidelné fakturace
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringTemplateInput' }
      responses:
        '201':
          description: Vytvořeno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringTemplate' }
        '400':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/recurring/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Recurring]
      summary: Detail šablony
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringTemplate' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Recurring]
      summary: Aktualizace šablony
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringTemplateInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringTemplate' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Recurring]
      summary: Smaže šablonu
      responses:
        '200': { description: 'OK ({ deleted: true })' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recurring/{id}/invoices:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Recurring]
      summary: Faktury vygenerované z této šablony
      description: Flat list (poslední první) — id, varsymbol, typ, stav, data, částky, currency.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }

  /api/v1/recurring/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Recurring]
      summary: Pozastaví šablonu (status → paused)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringTemplate' }

  /api/v1/recurring/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Recurring]
      summary: Obnoví pozastavenou šablonu (status → active, přepočet next_run)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringTemplate' }
        '409': { description: 'Šablona vypršela (next_run > end_date)' }

  /api/v1/recurring/{id}/run-now:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Recurring]
      summary: Manuální spuštění šablony (vygeneruje fakturu / koncept)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                issue_date: { type: string, format: date, description: Vynucené datum vystavení }
                draft: { type: boolean, description: 'true = vytvořit koncept i u šablony s auto_issue' }
      responses:
        '201':
          description: 'Vygenerováno (invoice_id, varsymbol, issued, sent_to, new_next_run_date, template_status)'
        '409': { description: Šablonu nelze spustit (vypršela / chyba generování) }

  # ── Vydané faktury — párování zálohy ─────────────────────────────────────
  /api/v1/invoices/{id}/advance-candidates:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [InvoiceOps]
      summary: Nespárované zálohové faktury (proforma) téhož odběratele
      description: Kandidáti pro propojení daňového dokladu se zálohou.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates: { type: array, items: { type: object } }

  /api/v1/invoices/{id}/final-candidates:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [InvoiceOps]
      summary: Daňové doklady, se kterými lze tuto zálohu (proforma) spárovat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates: { type: array, items: { type: object } }

  /api/v1/invoices/{id}/link-advance:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [InvoiceOps]
      summary: Propojí daňový doklad se zálohovou fakturou
      description: Uloží `parent_invoice_id` a doplní `advance_paid_amount`, pokud na faktuře ještě žádná záloha není.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [advance_id]
              properties:
                advance_id: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '409': { description: Propojení selhalo }
    delete:
      tags: [InvoiceOps]
      summary: Zruší propojení se zálohou
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }

  # ── Přijaté faktury — párování zálohy ────────────────────────────────────
  /api/v1/purchase-invoices/{id}/advance-candidates:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Purchase invoices]
      summary: Nespárované zálohové přijaté faktury téhož dodavatele
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates: { type: array, items: { type: object } }

  /api/v1/purchase-invoices/{id}/settlement-candidates:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Purchase invoices]
      summary: Vyúčtovací faktury, se kterými lze tuto zálohu spárovat (opačný směr)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates: { type: array, items: { type: object } }

  /api/v1/purchase-invoices/{id}/link-advance:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Purchase invoices]
      summary: Propojí finální přijatou fakturu se zálohovou (proti dvojímu nákladu)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [advance_id]
              properties:
                advance_id: { type: integer, format: int64 }
      responses:
        '200': { description: 'OK (aktualizovaná faktura vč. linked_advance)' }
        '409': { description: Propojení selhalo }
    delete:
      tags: [Purchase invoices]
      summary: Zruší propojení se zálohou
      responses:
        '200': { description: OK }

  /api/v1/purchase-invoices/{id}/advance-suggestion:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Purchase invoices]
      summary: Zamítne automatický návrh na spárování zálohy
      responses:
        '200': { description: OK }

  /api/v1/purchase-invoices/{id}/dismiss-extraction-warning:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Purchase invoices]
      summary: Skryje varování z AI/automatické extrakce dokladu
      responses:
        '200': { description: OK }

  # ── CRM dashboard — doplňující endpointy ─────────────────────────────────
  /api/v1/crm/yearly:
    get:
      tags: [CRM]
      summary: Historie tržeb/nákladů/zisku po rocích
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: currency, schema: { type: string } }
      responses: { '200': { description: Roční řady } }

  /api/v1/crm/dpo:
    get:
      tags: [CRM]
      summary: Days Payable Outstanding (Ø doba úhrady dodavatelům)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
      responses: { '200': { description: 'avg_days + sample_size' } }

  /api/v1/crm/vendor-concentration:
    get:
      tags: [CRM]
      summary: Riziko koncentrace nákladů (Top dodavatelé share + Pareto)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
        - { in: query, name: currency, schema: { type: string } }
      responses: { '200': { description: 'top1_share + pareto_80_count + risk_level' } }

  /api/v1/crm/revenue-breakdown:
    get:
      tags: [CRM]
      summary: Tržby per kategorie tržeb
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: months, schema: { type: integer, default: 12 } }
        - { in: query, name: currency, schema: { type: string } }
      responses: { '200': { description: Per-category totals } }

  /api/v1/crm/action-items/dismiss:
    post:
      tags: [CRM]
      summary: Skryje položku action-items (den / týden / natrvalo)
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_type, mode]
              properties:
                item_type: { type: string }
                mode: { type: string, description: 'day | week | forever | historical' }
      responses:
        '200': { description: ok }
        '400': { description: Neplatný vstup }

  /api/v1/crm/action-items/restore:
    post:
      tags: [CRM]
      summary: Vrátí (un-dismiss) skrytou položku action-items
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_type]
              properties:
                item_type: { type: string }
      responses:
        '200': { description: ok }

  /api/v1/crm/action-items/restore-all:
    post:
      tags: [CRM]
      summary: Vrátí všechny skryté položky action-items aktuálního uživatele
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      responses:
        '200': { description: 'ok + restored (počet)' }

  # ── Dashboard náklady ────────────────────────────────────────────────────
  /api/v1/dashboard/purchase-summary:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Reports]
      summary: Dashboard nákladů (zrcadlo summary nad přijatými fakturami)
      description: |
        Agregace pro stránku **Náklady** nad `purchase_invoices`: KPI per měna
        (this/prev year + YoY), po splatnosti/nezaplacené závazky, top dodavatelé
        (YTD/loni/rolling 12m), náklady po měsících/rocích, rolling 12m, cash-outflow,
        aging závazků, forecast, rozpad DPH na vstupu (12m), rozpad nákladů po
        kategoriích, histogramy. VAT-aware (`is_vat_payer`). Zálohy se vyřazují
        z nákladů dle cash sémantiky (zaplaceno a nespárováno).
      responses:
        '200': { description: OK }

  # ── Daňový optimalizátor ─────────────────────────────────────────────────
  /api/v1/tax/analysis:
    get:
      tags: [Tax]
      summary: Daňová analýza za rok (retrospektiva nebo projekce)
      description: |
        Uzavřený rok → `mode: retrospective` (srovnání režimů na skutečném příjmu +
        YoY). Běžící rok → `mode: forecast` (YTD příjem + projekce a sledování limitů
        DPH/paušál). Vrací `profile`, `constants`, `available_years`, `is_vat_payer`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, schema: { type: integer }, description: 'Default = aktuální rok' }
      responses:
        '200': { description: OK }
        '400': { description: Žádný supplier scope }
        '422': { description: Neplatný rok }

  /api/v1/tax/profile:
    put:
      tags: [Tax]
      summary: Uloží daňový profil supplier-a pro rok
      description: |
        Profil pro optimalizátor — paušál/skutečné výdaje, sleva na manžela, počet
        dětí, úroky z hypotéky, penzijní/životní pojištění, dary, pásmo paušální daně.
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxProfileInput' }
      responses:
        '403':
          description: |
            Zápis přes API token (`token_write_forbidden`). Účetní a daňová vrstva
            je přes token jednosměrná — čtení ano, zápis jen z webového rozhraní,
            a to i tokenu se scope `read_write`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: 'OK ({ profile: {...} })' }
        '400': { description: Žádný supplier scope }
        '422': { description: Neplatný rok }

  # ── Klienti / vyhledávání — doplňující endpointy ─────────────────────────
  /api/v1/clients/{id}/vat-status:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Lookup]
      summary: Online ověření plátcovství DPH klienta (ARES dle IČO / VIES dle DIČ)
      description: |
        Ověří a uloží `clients.is_vat_payer`. Když registr nerozhodne, vrátí dosud
        uložený příznak. ARES/VIES cache (24 h) → opakované volání nezatěžuje registry.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  is_vat_payer: { type: boolean }
                  source: { type: string, enum: [ares, vies, unknown] }
                  ic: { type: [string, "null"] }
                  dic: { type: [string, "null"] }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/clients/lookup-bank:
    post:
      tags: [Lookup]
      summary: Zveřejněné bankovní účty z registru plátců DPH (CRPDPH) dle DIČ
      description: |
        Vrátí účty zveřejněné v registru plátců DPH (MFČR) + příznak nespolehlivého
        plátce. Vhodné při zakládání dodavatele (předvyplnění účtu z DIČ).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dic]
              properties:
                dic:
                  type: string
                  description: DIČ — 8–10 číslic (s i bez prefixu CZ)
                  example: "CZ27082440"
      responses:
        '200': { description: 'OK (účty + nespolehlivý plátce)' }
        '400': { description: Neplatné DIČ }

  /api/v1/search:
    get:
      tags: [Lookup]
      summary: Globální vyhledávač (klienti/dodavatelé + vydané/přijaté faktury)
      description: Min. 2 znaky, jinak prázdné výsledky. Tenant scope dle supplier-a.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: q, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  q: { type: string }
                  clients: { type: array, items: { type: object } }
                  invoices: { type: array, items: { type: object } }
                  purchase_invoices: { type: array, items: { type: object } }

  # ── Reports — doplňující endpointy ───────────────────────────────────────
  /api/v1/reports/dphdp3/settings:
    get:
      tags: [Reports]
      summary: Nastavení relevantní pro DPH přiznání (perioda, kód FÚ, plátcovství)
      parameters: [{ $ref: '#/components/parameters/SupplierIdHeader' }]
      responses: { '200': { description: Settings } }

  /api/v1/reports/dphdp3/trend:
    get:
      tags: [Reports]
      summary: Trend daňové povinnosti DPH za více období
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, schema: { type: integer } }
      responses: { '200': { description: Časová řada } }

  /api/v1/reports/dphdp3/drafts-prediction:
    get:
      tags: [Reports]
      summary: Predikce dopadu konceptů na příští DPH přiznání
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: month, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { in: query, name: quarter, schema: { type: integer, minimum: 1, maximum: 4 } }
      responses: { '200': { description: Predikce } }

  /api/v1/reports/dphdp3/post-filing-changes:
    get:
      tags: [Reports]
      summary: Doklady změněné po podání DPH přiznání (kandidáti na dodatečné přiznání)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, required: true, schema: { type: integer } }
        - { in: query, name: month, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { in: query, name: period, schema: { type: string, enum: [monthly, quarterly] } }
      responses:
        '200': { description: "OK {has_filing, snapshot_available, submission, documents}", content: { application/json: { schema: { type: object } } } }
        '400': { description: Neplatné parametry období, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Pouze admin/accountant }

  /api/v1/reports/vat-coefficient:
    get:
      tags: [Reports]
      summary: § 76 koeficient krácení nároku na odpočet DPH
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, required: true, schema: { type: integer, minimum: 2020, maximum: 2050 } }
      responses:
        '200': { description: "OK {year, provisional_percent, resolved_provisional_percent, carried_forward, final_percent, numerator_czk, denominator_czk, settled_at}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    put:
      tags: [Reports]
      summary: Nastaví zálohový koeficient na rok
      description: Účetní/admin.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, provisional_percent]
              properties:
                year: { type: integer }
                provisional_percent: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200': { description: "OK {year, provisional_percent}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/reports/vat-coefficient/settle:
    post:
      tags: [Reports]
      summary: Roční vypořádání koeficientu §76
      description: Admin-only.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              properties:
                year: { type: integer }
      responses:
        '200': { description: "OK {year, final_percent, numerator_czk, denominator_czk}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Neplatný rok nebo chybí podklady, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/reports/cnb-rate-audit:
    get:
      tags: [Reports]
      summary: Audit kurzů vs. ČNB — cizoměnové doklady s odchylkou (§C / K4)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: threshold, schema: { type: number }, description: "Práh odchylky v %, default ~0.5" }
      responses:
        '200': { description: "OK {from, to, threshold_percent, items, missing_cnb_count, fixed_mode_skipped}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports/invoice-series-completeness:
    get:
      tags: [Reports]
      summary: Úplnost číselné řady vydaných dokladů — mezera je auditní signál pro FÚ
      description: |
        Read-only, nic neopravuje. Faktury a dobropisy sdílející jednu šablonu (stejný digit skeleton) se posuzují jako jedna řada, aby se nehlásily falešné mezery způsobené tím druhým typem dokladu.

        Skenují se všechny tři osy číslování — dodavatel, klient s vlastní šablonou a kategorie tržby s vlastní šablonou. Doklad patří právě do jedné řady podle priority `klient → kategorie tržby → dodavatel`; skupinu v odpovědi rozlišuje dvojice `client_id` a `revenue_category_id` (0 = osa se neuplatnila).

        Výčet `missing` (a `missing_preview`) je v každém období stropovaný na 500 položek, protože jediné chybně zadané číslo posune horní hranici řady o několik řádů. Skutečný počet mezer je vždy v `missing_total` a useknutí hlásí `missing_truncated`; souhrnné `total_missing` sčítá `missing_total`, ne délku výčtu.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, schema: { type: integer, minimum: 2000, maximum: 2100 }, description: "Default aktuální rok. Řady s period='none' (bez ročního resetu counteru) se skenují vždy celé bez ohledu na year." }
      responses:
        '200': { description: "OK {year, series, total_missing}", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports/dph-book/preview:
    get:
      tags: [Reports]
      summary: Náhled Knihy DPH (interní VAT žurnál, vždy měsíční)
      description: Interní pomůcka — NENÍ EPO podání.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, required: true, schema: { type: integer } }
        - { in: query, name: month, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses: { '200': { description: Summary řádků žurnálu } }

  /api/v1/reports/dph-book:
    get:
      tags: [Reports]
      summary: Stáhne PDF Knihy DPH za měsíc
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, required: true, schema: { type: integer } }
        - { in: query, name: month, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200':
          description: PDF download
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /api/v1/reports/oss/preview:
    get:
      tags: [Reports]
      summary: Náhled OSS přiznání
      description: Kvartální podklad One Stop Shop z vydaných faktur. Zařazení řádku do OSS se odvozuje automaticky ze sazby, země odběratele a číselníku sazeb členských států. Vyžaduje zapnutý OSS režim v nastavení firmy.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, required: true, schema: { type: integer, minimum: 2020, maximum: 2050 } }
        - { in: query, name: quarter, required: true, schema: { type: integer, minimum: 1, maximum: 4 } }
      responses:
        '200':
          description: OSS souhrn podle zemí a sazeb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OssPreview' }
        '409': { description: OSS režim není v nastavení firmy aktivní (`oss_disabled`) }

  /api/v1/reports/oss:
    get:
      tags: [Reports]
      summary: OSS XML export
      description: EPO XML pro OSS EU režim (OSSEI1) z vydaných faktur; zařazení řádku do OSS se odvozuje automaticky. Běžná plnění generuje jako VetaR a opravy minulých období jako VetaO. Vyžaduje zapnutý OSS režim v nastavení firmy.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, required: true, schema: { type: integer, minimum: 2020, maximum: 2050 } }
        - { in: query, name: quarter, required: true, schema: { type: integer, minimum: 1, maximum: 4 } }
      responses:
        '200':
          description: XML download
          content:
            application/xml: {}
        '409': { description: OSS režim není v nastavení firmy aktivní (`oss_disabled`) }

  /api/v1/reports/oss/threshold:
    get:
      tags: [Reports]
      summary: Práh 10 000 EUR pro OSS (§ 8 odst. 3 ZDPH)
      description: |
        Sleduje překročení celoevropského prahu pro přeshraniční prodej zboží na dálku
        a poskytnutí TBE služeb koncovým spotřebitelům. Jako jediný OSS endpoint běží
        i s vypnutým OSS režimem — potřebuje ho právě ten, kdo registrovaný ještě není.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, schema: { type: integer, minimum: 2020, maximum: 2050 } }
      responses:
        '200':
          description: Stav prahu za rok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/v1/reports/oss/submissions:
    get:
      tags: [Reports]
      summary: Archiv OSS podání
      description: |
        Archivované OSS snapshoty (form_code `ossei1`) téhož supplier-a, nejnovější první,
        max 200 řádků. Detail, stažení archivovaného XML, EPO předání i označení „podáno"
        obsluhuje sdílené `/api/v1/reports/submissions/{id}` — OSS snapshoty leží v téže
        tabulce jako DPH a KH a druhý životní cyklus nad týmž záznamem by se rozešel.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      responses:
        '200':
          description: Seznam archivovaných OSS podání
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OssArchive' }
        '409': { description: OSS režim není v nastavení firmy aktivní (`oss_disabled`) }

  /api/v1/reports/oss/reconciliation:
    get:
      tags: [Reports]
      summary: Rekonciliace archivovaného OSS podání proti dnešnímu náhledu
      description: |
        Porovná snapshot posledního archivovaného podání za období s tím, co by se za
        totéž období podávalo dnes — odhalí doklady opravené zpětně PO podání.
        `snapshot_available: false` (archiv starší než snapshotování) NEZNAMENÁ shodu:
        `in_sync` v takovém případě zůstává `null`, protože porovnat nebylo s čím.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, schema: { type: integer, minimum: 2020, maximum: 2050 } }
        - { in: query, name: quarter, schema: { type: integer, minimum: 1, maximum: 4 } }
      responses:
        '200':
          description: Výsledek rekonciliace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OssReconciliation' }
        '400': { description: Neplatný rok/čtvrtletí (`validation_failed`) }
        '409': { description: OSS režim není v nastavení firmy aktivní (`oss_disabled`) }
        '500': { description: Náhled období se nepodařilo sestavit (`build_failed`) }

  /api/v1/reports/oss/evidence:
    get:
      tags: [Reports]
      summary: Evidence OSS podle § 110f ZDPH / čl. 63c
      description: |
        Evidenční záznamy období tak, jak je vyžaduje čl. 63c prováděcího nařízení
        (EU) 282/2011. Záznamy jsou write-once a uchovávají se 10 let od konce roku
        PLNĚNÍ (`retain_until`). `completeness` u záznamu vyjmenovává body čl. 63c,
        které se z dostupných dat naplnit nepodařilo — mlčet o nich by bylo horší.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, schema: { type: integer, minimum: 2020, maximum: 2050 } }
        - { in: query, name: quarter, schema: { type: integer, minimum: 1, maximum: 4 } }
      responses:
        '200':
          description: Evidenční záznamy období
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OssEvidence' }
        '400': { description: Neplatný rok/čtvrtletí (`validation_failed`) }
        '409': { description: OSS režim není v nastavení firmy aktivní (`oss_disabled`) }

  /api/v1/reports/oss/evidence/export:
    get:
      tags: [Reports]
      summary: Export evidence § 110f pro správce daně
      description: |
        Poskytnutí evidence správci daně elektronicky (§ 110f odst. 2 písm. b), čl. 63c
        odst. 3). CSV je výchozí formát; JSON drží strukturu včetně vnořených úhrad
        a podkladu o místě plnění. Export se zapisuje do provozního deníku
        (`report.oss_evidence_exported`) — komu a kdy jsme evidenci vydali je při
        kontrole stejně podstatné jako její obsah. Vyžaduje `reports.export`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, schema: { type: integer, minimum: 2020, maximum: 2050 } }
        - { in: query, name: quarter, schema: { type: integer, minimum: 1, maximum: 4 } }
        - { in: query, name: format, schema: { type: string, enum: [csv, json], default: csv } }
      responses:
        '200':
          description: Soubor s evidencí (Content-Disposition attachment)
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/OssEvidence' }
        '400': { description: Neplatný rok/čtvrtletí nebo formát (`validation_failed`) }
        '409': { description: OSS režim není v nastavení firmy aktivní (`oss_disabled`) }

