        dphdp3_line: { type: [string, 'null'] }
        kh_section: { type: [string, 'null'] }
        vat_rate: { type: [number, 'null'] }
        is_reverse_charge: { type: boolean }
        kh_regime_code:
          type: [string, 'null']
          enum: ['0', '1', '2', null]
          description: VetaA4.kod_rezim_pl — běžné plnění, cestovní služba §89 nebo použité zboží §90.
        kh_bad_debt:
          type: [string, 'null']
          enum: [N, P, null]
          description: VetaA4/VetaB2.zdph_44 — běžné plnění nebo oprava nedobytné pohledávky.
        display_order: { type: integer }
        archived: { type: boolean }
    VatClassificationCreate:
      allOf:
        - $ref: '#/components/schemas/VatClassificationInput'
        - type: object
          required: [code, label, direction]
    VatClassification:
      allOf:
        - $ref: '#/components/schemas/VatClassificationInput'
        - type: object
          required: [id, supplier_id, archived, created_at]
          properties:
            id: { type: integer }
            supplier_id: { type: [integer, 'null'] }
            archived: { type: boolean }
            created_at: { type: string, format: date-time }
    RevenueCategory:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, maxLength: 20 }
        label: { type: string, maxLength: 100 }
        display_order: { type: integer }
        archived: { type: boolean }
        created_at: { type: string }
        invoices_count:
          type: integer
          description: Počet vydaných faktur v této kategorii (jen v listu)
        invoice_number_format:
          type: [string, 'null']
          maxLength: 60
          description: |
            Vlastní číselná řada pro faktury v této kategorii; `null` = dědí se
            z dodavatele. Uplatní se jen u faktur, jejichž odběratel vlastní
            řadu nastavenou nemá (priorita klient → kategorie → dodavatel).
        proforma_number_format:
          type: [string, 'null']
          maxLength: 60
          description: Totéž pro proformy.
        credit_note_number_format:
          type: [string, 'null']
          maxLength: 60
          description: Totéž pro dobropisy.
        invoice_number_period:
          type: [string, 'null']
          enum: [year, month, none, null]
          description: |
            Kdy se čítač řady kategorie resetuje; `null` = převezme se perioda
            dodavatele.
    ExpenseCategory:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, maxLength: 20 }
        label: { type: string, maxLength: 100 }
        fixed_or_var: { type: string, enum: [fixed, variable] }
        display_order: { type: integer }
        archived: { type: boolean }
        created_at: { type: string }
        purchases_count:
          type: integer
          description: Počet přijatých faktur v této kategorii (jen v listu)
    TaxConstantsYear:
      type: object
      description: Efektivní daňové konstanty pro rok (výchozí seed nebo override).
      additionalProperties: true
      properties:
        year: { type: integer }
        is_override:
          type: boolean
          description: true = přepsáno administrátorem, false = výchozí konstanty
    TaxConstantsInput:
      type: object
      description: |
        Daňové konstanty pro rok. Lze poslat ploše nebo zabaleně v `{ "data": {...} }`.
        Všechny skalární klíče jsou povinné; vnořené struktury musí být objekty/pole.
      required:
        - credit_taxpayer
        - credit_spouse
        - tax_rate_low
        - tax_rate_high
        - tax_high_threshold
        - social_rate
        - health_rate
        - social_assessment_pct
        - health_assessment_pct
        - social_min_base_main
        - social_min_base_secondary
        - social_secondary_participation_threshold
        - health_min_base
        - mortgage_cap
        - pension_cap
        - vat_limit_low
        - vat_limit_high
        - vat_rate_standard
        - vat_rate_reduced
        - kh_item_threshold
        - band_ceilings
        - expense_caps
        - child_credits
        - minimum_wage
        - child_bonus_min_income
        - spouse_income_limit
        - tax_loss_carry_years
        - m1_depreciation_limit
        - extraordinary_depreciation
        - depreciation_straight_rates
        - depreciation_accelerated_coefficients
        - entity_category_thresholds
        - filing_deadlines
      properties:
        credit_taxpayer: { type: number, description: Sleva na poplatníka (Kč/rok) }
        credit_spouse: { type: number, description: Sleva na manžela/ku }
        tax_rate_low: { type: number, description: Nižší sazba daně z příjmu (%) }
        tax_rate_high: { type: number, description: Vyšší sazba daně z příjmu (%) }
        tax_high_threshold: { type: number, description: Práh pro vyšší sazbu }
        social_rate: { type: number }
        health_rate: { type: number }
        social_assessment_pct: { type: number }
        health_assessment_pct: { type: number }
        social_min_base_main: { type: number }
        social_min_base_secondary: { type: number }
        social_secondary_participation_threshold: { type: number, description: Rozhodná částka (zisk) pro povinnou účast na důch. pojištění u vedlejší SVČ }
        health_min_base: { type: number }
        mortgage_cap: { type: number, description: Strop odpočtu úroků z hypotéky }
        pension_cap: { type: number }
        vat_limit_low: { type: number, description: Limit obratu pro povinnou registraci DPH }
        vat_limit_high: { type: number }
        vat_rate_standard: { type: number, description: "Základní sazba DPH (%) — sloupce DPH výkazů, samovyměření RC, auto-klasifikace" }
        vat_rate_reduced: { type: number, description: Snížená sazba DPH (%) }
        kh_item_threshold: { type: number, description: "Limit KH (Kč vč. DPH) — nad limit doklad jednotlivě (A.4/B.2), do limitu sumace (A.5/B.3)" }
        pausal_monthly:
          type: array
          description: |
            Rozvrh měsíčních záloh paušální daně. Segment platí od `from` (vždy 1. den
            měsíce daného roku, první musí být 1. 1.), dokud ho nevystřídá další —
            sazba se může změnit uprostřed roku (2026: 1. pásmo 9 984 → 9 162 Kč
            od 1. 7.). Roční částka `pausal_annual` je z rozvrhu odvozená a neukládá se.
            Starší klienti smí místo rozvrhu poslat `pausal_annual` (bere se doslova).
          items:
            type: object
            required: [from, band1, band2, band3]
            properties:
              from: { type: string, format: date, example: '2026-07-01' }
              band1: { type: number, description: Měsíční záloha 1. pásma (Kč) }
              band2: { type: number }
              band3: { type: number }
        pausal_annual:
          type: object
          description: |
            Roční částky paušální daně per pásmo. Ve výstupu ODVOZENÉ ze součtu
            dvanácti měsíčních záloh roku; na vstupu se přijímají jen tehdy, není-li
            poslaný `pausal_monthly` (zpětná kompatibilita).
        band_ceilings:
          type: object
          description: Stropy obratu pro pásma paušální daně
        expense_caps:
          type: object
          description: Stropy výdajových paušálů per míra (40/60/80 %)
        child_credits:
          type: array
          minItems: 1
          description: Slevy na dítě (1./2./3.+ dítě)
          items: { type: number }
        minimum_wage: { type: number, description: Minimální měsíční mzda }
        child_bonus_min_income: { type: number, description: Minimální roční příjem pro daňový bonus }
        spouse_income_limit: { type: number }
        tax_loss_carry_years: { type: integer }
        m1_depreciation_limit: { type: number }
        extraordinary_depreciation:
          type: object
          description: Rozhodné období, délka a rozdělení mimořádných odpisů
          additionalProperties: true
        depreciation_straight_rates:
          type: object
          description: Sazby rovnoměrných odpisů podle varianty a odpisové skupiny
          additionalProperties: true
        depreciation_accelerated_coefficients:
          type: object
          description: Koeficienty zrychlených odpisů podle odpisové skupiny
          additionalProperties: true
        entity_category_thresholds:
          type: object
          description: Prahy aktiv, obratu a zaměstnanců pro kategorie účetních jednotek
          additionalProperties: true
        filing_deadlines:
          type: object
          description: Roční termíny ve formátu MM-DD a dny splatnosti záloh
          additionalProperties: true
    TaxProfileInput:
      type: object
      properties:
        year: { type: integer, description: 'Default = aktuální rok' }
        activity_rate: { type: integer, description: 'Výdajový paušál v % (40/60/80)', default: 60 }
        use_actual_expenses: { type: boolean }
        actual_expenses: { type: number }
        flat_tax_band: { type: string, description: Pásmo paušální daně }
        is_secondary: { type: boolean, description: Vedlejší činnost }
        spouse_credit: { type: boolean }
        children_count: { type: integer }
        mortgage_interest: { type: number }
        pension_contrib: { type: number }
        life_insurance: { type: number }
        donations: { type: number }
    DocumentBreadcrumb:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    DocumentFolder:
      type: object
      properties:
        id: { type: integer }
        parent_id: { type: [integer, "null"] }
        name: { type: string }
        created_at: { type: string }
        subfolder_count: { type: integer, description: "Naplněno jen v listingu potomků; jinak 0" }
        file_count: { type: integer, description: "Naplněno jen v listingu potomků; jinak 0" }
        total_bytes: { type: integer, description: "Součet velikostí aktivních souborů ve složce (jen v listingu potomků)" }
    Document:
      type: object
      properties:
        id: { type: integer }
        supplier_id: { type: integer }
        folder_id: { type: [integer, "null"] }
        title: { type: string }
        description: { type: [string, "null"] }
        original_name: { type: string }
        filename: { type: string, description: "Název souboru na disku ({sha8}-{safeName})" }
        sha256: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        doc_type: { type: string, enum: [pdf, docx, xlsx, xml, zfo, p7s, zip, image, other] }
        source: { type: string, enum: [manual, zfo_extract, zip_extract] }
        parent_document_id: { type: [integer, "null"] }
        signature_for_id: { type: [integer, "null"] }
        text_status: { type: string, enum: [none, extracted, unsupported, failed] }
        thumb_status: { type: string, enum: [none, generated, unsupported, failed] }
        has_thumb: { type: boolean }
        uploaded_by: { type: [integer, "null"], description: "User ID nahrávajícího" }
        created_at: { type: string }
        deleted_at: { type: [string, "null"], description: "Soft-delete (koš); NULL = aktivní" }
    DocumentLink:
      type: object
