        Řádek kontrolního číselníku sazeb členských států pro OSS. `is_custom = false`
        znamená řádek ze seedu migrace — ten se needituje ani nemaže, jen se mu překrývá
        platnost (`valid_to_override`) nebo se vyřadí (`disabled`), aby ho příští spuštění
