        '409': { description: Období pro rok už existuje, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/periods/{id}/status:
    post:
      tags: [Accounting]
      summary: Přechody stavu období (matice Epic F4)
      description: |
        Admin-only. Přes /status jdou pouze `closed→approved` (confirm=true),
        `closed→open` (reopen — povinný reason ≥ 10 znaků; blokováno 422
        `closing_entries_exist`, dokud existují závěrkové zápisy) a
        `approved→closed` (zrušení schválení — confirm + reason). Přechody
        open↔closing a closing→closed patří uzávěrkovému průvodci (422
        `use_closing_workflow`). Každá změna vyžaduje `row_version` (optimistická
        konkurence) — konflikt vrací 409 `version_conflict`.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, row_version]
              properties:
                status:
                  type: string
                  enum: [open, closed, reviewed, approved]
                  description: |
                    Cílový stav. Tímto endpointem vedou jen tyto přechody:
                    `closed→reviewed` a `reviewed→closed` (interní kontrola, vratná),
                    `closed→approved` a `reviewed→approved` (zákonné schválení, nevratné),
                    `closed→open` (znovuotevření).

                    **Ze stavu `approved` nevede žádný přechod ven** — schválená účetní
                    závěrka je podle § 17 odst. 7 ZoÚ definitivní; opravy se dělají
                    v období, kdy byla chyba zjištěna (§ 35 ZoÚ). Pokus skončí `422`
                    s kódem `approval_is_final`.

                    Přechody `open↔closing` a `closing→closed` sem nepatří — ty řídí
                    uzávěrkový průvodce (`closing/start`, `closing/abort`, `POST /close`);
                    jinak `422 use_closing_workflow`.
                row_version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 10, description: "Povinný u closed→open a reviewed→closed" }
                confirm: { type: boolean, description: "Povinný `true` u schválení (closed→approved, reviewed→approved)" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingPeriod' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: version_conflict — období mezitím změněno, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/journal:
    get:
      tags: [Accounting]
      summary: Stránkovaný seznam účetních zápisů
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
