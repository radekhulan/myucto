  /api/v1/eshop/products/import:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Eshop]
      summary: Import zboží z XLSX/CSV
      description: |
        Dry-run náhled (default `dry_run=1`). Ostrý běh (`dry_run=0`) je
        all-or-nothing — jakákoli chybová řádka vrátí 422 `import_has_errors`
        a nic se nezapíše. Soubor max 2 MB, whitelist přípon xlsx/csv, MIME se
        ověřuje z obsahu (ne jen z přípony).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                dry_run: { type: string, enum: ['0', '1'], default: '1' }
      responses:
        '200': { description: Report importu, content: { application/json: { schema: { $ref: '#/components/schemas/CodebookImportReport' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { description: Chybějící/nepodporovaný soubor nebo neshoda MIME s příponou }
        '422': { description: Import obsahuje chyby — nic nebylo zapsáno (import_has_errors) }
  /api/v1/eshop/products/{id}/i18n:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Eshop]
      summary: Seznam překladů karty zboží
      responses:
        '200': { description: OK }
  /api/v1/eshop/products/{id}/media:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Eshop]
      summary: Seznam médií karty zboží
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Eshop]
      summary: Nahraje média ke kartě zboží
      description: |
        Multipart pole `file` (jeden i více souborů, max 50 na request). Bajty
        se ukládají do content-addressed úložiště sdíleného s DMS (MIME z
        obsahu, blocklist spustitelných, dedup dle sha256). První nahraný
        obrázek se automaticky stane hlavním (`is_primary`), pokud karta ještě
        žádný hlavní obrázek nemá. Odpověď obsahuje `created` a `errors` (per
        soubor).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  oneOf:
                    - { type: string, format: binary }
                    - { type: array, items: { type: string, format: binary } }
      responses:
        '201': { description: Nahráno (aspoň jeden soubor uložen) }
        '400': { description: Žádný soubor odeslán nebo se nepodařilo uložit žádný soubor }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Příliš mnoho souborů najednou (max 50) }
  /api/v1/eshop/products/{id}/media/reorder:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Eshop]
      summary: Přeuspořádá média karty zboží
      description: Přijme pole `order` s id médií v novém pořadí; přijmou se jen id patřící této kartě.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: array
                  items: { type: integer }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/eshop/products/{id}/prices:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Eshop]
      summary: Seznam cen karty zboží (per měna)
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Eshop]
      summary: Uloží ceny karty zboží (bulk) a přepočte je
      description: |
        Nahradí ceny (`prices`) — měny, které v payloadu nejsou, se smažou.
        Každý řádek: `currency_code` (ISO 4217), `price_mode` (markup/fixed),
        `markup_pct`, `fixed_price` (povinná u `fixed`), `rounding`,
        `is_manual_override`. Po zápisu se vždy spustí přepočet ceny.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    required: [currency_code]
                    properties:
                      currency_code: { type: string, minLength: 3, maxLength: 3 }
                      price_mode: { type: string, enum: [markup, fixed], default: markup }
                      markup_pct: { type: [number, "null"] }
                      fixed_price: { type: [number, "null"] }
                      rounding: { type: string, enum: [none, '0.01', '0.10', '0.50', '1', '9_ending'], default: none }
                      is_manual_override: { type: boolean, default: false }
      responses:
        '200': { description: Výsledek přepočtu cen }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/eshop/products/{id}/prices/recompute:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Eshop]
      summary: Vynutí přepočet cen karty zboží
      responses:
        '200': { description: Výsledek přepočtu cen }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/eshop/products/{id}/promo-prices:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Eshop]
      summary: Akční (promoční) ceny karty zboží
      description: |
        Vrátí všechny akční ceny karty (i naplánované, vypnuté a prošlé),
        doplněné o dopočtený `qty_remaining` a `state`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EshopPromoPrice' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Eshop]
      summary: Nahradí akční ceny karty zboží (bulk)
      description: |
        Kompletní náhrada seznamu (`promo_prices`) — řádek s `id` se aktualizuje,
        bez `id` se zakládá, chybějící se mažou. Tři nezávislé, každý volitelný
        limit: časové okno (`valid_from`/`valid_to`, NULL = bez omezení),
        množstevní strop (`qty_mode`) a sama cena (`promo_price`, bez DPH).
        `qty_mode=limited` vyžaduje kladný `qty_limit`; u `stock` a `unlimited`
        se `qty_limit` ignoruje.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                promo_prices:
                  type: array
                  maxItems: 50
                  items: { $ref: '#/components/schemas/EshopPromoPriceInput' }
      responses:
        '200':
          description: Uložené akční ceny
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EshopPromoPrice' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/eshop/products/{id}/effective-price:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
      - in: query
        name: currency
        schema: { type: string, minLength: 3, maxLength: 3, default: CZK }
      - in: query
        name: qty
        description: Množství, pro které se cena posuzuje (rozhoduje o množstevním stropu akce).
        schema: { type: number, default: 1 }
      - in: query
        name: on_date
        description: Datum, ke kterému se posuzuje platnost akce (default dnes).
        schema: { type: string, format: date }
    get:
      tags: [Eshop]
      summary: Platná (efektivní) cena karty zboží
      description: |
        Jediný zdroj pravdy o tom, jakou cenu bez DPH zboží právě má — standardní
        cenu z cenotvorby, nebo akční cenu, pokud je nějaká platná a její
        množstevní strop pokryje celé `qty`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EshopEffectivePrice' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/eshop/products/{id}/vendors:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Eshop]
      summary: Seznam dodavatelů karty zboží
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Eshop]
      summary: Nahradí dodavatele karty zboží
      description: |
        Kompletní náhrada seznamu (`vendors`) — každý `client_id` musí patřit
        tenantovi a mít `is_vendor=1`, jinak 422 `vendor_invalid`. Nejvýše
        jeden dodavatel smí mít `is_preferred=true` (jinak 422
        `multiple_preferred_vendors`). Po zápisu se přepočte cena zboží
        (relevantní při `pricing_base=manual`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vendors:
                  type: array
                  items:
                    type: object
                    required: [client_id]
                    properties:
                      client_id: { type: integer }
                      vendor_sku: { type: [string, "null"] }
                      purchase_price: { type: [number, "null"] }
                      currency_code: { type: string, minLength: 3, maxLength: 3, default: CZK }
                      delivery_days: { type: [integer, "null"] }
                      stock_qty: { type: [number, "null"] }
                      is_preferred: { type: boolean, default: false }
                      note: { type: [string, "null"] }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Neplatný dodavatel nebo více preferovaných dodavatelů }
  /api/v1/eshop/products/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Eshop]
      summary: Karta zboží (agregát)
      description: |
        Vrací agregát nad `stock_items` (item_type=goods): eshopové sloupce +
        `i18n`, `categories`, `tag_ids`, `attributes`, `fees`, `media`.
        Základní skladová identita (sku/název/DPH/cena) se edituje přes
        `/api/stock/items`.
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Eshop]
      summary: Upraví eshopový obsah karty zboží (partial update agregátu)
      description: |
        Zapisují se jen přítomné sekce payloadu. `manufacturer_id` (pokud
        zadán) musí patřit tenantovi. `categories` — pole objektů
        `{category_id, is_primary?, display_order?}` (max 1 primary, jinak
        422). `tag_ids` — pole id štítků. `fees` — pole
        `{fee_type_id, amount, currency_code, vat_included}`. `attributes` —
        typované hodnoty parametrů. Změna `pricing_base` vyvolá přepočet cen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manufacturer_id: { type: [integer, "null"] }
                warranty_months: { type: [integer, "null"] }
                delivery_days: { type: [integer, "null"] }
                export_eshop: { type: boolean }
                is_stocked: { type: boolean }
                weight_g: { type: [integer, "null"] }
                pricing_base: { type: string }
                i18n:
                  type: array
                  items: { type: object }
                categories:
                  type: array
                  items:
                    type: object
                    properties:
                      category_id: { type: integer }
                      is_primary: { type: boolean }
                      display_order: { type: integer }
                tag_ids:
                  type: array
                  items: { type: integer }
                attributes:
                  type: array
                  items: { type: object }
                fees:
                  type: array
                  items:
                    type: object
                    properties:
                      fee_type_id: { type: integer }
                      amount: { type: number }
                      currency_code: { type: string }
                      vat_included: { type: boolean }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Neplatná vazba (výrobce/kategorie/štítek) nebo více hlavních kategorií }
  /api/v1/eshop/media/{mid}/file:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: mid
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Eshop]
      summary: Stáhne bajty média
      description: |
        Servíruje soubor média. Skutečné obrázky inline (pro `<img>`), ostatní
        typy vždy jako attachment. Vždy `X-Content-Type-Options: nosniff` a
        restriktivní CSP (obrana proti záměně typu/vloženému skriptu).
      responses:
        '200':
          description: Bajty souboru
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/eshop/media/{mid}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: mid
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Eshop]
      summary: Upraví metadata média
      description: |
        `is_primary=true` nastaví médium jako hlavní obrázek karty (nejvýše
        jedno na kartu — předchozí hlavní se transakčně zruší).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: [string, "null"] }
                alt_text: { type: [string, "null"] }
                export_eshop: { type: boolean }
                display_order: { type: integer }
                is_primary: { type: boolean }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Eshop]
      summary: Smaže médium karty zboží
      description: Maže jen záznam vazby — sdílené bajty (content-addressed) se neuklízí zde, o to se stará údržbová GC úloha.
      responses:
        '200': { description: Smazáno }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/stock/warehouses:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Seznam skladů
      description: |
        Číselník skladů vč. aktuální hodnoty (`value`) každého skladu. Filtr `active=1`
        vrátí jen aktivní sklady.
      parameters:
        - in: query
          name: active
          schema: { type: boolean }
          description: Jen aktivní sklady.
      responses:
        '200': { description: OK }
    post:
      tags: [Stock]
      summary: Nový sklad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 20, description: 'Unikátní kód skladu.' }
                name: { type: string, maxLength: 100 }
                is_default: { type: boolean }
                is_active: { type: boolean, default: true }
                note: { type: [string, "null"] }
      responses:
        '201': { description: Vytvořeno }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { description: 'Sklad s tímto kódem už existuje.' }
  /api/v1/stock/warehouses/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Detail skladu
      description: Vč. aktuální hodnoty skladu (`value`).
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stock]
      summary: Úprava skladu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, maxLength: 20 }
                name: { type: string, maxLength: 100 }
                is_default: { type: boolean }
                is_active: { type: boolean }
                note: { type: [string, "null"] }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Sklad s tímto kódem už existuje.' }
    delete:
      tags: [Stock]
      summary: Smazání skladu
      description: |
        Smaže sklad jen pokud nemá nenulový stav ani skladové pohyby. Jinak vrátí
        409 s `suggestion: deactivate` — místo mazání deaktivujte sklad (`is_active=false`).
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Sklad má nenulový stav nebo pohyby — nelze smazat.' }
  /api/v1/stock/items/search:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Našeptávač skladových karet (autocomplete)
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Hledaný text (SKU, název, EAN).
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200': { description: OK }
  /api/v1/stock/items:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Seznam skladových karet
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [material, goods, product] }
        - in: query
          name: active
          schema: { type: boolean }
        - in: query
          name: q
          schema: { type: string }
          description: Fulltextové hledání (SKU, název, EAN).
        - in: query
          name: only_below_min
          schema: { type: boolean }
          description: Jen karty pod minimální zásobou (`min_qty`).
        - in: query
          name: limit
          schema: { type: integer, default: 200, minimum: 1, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200': { description: OK }
    post:
      tags: [Stock]
      summary: Nová skladová karta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                sku: { type: string, maxLength: 50, description: 'Nepovinné — bez zadání se odvodí slug z názvu.' }
                name: { type: string, maxLength: 255 }
                item_type: { type: string, enum: [material, goods, product], default: goods }
                unit: { type: string, default: ks }
                ean: { type: [string, "null"] }
                vat_rate_id: { type: [integer, "null"] }
                sale_price_without_vat: { type: [string, "null"] }
                min_qty: { type: [string, "null"] }
                is_active: { type: boolean, default: true }
                note: { type: [string, "null"] }
      responses:
        '201': { description: Vytvořeno }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { description: 'Skladová karta s tímto SKU už existuje.' }
  /api/v1/stock/items/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Detail skladové karty
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stock]
      summary: Úprava skladové karty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku: { type: string, maxLength: 50 }
                name: { type: string, maxLength: 255 }
                item_type: { type: string, enum: [material, goods, product] }
                unit: { type: string }
                ean: { type: [string, "null"] }
                vat_rate_id: { type: [integer, "null"] }
                sale_price_without_vat: { type: [string, "null"] }
                min_qty: { type: [string, "null"] }
                is_active: { type: boolean }
                note: { type: [string, "null"] }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Skladová karta s tímto SKU už existuje.' }
    delete:
      tags: [Stock]
      summary: Smazání skladové karty
      description: |
        Smaže kartu jen pokud nemá žádné skladové pohyby. Jinak 409 s
        `suggestion: deactivate` — místo mazání kartu deaktivujte.
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Karta má skladové pohyby — nelze smazat.' }
  /api/v1/stock/items/{id}/movements:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Skladová kniha karty (pohyby)
      description: |
        Stránkovaný výpis pohybů karty s běžnou bilancí (`balance_after` po každém
        řádku) a počáteční bilancí (`opening_balance`) k dané stránce.
      parameters:
        - in: query
          name: warehouse_id
          schema: { type: integer }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: limit
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/stock/items/{id}/movements/export:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Export skladové karty (PDF/XLSX)
      description: |
        Kompletní historie pohybů karty (bez stránkování, celý rozsah dle filtrů
        `warehouse_id`/`from`/`to`) jako soubor ke stažení.
      parameters:
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [pdf, xlsx] }
        - in: query
          name: warehouse_id
          schema: { type: integer }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: 'Soubor (PDF nebo XLSX dle `format`).'
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/stock/levels:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Stav zásob
      description: Přehled aktuálních stavů skladu (skladová karta × sklad) s filtry.
      parameters:
        - in: query
          name: warehouse_id
          schema: { type: integer }
        - in: query
          name: item_type
          schema: { type: string, enum: [material, goods, product] }
        - in: query
          name: below_min
          schema: { type: boolean }
          description: Jen položky pod minimální zásobou.
        - in: query
          name: active
          schema: { type: boolean }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/v1/stock/availability:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Dávková dostupnost skladových karet
      description: |
        Použito pro badge dostupnosti v editoru faktury — vrátí dostupné množství
        pro zadané karty (volitelně na konkrétním skladu).
      parameters:
        - in: query
          name: item_ids
          required: true
          schema: { type: string }
          description: 'Seznam ID karet oddělený čárkou, např. `12,45,78`.'
        - in: query
          name: warehouse_id
          schema: { type: integer }
      responses:
        '200': { description: OK }
  /api/v1/stock/quantities:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Množství ve třech dimenzích (skladem / rezervováno / na cestě)
      description: |
        Nadmnožina `/stock/availability` (to zůstává beze změny jako legacy pro
        editor faktury a MCP). Pro každou kartu vrací:

        | veličina               | vzorec                            | k čemu je                |
        |------------------------|-----------------------------------|--------------------------|
        | `on_hand`              | `stock_levels.qty`                | ocenění, rozvaha         |
        | `reserved`             | vydané faktury bez zaúčtovaného výdeje | —                   |
        | `sellable`             | `on_hand − reserved`              | e-shop, dostupnost pro zákazníka |
        | `in_transit`           | objednáno u dodavatele, nedorazilo | doplnění zásob          |
        | `available_to_promise` | `on_hand − reserved + in_transit` | interní karta, plánování nákupu |

        „Na cestě" se do prodejní dostupnosti ZÁMĚRNĚ nepromítá. `sellable` může
        interně vyjít záporně (prodalo se víc, než je skladem) a nepodlahuje se —
        záporná hodnota je signál k urgentnímu doobjednání.

        Karta bez jediného skladového pohybu vrací řádek se samými nulami, ne
        prázdno: produkt smí být v katalogu dřív, než se poprvé nakoupí.
      parameters:
        - in: query
          name: item_ids
          schema: { type: string }
          description: 'Seznam ID karet oddělený čárkou, např. `12,45,78`. Bez něj celý katalog (max 500).'
        - in: query
          name: warehouse_id
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK }
        '403': { description: Skladový modul není pro firmu zapnutý. }
  /api/v1/stock/in-transit:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Zboží na cestě
      description: |
        Objednané a dosud nedodané množství per karta × sklad, s rozpadem na
        konkrétní objednávky a nejbližším očekávaným datem.

        Počítá se od stavu objednávky podle `supplier.stock_in_transit_from`
        (výchozí `sent`) a odečítá se z něj to, co už dorazilo na příjemkách.
        Storno příjemky vrátí množství zpátky „na cestu".
      parameters:
        - in: query
          name: item_ids
          schema: { type: string }
        - in: query
          name: warehouse_id
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK }
        '403': { description: Skladový modul není pro firmu zapnutý. }
  /api/v1/stock/reservations:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Rezervované zboží
      description: |
        Položky vydaných faktur se skladovou kartou, které ještě nemají zaúčtovaný
        výdej ze skladu — s rozpadem na konkrétní faktury, aby šlo dohledat, co
        který kus drží.

        Zálohová faktura nerezervuje (není závazek dodat), rozpracovaná ani
        stornovaná taky ne. Firmy se `stock_auto_issue = 1` tu mají trvale nulu.
      parameters:
        - in: query
          name: item_ids
          schema: { type: string }
        - in: query
          name: warehouse_id
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK }
        '403': { description: Skladový modul není pro firmu zapnutý. }
  /api/v1/stock/replenishment:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Co objednat (doplnění zásob)
      description: |
        `suggested_qty = max(0, min_qty × koeficient − on_hand + reserved − in_transit)`,
        zaokrouhleno nahoru na `package_qty` preferovaného dodavatele a podlahováno
        jeho `min_order_qty`.

        Odečtení `in_transit` je smysl celé sestavy — bez něj se objednává dvakrát.
        `reserved` se naopak přičítá, protože ty kusy jsou fakticky pryč.
      parameters:
        - in: query
          name: warehouse_id
          schema: { type: integer, format: int64 }
        - in: query
          name: below_min
          schema: { type: boolean }
        - in: query
          name: item_ids
          schema: { type: string }
        - in: query
          name: coefficient
          schema: { type: number, minimum: 0 }
          description: Kolikanásobek minimální zásoby doplňovat (výchozí 1).
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: OK }
        '403': { description: Skladový modul není pro firmu zapnutý. }
  /api/v1/stock/purchase-orders:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Objednávky vydané dodavatelům
      description: |
        Seznam objednávek s plněním (`qty_ordered_total`, `qty_received_total`,
        `qty_remaining_total`). Objednávka NENÍ účetní doklad (§ 11 ZoÚ) —
        negeneruje deníkový zápis ani skladový pohyb.
      parameters:
        - in: query
          name: state
          schema: { type: string }
          description: 'Stav(y) oddělené čárkou: draft, sent, confirmed, partially_received, received, closed, cancelled.'
        - in: query
          name: open
          schema: { type: boolean }
          description: Zkratka pro draft + sent + confirmed + partially_received.
        - in: query
          name: vendor_id
          schema: { type: integer, format: int64 }
        - in: query
          name: warehouse_id
          schema: { type: integer, format: int64 }
        - in: query
          name: stock_item_id
          schema: { type: integer, format: int64 }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: expected_to
          schema: { type: string, format: date }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: OK }
        '403': { description: Skladový modul není pro firmu zapnutý. }
    post:
      tags: [Stock]
      summary: Nová objednávka (draft)
      description: |
        Zakládá se vždy jako `draft` — číslo z řady OBJ přiděluje až `send` a do
        „na cestě" objednávka do té doby nevstupuje. Sklad z hlavičky platí pro
        všechny řádky, řádek ho smí přebít. Řádek bez `stock_item_id` je služba
        (doprava, balné) — vstupuje do ceny, ne do skladového plnění.

        Vyžaduje oprávnění `stock.orders.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id, order_date, warehouse_id, currency_id, lines]
              properties:
                vendor_id: { type: integer, format: int64 }
                order_date: { type: string, format: date }
                expected_date: { type: string, format: date, nullable: true }
                warehouse_id: { type: integer, format: int64 }
                currency_id: { type: integer }
                exchange_rate: { type: string, nullable: true }
                vendor_reference: { type: string, nullable: true, maxLength: 50 }
                note: { type: string, nullable: true }
                internal_note: { type: string, nullable: true }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [qty_ordered]
                    properties:
                      stock_item_id: { type: integer, format: int64, nullable: true }
                      warehouse_id: { type: integer, format: int64, nullable: true }
                      vendor_sku: { type: string, nullable: true, maxLength: 80 }
                      description: { type: string, maxLength: 500 }
                      unit: { type: string, maxLength: 20 }
                      qty_ordered: { type: string }
                      unit_price: { type: string }
                      vat_rate_id: { type: integer, nullable: true }
                      expected_date: { type: string, format: date, nullable: true }
                      note: { type: string, nullable: true, maxLength: 255 }
      responses:
        '201': { description: Vytvořeno }
        '422': { description: Neplatná data nebo vazba mimo firmu. }
  /api/v1/stock/purchase-orders/bulk:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Stock]
      summary: Hromadné založení objednávek (seskupené po dodavatelích)
      description: |
        Z plochého seznamu položek udělá JEDNU objednávku NA DODAVATELE. Dodavatel
        se bere z položky, jinak z preferované nabídky karty; položka bez dodavatele
        se vrátí ve `skipped` (tiše se nezahodí). Objednávky vznikají jako `draft`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                order_date: { type: string, format: date }
                expected_date: { type: string, format: date, nullable: true }
                warehouse_id: { type: integer, format: int64 }
                currency_id: { type: integer }
                note: { type: string, nullable: true }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [stock_item_id, qty]
                    properties:
                      stock_item_id: { type: integer, format: int64 }
                      qty: { type: string }
                      vendor_id: { type: integer, format: int64, nullable: true }
                      warehouse_id: { type: integer, format: int64, nullable: true }
                      unit_price: { type: string, nullable: true }
      responses:
        '201': { description: Vytvořeno }
        '422': { description: Ani jedna položka nešla objednat. }
  /api/v1/stock/purchase-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Detail objednávky
      description: |
        Objednávka včetně řádků s plněním (`qty_received`, `qty_effective`,
        `qty_remaining`), napárovaných přijatých faktur a vystavených příjemek.
        „Přijato" se odvozuje ze `stock_document_lines`, ne z řádků faktury.
      responses:
        '200': { description: OK }
        '404': { description: Objednávka nenalezena. }
    put:
      tags: [Stock]
      summary: Úprava objednávky (jen draft)
      description: |
        Replace-all včetně řádků. Odeslanou objednávku upravit nejde (`409
        order_not_editable`) — u dodavatele už existuje; změnu množství zaznamenej
        přes `confirm`, nedodaný zbytek přes `close`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '409': { description: Objednávka není rozpracovaná. }
    delete:
      tags: [Stock]
      summary: Smazání objednávky (jen draft)
      responses:
        '200': { description: Smazáno }
        '409': { description: Odeslanou objednávku lze jen stornovat. }
  /api/v1/stock/purchase-orders/{id}/send:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Stock]
      summary: Odeslání objednávky
      description: |
        `draft → sent`, přidělí číslo z řady OBJ (v transakci, po `FOR UPDATE`
        hlavičky) a od té chvíle se zboží počítá „na cestě". Idempotentní —
        opakované volání číslo znovu nepřidělí.
      responses:
        '200': { description: OK }
        '409': { description: Objednávka není rozpracovaná. }
  /api/v1/stock/purchase-orders/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Stock]
      summary: Potvrzení objednávky dodavatelem
      description: |
        `sent → confirmed`, volitelně s jiným množstvím a termínem. `qty_confirmed`
        NAHRAZUJE `qty_ordered` ve všech dalších výpočtech („na cestě" i „zbývá
        přijmout").
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_date: { type: string, format: date }
                lines:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: integer, format: int64 }
                      qty_confirmed: { type: string, nullable: true }
                      expected_date: { type: string, format: date, nullable: true }
      responses:
        '200': { description: OK }
        '409': { description: Objednávka není ve stavu, ze kterého lze potvrdit. }
  /api/v1/stock/purchase-orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Stock]
      summary: Storno objednávky
      description: |
        Jen dokud se z objednávky nic nepřijalo — jinak `409
        order_partially_received` s návodem použít `close`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200': { description: OK }
        '409': { description: K objednávce už existuje příjem. }
  /api/v1/stock/purchase-orders/{id}/close:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Stock]
      summary: Uzavření nedodaného zbytku
      description: |
        Doplní `qty_cancelled` na otevřených řádcích (zbytek zmizí z „na cestě")
        a objednávku uzavře. Vzít zpět lze přes `reopen`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200': { description: OK }
        '409': { description: Objednávka je už uzavřená, stornovaná nebo rozpracovaná. }
  /api/v1/stock/purchase-orders/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Stock]
      summary: Znovuotevření uzavřené objednávky
      description: |
        Vynuluje uzavřený zbytek a stav dopočítá podle skutečně přijatého množství.
      responses:
        '200': { description: OK }
        '409': { description: Objednávka není uzavřená. }
  /api/v1/stock/purchase-orders/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: PDF objednávky
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Objednávka nenalezena. }
  /api/v1/stock/purchase-orders/{id}/receipt:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Návrh příjemky z objednávky
      description: |
        Otevřené řádky se skladovou kartou, „zbývá přijmout" a pořizovací cena.
        Cena se bere z napárovaného řádku přijaté faktury; když faktura ještě
        nedorazila, použije se `unit_price × exchange_rate` z objednávky jako ODHAD
        a řádek nese `cost_is_estimate: true`.
      responses:
        '200': { description: OK }
        '404': { description: Objednávka nenalezena. }
    post:
      tags: [Stock]
      summary: Založení DRAFT příjemky z objednávky
      description: |
        Vytvoří `stock_documents` s `origin='purchase_order'`, `purchase_order_id`
        na hlavičce a `purchase_order_line_id` na řádcích. Zaúčtování zůstává na
        `POST /api/stock/documents/{id}/post` — ten uvnitř téže transakce přepočte
        i stav objednávky (`partially_received` / `received`).

        Nadměrná dodávka končí `409 over_receipt`; s `allow_over_delivery: true`
        se přijme a řádek dostane `has_over_delivery = 1`. `qty_ordered` se nikdy
        nezvyšuje.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_date, lines]
              properties:
                doc_date: { type: string, format: date }
                warehouse_id: { type: integer, format: int64 }
                description: { type: string, maxLength: 255 }
                allow_over_delivery: { type: boolean, default: false }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [purchase_order_line_id, qty]
                    properties:
                      purchase_order_line_id: { type: integer, format: int64 }
                      qty: { type: string }
                      unit_cost: { type: string, nullable: true }
      responses:
        '201': { description: DRAFT příjemka vytvořena }
        '409': { description: Nadměrná dodávka nebo objednávka v neplatném stavu. }
  /api/v1/stock/purchase-orders/{id}/receipts:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Příjemky k objednávce
      responses:
        '200': { description: OK }
  /api/v1/stock/vendor-offers:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Nabídky dodavatelů („u dodavatele")
      description: |
        Zboží × dodavatel: nákupní cena, kód u dodavatele, dodací lhůta, množství
        hlášené dodavatelem, dostupnost, minimální objednávka a balení.

        Vrací i karty, které nikdy neměly skladový pohyb — `on_hand` je pak `0`,
        ne chybějící řádek. Katalogová karta smí existovat dřív, než se cokoli
        objedná.
      parameters:
        - in: query
          name: stock_item_id
          schema: { type: integer, format: int64 }
        - in: query
          name: client_id
          schema: { type: integer, format: int64 }
          description: Jen nabídky tohoto dodavatele (karta klienta s `is_vendor`).
        - in: query
          name: availability_state
          schema: { type: string, enum: [in_stock, on_order, unavailable, unknown] }
        - in: query
          name: active
          schema: { type: boolean }
          description: Filtr na `is_active`; vynecháno = aktivní i vyřazené.
        - in: query
          name: preferred
          schema: { type: boolean }
          description: Jen hlavní dodavatele.
        - in: query
          name: q
          schema: { type: string }
          description: Hledá v SKU, názvu zboží, kódu u dodavatele a názvu dodavatele.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StockVendorOffer' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '403': { description: Skladový modul není pro firmu zapnutý. }
    post:
      tags: [Stock]
      summary: Nová nabídka dodavatele
      description: |
        Dvojice zboží × dodavatel je unikátní — druhý pokus vrátí `409
        vendor_offer_exists`. Nastavením `is_preferred` se předchozí hlavní
        dodavatel karty odznačí (nejvýš jeden na kartu).

        Po zápisu se přepočítají prodejní ceny karty (cenotvorba s
        `pricing_base=manual` bere nákupní cenu hlavního dodavatele).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockVendorOfferCreate' }
      responses:
        '201':
          description: Vytvořeno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockVendorOffer' }
        '409': { description: Dodavatel už u karty nabídku má. }
        '422': { description: Neplatná data nebo dodavatel není označen jako dodavatel. }
  /api/v1/stock/vendor-offers/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Detail nabídky dodavatele
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockVendorOffer' }
        '404': { description: Nenalezeno }
    patch:
      tags: [Stock]
      summary: Částečná úprava nabídky dodavatele
      description: |
        Zapíše JEN předaná pole — klíč, který v těle není, se nemění; `null`
        u nullable pole hodnotu maže. Změna `stock_qty` orazítkuje
        `stock_qty_updated_at`; razítko je informativní, hlášená skladovost
        platí, dokud ji dodavatel nezmění.

        Po zápisu se přepočítají prodejní ceny karty, stejně jako u
        `PUT /api/eshop/products/{id}/vendors`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockVendorOfferPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockVendorOffer' }
        '404': { description: Nenalezeno }
        '422': { description: Neplatná data }
    delete:
      tags: [Stock]
      summary: Smazat nabídku dodavatele
      responses:
        '200': { description: Smazáno }
        '404': { description: Nenalezeno }
  /api/v1/stock/vendor-offers/import:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Stock]
      summary: Import ceníku dodavatele (XLSX/CSV)
      description: |
        Identita řádku = SKU karty × dodavatel. Import NIKDY nemaže a NIKDY
        nezakládá karty ani klienty — neznámé SKU i neznámý dodavatel skončí jako
        chyba řádku. Dodavatel se hledá podle IČO (sloupec `ico`), jinak podle
        názvu (`dodavatel`).

        `dry_run` (výchozí) jen spočítá report. Ostrý běh je vše-nebo-nic:
        jediný chybný řádek zruší celý zápis. Zapsané řádky dostanou
        `data_source=import`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'XLSX nebo CSV, max 2 MB.' }
                dry_run: { type: boolean, default: true }
      responses:
        '200':
          description: Report importu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockVendorOfferImportReport' }
        '415': { description: Nepodporovaný formát souboru. }
        '422': { description: Soubor je příliš velký nebo má příliš mnoho řádků. }
  /api/v1/stock/documents:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Seznam skladových dokladů
      description: Stránkovaný seznam dokladů PRI/VYD/PRE (příjemka/výdejka/převodka).
      parameters:
        - in: query
          name: doc_type
          schema: { type: string, enum: [receipt, issue, transfer] }
        - in: query
          name: status
          schema: { type: string, enum: [draft, posted, reversed] }
        - in: query
          name: origin
          schema: { type: string, enum: [manual, invoice, credit_note, purchase_invoice, inventory] }
        - in: query
          name: warehouse_id
          schema: { type: integer }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: limit
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200': { description: 'OK — `{items, total, limit, offset}`.' }
    post:
      tags: [Stock]
      summary: Nový skladový doklad (draft)
      description: |
        Založí draft dokladu (hlavička + řádky). U `doc_type=transfer` je povinný i
        `warehouse_to_id` (odlišný od `warehouse_id`). U příjemky se ocenění řádků
        (`unit_cost`/`extra_cost`) počítá zadanou pořizovací cenou; u výdeje/převodky
        se doplní až při zaúčtování (`post`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_type, doc_date, description, warehouse_id, lines]
              properties:
                doc_type: { type: string, enum: [receipt, issue, transfer] }
                origin: { type: string, enum: [manual, invoice, credit_note, purchase_invoice, inventory], default: manual }
                doc_date: { type: string, format: date }
                description: { type: string, maxLength: 255 }
                warehouse_id: { type: integer }
                warehouse_to_id: { type: [integer, "null"], description: 'Povinné jen u transfer.' }
                partner_name: { type: [string, "null"] }
                invoice_id: { type: [integer, "null"] }
                purchase_invoice_id: { type: [integer, "null"] }
                stock_take_id: { type: [integer, "null"] }
                lines:
                  type: array
                  items:
                    type: object
                    required: [stock_item_id, qty]
                    properties:
                      stock_item_id: { type: integer }
                      qty: { type: string }
                      unit_cost: { type: string, description: 'Jen u receipt.' }
                      extra_cost: { type: string, description: 'Vedlejší pořizovací náklady, jen u receipt.' }
                      invoice_item_id: { type: [integer, "null"] }
                      purchase_invoice_item_id: { type: [integer, "null"] }
                      source_description: { type: [string, "null"] }
                      source_qty: { type: [string, "null"] }
                      note: { type: [string, "null"] }
      responses:
        '201': { description: 'Vytvořeno (draft).' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/stock/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Detail skladového dokladu
      description: Vč. řádků.
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stock]
      summary: Úprava skladového dokladu (draft)
      description: |
        Přepíše hlavičku a nahradí řádky. Lze upravovat jen doklad ve stavu `draft`
        (jinak 422 `not_draft`). Tělo stejné jako u vytvoření.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                doc_type: { type: string, enum: [receipt, issue, transfer] }
                origin: { type: string, enum: [manual, invoice, credit_note, purchase_invoice, inventory] }
                doc_date: { type: string, format: date }
                description: { type: string, maxLength: 255 }
                warehouse_id: { type: integer }
                warehouse_to_id: { type: [integer, "null"] }
                partner_name: { type: [string, "null"] }
                lines:
                  type: array
                  items: { type: object }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Doklad není draft, nebo validace řádků selhala.' }
    delete:
      tags: [Stock]
      summary: Smazání skladového dokladu (draft)
      description: Smazat lze jen doklad ve stavu `draft`.
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Doklad není draft.' }
  /api/v1/stock/documents/{id}/post:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Stock]
      summary: Zaúčtování skladového dokladu
      description: |
        Zaúčtuje draft: kontrola dostupnosti (výdej/převodka nesmí jít do minusu),
        aplikace pohybů na stavy skladu (naskladnění u receipt, vyskladnění u issue,
        výdej+příjem u transfer), přidělení čísla řady a přechod do stavu `posted`.
        Idempotentní — opakované zavolání na už zaúčtovaném dokladu vrátí doklad
        beze změny. Blokováno otevřenou inventurou (status `counting`) na dotčeném
        skladu a uzavřeným účetním obdobím.
      responses:
        '200': { description: 'Zaúčtováno — doklad vč. `warnings` (např. neaktivní karta na řádku).' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Nedostatek zásob, otevřená inventura na skladu, nebo uzavřené účetní období.' }
        '422': { description: 'Doklad není draft, nebo je neplatný (chybí sklad/řádky).' }
  /api/v1/stock/documents/{id}/reverse:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Stock]
      summary: Storno skladového dokladu
      description: |
        Vytvoří protidoklad v PŮVODNÍ ceně (hodnotově neutrální storno) — opačný
        `doc_type` (u převodky s prohozenými sklady), stejné řádky a `doc_date`
        původního dokladu; protidoklad se rovnou zaúčtuje a původní doklad se
        označí jako `reversed`. Storno lze provést jen na zaúčtovaném (`posted`)
        dokladu; storno příjemky po výdejích, které by způsobilo záporný stav,
        je odmítnuto (409).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: 'Volitelný důvod storna (do popisu protidokladu).' }
      responses:
        '200': { description: 'Storno provedeno — `{original, reversal}`.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Doklad už je stornovaný, není zaúčtovaný, nedostatek zásob, otevřená inventura, nebo uzavřené období.' }
  /api/v1/stock/documents/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Tisk skladového dokladu (PDF)
      description: PDF skladového dokladu (PRI/VYD/PRE) vč. hlavičky, řádků a celkové hodnoty.
      responses:
        '200':
          description: PDF ke stažení (inline).
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/stock/takes:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Seznam inventur
      parameters:
        - in: query
          name: warehouse_id
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string, enum: [draft, counting, closed] }
      responses:
        '200': { description: OK }
    post:
      tags: [Stock]
      summary: Nová inventura (draft)
      description: |
        Založí novou inventuru ve stavu `draft`. Na skladu smí být rozpracovaná
        (draft/counting) jen jedna inventura zaráz — jinak 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_id, take_date, counting_method, responsible_count_name, responsible_inventory_name]
              properties:
                warehouse_id: { type: integer }
                take_date: { type: string, format: date }
                note: { type: [string, "null"] }
                counting_method: { type: string, enum: [physical_count, measurement, weighing, other] }
                responsible_count_name: { type: string, maxLength: 255 }
                responsible_inventory_name: { type: string, maxLength: 255 }
      responses:
        '201': { description: Vytvořeno }
        '409': { description: 'Na skladu už běží rozpracovaná inventura.' }
        '422': { description: 'Sklad nenalezen nebo neaktivní, nebo chybí datum.' }
  /api/v1/stock/takes/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Detail inventury
      description: Vč. řádků s `diff_qty` (rozdíl skutečnost−očekávání, `null` pokud nepočítáno).
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stock]
      summary: Zadání skutečných počtů
      description: Zadání/úprava `counted_qty` na řádcích inventury — jen ve fázi `counting`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: integer, description: 'ID řádku inventury (stock_take_lines.id).' }
                      counted_qty: { type: [string, "null"], description: 'null = nepočítáno.' }
                      surplus_unit_cost: { type: [string, "null"], description: 'Reprodukční pořizovací cena za MJ pro kladný inventurní rozdíl.' }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Inventura není ve fázi counting.' }
  /api/v1/stock/takes/{id}/start:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Stock]
      summary: Spuštění inventury (draft → counting)
      description: |
        Vytvoří snapshot očekávaných stavů (`expected_qty`/`expected_value`) všech
        aktivních karet skladu k okamžiku spuštění a přepne inventuru do fáze
        `counting`. Lze spustit jen inventuru ve stavu `draft`.
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Inventura není draft.' }
  /api/v1/stock/takes/{id}/close:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Stock]
      summary: Uzavření inventury (counting → closed)
      description: |
        Spočítá rozdíly (skutečnost−očekávání) na počítaných řádcích a vygeneruje
        rozdílové skladové doklady (origin=`inventory`, rovnou zaúčtované) — souhrnnou
        příjemku za přebytky a/nebo souhrnnou výdejku za manka; nepočítané řádky
        (`counted_qty=null`) beze změny. Přepne inventuru do stavu `closed`. Lze
        uzavřít jen inventuru ve fázi `counting`.
      responses:
        '200': { description: 'Uzavřeno — vč. `receipt_document`/`issue_document` (může být `null`).' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Zaúčtování rozdílového dokladu selhalo (např. uzavřené období).' }
        '422': { description: 'Inventura není ve fázi counting.' }
  /api/v1/stock/takes/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stock]
      summary: Inventurní soupis PDF
      responses:
        '200':
          description: Průkazný inventurní soupis s odpovědnými osobami, okamžiky a podpisovými řádky.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/stock/reports/status:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Sestava — stav zásob
      parameters:
        - in: query
          name: warehouse_id
          schema: { type: integer }
        - in: query
          name: item_type
          schema: { type: string, enum: [material, goods, product] }
        - in: query
          name: below_min
          schema: { type: boolean }
        - in: query
          name: active
          schema: { type: boolean }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/v1/stock/reports/valuation:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Stock]
      summary: Sestava — ocenění zásob k datu
      description: Ocenění stavu zásob k historickému datu (rekonstrukce z pohybů).
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
          description: Výchozí dnešní datum.
        - in: query
          name: warehouse_id
          schema: { type: integer }
      responses:
        '200': { description: OK }
  /api/v1/stock/reports/{name}/export:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: name
        required: true
        schema: { type: string, enum: [status, valuation] }
    get:
      tags: [Stock]
      summary: Export sestavy (PDF/XLSX)
      description: Export sestavy `status` nebo `valuation` (stejné filtry jako u dat sestavy).
      parameters:
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [pdf, xlsx] }
        - in: query
          name: warehouse_id
          schema: { type: integer }
        - in: query
          name: item_type
          schema: { type: string, enum: [material, goods, product] }
          description: Jen u sestavy status.
        - in: query
          name: below_min
          schema: { type: boolean }
          description: Jen u sestavy status.
        - in: query
          name: active
          schema: { type: boolean }
          description: Jen u sestavy status.
        - in: query
          name: q
          schema: { type: string }
          description: Jen u sestavy status.
        - in: query
          name: date
          schema: { type: string, format: date }
          description: Jen u sestavy valuation.
      responses:
        '200':
          description: 'Soubor (PDF nebo XLSX dle `format`).'
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '404': { description: 'Neznámá sestava.' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/documents/{entity_type}/{id}/signature-selection:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: entity_type
        required: true
        schema: { type: string, enum: [invoice, work_report] }
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: ID faktury (u `work_report` je to ID faktury, ke které výkaz patří).
    get:
      tags: [Documents]
      summary: Per-dokumentový výběr podpisového profilu — aktuální stav
      description: |
        Vrací efektivní i vlastní (override) nastavení výběru podpisového profilu pro
        PDF konkrétního dokladu: `selection_source` (`inherit`/`logged_in_user`/`admin_profile_settings`),
        zděděné nastavení z admin output settings a `effective_will_sign` (skutečně se
        doklad podepíše — zapnutý výstup + resolvovatelný profil s certifikátem).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage: { type: string, enum: [pdf] }
                  entity_type: { type: string }
                  entity_id: { type: integer }
                  selection_source: { type: string, enum: [inherit, logged_in_user, admin_profile_settings] }
                  admin_profile_id: { type: [integer, "null"] }
                  inherited_selection_source: { type: string }
                  inherited_admin_profile_id: { type: [integer, "null"] }
                  effective_selection_source: { type: string }
                  effective_admin_profile_id: { type: [integer, "null"] }
                  has_override: { type: boolean }
                  effective_will_sign: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Documents]
      summary: Nastaví (nebo zdědí) výběr podpisového profilu pro doklad
      description: |
        `selection_source = inherit` (nebo prázdné) smaže override a doklad se vrátí
        ke zděděnému nastavení dodavatele. `admin_profile_id` smí nastavit jen admin.
        Po změně se u faktury invaliduje vygenerované PDF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selection_source: { type: string, enum: [inherit, logged_in_user, admin_profile_settings] }
                admin_profile_id: { type: [integer, "null"] }
      responses:
        '200': { description: Aktuální stav výběru }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Documents]
      summary: Zruší override výběru podpisového profilu (návrat ke zděděnému nastavení)
      responses:
        '200': { description: Aktuální stav výběru }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/document-folders/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      tags: [Documents]
      summary: Přejmenování složky
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '200': { description: ok }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Složka se stejným názvem už v cílovém rodiči existuje (duplicate)' }
    delete:
      tags: [Documents]
      summary: Přesun podstromu složky do koše (soft-delete)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  trashed_folders: { type: integer, description: Počet smazaných složek podstromu vč. této. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/document-folders/{id}/move:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Documents]
      summary: Přesun složky pod jinou nadřazenou složku
      description: Zakázán přesun do sebe sama nebo do vlastního potomka (cyklus).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id: { type: [integer, "null"], description: 'NULL = přesun do kořene' }
      responses:
        '200': { description: ok }
        '400': { description: 'Cyklus — přesun do vlastního potomka' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/document-folders/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Documents]
      summary: Obnovení složky z koše
      responses:
        '200': { description: ok }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/documents/zip-import:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Documents]
      summary: Nahraje ZIP a rozbalí ho na pozadí (async job)
      description: |
        Uloží ZIP a založí background job `document_zip_import`; sleduj přes
        `GET /documents/jobs/{id}`. Určeno pro velké archivy (obchází PHP limity uploadu).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: ZIP archiv }
                folder_id: { type: [integer, "null"], description: 'Cílová složka; prázdné = kořen' }
      responses:
        '200':
          description: Job založen
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: integer }
                  status: { type: string, enum: [queued] }
        '400': { description: 'Chybí soubor / cílová složka nenalezena' }
        '415': { description: 'Soubor není ZIP' }
        '500': { description: 'Úložiště nezapisovatelné / chybí DB migrace pro job' }
  /api/v1/documents/export:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Documents]
      summary: Sestaví ZIP export vybraných dokumentů/složek na pozadí (async job)
      description: |
        Založí background job `document_zip_export` se zachovanou strukturou složek.
        Výsledek stáhneš přes `GET /documents/jobs/{id}/download` po dokončení.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: integer }, description: ID dokumentů }
                folder_ids: { type: array, items: { type: integer }, description: ID složek (exportují se rekurzivně) }
      responses:
        '200':
          description: Job založen
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: integer }
                  status: { type: string, enum: [queued] }
        '400': { description: 'Nebyly vybrány žádné položky' }
  /api/v1/documents/upload/start:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Documents]
      summary: Zahájí chunkovaný upload — založí job a staging adresář
      description: |
        Krok 1 chunkovaného upload protokolu (obchází `post_max_size`/`upload_max_filesize`):
        `start` → 1..N × `chunk-bytes` (mode `zip-explode`/`single`) nebo `chunk-files`
        (mode `folder`) → `finish` (spustí worker). `mode=single` uloží `name` pro
        pozdější manifest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [zip-explode, folder, single] }
                folder_id: { type: [integer, "null"] }
                name: { type: string, description: 'Jen mode=single — název souboru' }
      responses:
        '200':
          description: Job/staging založen
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: integer }
                  mode: { type: string }
        '400': { description: 'Neplatný mode' }
        '404': { description: 'Cílová složka nenalezena' }
        '500': { description: 'Úložiště nezapisovatelné / chybí DB migrace pro job' }
  /api/v1/documents/upload/chunk-bytes:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: query
        name: job_id
        required: true
        schema: { type: integer }
    post:
      tags: [Documents]
      summary: Nahraje jeden bytový chunk (mode zip-explode/single)
      description: Tělo požadavku je surový binární chunk, který se append-uje na disk k jobu.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Aktuální velikost akumulovaného souboru
          content:
            application/json:
              schema:
                type: object
                properties:
                  size: { type: integer }
        '409': { description: 'Neplatný/již dokončený job nebo chybí staging' }
        '413': { description: 'Soubor přesáhl 1 GiB strop' }
        '500': { description: 'Zápis chunku selhal' }
  /api/v1/documents/upload/chunk-files:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: query
        name: job_id
        required: true
        schema: { type: integer }
    post:
      tags: [Documents]
      summary: Nahraje dávku souborů s relativními cestami (mode folder)
      description: Určeno pro upload celého adresáře — zachovává relativní cestu z `relpaths[]`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                'file[]': { type: array, items: { type: string, format: binary } }
                'relpaths[]': { type: array, items: { type: string }, description: 'Relativní cesta odpovídající stejnému indexu file[]' }
      responses:
        '200':
          description: Počet přidaných souborů do stagingu
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
        '409': { description: 'Neplatný/již dokončený job nebo chybí staging' }
  /api/v1/documents/upload/finish:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Documents]
      summary: Dokončí chunkovaný upload a spustí zpracování na pozadí
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id]
              properties:
                job_id: { type: integer }
      responses:
        '200':
          description: Zpracování spuštěno
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: integer }
                  status: { type: string, enum: [queued] }
        '409': { description: 'Neplatný nebo již dokončený job' }
  /api/v1/documents/jobs:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Documents]
      summary: Seznam background jobů sekce Dokumenty (import/export)
      description: |
        Posledních 30 jobů dodavatele typu `document_zip_import`, `document_zip_export`
        nebo `document_folder_import`. Non-admin vidí jen vlastní joby (`created_by`),
        admin vidí všechny (vlastnická osa napříč uživateli dodavatele).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        source: { type: string, enum: [document_zip_import, document_zip_export, document_folder_import] }
                        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
                        total_items: { type: [integer, "null"] }
                        processed: { type: integer }
                        created_count: { type: integer }
                        skipped_count: { type: integer }
                        failed_count: { type: integer }
                        current_step: { type: [string, "null"] }
                        last_error: { type: [string, "null"] }
                        cancel_requested: { type: boolean }
                        result_name: { type: [string, "null"] }
                        result_size: { type: [integer, "null"] }
                        created_at: { type: string, format: date-time }
                        finished_at: { type: [string, "null"], format: date-time }
  /api/v1/documents/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Documents]
      summary: Stav background jobu (polling)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  source: { type: string, enum: [document_zip_import, document_zip_export, document_folder_import] }
                  status: { type: string, enum: [queued, running, completed, failed, cancelled] }
                  total_items: { type: [integer, "null"] }
                  processed: { type: integer }
                  created_count: { type: integer }
                  skipped_count: { type: integer }
                  failed_count: { type: integer }
                  current_step: { type: [string, "null"] }
                  last_error: { type: [string, "null"] }
                  cancel_requested: { type: boolean }
                  result_name: { type: [string, "null"] }
                  result_size: { type: [integer, "null"] }
                  created_at: { type: string, format: date-time }
                  finished_at: { type: [string, "null"], format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Documents]
      summary: Smaže job (vč. výsledného souboru na disku, pokud existuje)
      responses:
        '200': { description: ok }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/documents/jobs/{id}/download:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Documents]
      summary: Stažení výsledku dokončeného jobu (typicky ZIP export)
      description: Vyžaduje job ve stavu `completed` s uloženým výsledkem; jinak `404`.
      responses:
        '200':
          description: Binární obsah výsledku (`Content-Type` dle `result_mime`, default `application/zip`)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { description: 'Job nenalezen, nedokončen nebo výsledek chybí' }
  /api/v1/documents/jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Documents]
      summary: Požádá o zrušení běžícího jobu (worker zrušení zkontroluje mezi kroky)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cancel_requested: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/documents/tags:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Documents]
      summary: Seznam tagů dodavatele s počtem použití
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        usage_count: { type: integer }
  /api/v1/documents/trash:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Documents]
      summary: Obsah koše — smazané dokumenty a smazané složky
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: array, items: { $ref: '#/components/schemas/Document' } }
                  folders: { type: array, items: { $ref: '#/components/schemas/DocumentFolder' } }
  /api/v1/documents/trash/empty:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Documents]
      summary: Vysype koš — trvalé smazání (dedup-aware mazání souborů z disku)
      description: |
        Smaže DB řádky smazaných dokumentů i složek a následně fyzicky odstraní
        soubory, na které už po smazání neukazuje žádný jiný dokument/příloha
        (union ref-counting `documents` + `document_files`). Scope-aware: non-admin
        vysype jen firemní a vlastní osobní doklady, cizí osobní doklady v koši zůstanou.

        Doklady, na které ukazuje živá vazba z jiné agendy (mzdové doklady v DMS,
        důkazy k exekucím, artefakty podání na finanční správu), se **vynechají** —
        vysypání se kvůli nim nezastaví. Vrátí se v `kept_documents` i s důvodem.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deleted: { type: integer }
                  kept: { type: integer, description: Kolik dokladů v koši zůstalo }
                  kept_documents:
                    type: array
                    description: Doklady, které v koši zůstaly, i s vysvětlením proč
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        reason: { type: string }
  /api/v1/documents/bulk:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Documents]
      summary: Hromadná akce nad dokumenty a/nebo složkami
      description: |
        `action=move` — přesun `ids`/`folder_ids` do `folder_id` (zákaz cyklu u složek).
        `action=delete` — soft-delete (do koše). `action=tag` — přiřadí `tags[]`
        k dokumentům `ids` (složky tag nepodporují). Cizí osobní doklady jsou
        scope-guardem tiše přeskočeny (nezapočítají se do `affected`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [move, delete, tag] }
                ids: { type: array, items: { type: integer } }
                folder_ids: { type: array, items: { type: integer } }
                folder_id: { type: [integer, "null"], description: 'Jen action=move' }
                tags: { type: array, items: { type: string }, description: 'Jen action=tag' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  affected: { type: integer }
        '400': { description: 'Nebyly vybrány žádné položky / neznámá akce' }
        '404': { description: 'Cílová složka nenalezena (action=move)' }
  /api/v1/documents/bulk-download:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: query
        name: ids
        required: true
        schema: { type: string }
        description: 'CSV seznam ID dokumentů, např. "1,2,3"'
    get:
      tags: [Documents]
      summary: Stáhne vybrané dokumenty jako jeden ZIP (dokumenty.zip)
      description: Názvy v ZIPu jsou deduplikovány (`-2`, `-3`, …) při shodě `original_name`.
      responses:
        '200':
          description: ZIP archiv
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400': { description: 'Nebyly vybrány žádné dokumenty' }
        '404': { description: 'Žádný soubor k zabalení' }
        '500': { description: 'ZIP není na serveru dostupné / vytvoření selhalo' }
  /api/v1/documents/{id}/move:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Documents]
      summary: Přesun dokumentu do jiné složky
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_id: { type: [integer, "null"], description: 'NULL = přesun do kořene' }
      responses:
        '200': { description: ok }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/documents/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Documents]
      summary: Obnovení dokumentu z koše
      responses:
        '200': { description: ok }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/documents/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Documents]
      summary: Inline náhled souboru (jen PDF/rastrové obrázky, jinak attachment fallback)
      description: |
        Bezpečné servírování: inline `Content-Disposition` jen pro `pdf`/`image`
        doc_type s whitelistovaným MIME (PDF, JPEG, PNG, GIF, WEBP); ostatní typy
        (vč. HTML/SVG) se vrátí jako `attachment` s `application/octet-stream`
        (anti stored-XSS), plus `Content-Security-Policy: sandbox`.
      responses:
        '200':
          description: Binární obsah souboru
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '404': { description: 'Dokument nebo soubor na disku nenalezen' }
  /api/v1/documents/{id}/thumb:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Documents]
      summary: Náhled dokumentu (JPEG)
      description: Vrátí `404`, dokud není náhled vygenerován (`thumb_status = generated`).
      responses:
        '200':
          description: JPEG náhled
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        '404': { description: 'Náhled není k dispozici / nenalezen na disku' }
  /api/v1/documents/{id}/files:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Documents]
      summary: Seznam souborů dokumentu (primary + přílohy)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        document_id: { type: integer }
                        role: { type: string, enum: [primary, attachment] }
                        original_name: { type: string }
                        mime_type: { type: string }
                        size_bytes: { type: integer }
                        doc_type: { type: string, enum: [pdf, docx, xlsx, xml, zfo, p7s, zip, image, other] }
                        sort_order: { type: integer }
                        uploaded_by: { type: [integer, "null"] }
                        created_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Documents]
      summary: Přidá přílohu/přílohy k dokumentu (role vždy attachment)
      description: |
        Multipart upload jednoho i více souborů (`file`/`file[]`, max 100 na request).
        Bajty jdou přes hardened storage (MIME z obsahu, blocklist, size cap, dedup).
        Shodný obsah (stejné `sha256`) už u dokumentu → daný soubor se přeskočí
        s `reason: duplicate` v `errors[]`, ostatní se zpracují dál.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                'file[]': { type: array, items: { type: string, format: binary } }
      responses:
        '200':
          description: 'Výsledek (i částečný — viz errors[])'
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        document_id: { type: integer }
                        role: { type: string, enum: [primary, attachment] }
                        original_name: { type: string }
                        mime_type: { type: string }
                        size_bytes: { type: integer }
                        doc_type: { type: string, enum: [pdf, docx, xlsx, xml, zfo, p7s, zip, image, other] }
                        sort_order: { type: integer }
                        uploaded_by: { type: [integer, "null"] }
                        created_at: { type: string, format: date-time }
                  errors: { type: array, items: { type: object, properties: { name: { type: string }, reason: { type: string } } } }
        '400': { description: 'Žádný soubor odeslán / žádný se nepodařilo přidat (viz errors[])' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: 'Příliš mnoho souborů najednou (> 100)' }
  /api/v1/documents/{id}/files/{fileId}/download:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
      - in: path
        name: fileId
        required: true
        schema: { type: integer }
    get:
      tags: [Documents]
      summary: Stažení konkrétního souboru dokumentu (vždy attachment + nosniff)
      responses:
        '200':
          description: Binární obsah souboru
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '404': { description: 'Dokument, soubor nebo bajty na disku nenalezeny' }
  /api/v1/documents/{id}/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer }
      - in: path
        name: fileId
        required: true
        schema: { type: integer }
    patch:
      tags: [Documents]
      summary: Nastaví soubor jako primární a/nebo změní pořadí
      description: |
        `role=primary` atomicky degraduje stávající primary a povýší cíl (právě
        jeden primary na dokument). `role=attachment` na aktuálně primárním souboru
        je odmítnuto — dokument musí mít vždy primární soubor.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [primary, attachment] }
                sort_order: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        document_id: { type: integer }
                        role: { type: string, enum: [primary, attachment] }
                        original_name: { type: string }
                        mime_type: { type: string }
                        size_bytes: { type: integer }
                        doc_type: { type: string, enum: [pdf, docx, xlsx, xml, zfo, p7s, zip, image, other] }
                        sort_order: { type: integer }
                        uploaded_by: { type: [integer, "null"] }
                        created_at: { type: string, format: date-time }
        '400': { description: 'Neplatná role' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Nelze degradovat/smazat poslední primární soubor' }
    delete:
      tags: [Documents]
      summary: Odebere soubor od dokumentu (nelze poslední primary; orphan-aware mazání bajtů)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        document_id: { type: integer }
                        role: { type: string, enum: [primary, attachment] }
                        original_name: { type: string }
                        mime_type: { type: string }
                        size_bytes: { type: integer }
                        doc_type: { type: string, enum: [pdf, docx, xlsx, xml, zfo, p7s, zip, image, other] }
                        sort_order: { type: integer }
                        uploaded_by: { type: [integer, "null"] }
                        created_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Nelze smazat poslední primární soubor' }
  /api/v1/accounting/journal/{id}/description:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Accounting]
      summary: Upraví popis účetního zápisu (§35)
      description: |
        Inline editace popisu zápisu v deníku. Audit before/after se zapisuje ATOMICKY
        v téže transakci (§35 requirement). Vyžaduje roli účetní/admin (requireWrite).
        `description: null` nebo prázdný řetězec popis smaže.

        Optimistická konkurence: pošli aktuální `row_version` v hlavičce `If-Match`
        (hodnota z ETag u GET). Při neshodě 409 `version_conflict` (mezitím editoval
        jiný uživatel). Vynechání If-Match i body `row_version` = bez CAS (zpětně kompat.).
      parameters:
        - in: header
          name: If-Match
          required: false
          description: |
            Očekávaná verze zápisu (row_version) pro optimistickou konkurenci; při neshodě
            409 version_conflict. Formát ETag validátoru (`"5"`). Vynechání = bez CAS.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: [string, "null"], maxLength: 255 }
                row_version:
                  type: integer
                  description: Fallback k If-Match, pokud klient neumí posílat hlavičku.
      responses:
        '403':
          description: |
            Zápis přes API token (`token_write_forbidden`). Účetní a daňová vrstva
            je přes token jednosměrná — čtení ano, zápis jen z webového rozhraní,
            a to i tokenu se scope `read_write`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200':
          description: OK
          headers:
            ETag:
              description: Aktuální row_version zápisu jako validátor pro další If-Match.
              schema: { type: string }
        '400':
          description: invalid_if_match — hlavička If-Match není platný validátor (row_version)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: version_conflict — zápis mezitím změnil jiný uživatel
          headers:
            ETag:
              description: Aktuální row_version zápisu (pro resync klienta).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/accounting/journal/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Accounting]
      summary: Seznam příloh účetního zápisu (§33a)
      description: Vrací `items` (seznam příloh) a `total_size` (součet bajtů příloh zápisu). Čtení (readonly+).
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Accounting]
      summary: Nahraje jednu nebo více příloh k účetnímu zápisu
      description: |
        Multipart upload, pole `file` nebo `file[]` (víc souborů najednou). MIME se
        detekuje z OBSAHU (magic-byte + finfo, klient-side Content-Type se ignoruje) +
        blocklist nebezpečných přípon/MIME. Content-addressed SHA-256 s dedupem —
        stejný obsah u téhož zápisu vrací `duplicate` (409). Limity: max 20 MiB na
        soubor, strop na celkovou velikost příloh zápisu.

        Dávkový upload nesmí spadnout kvůli jedné vadné příloze — odpověď obsahuje
        `results` (created/error per soubor). Pokud NIC nevzniklo a nastala chyba,
        vrací se klasický chybový status (409 duplicate, 413 file_too_large, …) —
        REST parita pro single-file upload. Vyžaduje roli účetní/admin.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Jeden soubor, nebo pole souborů (file[]).
      responses:
        '403':
          description: |
            Zápis přes API token (`token_write_forbidden`). Účetní a daňová vrstva
            je přes token jednosměrná — čtení ano, zápis jen z webového rozhraní,
            a to i tokenu se scope `read_write`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: array, items: { type: integer }, description: ID úspěšně vytvořených příloh. }
                  results:
                    type: array
                    description: Per-soubor výsledek (status created/error, original_name, error, message).
                    items: { type: object }
                  items: { type: array, description: Aktuální seznam příloh zápisu po uploadu. }
                  total_size: { type: integer, description: Součet bajtů příloh zápisu po uploadu. }
        '400': { description: "Žádný/vadný soubor (no_file, validation_failed)" }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Stejný obsah (sha256) už je u zápisu evidován (duplicate)' }
        '413': { description: Soubor nebo součet příloh zápisu přesahuje limit }
  /api/v1/accounting/journal/{id}/attachments/{attId}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
      - in: path
        name: attId
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Accounting]
      summary: Stáhne přílohu účetního zápisu
      description: |
        Vždy `Content-Disposition: attachment` (nikdy inline render) + `X-Content-Type-Options: nosniff`.
        Cesta k souboru prochází realpath-inside-base kontrolou před streamem (path traversal guard).
      responses:
        '200':
          description: Binární obsah přílohy
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Accounting]
      summary: Smaže přílohu účetního zápisu
      description: |
        Odstraní DB řádek; bajt na disku se smaže jen pokud je orphan (dedup-aware,
        počítá se jen v rámci journal_entry_attachments, nekříží se s DMS). requireWrite.
      responses:
        '403':
          description: |
            Zápis přes API token (`token_write_forbidden`). Účetní a daňová vrstva
            je přes token jednosměrná — čtení ano, zápis jen z webového rozhraní,
            a to i tokenu se scope `read_write`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/accounting/journal/{id}/attachments/{attId}/description:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
      - in: path
        name: attId
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Accounting]
      summary: Upraví popisek přílohy zápisu
      description: 'Neměnný before/after audit log. requireWrite = účetní/admin. `description: null`/prázdný řetězec popis smaže (max 255 znaků).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: [string, "null"], maxLength: 255 }
      responses:
        '403':
          description: |
            Zápis přes API token (`token_write_forbidden`). Účetní a daňová vrstva
            je přes token jednosměrná — čtení ano, zápis jen z webového rozhraní,
            a to i tokenu se scope `read_write`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/bank-statements/scan:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Bank]
      summary: Naskenuje nakonfigurovaný adresář a naimportuje nové bankovní výpisy
      description: |
        Pouze role admin. Adresář se čte z `cfg.bank_import.scan_root` — pokud není
        nastaven nebo neexistuje, vrací `config_missing` (400). Používá se místo
        ručního uploadu, když banka ukládá výpisy na sdílený disk.
      responses:
        '200': { description: 'OK — souhrn naskenovaných/naimportovaných souborů' }
        '400': { description: cfg.bank_import.scan_root není nastaveno nebo adresář neexistuje }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: '`managed_installation` — spravovaná instalace (cfg `app.managed`) skenování adresářů na serveru nepovoluje' }
  /api/v1/bank-statements/account-balances:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Bank]
      summary: Přehled zůstatků na bankovních účtech dodavatele
      description: |
        Pro každý měnový účet (currencies) vrací aktuální zůstatek, měsíční vývoj
        (carry-forward) a přepočet do CZK kurzem ČNB ke konci každého měsíce
        (`exchange_rates` cache). Zdroj zůstatku: GPC výpisy (`source=gpc`,
        autoritativní) nebo e-mailová avíza (`bank_transactions.balance`) — novější
        datum vyhrává, při shodě GPC. Měny bez dostupného kurzu jsou v `missing_rates`.
        Grafy jsou omezené na posledních 36 měsíců.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  base_currency: { type: string, example: CZK }
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        code: { type: string }
                        label: { type: string }
                        account_number: { type: string }
                        bank_code: { type: [string, "null"] }
                        is_default: { type: boolean }
                        current_balance: { type: number }
                        current_balance_czk: { type: [number, "null"] }
                        statement_date: { type: [string, "null"], format: date }
                        current_source: { type: string, enum: [gpc, email_notice] }
                        statement_count: { type: integer }
                        months:
                          type: array
                          items:
                            type: object
                            properties:
                              month: { type: string, example: '2026-06' }
                              balance: { type: [number, "null"] }
                  total_czk:
                    type: object
                    properties:
                      current: { type: number }
                      months:
                        type: array
                        items:
                          type: object
                          properties:
                            month: { type: string }
                            balance_czk: { type: [number, "null"] }
                  missing_rates:
                    type: array
                    items: { type: string }
                    description: Kódy měn bez dostupného kurzu (chybí v přepočtu do CZK).
  /api/v1/bank-statements/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Bank]
      summary: Přiloží k výpisu oficiální PDF z banky
      description: |
        Multipart upload (max 10 MiB). Validace: přípona `.pdf`, magic bytes `%PDF-`,
        MIME `application/pdf`. Ukládá se jako MEDIUMBLOB do `bank_statements.pdf_content`.
        Avízo-výpis (`source=email_notice`, virtuální, složený z e-mailových avíz) PDF
        nemá — vrací `unsupported` (400). Role admin nebo účetní.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'PDF výpis (max 10 MiB)' }
      responses:
        '200': { description: OK }
        '400': { description: 'Soubor chybí, není PDF, nebo je avízo-výpis (unsupported)' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Soubor je příliš velký (> 10 MiB) }
    get:
      tags: [Bank]
      summary: Stáhne přiložené PDF výpisu
      description: 'Číslo účtu se prepend­uje do názvu souboru, pokud v něm ještě není (odlišení výpisů z různých účtů).'
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: "K výpisu není nahrané PDF, nebo výpis nenalezen" }
    delete:
      tags: [Bank]
      summary: Smaže přiložené PDF výpisu
      description: GPC data i transakce zůstávají zachované, maže se jen PDF. Role admin nebo účetní.
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/bank-transactions/{id}/match-candidates:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Bank]
      summary: Navrhne faktury ke spárování s bankovní transakcí
      description: |
        Použije se, když transakce nemá VS nebo VS nesedí. Prohledává vystavené i
        přijaté faktury (± 14 dní kolem data splatnosti/vystavení), znaménko se
        nefiltruje (dobropisy). Cizoměnová faktura placená z CZK účtu se porovnává
        přes kurz faktury s relativní tolerancí (4 %). Zahrnuje i zaplacené faktury
        (druhá platba/doplatek). Vrací max 25 kandidátů, nejlepší shoda první.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [invoice, purchase_invoice] }
                        id: { type: integer }
                        ref: { type: [string, "null"] }
                        amount: { type: number }
                        currency: { type: string }
                        converted_amount: { type: [number, "null"] }
                        converted_currency: { type: [string, "null"] }
                        issue_date: { type: string, format: date }
                        due_date: { type: [string, "null"], format: date }
                        party: { type: [string, "null"] }
                        paid: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/bank-transactions/{id}/split-suggestions:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Bank]
      summary: Navrhne sloučenou úhradu — jedna platba pokrývající více vystavených faktur
      description: |
        Použije se, když klient zaplatil 2+ faktur jednou platbou a VS nesedí (jen
        příchozí platby). Kombinace se hledají výhradně v rámci jednoho klienta;
        default okno ± 7 dní kolem data platby (rozšiřitelné parametrem `window`).
        Volitelná kotva `invoice_id` — uživatel už jednu fakturu vybral a částka
        nesedí, dohledají se další faktury téhož klienta.
      parameters:
        - in: query
          name: invoice_id
          schema: { type: integer }
          description: Kotva — omezí návrh na klienta této již vybrané faktury.
        - in: query
          name: window
          schema: { type: integer, default: 7, minimum: 1, maximum: 60 }
          description: Okno ve dnech kolem data platby (výchozí 7, max 60).
        - in: query
          name: max
          schema: { type: integer, default: 6, minimum: 2, maximum: 6 }
          description: Max počet faktur v jedné navržené kombinaci.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        client_id: { type: integer }
                        client_name: { type: [string, "null"] }
                        total: { type: number }
                        currency: { type: string }
                        count: { type: integer }
                        invoices: { type: array, items: { type: object } }
                  window: { type: integer }
                  max: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/bank-transactions/{id}/create-purchase-invoice:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Bank]
      summary: Založí koncept přijaté faktury z odchozí bankovní transakce
      description: |
        Jen pro ODCHOZÍ (zápornou) platbu — jinak `not_outgoing` (400). Dodavatel se
        NEzakládá automaticky, musí existovat a být vybraný přes `vendor_id` (uživatel
        ho vybere ve VendorPickeru, případně přes tlačítko „nový dodavatel"). Předvyplní
        fakturu (částka, datum, VS, měna, popis) jako DRAFT s jednou položkou v sazbě
        0 % — uživatel po nahrání PDF doplní skutečný rozpad DPH. `vendor_invoice_number`
        se nastaví na placeholder `BANK-{txId}` (VS jde do `varsymbol`, nekoliduje s
        unikátním klíčem). Zápis se spáruje s transakcí (`payment_matches`, typ manual),
        faktura ale NENÍ označena jako paid. Opakované volání na téže transakci vrací
        `already_exists` (409) s ID existujícího konceptu. Role admin nebo účetní.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id]
              properties:
                vendor_id: { type: integer, description: 'ID dodavatele (clients.id, musí patřit tenantovi).' }
      responses:
        '201':
          description: Koncept vytvořen
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase_invoice_id: { type: integer }
                  vendor_id: { type: integer }
                  currency: { type: string }
        '400': { description: 'Chybí/neplatný vendor_id, nebo transakce není odchozí (not_outgoing)' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Z této transakce už koncept přijaté faktury existuje (already_exists)' }
  /api/v1/bank-transactions/{id}/document-request:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Bank]
      summary: Založí požadavek na doklad z bankovní transakce (Fáze F)
      description: Výchozí popis/částka/datum se předvyplní z transakce.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 500 }
                deadline: { type: string, format: date }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/invoices/{id}/stock-documents:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Invoices, Stock]
      summary: Skladové doklady vázané na vydanou fakturu
      description: Vrací výdejky/doklady vytvořené k této faktuře (např. výdej ze skladu při fakturaci). 400, pokud sklad není u dodavatele zapnutý.
      responses:
        '200': { description: OK }
        '400': { description: Skladový modul není u tohoto dodavatele zapnutý }
  /api/v1/invoices/{id}/book:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Invoices]
      summary: Ručně označí vydanou fakturu jako zaúčtovanou
      description: |
        Epic F6 (§4.6) — pro tax_evidence firmy bez journalu/období je `booked_at`
        jediný mechanismus zámku pro roli client. Idempotentní — existující
        `booked_at`/`booked_by` se nepřepisuje. Koncept (`status=draft`) nelze
        zaúčtovat (`not_draft`, 409).
      responses:
        '200': { description: 'OK — vrací fakturu vč. stavu zámku' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Koncept nelze označit jako zaúčtovaný (not_draft)' }
    delete:
      tags: [Invoices]
      summary: Zruší ruční zaúčtování vydané faktury
      description: |
        Smaže `booked_at`/`booked_by`. Pokud má doklad aktivní (nestornovaný) posted
        zápis v deníku, vrací `still_posted` (409) — nejdřív je nutné zápis stornovat.
      responses:
        '200': { description: 'OK — vrací fakturu vč. stavu zámku' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Doklad má aktivní účetní zápis — nejdřív stornovat v deníku (still_posted)' }
  /api/v1/purchase-invoices/{id}/source:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Purchase invoices]
      summary: Stáhne archivovaný strojově čitelný zdrojový doklad (ISDOC/ISDOCX/Pohoda XML/…)
      description: |
        Vrací bajty AS-IS (`.isdocx` se nerozbaluje). Soubor leží mimo webroot, cesta
        prochází realpath-inside-archive-root kontrolou (path traversal guard). Vždy
        `Content-Disposition: attachment`. 404, pokud faktura nemá archivovaný zdroj.
      responses:
        '200':
          description: Binární obsah zdrojového dokladu
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { description: 'K faktuře není archivovaný zdroj, nebo faktura nenalezena' }
  /api/v1/purchase-invoices/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Purchase invoices]
      summary: Seznam DMS dokumentů provázaných s přijatou fakturou
      description: |
        Epic F7 (§6) — vazba přes `document_links(entity_type='purchase_invoice')`,
        nezávislá na fixních `pdf_`/`source_` sloupcích PF. Výsledek prochází DMS
        scope guardem (user-scoped doklady cizích uživatelů se nevrací).
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Purchase invoices]
      summary: Přivěsí existující DMS dokument k přijaté faktuře
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id]
              properties:
                document_id: { type: integer }
      responses:
        '200': { description: 'OK — vrací aktuální seznam provázaných dokumentů' }
        '400': { description: Chybí document_id }
        '404': { description: 'Faktura nebo dokument nenalezen (mimo DMS scope viewera)' }
    delete:
      tags: [Purchase invoices]
      summary: Odpojí DMS dokument od přijaté faktury
      description: '`document_id` se čte z těla požadavku, případně z query parametru.'
      parameters:
        - in: query
          name: document_id
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                document_id: { type: integer }
      responses:
        '200': { description: 'OK — vrací aktuální seznam provázaných dokumentů' }
        '404': { description: 'Faktura nebo dokument nenalezen (mimo DMS scope viewera)' }
  /api/v1/purchase-invoices/{id}/stock-receipt:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Purchase invoices, Stock]
      summary: Návrh příjemky ke skladovým položkám přijaté faktury
      description: Vrací, co zbývá přijmout na sklad, navrhované pořizovací ceny a kandidáty vedlejších nákladů. 400, pokud sklad není u dodavatele zapnutý.
      responses:
        '200': { description: OK }
        '400': { description: Skladový modul není u tohoto dodavatele zapnutý }
    post:
      tags: [Purchase invoices, Stock]
      summary: Založí skladovou příjemku (DRAFT) z přijaté faktury
      description: Vytvoří skladový doklad typu příjemka navázaný na fakturu. Tělo odpovídá návrhu z GET (položky/množství/ceny), lze upravit. requireWrite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Položky příjemky (podle návrhu z GET stock-receipt, upravitelné).
      responses:
        '201': { description: Příjemka vytvořena }
        '400': { description: Skladový modul není u tohoto dodavatele zapnutý }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/purchase-invoices/{id}/stock-receipts:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Purchase invoices, Stock]
      summary: Přehled skladových příjmů vytvořených z této přijaté faktury
      responses:
        '200': { description: OK }
        '400': { description: Skladový modul není u tohoto dodavatele zapnutý }
  /api/v1/logbook/trip-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Logbook]
      summary: Upraví kategorii cesty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, label]
              properties:
                code: { type: string }
                label: { type: string }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Kód už existuje' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Logbook]
      summary: Smaže kategorii cesty
      description: |
        Selže s 409, pokud jsou na kategorii navázané jízdy — v takovém případě
        ji lze místo smazání archivovat přes PUT.
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Kategorie má navázané jízdy' }
  /api/v1/logbook/trips/import:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Logbook]
      summary: Import knihy jízd z CSV/XLSX
      description: |
        Multipart upload souboru (max 10 MB). Vrací report o počtu vytvořených
        a neúspěšných řádků.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 'Report importu (created/failed)' }
        '400': { description: 'Chybí soubor nebo import selhal' }
        '413': { description: 'Soubor příliš velký (max 10 MB)' }
  /api/v1/logbook/trips/export:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: query
        name: format
        schema: { type: string, enum: [xlsx, pdf], default: xlsx }
      - in: query
        name: date_from
        schema: { type: string, format: date }
      - in: query
        name: date_to
        schema: { type: string, format: date }
      - in: query
        name: car_id
        schema: { type: integer }
      - in: query
        name: category_id
        schema: { type: integer }
    get:
      tags: [Logbook]
      summary: Export knihy jízd (XLSX/PDF)
      description: |
        Binární download souboru za zvolené období/filtry.
      responses:
        '200':
          description: Soubor exportu
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { description: 'Chybí supplier kontext nebo neplatný format' }
  /api/v1/logbook/trips/purposes:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Logbook]
      summary: Našeptávač účelů cest
      description: Distinct dříve zadané účely cest daného tenanta.
      responses:
        '200': { description: OK }
  /api/v1/logbook/trips/places:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Logbook]
      summary: Našeptávač míst cest
      description: Distinct dříve zadaná místa (odkud/kam) daného tenanta.
      responses:
        '200': { description: OK }
  /api/v1/logbook/fuelings/export:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: query
        name: format
        schema: { type: string, enum: [xlsx, pdf], default: xlsx }
      - in: query
        name: date_from
        schema: { type: string, format: date }
      - in: query
        name: date_to
        schema: { type: string, format: date }
      - in: query
        name: car_id
        schema: { type: integer }
      - in: query
        name: source
        schema: { type: string }
      - in: query
        name: vendor_id
        schema: { type: integer }
    get:
      tags: [Logbook]
      summary: Export tankování (XLSX/PDF)
      description: |
        Binární download souboru za zvolené období/filtry.
      responses:
        '200':
          description: Soubor exportu
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { description: 'Chybí supplier kontext nebo neplatný format' }
  /api/v1/logbook/summary/export:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: query
        name: year
        schema: { type: integer }
      - in: query
        name: format
        schema: { type: string, enum: [xlsx, pdf], default: xlsx }
    get:
      tags: [Logbook]
      summary: Export ročního souhrnu knihy jízd (XLSX/PDF)
      description: |
        Binární download souhrnu za rok (per vozidlo + totály + měsíční km).
        Bez `year` se použije nejnovější dostupný rok.
      responses:
        '200':
          description: Soubor exportu
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { description: 'Chybí supplier kontext nebo neplatný format' }
  /api/v1/logbook/fuel-invoices/backfill:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Logbook]
      summary: Zpětné dávkové vytěžení historie tankování z faktur
      description: |
        Projde historické přijaté faktury od benzínek (is_fuel_station) a vytěží
        z nich tankování. `limit` omezuje počet zpracovaných faktur na jedno volání
        (1–100, default 25).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: 'Report (processed/created/remaining)' }
  /api/v1/logbook/fuel-invoices:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Logbook]
      summary: Přehled faktur od benzínek
      description: |
        Nespárované faktury vrací všechny, spárované jen posledních `scanned_limit`
        (default 10, 0 = žádné). `only_unscanned=1` zobrazí jen dosud nevytěžené.
      parameters:
        - in: query
          name: year
          schema: { type: integer }
        - in: query
          name: only_unscanned
          schema: { type: boolean }
        - in: query
          name: scanned_limit
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: 'Faktury + seznam aut tenanta + has_cars' }
  /api/v1/logbook/fuel-invoices/{id}/items:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Logbook]
      summary: Položky faktury od benzínky (detail pro vytěžení)
      description: |
        Detail položek faktury s příznakem `is_fuel` (rozpoznání paliva dle klíčových slov).
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/logbook/fuel-invoices/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Logbook]
      summary: Vytěží fakturu a přiřadí ji autu
      description: |
        Vytěží položky faktury (i opakovaně — force režim doplní dříve chybějící
        litry) a přiřadí vzniklá tankování zvolenému autu. Reassign přepíše auto
        u všech tankování navázaných na tuto fakturu. `car_id: null` = zruší přiřazení.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                car_id: { type: [integer, "null"] }
      responses:
        '200': { description: 'Výsledek vytěžení + reassigned' }
        '400': { description: 'Vytěžení selhalo' }
        '404': { description: 'Auto neexistuje' }
  /api/v1/tax-evidence/cash-journal:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: query
        name: year
        schema: { type: integer }
      - in: query
        name: from
        schema: { type: string, format: date }
      - in: query
        name: to
        schema: { type: string, format: date }
    get:
      tags: [Tax]
      summary: Peněžní deník daňové evidence (§7b, kasová báze)
      description: |
        Read-only report. Období zadej buď `year` (celý rok), nebo `from`+`to`
        (YYYY-MM-DD). Bez parametrů = aktuální rok. Vrací deník + totály +
        checks{} + warnings[].
      responses:
        '200': { description: OK }
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/tax-evidence/cash-journal/export:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: query
        name: year
        schema: { type: integer }
      - in: query
        name: from
        schema: { type: string, format: date }
      - in: query
        name: to
        schema: { type: string, format: date }
      - in: query
        name: format
        required: true
        schema: { type: string, enum: [pdf, xlsx] }
    get:
      tags: [Tax]
      summary: Export peněžního deníku (PDF/XLSX)
      responses:
        '200':
          description: Soubor exportu
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/tax-evidence/receivables-payables:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Tax]
      summary: Pohledávky a závazky daňové evidence (aging)
      description: |
        Read-only report — aging per měna + KPI (DSO/DPO/punktualita). Reuse
        CRM agregací, bez vlastních parametrů (aktuální stav).
      responses:
        '200': { description: OK }
  /api/v1/tax-evidence/receivables-payables/export:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: query
        name: format
        required: true
        schema: { type: string, enum: [pdf, xlsx] }
    get:
      tags: [Tax]
      summary: Export pohledávek a závazků (PDF/XLSX)
      responses:
        '200':
          description: Soubor exportu
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/tax-evidence/classification:
    post:
      tags: [Tax]
      summary: Ruční klasifikační override pohybu peněžního deníku (G2)
      description: Účetní/admin. Předvyplněnou automatickou klasifikaci lze ručně přebít.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_type, source_id, tax_bucket]
              properties:
                source_type: { type: string, enum: [bank, cash] }
                source_id: { type: integer }
                tax_bucket: { type: string }
                note: { type: [string, "null"], maxLength: 255 }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/tax-evidence/classification/{source_type}/{source_id}:
    delete:
      tags: [Tax]
      summary: Smaže klasifikační override (vrátí pohyb k automatické klasifikaci)
      description: Účetní/admin.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: source_type, required: true, schema: { type: string, enum: [bank, cash] } }
        - { in: path, name: source_id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/tax-evidence/transition-report:
    get:
      tags: [Tax]
      summary: Podklady přechodového můstku §7b→§24 ZDP (příloha č. 3, G7)
      description: Read-only report.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: as_of, schema: { type: string, format: date } }
        - { in: query, name: direction, schema: { type: string, enum: [tax_to_accounting, accounting_to_tax], default: tax_to_accounting } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { description: Přechod se na firmu nevztahuje, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/tax-evidence/closing/{year}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: year, required: true, schema: { type: integer, minimum: 2018 } }
    get:
      tags: [Tax]
      summary: Roční uzávěrka daňové evidence podle § 7b ZDP
      description: Vrátí nebo založí rozpracovanou uzávěrku včetně checklistu, stavů a nepeněžních úprav.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaxEvidenceAnnualClosing' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    put:
      tags: [Tax]
      summary: Uloží rozpracovanou roční uzávěrku daňové evidence
      description: Účetní/admin. `row_version` chrání proti souběžné úpravě.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxEvidenceAnnualClosingWrite' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaxEvidenceAnnualClosing' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/tax-evidence/closing/{year}/finalize:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: year, required: true, schema: { type: integer, minimum: 2018 } }
    post:
      tags: [Tax]
      summary: Finalizuje roční uzávěrku a uloží neměnný zdrojový snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [row_version], properties: { row_version: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaxEvidenceAnnualClosing' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/tax-evidence/closing/{year}/reopen:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - { in: path, name: year, required: true, schema: { type: integer, minimum: 2018 } }
    post:
      tags: [Tax]
      summary: Vrátí finální uzávěrku daňové evidence do rozpracovaného stavu
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [row_version], properties: { row_version: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaxEvidenceAnnualClosing' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/reports/monthly-export/preview:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: query
        name: period
        schema: { type: string, enum: [monthly, quarterly] }
      - in: query
        name: year
        schema: { type: integer }
      - in: query
        name: month
        schema: { type: string, description: 'Číslo měsíce (1-12) nebo YYYY-MM' }
      - in: query
        name: quarter
        schema: { type: integer, minimum: 1, maximum: 4 }
    get:
      tags: [Reports]
      summary: Náhled měsíčního/kvartálního exportu — počty položek
      description: |
        Bez validního `period` se `month` bere jako legacy zápis YYYY-MM.
        Přístup jen role admin/accountant/readonly.
      responses:
        '200': { description: 'Počty per část (sales_pdf, sales_isdoc, purchase_pdf, purchase_isdoc, bank_pdf, bank_gpc, dph_book)' }
        '400': { description: 'Neplatné parametry období' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/reports/monthly-export/start:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    post:
      tags: [Reports]
      summary: Spustí měsíční/kvartální export (background job)
      description: |
        Vytvoří job (import_jobs, source=monthly_export) a spustí worker na
        pozadí (ZIP se sales/purchase PDF+ISDOC, bankovními výpisy PDF+GPC a
        Knihou DPH). Vrátí 409, pokud už export běží. Období se čte z těla,
        přebíjí query (`period`/`year`/`month`/`quarter`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period: { type: string, enum: [monthly, quarterly] }
                year: { type: integer }
                month: { type: string }
                quarter: { type: integer, minimum: 1, maximum: 4 }
                parts:
                  type: array
                  items:
                    type: string
                    enum: [sales_pdf, sales_isdoc, purchase_pdf, purchase_isdoc, bank_pdf, bank_gpc, dph_book]
                  description: 'Prázdné/chybí = všechny části'
      responses:
        '201': { description: 'job_id, status=queued, params' }
        '400': { description: 'Chybí supplier kontext nebo neplatné období' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Export už běží (existing_job_id)' }
  /api/v1/reports/monthly-export/jobs:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Reports]
      summary: Historie jobů měsíčního exportu
      description: Posledních 15 jobů (zůstávají ke stažení dokud nejsou uklizené).
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/reports/monthly-export/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Reports]
      summary: Stav jobu měsíčního exportu (polling)
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reports]
      summary: Smaže job měsíčního exportu i jeho soubor
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/reports/monthly-export/jobs/{id}/download:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Reports]
      summary: Stáhne hotový ZIP měsíčního exportu
      responses:
        '200':
          description: ZIP archiv exportu
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Export ještě není připravený ke stažení' }
        '410': { description: 'Soubor exportu už není k dispozici' }
  /api/v1/reports/monthly-export/jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Reports]
      summary: Zruší běžící/čekající job měsíčního exportu
      responses:
        '200': { description: 'ok, cancel_requested' }
