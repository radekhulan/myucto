        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/reports/monthly-report/send:
    post:
      tags: [Accounting]
      summary: Měsíční přehled klientovi — odeslání e-mailem + archivace do DMS
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month, to]
              properties:
                year: { type: integer, minimum: 2000, maximum: 2100 }
                month: { type: integer, minimum: 1, maximum: 12 }
                to: { type: array, minItems: 1, items: { type: string, format: email } }
                cc: { type: array, items: { type: string, format: email } }
                comment: { type: string }
                subject_override: { type: string }
      responses:
        '200': { description: "OK {sent_to, cc, document_id, sent_at}", content: { application/json: { schema: { type: object } } } }
        '400': { description: Chybí příjemci / neplatný e-mail, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502': { description: Odeslání e-mailu selhalo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/accounting/reports/monthly-report/history:
    get:
      tags: [Accounting]
      summary: Měsíční přehled klientovi — historie odeslání
      description: "Log odeslání (komu, kdy, kdo, archivovaná kopie v Dokumentech)."
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: limit, schema: { type: integer, default: 30, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }

  /api/v1/accounting/reports/journal/export:
    get:
      tags: [Accounting]
      summary: Export účetního deníku (PDF / XLSX)
      description: |
        Deník je zákonná kniha (§13 ZoÚ). Export respektuje PŘESNĚ stejné filtry jako
        GET /accounting/journal (bez stránkování — vrací všechny odpovídající zápisy
        chronologicky). Řádky nesou kód/název účtu a částku MD/Dal, PDF má číslované
        strany. Strop 5000 zápisů na jeden export — nad limit vrací 422 `too_many_rows`
        (audit 2026-07).
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: period_id, schema: { type: integer } }
        - { in: query, name: date_from, schema: { type: string, format: date } }
        - { in: query, name: date_to, schema: { type: string, format: date } }
        - { in: query, name: source_type, schema: { type: string, enum: [invoice, purchase_invoice, bank, cash, asset, manual, closing, opening, depreciation, asset_disposal, fx_revaluation, stock, provision, income_tax, profit_distribution, offset, small_asset_accrual, prepaid_expense_accrual, settlement, deferred_tax, payroll, vat_clearing] } }
        - { in: query, name: source_id, schema: { type: integer } }
        - { in: query, name: posted, schema: { type: boolean } }
        - { in: query, name: format, required: true, schema: { type: string, enum: [pdf, xlsx] } }
      responses:
        '200': { description: Soubor sestavy, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/journal/{id}/history:
    get:
      tags: [Accounting]
      summary: Auditní historie zápisu (SYSTEM VERSIONING timeline)
      description: |
        Všechny historické i aktuální verze hlavičky a řádků zápisu (MariaDB
        `FOR SYSTEM_TIME ALL`, viz migrace 1029) s diffem oproti předchozí verzi
        (změněná hlavičková pole, přidané/odebrané/změněné řádky dle `line_no`) a
        best-effort spárováním s activity_log (audit 2026-07). Verze jsou seřazené
        od nejnovější. Vyžaduje MariaDB — na jiné DB degraduje na jedinou verzi.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }

