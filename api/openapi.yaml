        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/clients/{id}/bank-accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
      - in: path
