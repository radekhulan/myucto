      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ValidationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Accounting]
      summary: Smazání pokladny (jen bez dokladů) — účetní|admin
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/cash-registers/{id}/book:
    get:
      tags: [Accounting]
      summary: Pokladní kniha (opening + running balance + join na cash_documents, O8)
      description: |
        Filtry `q`/`doc_type`/`purpose` zužují jen vypsané řádky (a `total`).
        Počáteční a konečný zůstatek i obraty se počítají za CELÉ období, nikdy
        za výběr — jinak by filtr vyrobil zůstatek, který v knize neplatí.

        `truncated: true` znamená, že filtrované okno bylo delší, než kolik se dá
        prohledat najednou, a výběr proto není úplný — je potřeba zúžit období.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: q, schema: { type: string }, description: "Fulltext přes popis, partnera a číslo dokladu; diakritiku ignoruje" }
        - { in: query, name: doc_type, schema: { type: string, enum: [in, out] } }
        - { in: query, name: purpose, schema: { type: string, enum: [sale, purchase, invoice_payment, purchase_payment, transfer, other] } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: per_page, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/accounting/cash-registers/{id}/book/pdf:
    get:
      tags: [Accounting]
      summary: PDF pokladní knihy (podvojné účetnictví i daňová evidence)
      description: |
        Přijímá tytéž filtry jako `/book`, aby tisk odpovídal obrazovce. Obraty
        a zůstatky zůstávají i v PDF za celé období.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: doc_type, schema: { type: string, enum: [in, out] } }
        - { in: query, name: purpose, schema: { type: string, enum: [sale, purchase, invoice_payment, purchase_payment, transfer, other] } }
      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }

  /api/v1/accounting/cash-documents:
    get:
      tags: [Accounting]
      summary: Stránkovaný seznam pokladních dokladů (filtry)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: register_id, schema: { type: integer } }
        - { in: query, name: doc_type, schema: { type: string, enum: [in, out] } }
        - { in: query, name: purpose, schema: { type: string, enum: [sale, purchase, invoice_payment, purchase_payment, transfer, other] } }
        - { in: query, name: status, schema: { type: string, enum: [draft, posted, reversed] } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: per_page, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
    post:
      tags: [Accounting]
      summary: Nový pokladní doklad (default post:true = create+post v 1 transakci) — účetní|admin
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [register_id, doc_type, purpose, issue_date, description, total_amount], properties: { register_id: { type: integer }, doc_type: { type: string, enum: [in, out] }, purpose: { type: string, enum: [sale, purchase, invoice_payment, purchase_payment, transfer, other] }, issue_date: { type: string, format: date }, tax_date: { type: string, format: date }, partner_name: { type: string }, partner_ic: { type: string }, partner_dic: { type: string }, description: { type: string }, vat_mode: { type: string, enum: [none, vat] }, total_amount: { type: number }, amount_foreign: { type: number, nullable: true, description: "Částka v měně pokladny u valutové pokladny (§11); CZK ekvivalent do total_amount dopočítá server" }, fx_rate: { type: number, description: "Ruční kurz; vynechte, ať se použije kurz ČNB k datu vystavení" }, vat_lines: { type: array, items: { type: object, properties: { vat_rate: { type: number }, base_amount: { type: number }, vat_amount: { type: number }, vat_deduction: { type: string, enum: [full, none, proportional, reduced], default: full, description: "Rozsah nároku na odpočet DPH řádku (§ 75/76)" }, vat_deduction_percent: { type: number, default: 100, description: "Poměrný / skutečný roční koeficient odpočtu v procentech (0–100)" }, tax_treatment: { type: string, enum: [deductible, non_deductible, not_expense], default: deductible, description: "Uznatelnost řádku pro daň z příjmů (§ 24/25), nezávislá na DPH" } } } }, invoice_id: { type: integer }, purchase_invoice_id: { type: integer }, rule_key: { type: string }, counter_account_code: { type: string }, post: { type: boolean, default: true } } } } }
      responses:
        '201': { description: Vytvořeno, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/cash-documents/unpaid:
    get:
      tags: [Accounting]
      summary: Našeptávač nezaplacených FV/PF (jen CZK) pro úhradu hotově
      description: |
        Vrací doklady, na kterých ještě něco zbývá k úhradě. `remaining` je zbytek,
        ne brutto: u přijaté faktury se odečítá uhrazená záloha (`amount_to_pay`)
        i už zaúčtované úhrady (bankovní i hotovostní), takže doklad krytý zálohou
        se nenabízí vůbec. U vydaných faktur je v seznamu i zálohová faktura
        (`invoice_type = proforma`, příznak `is_proforma`) — hotově se hradit smí,
        ale úhrada spustí vystavení finálního dokladu nebo daňového dokladu
        k přijaté platbě. Platební kalendář se nenabízí.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: kind, required: true, schema: { type: string, enum: [invoice, purchase_invoice] } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: "OK — položky {id, kind, number, partner_name, total, paid, remaining, currency_code, issued_on} + `invoice_type`/`is_proforma` (FV) nebo `document_kind` (PF)", content: { application/json: { schema: { type: array, items: { type: object } } } } }

  /api/v1/accounting/cash-documents/rule-presets:
    get:
      tags: [Accounting]
      summary: Nabídka kontačních pravidel pro pokladní doklad s purpose=other
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: doc_type, schema: { type: string, enum: [in, out] } }
      responses:
        '200': { description: "OK {items}", content: { application/json: { schema: { type: object } } } }

  /api/v1/accounting/cash-documents/{id}:
    get:
      tags: [Accounting]
      summary: Detail pokladního dokladu (vč. vat_lines, registru, vazeb)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Accounting]
      summary: Úprava draftu — účetní|admin
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Accounting]
      summary: Smazání draftu (s `?force=1` i zaúčtovaného dokladu) — `cash.document.write`, force navíc `cash.close`
      description: |
        Bez `force` smaže jen rozpracovaný (draft) doklad. `?force=1` smaže i zaúčtovaný
        doklad včetně deníkových zápisů — nevratně a bez protizápisu. Vydané číslo řady
        se nevrací, takže v řadě PPD/VPD zůstane trvalá díra; odpověď proto vrací
        `doc_number`, `deleted_entry_ids` a varování `cash.warning.series_gap`.
        Varování chodí jen tehdy, když doklad číslo skutečně měl (`doc_number != null`) —
        po draftu smazaném přes `?force=1` žádná díra nevzniká.
        Preferovanou cestou je storno (`/reverse`), které auditní stopu zachová.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: force, required: false, schema: { type: string, enum: ['1'] }, description: "Tvrdé smazání dokladu i s účetními zápisy; vyžaduje právo `cash.close`" }
      responses:
        '200': { description: "OK — `{deleted, warnings}`; s `?force=1` navíc `doc_number` a `deleted_entry_ids`", content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "Doklad má živou vazbu z jiné agendy (kód `cash.error.has_dependencies`, `error.blocked_by` uvádí počty po druzích) — typicky je použit jako doklad o vyplacení mezd. Nebo z úhrady zálohy už vznikl navazující doklad (`cash.error.followup_document_exists`) a je potřeba zrušit nejdřív ten." }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/cash-documents/{id}/post:
    post:
      tags: [Accounting]
      summary: Zaúčtování draftu (idempotentní na dvojklik) — účetní|admin
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/cash-documents/{id}/reverse:
    post:
      tags: [Accounting]
      summary: Storno pokladního dokladu (povinný reason) — `cash.document.write`
      description: |
        Bez `entry_date` se protizápis datuje datem PŮVODNÍHO zápisu; na dnešek ho
        posune až tehdy, když je původní datum uzamčené. Doklad v uzamčeném období
        proto stornovat lze. Storno úhrady zálohové faktury, ze které už vznikla
        finální faktura nebo daňový doklad k přijaté platbě, se odmítne s kódem
        `cash.error.followup_document_exists` — navazující doklad je nutné zrušit dřív.

        `warnings` nesou klíče `cash.warning.*`: `reversal_date_shifted` (protizápis
        skončil u jiného data než původní zápis) a `negative_balance_after_reverse`
        (pokladna je po stornu v mínusu). Nejsou to chyby — storno proběhlo.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 }, entry_date: { type: string, format: date, description: "Datum protizápisu; vynechte, ať se použije datum původního zápisu" } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { reversal_entry_id: { type: [integer, "null"] }, warnings: { type: array, items: { type: string } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "Z úhrady zálohy už vznikl navazující doklad (`cash.error.followup_document_exists`), nebo je uzamčené i datum protizápisu (`cash.error.date_locked`)." }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/accounting/cash-documents/{id}/pdf:
    get:
      tags: [Accounting]
      summary: Tisk pokladního dokladu do PDF (doplní PDF stage)
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }

  /api/v1/eshop/manufacturers:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Eshop]
      summary: Seznam výrobců
      parameters:
        - in: query
          name: active
          schema: { type: boolean }
          description: Jen aktivní (nearchivovaní) výrobci.
      responses:
        '200': { description: OK }
    post:
      tags: [Eshop]
      summary: Vytvoří výrobce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 50 }
                name: { type: string, maxLength: 150 }
                website: { type: [string, "null"] }
                display_order: { type: integer }
                export_eshop: { type: boolean, default: true }
                archived: { type: boolean, default: false }
      responses:
        '201': { description: Vytvořeno }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { description: Výrobce s tímto kódem už existuje }
  /api/v1/eshop/manufacturers/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Eshop]
      summary: Detail výrobce
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Eshop]
      summary: Upraví výrobce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, maxLength: 50 }
                name: { type: string, maxLength: 150 }
                website: { type: [string, "null"] }
                display_order: { type: integer }
                export_eshop: { type: boolean }
                archived: { type: boolean }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Výrobce s tímto kódem už existuje }
    delete:
      tags: [Eshop]
      summary: Smaže výrobce
      description: Odmítnuto (409), pokud je výrobce referencovaný u zboží — nabídne se archivace.
      responses:
        '200': { description: Smazáno }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Výrobce je použit u zboží — archivujte jej místo mazání }
  /api/v1/eshop/locales:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Eshop]
      summary: Seznam jazyků e-shopu
      description: >-
        Číselník jazykových mutací firmy. Kódy odpovídají poli `locale`
        u překladů zboží i kategorií — jiný jazyk zápisové cesty nepřijmou.
      parameters:
        - in: query
          name: active
          schema: { type: boolean }
          description: Jen aktivní (nearchivované) jazyky.
      responses:
        '200': { description: OK }
    post:
      tags: [Eshop]
      summary: Přidá jazyk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 5, pattern: '^[a-z]{2}(-[A-Z]{2})?$', description: 'Např. cs nebo pt-BR.' }
                name: { type: string, maxLength: 100 }
                display_order: { type: integer, default: 0 }
                is_default: { type: boolean, default: false, description: 'Předvyplněný jazyk na kartě; nejvýš jeden na firmu.' }
                archived: { type: boolean, default: false }
      responses:
        '201': { description: Vytvořeno }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { description: Jazyk s tímto kódem už existuje }
  /api/v1/eshop/locales/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Eshop]
      summary: Detail jazyka
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Eshop]
      summary: Upraví jazyk
      description: >-
        Kód jazyka, ke kterému už existují překlady, změnit nelze — vazba
        `stock_item_i18n.locale` je hodnota, ne FK (409 `locale_code_locked`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, maxLength: 5, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
                name: { type: string, maxLength: 100 }
                display_order: { type: integer }
                is_default: { type: boolean }
                archived: { type: boolean }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Kód už existuje, nebo na jazyk navazují překlady }
    delete:
      tags: [Eshop]
      summary: Smaže jazyk
      description: Jazyk s uloženými překlady smazat nelze (409 `locale_in_use`) — archivujte jej.
      responses:
        '200': { description: Smazáno }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Jazyk má uložené překlady }
  /api/v1/eshop/currencies:
    parameters:
      - $ref: '#/components/parameters/SupplierIdHeader'
    get:
      tags: [Eshop]
      summary: Seznam prodejních měn e-shopu
      description: >-
        Číselník měn, ve kterých firma uvádí ceny zboží. Kódy odpovídají poli
        `currency_code` u cen, akčních cen a poplatků.


        Nejde o měnové účty z `/settings/currencies` — prodejní měna je prezentace
        ceny zákazníkovi a s bankovním účtem nesouvisí. Zboží lze nacenit v GBP
        i bez britského účtu; zákazník zaplatí kartou třeba na eurový účet.
      parameters:
        - in: query
          name: active
          schema: { type: boolean }
          description: Jen aktivní (nearchivované) měny.
      responses:
        '200': { description: OK }
    post:
      tags: [Eshop]
      summary: Přidá měnu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, minLength: 3, maxLength: 3, pattern: '^[A-Z]{3}$', description: 'ISO 4217, např. CZK. Malá písmena se převedou na velká.' }
                name: { type: string, maxLength: 100 }
                symbol: { type: [string, "null"], maxLength: 8, description: 'Zobrazovaný symbol (Kč, €, £). Prázdný řetězec se uloží jako null.' }
                display_order: { type: integer, default: 0 }
                is_default: { type: boolean, default: false, description: 'Předvyplněná měna nového cenového řádku; nejvýš jedna na firmu.' }
