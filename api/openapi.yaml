        PDF balíček pro klienta sestavený NAD existujícími sestavami (výsledovka
        měsíc+YTD, rozvaha, top pohledávky/závazky po splatnosti ze saldokonta,
        DPH k úhradě a termín podání pro plátce DPH, nadcházející daňové termíny).
        Tento endpoint jen vrací data pro náhled; PDF viz /download.
      parameters:
        - $ref: '#/components/parameters/SupplierIdHeader'
        - { in: query, name: year, required: true, schema: { type: integer } }
        - { in: query, name: month, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { in: query, name: comment, description: "Volitelný komentář účetní (zobrazí se i v PDF/e-mailu)", schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

