# MyUcto.cz — Docker Compose pro produkci s pre-built image z GHCR
#
# Použití (žádné klonování repa potřeba):
#
#   curl -O https://raw.githubusercontent.com/radekhulan/myucto/master/docker-compose.production.yml
#   curl -O https://raw.githubusercontent.com/radekhulan/myucto/master/cfg.sample.php
#   mv docker-compose.production.yml docker-compose.yml
#   cp cfg.sample.php cfg.docker.php
#   # uprav cfg.docker.php: db.host=db, db.user=myucto, db.pass=…,
#   # app.pepper, secret_encryption_key (oboje openssl rand -base64 32)
#   echo "DB_PASSWORD=$(openssl rand -base64 28)" > .env
#   echo "DB_ROOT_PASSWORD=$(openssl rand -base64 28)" >> .env
#   docker compose up -d
#   docker compose exec --user www-data app php api/bin/migrate.php
#   # otevři http://localhost:8080 → setup wizard
#
# Pro update na novější verzi: změň :latest na konkrétní verzi (např. :3.6.0),
# pak `docker compose pull && docker compose up -d` + `migrate.php`.
#
# Volume layout (od 3.6.0): single-volume default — jediný `app-data:/data`.
# Drží VŠECHEN stateful obsah včetně `cfg.local.php` z setup wizardu, takže
# per-instance konfigurace (app.url, auth.require_totp) přežije image updaty.
# Upgrade z 3-volume (3.5.x a starší): `cmd/docker-update.{sh,ps1}` autodetekuje
# a spustí `cmd/docker-migrate-volumes.{sh,ps1}` automaticky před up -d.

services:
  app:
    image: ghcr.io/radekhulan/myucto:latest   # pin na konkrétní verzi v produkci, např. :3.6.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # OPTIONAL — image už obsahuje stub `cfg.php`. Pro full-ENV deploy (Railway,
      # Heroku, Fly.io) lze tento mount vynechat a vše předat přes ENV (12-factor).
      - ./cfg.docker.php:/var/www/html/cfg.php:ro
      # Single-volume layout (od 3.6.0).
      - app-data:/data
    environment:
      TZ: Europe/Prague
      MYINVOICE_DATA_DIR: /data
      MYINVOICE_MCP_ENABLED: ${MYINVOICE_MCP_ENABLED:-}
      MYINVOICE_APP_ENV: ${MYINVOICE_APP_ENV:-}
      # Vestavěný cron v app kontejneru (default 1). Při více replikách app nastav 0,
      # jinak by plánované úlohy běžely v každé replice (duplicitní zálohy, recurring…).
      MYINVOICE_ENABLE_CRON: ${MYINVOICE_ENABLE_CRON:-1}
      # Prázdné hodnoty nepřebíjí cfg.docker.php; politiku lze nastavit v .env.
      MYINVOICE_AUTH_REQUIRE_MFA: ${MYINVOICE_AUTH_REQUIRE_MFA:-}
      MYINVOICE_AUTH_MFA_METHODS: ${MYINVOICE_AUTH_MFA_METHODS:-}
      MYINVOICE_OIDC_ENTRA_SKIP_MFA: ${MYINVOICE_OIDC_ENTRA_SKIP_MFA:-}
      MYINVOICE_AUTH_PASSWORDLESS_LOGIN: ${MYINVOICE_AUTH_PASSWORDLESS_LOGIN:-}
      MYINVOICE_SESSION_LOCK_AFTER_MINUTES: ${MYINVOICE_SESSION_LOCK_AFTER_MINUTES:-}
      # Full-ENV SMTP (12-factor). Prázdné/chybějící klíče se v Configu ignorují
      # (viz Config::applyEnvOverrides guard), takže nepřebijí SMTP z cfg.docker.php.
      MYINVOICE_SMTP_HOST: ${MYINVOICE_SMTP_HOST:-}
      MYINVOICE_SMTP_PORT: ${MYINVOICE_SMTP_PORT:-}
      MYINVOICE_SMTP_ENCRYPTION: ${MYINVOICE_SMTP_ENCRYPTION:-}
      MYINVOICE_SMTP_AUTH: ${MYINVOICE_SMTP_AUTH:-}
      MYINVOICE_SMTP_USER: ${MYINVOICE_SMTP_USER:-}
      MYINVOICE_SMTP_PASS: ${MYINVOICE_SMTP_PASS:-}
      MYINVOICE_SMTP_FROM_EMAIL: ${MYINVOICE_SMTP_FROM_EMAIL:-}
      MYINVOICE_SMTP_FROM_NAME: ${MYINVOICE_SMTP_FROM_NAME:-}
      # Redis (profil `redis`). Bez ENABLED=1 jede aplikace na DB fallbacku:
      # sessiony v `sessions`, rate limit v `rate_limit_counters`.
      MYINVOICE_REDIS_ENABLED: ${MYINVOICE_REDIS_ENABLED:-0}
      MYINVOICE_REDIS_HOST: ${MYINVOICE_REDIS_HOST:-redis}
      MYINVOICE_REDIS_PORT: ${MYINVOICE_REDIS_PORT:-6379}
      MYINVOICE_REDIS_AUTH: ${MYINVOICE_REDIS_AUTH:-}
      MYINVOICE_REDIS_DB: ${MYINVOICE_REDIS_DB:-0}
      MYINVOICE_REDIS_PREFIX: ${MYINVOICE_REDIS_PREFIX:-myinvoice:}
      # Workery php-fpm (image default 8, každý ~30-60 MB). Na silnějším stroji zvyš,
      # aby souběžní uživatelé nečekali ve frontě; prázdné = default image.
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-}
      # Lokální AI přes Ollamu (Nastavení → Integrace → AI brána). Prázdné = výchozí.
      MYINVOICE_OLLAMA_TIMEOUT: ${MYINVOICE_OLLAMA_TIMEOUT:-}
      MYINVOICE_OLLAMA_NUM_CTX: ${MYINVOICE_OLLAMA_NUM_CTX:-}
      MYINVOICE_OLLAMA_ALLOWED_HOSTS: ${MYINVOICE_OLLAMA_ALLOWED_HOSTS:-}

  db:
    image: mariadb:11.8
    restart: unless-stopped
    # Tuning pro hosting s málo pamětí/diskem:
    #   - performance_schema OFF → ~100–200 MB méně RAM
    #   - buffer pool 128 MB (RAM) — přes DB_INNODB_BUFFER_POOL přizpůsob stroji:
    #     64M na opravdu malý VPS, 1G při 3 GB RAM, 1536M při 4 GB RAM. Buffer pool
    #     pod velikostí dat znamená, že se každý dotaz dočítá z disku.
    #   - redo log 48 MB místo default 96 MB → ~50 MB méně na disku (DB_INNODB_LOG_SIZE)
    # MariaDB redo log při startu bezpečně přesází (po čistém shutdownu), data zůstávají.
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=${DB_INNODB_BUFFER_POOL:-128M}
      - --innodb-log-file-size=${DB_INNODB_LOG_SIZE:-48M}
      # Default 16 MB nestačí na dump ani obnovu s přílohami do 50 MB
      # (documents.max_file_bytes) — kontrola prostředí to hlásí jako varování.
      - --max-allowed-packet=${DB_MAX_ALLOWED_PACKET:-64M}
      # Dočasné tabulky (ORDER BY/GROUP BY nad joinem). Default 16 MB posílá na disk
      # i malý mezivýsledek — u deníku a sestav to stojí stovky ms navíc.
      - --tmp-table-size=${DB_TMP_TABLE_SIZE:-64M}
      - --max-heap-table-size=${DB_TMP_TABLE_SIZE:-64M}
      # Úložiště je SSD/NVMe. Default io_capacity=200 a flush_neighbors=1 jsou
      # hodnoty pro rotační disk a zbytečně brzdí zápis i čištění buffer poolu.
      - --innodb-io-capacity=${DB_INNODB_IO_CAPACITY:-1000}
      - --innodb-io-capacity-max=${DB_INNODB_IO_CAPACITY_MAX:-2000}
      - --innodb-flush-neighbors=0
      # Schéma má přes 550 tabulek, default 400 definic se recykluje pořád dokola.
      - --table-definition-cache=${DB_TABLE_DEFINITION_CACHE:-1000}
      # Přesnější statistiky = lepší plány. S defaultem 20 vzorků sahá optimalizátor
      # u self-joinů deníku po scanu celé tabulky (BNL) místo indexu.
      - --innodb-stats-persistent-sample-pages=64
      # Strop spojení drží nejhorší případ per-connection bufferů v mezích;
      # víc než 80 souběžných spojení tahle aplikace neotevře.
      - --max-connections=${DB_MAX_CONNECTIONS:-80}
      # Pomalé dotazy logovat trvale — bez nich se výkonový problém v produkci hádá.
      # Log leží v datovém volume; při long_query_time=1 je za normálu prázdný.
      - --slow-query-log=${DB_SLOW_QUERY_LOG:-1}
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=${DB_LONG_QUERY_TIME:-1}
      - --log-slow-verbosity=query_plan,explain
    environment:
      # Fail-closed: bez .env se stack nespustí (žádný předvídatelný default).
      # Vytvoř .env s DB_PASSWORD a DB_ROOT_PASSWORD (viz hlavička výše).
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD required — vytvoř .env (viz hlavička souboru)}
      MARIADB_DATABASE: ${DB_NAME:-myucto}
      MARIADB_USER: ${DB_USER:-myucto}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required — vytvoř .env (viz hlavička souboru)}
      TZ: Europe/Prague
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    # maxmemory + policy jsou povinné: bez limitu si Redis s AOF vezme veškerou
    # RAM a nechá se OOM-killnout místo evikce. `volatile-lru` navíc evikuje jen
    # klíče s TTL — sessiony (SETEX) ano, ale nic bez TTL se nezahodí.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
  app-data:
  redis-data:
